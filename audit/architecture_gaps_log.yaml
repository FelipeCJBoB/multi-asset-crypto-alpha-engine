    implementacao_2026_08_16: >
      Manager pediu explicitamente solução de engenharia real pros
      achados HIGH+MEDIUM (não remediação -- "reduzir chunk_days" ficou
      de fora de propósito) + auto-validação. Ciclo completo executado:
      Agent implementa (contexto rico, algoritmo especificado passo a
      passo) -> eu reviso pessoalmente o diff linha a linha, não só o
      relato -> Agent independente (`project_assurance`, sem contexto do
      raciocínio) revisa de novo do zero -> eu corrijo os achados reais
      -> mecânicos rerodados. Três camadas de revisão encontraram, cada
      uma, pelo menos 1 problema real que a anterior não via -- valida o
      processo, não só o código final.

      **HIGH resolvido:** `threshold_bars_step`/`ThresholdBarsCarry`
      reescritos -- `leftover` vira `_TradeArrays` (4 arrays numpy, não
      mais `pl.DataFrame` de 7 colunas), `np.concatenate`/`np.cumsum`
      substituem `pl.concat`/`cum_sum()`, e os DOIS `.filter()` viram 1
      busca binária (`np.searchsorted`) + 2 slices (view, não cópia) --
      explora a monotonicidade de `bar_id` que o módulo já provava no
      docstring e nunca usava. Reduz o pico de ~4-5x o tamanho do chunk
      pra ~2x. Paridade bit-a-bit `np.cumsum` vs `pl.Series.cum_sum()`
      verificada por leitura do source Rust real do Polars na tag pinada
      (`py-1.43.2`, `cum_scan_numeric`, acumulador mutável único, sem
      paralelismo) -- confirmada de novo, independentemente, pelo Agent
      revisor.

      **MEDIUM (schema) resolvido:** consequência direta da extração de
      colunas em `_TradeArrays` -- as 3 colunas nunca usadas não voltam a
      existir no `leftover`.

      **MEDIUM (`bar_frames` não-universal) resolvido estruturalmente:**
      novo contrato `import-linter` em `pyproject.toml` ("data não importa
      analysis"), mesmo padrão de "features/models não importam analysis"
      -- impede mecanicamente um futuro orquestrador de reprocessamento
      real de reusar `m2_worker._build_trades_dependent_bars` por
      conveniência.

      **MEDIUM (threshold sem teto) resolvido:** circuit breaker novo --
      `LeftoverOverflowError` (`bars.py`), `max_leftover_trades: float |
      None = None` (default preserva bit-exato todo caller/teste sem este
      argumento). Teto derivado, não inventado: `m2_worker._max_leftover_
      trades(n_ticks, target_n_bars) = (n_ticks/target_n_bars) *
      bars_threshold_leftover_safety_multiplier` (constante nova, classe
      C, `ASSUMED`, valor 50,0 -- mesmo padrão de `bars_tick_imbalance_
      clip_multiplier`).

      **MEDIUM (sem sinal diagnóstico) resolvido:** `ThresholdBarsCarry.
      leftover_trade_count` exposto; `m2_worker.py` loga `dollar_leftover_
      trades`/`volume_leftover_trades` por chunk, ao lado de `tib_bars_
      closed` já existente.

      **Achado de revisão PESSOAL (antes de mandar pra revisão externa):**
      `threshold_bars_step` mutava `carry.bar_frames`/`carry.base_value`
      ANTES de checar o circuit breaker -- se `LeftoverOverflowError`
