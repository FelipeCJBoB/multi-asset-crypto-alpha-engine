  - id: AG-091
    date: "2026-08-19"
    file: "src/analysis/m6_common_factor_hypothesis.py"
    related_file: "src/analysis/m4_critical_windows.py (heterogeneidade por bucket reusa cochrans_q_heterogeneity, k=1 acontece de verdade quando um candidato satura a 1 bucket só, ex. Jump Model saturado -- AG-087)"
    found_by: "Agent auditoria cética sobre a liderança suspeita do BOCPD em Cochran's Q/I², 2026-08-18"
    gap: >
      `cochrans_q_heterogeneity` com `k=1` estrato (`df=k-1=0`) usava a
      mesma fórmula do caso geral (`i_squared = max(0,(q-df)/q)*100`).
      Matematicamente `Q`/`I²` são INDEFINIDOS com 1 grupo só (sem
      "variância entre grupos" possível) -- a intenção implícita do
      código era produzir `0.0` "por convenção", mas em ponto flutuante
      `pooled = Σ(w·v)/Σw` com 1 termo não recupera `v` bit-exato (2
      arredondamentos, erro esperado `~4u²≈4,93e-32`), e com `df=0` a
      fórmula antiga `(q-df)/q` amplifica esse ruído de ULP pro EXTREMO
      OPOSTO: `i_squared_pct=100,0`. Caso real medido em produção
      (`experiments/m4_critical_windows_report.json`,
      BTCUSDT/CRYPTO_WINTER/short): `q_statistic=3,857e-32`, não `0.0`.
    severity: "médio"
    layer: "analysis -- núcleo estatístico puro, consumido por M6 (nunca teve k=1 na prática) e M4 (k=1 real via saturação de candidato)"
    consequence: >
      Confirmado que a execução real do M6 nunca teve `k=1`
      (`experiments/m6_common_factor_hypothesis_report.json`, `k=5`
      sempre nos 2 lados) -- a correção NÃO muda nenhum resultado do M6
      já auditado/validado. M4 (heterogeneidade por bucket) É afetado --
      qualquer célula onde um candidato satura a 1 bucket só (Jump Model
      degenerado, AG-087) produziria `i_squared_pct=100,0` fantasma sob a
      fórmula antiga, inflando artificialmente a aparência de
      heterogeneidade "máxima" numa célula sem informação estatística
      nenhuma pra sustentar isso.
    resolved_by_commit: null
    resolution: >
      Corrigido 2026-08-19 -- early-return quando `df==0`, devolvendo
      `q_statistic`/`p_value`/`i_squared_pct` = `NaN` explícito (nunca
      `0.0`/`100.0`), preservando `pooled_edge_bruto_atr` (continua
      computável -- é literalmente o valor do único estrato). 2 testes
      novos (`test_cochrans_q_k1_devolve_nan_nunca_zero_ou_cem_por_
      acaso_de_ponto_flutuante`, `test_cochrans_q_k2_valores_quase_
      identicos_ainda_clipa_pra_zero_no_df_maior_que_zero`).

      **Auditoria independente concluída 2026-08-19 -- achado HIGH real,
      corrigido no mesmo dia.** A citação original ("precedente unânime,
      5 fontes: `metafor::rma.uni`/pacote `meta` no R devolvem `QE=NA`/
      `I²=NA` pra k=1; Higgins & Thompson 2002; Cochrane Handbook §9.5.2")
      era FALSA -- o agente auditor leu o código-fonte REAL dos 2
      pacotes R (não resumos de terceiros): `metafor::rma.uni`
      (`R/rma.uni.r`) hard-codifica `QE=0, I2=0, QEp=1` pra `k<=p`;
      `meta::hetcalc` (`R/hetcalc.R`) hard-codifica `Q=0` pra `k=1` com
      dado presente -- as DUAS bibliotecas tratam `k=1` como "0% por
      convenção" e INCLUEM na agregação, o OPOSTO da decisão `NaN`/
      EXCLUIR tomada aqui. Nenhum texto do Cochrane Handbook (arquivado
      ou atual) declarando `I²`/`Q` indefinidos pra `k=1` foi encontrado
      (o link §9.5.2 citado está morto). A decisão de código (`NaN`)
      continua válida, mas por OUTRA razão -- não precedente de
      biblioteca, e sim decisão específica ao uso real deste repo
      (M4: `k=1` normalmente = classificador de regime degenerado que
      saturou a 1 bucket, AG-087 -- excluir da mediana evita recompensar
      esse colapso com um score artificialmente "limpo"; diferente do
      caso de meta-análise clássica onde `k=1` só significa "1 estudo
      disponível", sem essa conotação de degenerescência). Docstring de
      `cochrans_q_heterogeneity` e do teste `test_cochrans_q_k1_*`
      reescritos 2026-08-19 removendo a citação falsa e substituindo pela
      justificativa de primeiros princípios correta.

      2 achados MEDIUM adicionais, ambos corrigidos no mesmo dia: (a)
      impacto real em M4 subestimado no docstring -- confirmado 26
      células com `n_buckets=1` em `experiments/m4_critical_windows_
      report.json` (23 saíam `0.0` "por sorte" de ponto flutuante e
      eram incluídas na mediana antes desta correção, 3 saíam `100.0`
      corrompidas -- as 26 passam a `NaN`/excluídas agora, mudança
      sistemática, não só das 3 quebradas), quantificado no docstring;
