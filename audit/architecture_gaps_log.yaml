  - id: AG-156
    date: "2026-08-22"
    file: "src/models/baselines.py:819 (run_b4_feature_shuffle)"
    related_file: "audit/evidence_ledger.yaml::alpha-legado-auc-abaixo-do-nulo-permutado; src/labels/weights.py:40-116 (concurrency/uniqueness)"
    found_by: "Agent Project Assurance (revisão independente do design doc v2 do Meta-model), PRINCE2 §6.4"
    gap: >
      `run_b4_feature_shuffle` permuta as features com
      `rng.permutation(X_perm.shape[0])` -- i.i.d., linha a linha -- sobre um
      dataset cujos rótulos triple-barrier SE SOBREPÕEM (é o motivo de
      existirem `concurrency`/`uniqueness` em `weights.py` e purge/embargo em
      `cpcv.py`) e cujas features têm autocorrelação temporal forte por
      construção (janelas móveis, quantis expansivos). A permutação i.i.d.
      destrói a estrutura temporal de ambos os lados.
    severity: "baixo"
    layer: "models/baselines -- nulo estatístico com esquema de permutação que não preserva a estrutura de dependência do dado"
    consequence: >
      QUALIFICAÇÃO QUE MUDA A LEITURA, e por isso a severidade é baixa: para o
      B4 especificamente, o viés vai na direção CONSERVADORA. Features
      permutadas i.i.d. perdem a autocorrelação que um modelo poderia explorar,
      então o nulo fica MAIS FÁCIL de bater que um nulo com estrutura
      preservada. Logo o achado registrado em `evidence_ledger.yaml`
      (`auc_real_pooled = 0,49776` < `auc_permuted_pooled = 0,49998`) NÃO é
      invalidado -- ao contrário, é reforçado: o Alpha ficou abaixo de um nulo
      otimista. O que importa aqui é o PRECEDENTE: este é o único esquema de
      permutação implementado no repo, e é o que seria copiado por qualquer
      teste de permutação futuro. O design doc v2 do Meta-model especificou um
      Gate E0 baseado em nulo permutado sem declarar o esquema -- herdar este
      teria produzido um nulo de variância governada por linhas em vez de
      blocos, com p95 estreito demais, fazendo o gate mais consequente do
      desenho passar praticamente qualquer coisa. Corrigido na v3 do documento
      (circular-shift por bloco + validação obrigatória do nulo); este AG
      registra a fonte do padrão.
    resolved_by_commit: null
    resolution: null
    status: "aberto -- prioridade baixa. Fix recomendado quando alguém tocar em B4: permutação por BLOCO (circular-shift com comprimento derivado da escala de dependência já usada no projeto -- largura de grupo do CPCV ou `cpcv_embargo_ms`), e reportar que o valor de `auc_permuted` muda com o fix. NÃO refazer a medição do Alpha legado só por isso (motor descontinuado, §15.19). Regra geral recomendada: todo teste de permutação sobre dado com rótulo sobreposto declara o esquema explicitamente."

