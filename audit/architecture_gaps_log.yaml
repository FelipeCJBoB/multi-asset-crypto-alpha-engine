  - id: AG-043
    date: "2026-08-16"
    file: "config/constants.yaml (8 janelas de feature, AG-027)"
    related_file: "audit/architecture_gaps_log.yaml::AG-027, docs/refactor_dollar_bar_canonico.md (F1/F2/F3), src/features/support.py"
    found_by: "Manager -- extensão do vocabulário scaling_invariant e decisão de reclassificação."
    gap: >
      Registro de decisão sobre o vocabulário `scaling_invariant`
      (AG-027 addendum, hoje `clock`|`bar_count`). Ganha 3ª classe
      `activity`, MAS com regra explícita: dollar bar não converte
      automaticamente toda feature em `activity` -- a unidade é definida
      pela INTENÇÃO da feature, não pelo tipo de barra.

      Dois casos reais que testam a regra: `feature_d06f_taker_imbalance_
      window` já é `bar_count` hoje (justificativa: baseline não deve
      "correr atrás do próprio evento") -- sob dollar bar, `bar_count` já
      É proporcional a atividade, então esta feature ganha a propriedade
      de `activity` DE GRAÇA, sem precisar da 3ª classe. `feature_a13_ema_
      window`/`feature_b01_rsi_window`, ao contrário, estão marcadas
      `clock` com justificativa ESPECÍFICA amarrada ao Bloqueador 1 (A13:
      "span deve ser comensurável ao horizonte de RELÓGIO do label",
      constants.yaml). Reclassificar essas duas pra `bar_count`
      SILENCIOSAMENTE (sem reescrever a justificativa) violaria a própria
      regra -- a tag mudaria de sentido sem a intenção documentada mudar
      junto. Nota: B01 tem a MESMA classe `clock` mas justificativa mais
      fraca ("coincidência de magnitude", não amarrada ao horizonte do
      label como A13) -- as duas não têm o mesmo peso de decisão.

      Decisão: **F1 explícito para A13 (e reavaliar B01 separadamente,
      justificativa mais fraca)** -- tratar como mudança DELIBERADA de
      intenção ("EMA de 48 dollar bars, ponto"), reescrever a justificativa
      em `constants.yaml` junto com a tag, rodar como parte da MESMA
      passada F3 (classificação pura, 0 trials por desenho -- compatível
      com os 15 trials restantes). F2 (preservar intenção original via
      `span = duração_mediana_medida`) descartado -- reintroduz a
      não-estacionariedade do Bloqueador 2 dentro da própria feature, e
      `support.ema` só aceita span inteiro fixo.

      Achado adicional (a tag sozinha não resolve, precisa auditoria de
      código): `support.py:283` (`std*sqrt(window)` assume `window`
      proporcional a tempo -- falso sob dollar bar mesmo em features JÁ
      marcadas `bar_count`, afeta C06/C07); `support.py:252-256` (gap
      "overnight" do Yang-Zhang colapsa de sentido, vira gap tick-a-tick);
      `group_e.py`/`_sources.py:60-65` (defasagem do asof-join de OI/
      funding vira variável). Grupo K (`hour_of_day`/`day_of_week`/
      `days_since_halving`) é uma 4ª categoria ADJACENTE, não confundir --
      indexado por timestamp real, não é pergunta de span de agregação.
    severity: "baixo"
    layer: "features"
    consequence: >
      Sem separar "reclassificação de tag" de "correção de matemática em
      support.py", a passada F3 poderia dar falsa sensação de completude
      -- a tag `bar_count`/`clock` fica coerente no YAML, mas o código que
      de fato calcula a feature continua com premissa de relógio
      escondida, exatamente a classe de furo que `project_assurance`
      existe pra pegar.
    resolved_by_commit: null
    resolution: >
      PARCIALMENTE IMPLEMENTADO 2026-08-16 -- só a peça (1), F3 (passada de
      classificação pura em constants.yaml, 0 trials): `feature_a13_ema_
      window` mantido `scaling_invariant: clock`, justificativa reescrita
      pra deixar explícito que é decisão DELIBERADA de intenção ("EMA de
      48 barras de RELÓGIO, ponto -- não converte pra bar_count sob dollar
      bar"), não classificação por omissão. `feature_b01_rsi_window`
      REAVALIADO separadamente, com justificativa PRÓPRIA (não emprestada
      de A13) -- RECLASSIFICADO de `clock` para `bar_count`: a
      justificativa `clock` anterior ("mesma classe de A13") nunca amarrou
      o span ao horizonte de relógio do label, era só coincidência de
      magnitude; RSI de Wilder usa o mesmo primitivo de suavização de
      `atr_window` (`support.py::wilder_smooth`), que já está decidido
      `bar_count` pro Feature Engine sob esta mesma AG-043; RSI é
      oscilador limitado (família agregação/estimação, como B07/C06/C07),
      não distância posicional amarrada ao horizonte do label como A13.
      Nenhum valor numérico mudou (A13 continua 48, B01 continua 14) --
      só a tag e a justificativa, 0 trials. `feature_d06f_taker_imbalance_
      window` NÃO tocado (já `bar_count`, fora de escopo por desenho).

      Peça (2) investigada a fundo 2026-08-16 (decisão explícita pedida
      pelo Manager: implementar agora vs. deferir, com evidência, não
      suposição). Veredito: DEFERIR -- mesma razão estrutural de
      AG-042(2/3), confirmada ponto a ponto, não por analogia solta.

      (a) `support.py` `realized_vol` (`out = std*np.sqrt(window)`, hoje
      linha 299 -- a linha `:283` citada acima sofreu drift desde a
      escrita original desta entrada, com a docstring do módulo crescendo
      por causa de AG-030): não existe fórmula de correção óbvia.
      `docs/refactor_dollar_bar_canonico.md` §1.3 já mapeia esta EXATA
      linha dentro de uma decisão de 4 opções (F1-F4) que o Manager ainda
      não tomou, e a opção F1 (não recalibrar, tratar como `bar_count`
      puro) argumenta que `sqrt(nº de barras)` PODE JÁ SER a leitura
      correta sob dollar bar ("erro amostral não conhece relógio",
      `constants.yaml:686-687`) -- trocar por `sqrt(tempo decorrido)` não
      é obviamente um conserto, pode ser uma regressão, dependendo de qual
      leitura a arquitetura escolher. Não há contrato de tempo decorrido
      pra consumir hoje: `_BAR_OUTPUT_SCHEMA` (`src/data/bars.py:127-138`)
      só tem `open_time`/`close_time`, sem `duration_ms`/`n_trades`
      normalizado; `canonical_bar_type` não é lido por nenhuma linha de
      `src/` fora de 2 comentários em prosa (`cpcv.py:169`,
      `m2_bar_comparison.py:9`) -- confirmado por grep, mesmo achado B de
      `docs/refactor_dollar_bar_canonico.md`. Inventar um parâmetro
      `elapsed_ms` agora seria adivinhar um contrato que o Bloqueador 1
      (AG-031) e o Bloqueador 2 (AG-042) ainda vão desenhar.

      (b) `support.py` `yang_zhang_vol`, gap overnight (hoje linha 272,
      era `:252-256`): não existe fórmula substituta na literatura pra
      "gap tick-a-tick sob barra de atividade" -- Yang-Zhang (2000)
      pressupõe sessão de bolsa com fechamento real, não barra de
      atividade contínua. A pergunta não é "qual a fórmula certa" (bug de
      engenharia), é "esse estimador continua válido sob dollar bar, e se
      não, o que substitui" (pesquisa de literatura + medição em dado
      real). Teste sintético não resolve -- provaria só que o mecanismo
      dispara sob espaçamento variável, o que já é sabido e não é a dúvida
      em aberto.

      (c) `group_e.py`/`_sources.py:60-65`, defasagem do asof-join OI/
      funding: não há bug de código aqui -- `asof_align_backward` já opera
      sobre `close_time`, já é agnóstico a tipo de barra por construção
      (mesma conclusão que `docs/refactor_dollar_bar_canonico.md:138` já
      registra sobre o teste de paridade equivalente: "agnóstico à
      cadência por construção"). O achado é uma HIPÓTESE de contaminação
      informacional (a defasagem pode carregar sinal de atividade não
      intencional) só testável correlacionando com atividade de MERCADO
      REAL -- fabricar isso em barras sintéticas provaria só que a
      defasagem VARIA (trivial, já sabido por desenho), não que ela
      CONTAMINA.

      Precedente direto na mesma sessão pro mesmo padrão de decisão:
      `src/validation/cpcv.py:387-393` já enfrentou o problema
      estruturalmente idêntico (checar identidade de grade sob
      espaçamento não-uniforme) e escolheu levantar `NotImplementedError`
      explícito em vez de fingir um mecanismo -- "não há caller de
      produção real (canonical_bar_type=dollar decidido, deployment não
      iniciado)... falhar explícito aqui é mais honesto que fingir que a
      checagem de hoje generaliza". Mesma lógica aplicada aqui.

      Diferença de AG-030 (que FOI corrigido proativamente): lá o bug
      afetava comportamento de PRODUÇÃO HOJE, sob a grade de tempo atual
      (BTC acumula ~231k barras de 15m vs ~164k dos alts -- viés real e
      mensurável sem esperar dollar bar nenhuma). Aqui, os 3 pontos
      produzem resultado IDÊNTICO ao esperado sob barra de tempo (janela
      uniforme -> `sqrt(bar_count)==sqrt(tempo)` a menos de constante;
      gap overnight realmente ~0 por barras contíguas; defasagem do
      asof-join realmente pequena e estável) -- não há caller de produção
      afetado hoje, e não há como validar a correção proposta sem o mesmo
      dado real que os dois Bloqueadores também esperam.

      O que desbloqueia: (1) Bloqueador 1 (AG-031, horizonte do label) e
      Bloqueador 2 (AG-042 itens 2/3, identidade de grade/threshold)
      resolvidos -- decisão de como o Feature Engine de fato recebe uma
      dollar bar (schema, campo de tempo decorrido se houver algum); (2)
      `docs/refactor_dollar_bar_canonico.md` §8 item 2 medido --
      distribuição real de duração de relógio de uma dollar bar (hoje
      TBD; sem essa medição não dá pra saber se o erro de `sqrt(window)`
      é desprezível ou dominante); (3) decisão explícita do Manager entre
      as opções F1-F4 de §1.3 (a MESMA decisão que já cobre este código,
      não uma decisão nova a criar). Só então dá pra escrever um teste
      sintético que reflita o contrato real em vez de um inventado, e
      código que resolve o problema de verdade em vez de codificar uma
      suposição de design revertível. Nenhum arquivo de código alterado
      nesta investigação.
    status: "parcialmente fechado -- F3 (classificação pura, 2026-08-16) E
