    addendum_decisao_exclusao_expanding_2026-08-23: >
      Manager decidiu `08_SPLIT`/`AG-032` item pendente (as 3 features
      `expanding` SAEM do conjunto ativo `T1_FEATURE_IDS`) --
      implementação em andamento nesta mesma sessão. **Consequência
      direta pra esta entrada**: o gate que mascarava este risco
      (`assert_no_expanding_lookback_in_active_set` levantando
      incondicionalmente enquanto as 3 features expanding estavam
      ativas) deixa de bloquear o caminho -- `compute_max_feature_
      lookback_ms` passa a EXECUTAR de verdade sob `resolution_id`
      (R2/R3), usando o proxy `label_prefetch_p99_bar_duration_ms` cuja
      magnitude segue não-validada pra purge (ressalva 3/4 acima). **Isto
      NÃO é mais um risco dormente/preparação futura -- é pré-requisito
      real antes do primeiro treino sob R2/R3 com purge ativo.**
      Severidade reavaliada de "média" pra "alta" na prática (o texto do
      campo `severity` acima não foi reescrito -- ledger não edita
      campos fechados retroativamente sem necessidade; a reavaliação
      fica registrada aqui).

      Ação tomada: `tools/diagnostics/measure_max_consecutive_bar_
      window_duration.py` escrito (novo) -- mede, sobre os parquets JÁ
      PERSISTIDOS (`data/capacity/dollar_bars_r{1,2,3}/`), a duração
      REAL máxima de qualquer janela de `max_feature_window_bars()`
      (hoje 96) barras consecutivas, por símbolo × resolução -- responde
      a ressalva 3 (medição do máximo real) sem coletar dado novo (B23).
      Reporta também o ratio contra o proxy usado hoje, generalizando a
      medição pontual de SOLUSDT/R3 (~5,8x, achado do `project_
      assurance`) pras 15 combinações reais. Não escreve em
      `constants.yaml` nem altera `compute_max_feature_lookback_ms`
      sozinho (B20) -- decisão de como registrar a constante MEASURED e
      como a guarda de runtime (ressalva 4) usa esse número fica pro
      Manager revisar depois de rodar. Comando (Claude não executa,
      protocolo de execução):
      `uv run python tools/diagnostics/measure_max_consecutive_bar_
      window_duration.py`. Verificado: `ruff check`/`mypy`/
      `banned_patterns.py --strict` limpos.

      **Não fechar esta entrada** até a ressalva de magnitude
      (constante MEASURED + guarda de runtime) fechar de verdade --
      mesma condição já registrada no addendum anterior, agora mais
      urgente.

    addendum_medicao_real_2026-08-23: >
      Usuário rodou `tools/diagnostics/measure_max_consecutive_bar_
      window_duration.py` -- 15/15 combinações, 0 skipped.
      **Resultado contradiz a leitura anterior de "~5,8x sub-cobertura"**:
      `worst_case_ratio_max_over_proxy = 0,472` -- em TODAS as 15
      combinações, a duração real máxima de uma janela de 96 barras
      consecutivas fica ABAIXO (não acima) do proxy usado hoje. Pior caso
      real: SOLUSDT/R3, 283,44h reais vs. 600,16h de proxy (ratio 0,472).
      Causa raiz da contradição, investigada: `label_prefetch_p99_bar_
      duration_ms` é uma constante ÚNICA, definida como o MÁXIMO entre as
      15 combinações símbolo×resolução (não um valor por-símbolo) -- o
      achado original de "5,8x" comparava o máximo real de SOLUSDT/R3
      contra o p99 LOCAL daquele mesmo símbolo/resolução (base menor,
      específica), não contra a constante cross-symbol que `compute_max_
      feature_lookback_ms` de fato usa em produção. A proteção real
      (constante = pior caso global, não por símbolo) já embute a folga
      que o achado original media como ausente.

      **Consequência**: o proxy usado hoje É seguro na prática, com folga
      real (~2,1x no pior caso) -- mas por CONSTRUÇÃO INCIDENTAL (a
      constante feliz ser o máximo global), não por garantia estrutural
      declarada. Se `max_feature_window_bars()` crescer no futuro (nova
      feature com lookback > 96) ou a constante for redefinida como
      por-símbolo, a folga pode encolher sem aviso. `structlog.warning`
      (addendum anterior) permanece como visibilidade barata,
      independente desta medição. Dado completo: `experiments/max_
      consecutive_bar_window_duration.json`. Decisão de fechar esta
      ressalva (aceitar a folga incidental como suficiente) ou
      formalizar a garantia (registrar `label_prefetch_p99_bar_
      duration_ms` explicitamente como "MEASURED, definição = máximo
      cross-symbol, garantia de folga documentada") fica pro Manager --
      não fechada automaticamente aqui (B20).

    addendum_solucao_definitiva_2026-08-23: >
      Usuário perguntou explicitamente: "refatorar pra engenharia mais
      robusta, ou remediação barata basta?" -- decisão: garantia
      FORMAL, não aceitar a folga incidental. Constante dedicada nova,
      `max_consecutive_bar_window_duration_ms` (`config/constants.yaml`,
      `MEASURED` direto, valor = máximo real medido, 1.020.378.446ms,
      SOLUSDT/R3) substitui o reaproveitamento de `label_prefetch_p99_
      bar_duration_ms` (que segue existindo, intocada, servindo só seu
      propósito original de PREFETCH). `compute_max_feature_lookback_ms`
      (`src/features/build.py`) reescrita: sob `resolution_id`, retorna
      a constante dedicada DIRETO (já é duração TOTAL da janela medida,
      não "por barra" -- multiplicar por `window_bars` reintroduziria a
      suposição de linearidade que uma dollar-bar irregular não garante).

      **Por que per-resolução/per-símbolo NÃO foi escolhido** (opção
      mais granular considerada e descartada): dado medido mostra que a
      variância é dominada pela RESOLUÇÃO (R1: ratio 0,14-0,255; R2:
      0,221-0,347; R3: 0,379-0,472 -- fator ~1,8x dentro de cada
      resolução) muito mais que pelo SÍMBOLO dentro da mesma resolução.
      Um único valor global (máximo cross-tudo) segue o MESMO padrão já
      estabelecido neste projeto pra este tipo de constante de segurança
      (`label_prefetch_p99_bar_duration_ms`, mesma filosofia
      documentada: "dimensionado pelo PIOR caso... custo é só folga
      extra, nunca corretude") -- consistente com o precedente real do
      repo, não inventado. Per-símbolo/resolução ficaria mais preciso
      mas exigiria threading de `symbol` por toda a cadeia de chamada
      (`pipeline.py`/`leakage.py`) sem ganho prático adicional dado que
      a folga já é generosa (~2,1x) mesmo no formato mais simples.

      **Guarda de staleness nova**: a constante foi medida pra
      `window_bars=96` -- se o conjunto ativo de features crescer essa
      janela, a função detecta a divergência e emite `structlog.warning`
      (não falha -- a constante ainda protege, só deixa de ser o máximo
      exato), pedindo remedição via o mesmo diagnóstico.

      3 testes novos (`tests/unit/test_features_build.py`): usa a
      constante dedicada corretamente, sem warning quando `window_bars`
      bate com o medido, com warning quando diverge. Verificado:
      `banned_patterns.py --strict`/`check_constants_referenced.py`/
      `check_constants_provenance.py`/`ruff`/`mypy` limpos (mypy: 1 erro
      novo, mesma classe pré-existente de "atributo não exportado
      explicitamente" já presente 4x no mesmo arquivo antes desta
      mudança -- não uma classe nova de problema).

