        mesma sessão)
      bar_unit = USDT
      bar_close_condition: cumulative_quote_volume >= threshold_usdt

      IDENTIDADE da grade = symbol + resolution_id + threshold_usdt +
      calibration_version -- NÃO barras/dia. `target_activity` (a
      densidade histórica que calibrou o threshold) vira insumo de
      CALIBRAÇÃO/MONITORAMENTO apenas, nunca parte da identidade -- fecha
