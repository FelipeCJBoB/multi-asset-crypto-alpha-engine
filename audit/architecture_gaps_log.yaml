    severity: "alto"
    layer: "analysis -- comparação de candidatos não é mais apples-to-apples entre BOCPD e os outros 5"
    consequence: >
      Amostra ~5x maior pro BOCPD em cada célula infla artificialmente
      seu Cochran's Q/I² (I² aumenta com precisão amostral a
