      calibra por `total_dollar/target_n_bars`, mas o discovery nunca
      declarou se "resolução" = threshold ou = contagem-alvo).

      Separação de camada explícita: SEMÂNTICA da barra = threshold_usdt;
      CALIBRAÇÃO da resolução = densidade histórica desejada; IDENTIDADE
      da grade = symbol+resolução+threshold+versão. Evita que "R1 = 15m
