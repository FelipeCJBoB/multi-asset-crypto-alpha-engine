    found_by: "Agent auditoria cética sobre a liderança suspeita do BOCPD em Cochran's Q/I², 2026-08-18 -- reprodução direta sobre dado real (~43.776 obs de BOCPD vs. ~8.736 dos outros candidatos numa mesma célula)"
    gap: >
