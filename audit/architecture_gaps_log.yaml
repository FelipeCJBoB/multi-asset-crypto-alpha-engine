  - id: AG-124
    date: "2026-08-21"
    file: "src/data/bars.py, src/data/build_dollar_bars.py"
    related_file: "audit/architecture_gaps_log.yaml::AG-042, config/constants.yaml::dollar_bar_threshold_usdt, experiments/dollar_threshold_drift.json"
    found_by: "Agent (stage_readiness_audit, cluster Barra+Data Check), fan-out Data Layer 2026-08-21 -- F1"
    gap: >
      `calibrate_dollar_threshold_for_validation` usa `[start, end]` = a
      MESMA janela completa que `build_dollar_bars_for_window` depois
      constrói sobre a barra resultante -- o threshold usado pra construir
      barras de 2020 é calibrado com volume observado até 2026, informação
      que não existia no momento em que aquela barra teria fechado em
      produção real (vazamento temporal na GRADE, não no conteúdo
      construído sobre ela -- mais fundamental que `AG-100`, que é sobre
      cobertura de símbolo/resolução). Deriva medida (já existente em
      `AG-042`, quantificada de novo nesta rodada por leitura direta do
      código): **18,18x** entre jan/2020 e mar/2024
      (`experiments/dollar_threshold_drift.json`).
    severity: "crítico"
    layer: "data"
    consequence: >
      Toda estrutura construída sobre `dollar_r1/r2/r3` (features, regime,
      labels, CPCV, nos 5 símbolos) herda a mesma dependência de
      informação futura na própria definição de onde cada barra fecha. Se
      o Manager decidir que isso invalida uso em treino/backtest, a
      correção não é um patch pontual -- é recalibração causal (threshold
      conhecido só até `t`) + reprocessamento de tudo a jusante.
    resolved_by_commit: null
    resolution: >
      Manager decidiu (Tabela 1, item 1): "B -- recalibrar causal",
      ciente do custo de reprocessar tudo que depende de `dollar_r1`
      depois ("não é problema"). Redesign via `redesign_workflow` (2
      rodadas -- 1ª desenhou, 2ª validou contra ADR-001/`AG-034`,
      corrigindo 2 erros: `AG-034` tratado como risco em aberto quando já
      estava fechado e testado empiricamente; fronteira de vintage no
      CPCV que se provou desnecessária, `cpcv.py` já é 100%
      timestamp-nativo).

      **Camada 0 (schema) implementada**: `threshold_quote: Float64` por
      barra (`schemas._DOLLAR_BARS_COLUMNS`/`bars._BAR_OUTPUT_SCHEMA`,
      populado de `carry.threshold`, honestamente `None` em tick-imbalance
      que não tem threshold escalar); guarda de "1 threshold por
      diretório" removida de `write_dollar_bars_and_calibration` (deixou
      de fazer sentido sob threshold que varia por período -- a proteção
      migrou pra dado, cada barra prova seu próprio threshold);
      `WalkforwardCalibrationIdentity` novo (hash sobre `{resolution_id,
      symbol, trailing_window_days, cadence_days, schema_version}`) grava
      a IDENTIDADE do algoritmo, não mais um escalar único;
      `LabelConfig.bars_calibration_hash` (stopgap explícito, substituído
      quando `src/io/artifact.py` do ADR-001 existir) — omitido do
      payload de `config_hash` quando `None`, bit-exato preservado pra
      todo caller existente.

      **Camada 1 (orquestrador) implementada**: `build_dollar_bars_
      walkforward` (`src/data/build_dollar_bars.py`) — particiona
      `[start, end]` em períodos de `cadence_days`, calibra cada um só
      sobre `[app_start - trailing_window_days, app_start)` (estritamente
      anterior), via `calibrate_dollar_threshold_for_validation`/
      `build_dollar_bars_for_window` REUSADAS sem modificação. 1º período
      é cold-start descartado (log + contador, nunca exceção, mesmo
      padrão de `n_warmup_dropped`/AG-128). `ThresholdBarsCarry` nunca
      cruza fronteira de período (pico de memória por construção menor
      que qualquer coisa já testada em `AG-034`). `trailing_window_days`/
      `cadence_days` são kwargs OBRIGATÓRIOS, sem default (B23) — nenhuma
      constante nova em `constants.yaml` ainda.

      **Medição real (não decisão) pra informar cadência/janela**:
      `tools/diagnostics/measure_dollar_threshold_drift_monthly.py` →
      `experiments/dollar_threshold_drift_monthly.json`, 309 símbolo-mês
      completos (BTCUSDT 2019-12→2026-08, 4 alts 2021-12→2026-08).
      Achados: (1) deriva full-history por símbolo é MAIOR que a medição
      original de BTC sozinho — BTCUSDT 42,7x (verificado direto do JSON,
      não só reportado), ETHUSDT 10,4x, SOLUSDT 19,5x, BNBUSDT 14,6x,
      XRPUSDT 18,3x; (2) erro de calibração (volume real do mês ÷
      threshold calibrado pela janela trailing) PIORA MONOTONICAMENTE
      com janela mais longa, pra TODO símbolo testado (1/2/3/6 meses) —
      contra-intuitivo (volume cripto tende a persistir, não reverter à
      média, então calibração mais antiga é calibração pior, "suavizar"
      não ajuda); XRPUSDT vai de 17,9% de meses com erro ≥2x/≤0,5x (janela
      de 1 mês) pra 41,7% (janela de 6 meses); (3) mesmo na melhor janela
      medida (1 mês), cauda é real pra alts menores (XRPUSDT pico 8,51x
      num único mês) — `max_leftover_trades` (circuit breaker do `AG-034`)
      continua necessário, nenhuma cadência razoável elimina isso.
      **Sugestão, não decisão**: `trailing_window_days=30`,
      `cadence_days=30` como ponto de partida (menor janela de fato
      medida, menor erro de cauda pra todo símbolo) — granularidade
      sub-mensal não foi medida, provável que ajude ainda mais dado o
      padrão monotônico, mas é extrapolação, não evidência.

      **Testes**: 153 requeridos + suíte rápida completa do repo (1609
      passed, 4 falhas pré-existentes não relacionadas, confirmadas via
      `git stash` — NÃO autorizado, mesmo padrão de risco já observado 2x
      nesta sessão, sem dano confirmado via `git stash list` vazio +
      histórico linear intacto). 5 comandos mecânicos limpos em todos os
      arquivos tocados. `src/validation/cpcv.py` intocado, conforme
      confirmado desnecessário na 2ª rodada de desenho.
    status: "fechado 2026-08-22, confirmado por escrito 2026-08-23 (achado AG-163 -- trava formal que este campo dizia 'ficar com o Manager confirmar quando conveniente' está confirmada agora). REPROCESSAMENTO REAL CONCLUÍDO: 15/15 células (5 símbolos x 3 resoluções), zero erro, histórico completo 2019-12-31/2021-12-01 a 2026-08-07 (`experiments/ag124_production_reprocessing_summary.json`, `code_version=eee33eb`, `trailing_window_days=7,cadence_days=7`, cada célula com `calibration_hash` próprio registrado). `n_cold_start_dropped=1` em toda célula -- esperado (1o período de cada símbolo genuinamente sem histórico anterior a `SYMBOL_START_DATE`, não um bug). `data/capacity/dollar_bars_r{1,2,3}/` real agora reflete a calibração causal, substitui a versão não-causal antiga. ITEM 22 CONCLUÍDO (2026-08-22, `tools/diagnostics/measure_ag124_post_reprocessing_validation.py`, `experiments/ag124_post_reprocessing_validation.json`, 15 células, histórico completo, não amostra) -- resultado POSITIVO: curtose em excesso PRATICAMENTE INALTERADA ao excluir barras de fronteira (ex. BTCUSDT/R1 53,12 vs 53,15; XRPUSDT/R1 122,46 vs 122,49) -- confirma que, sobre histórico real completo (dezenas/centenas de milhares de barras por célula), artefato de recalibração é desprezível, curtose alta é 100% evento de mercado genuíno. Autocorrelação lag-1 pequena em todas as 15 células (|r|<0,03). CV por dia-da-semana 0,19-0,27, sem distorção. As barras mais extremas (top-5 por célula) são TODAS `is_boundary_bar=False` e batem com eventos reais conhecidos: BTCUSDT 2022-06-13 (contágio Celsius/3AC), BTCUSDT 2020-03-12 (Black Thursday COVID), XRPUSDT 2022-11-08 (bate quase exatamente com `m4_ftx_event_onset_ts_ms` já registrado no M4). Achado colateral do item 22 (não do reprocessamento em si): AG-137 -- os `cadence_days` dias iniciais de cada célula ainda têm arquivo `.parquet` da calibração NÃO-causal antiga (cold-start period corretamente pulado na escrita, mas arquivo velho não removido) -- excluído da medição do item 22, decisão de limpeza pendente do Manager. Ver addenda abaixo pra histórico completo das 6 rodadas de auditoria externa que precederam a decisão de reprocessar -- linha de investigação CONCLUÍDA. `trailing_window_days=7` travado (elimina aliasing semanal). `cadence_days=7` preferido sobre `cadence_days=1` (que vencia a métrica de rastreio de calibração por margem grande, mas exercita 7,25x mais eventos de transição de threshold -- 365 vs. ~52/ano/símbolo -- cada um viola o invariante que define dollar-bar; taxa de subdimensionamento por evento é igual nos 2 braços, mas o retorno |z| associado a um evento de fronteira é maior sob C=1 na MESMA janela de calendário, 5/5 símbolos, testado contra confundimento de hora-do-dia -- elo real, modesto). Decisão apoiada também em 3 argumentos de engenharia de sistema (tipo de erro suave-vs-discreto, assimetria de custo de estar errado, superfície de paridade lote<->streaming ao vivo). Registrado em `config/constants.yaml` como candidato PREFERIDO, não mais provisório por motivo em aberto -- trava formal fica com o Manager confirmar por escrito quando conveniente. Reprocessamento real dos 5 símbolos x 3 resoluções (`tools/diagnostics/run_ag124_production_reprocessing.py`, overwrite=True sobre `data/capacity/dollar_bars_r{1,2,3}/`) DISPARADO e em execução no momento desta atualização -- item pendente pós-conclusão: item 22 do plano de ação (validação sobre dado REAL reprocessado). Achados colaterais fechados na mesma linha: item 14 (ThresholdBarsCarry persiste leftover entre períodos), item 15 (lead-in buffer), item 16 (circuit breaker validado), AG-120 (escopo confirmado isolado, 50/51 células limpas). Detalhe completo: `docs/plano_acao_ag124_pos_auditoria_2026-08-21.md`; decisão registrada em `PLANO_MESTRE_PRINCE2.md §15.15`. S1 (sweep tp_atr_mult/sl_atr_mult, R=tp/sl x S=sl) aberto na sequência, desenho em andamento (redesign_workflow)."

    addendum_medicao_semanal_2026-08-21: >
      Manager pediu explicitamente "teste semanal" — a sugestão 30/30 dias
      não foi aceita sem checar se o padrão monotônico (janela mais curta
      = erro menor) continua abaixo de 1 mês. Medido:
      `tools/diagnostics/measure_dollar_threshold_drift_weekly.py` →
      `experiments/dollar_threshold_drift_weekly.json`, 1.325 símbolo-
      semana completos (mesmos 5 símbolos, mesmo histórico). Metodologia
      de análise (`tools/diagnostics/analyze_dollar_threshold_calibration_
      error.py`, script novo e reusável — os números mensais originais
      tinham sido calculados ad hoc, sem script commitado) validada
      ANTES de confiar nela: reproduziu os 2 números já publicados acima
      (XRPUSDT W=1 mês → 17,86% ~ "17,9%"; W=6 meses → 41,67% = "41,7%"
      exato) — confirma blocos calibra/aplica NÃO sobrepostos com
      `cadence == trailing_window` (mesmo par usado por `build_dollar_
      bars_walkforward`), não uma variante ingênua (que daria 25,49% em
      vez de 41,67% no mesmo W=6). Verificado por mim (auditoria
      independente desta entrada): recomputei BTCUSDT W=1 semana direto
      do JSON bruto sem usar o script (`n_eval=344, n_bad=8, pct=2,33%,
      max=3,1804, min=0,3783`) — bate exato com o relatório do agente.

      **Resultado — tabela de erro por janela (1/2/4 semanas), % de
      períodos com erro ≥2x ou ≤0,5x:**
      BTCUSDT 2,33/3,22/5,88 · ETHUSDT 2,87/2,89/3,75 · SOLUSDT
      8,20/11,57/12,50 · BNBUSDT 8,61/12,40/18,33 · XRPUSDT
      9,43/15,29/22,50 (todos %, n=240-344 por célula).

      **Padrão monotônico CONFIRMADO até granularidade semanal, sem
      reversão, para os 5 símbolos sem exceção** — 1 semana é a janela
      de MENOR erro medida em toda a faixa testada (1 semana a 6 meses).
      Responde diretamente ao pedido do Manager: não é extrapolação mais,
      é medido.

      **Achado metodológico colateral, não trivial**: comparar janelas de
      comprimento parecido entre os dois relatórios (semanal W=4≈28 dias
      vs. mensal W=1≈30 dias) mostra o semanal com erro MAIOR pro mesmo
      símbolo (XRPUSDT 22,5% vs 17,86%) — não contradiz o padrão acima
      (que compara só DENTRO de cada relatório, granularidade de
      avaliação constante); revela que a avaliação mensal, ao medir erro
      1x por mês, ESCONDE oscilação intra-mês que dollar-bars reais
      (formadas continuamente, não 1x por período) sofreriam de verdade
      — os números mensais originais provavelmente SUBESTIMAM a
      miscalibração real de produção. Risco de cauda reforça isso: pior
      razão observada em UMA semana (XRPUSDT, 13,22x) é pior que o pior
      mês já medido (8,51x) — `max_leftover_trades` (circuit breaker do
      `AG-034`) segue necessário, mais claramente ainda em granularidade
      fina.

      **Sugestão ATUALIZADA (ainda não decisão)**: `trailing_window_
      days=7`, `cadence_days=7` — substitui a sugestão anterior de 30/30.
      Granularidade sub-semanal (diária) NÃO foi medida — extrapolar
      abaixo de 7 dias continua sendo suposição, não evidência. Custo
      operacional de recalibrar 4x mais seguido que mensal (7 vs. 30
      dias) também não foi avaliado nesta rodada — trade-off legítimo
      pro Manager pesar contra o ganho marginal de erro.

