  - id: AG-121
    date: "2026-08-20"
    file: "src/regime/canonicalization.py::canonicalize_states; docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §3.4 Cláusula 2 (Parte I do parecer completo)"
    related_file: "PRD_V4_1.md §3.2 M4; src/validation/regime_utility.py::identify_stress_state_by_volatility (AG-114, workaround já em produção)"
    found_by: "Claude, verificando o ADR-001 completo (Partes I/II, ~1900 linhas, colado pelo Manager nesta sessão como docs/ADR-001_..._base.md) antes de implementar AG-118 -- achado real de leitura, não hipotético"
    gap: >
      ADR-001 (parecer de auditoria externa, §3.4 Cláusula 2) recomenda
      canonicalizar estado de regime ordenando por VOLATILIDADE realizada
      média dos membros do estado no fold de treino, ASCENDENTE --
      motivado por label switching em HMM/mistura (permutation invariance
      dos rótulos de estado). A implementação REAL já em produção
      (`src/regime/canonicalization.py::canonicalize_states`, usada por
      HMM k=2/3/4, Jump Model e BOCPD) ordena por RETORNO médio
      ascendente, desempate por variância ascendente -- critério LITERAL
      de `PRD_V4_1.md` §3.2 M4 ("estados ordenados de forma
      determinística (média de retorno, desempate por variância)").

      CORREÇÃO 2026-08-20 (mesmo dia, Manager): `PRD_V4_1.md` é
      documento OBSOLETO deste projeto (só `PLANO_MESTRE_PRINCE2.md` +
      ADR-001 completo são canônicos) -- a formulação original desta
      entrada tratava o critério do PRD como "decisão deliberada e
      documentada do projeto, não um bug", em pé de igualdade com a
      recomendação do ADR-001. Isso está ERRADO na hierarquia atual: não
      é uma divergência entre 2 fontes igualmente válidas, é a
      implementação real ainda seguindo um critério de um documento
      DESATUALIZADO, nunca reconciliado contra o único parecer de
      arquitetura canônico (ADR-001) que já existia quando isso foi
      escrito. Tratamento corrigido abaixo.
    severity: "médio"
    layer: "regime -- convenção de canonicalização, consumida por todo candidato não-baseline"
    consequence: >
      Qualquer consumidor futuro que confie em `canonical_id` como PROXY
      de volatilidade crescente (ex.: "estado K-1 é sempre o mais
      volátil") está ERRADO -- o `canonical_id` real ordena por retorno,
      não por volatilidade; os dois só coincidem por acaso. `AG-114`/
      `AG-118` (Gate Efficiency) já evitam esse erro corretamente,
      usando `identify_stress_state_by_volatility` (deriva o estado de
      stress via `realized_vol_short` medido diretamente, nunca confia em
      `canonical_id` cru) -- workaround já em produção, não um fix
      pendente para ESSES 2 consumidores. Risco real é pra consumidor
      FUTURO que reintroduza a suposição errada (ex.: implementação do
      contrato `regime()`/`tradeable` de ADR-001 §3.4, quando
      `src/io/artifact.py` for construído) sem repetir esse achado.
    resolved_by_commit: null
    resolution: >
      Não resolvido nesta sessão -- fora de escopo da implementação de
      `AG-118` (que já sidesteps corretamente via
      `identify_stress_state_by_volatility`). Registrado pra decisão
      futura do Manager, agora com a hierarquia documental correta: (a)
      migrar `canonicalize_states` pra ordenar por volatilidade
      (recomendação do único documento canônico de arquitetura que trata
      disso, ADR-001) -- risco real a considerar antes de migrar: quebra
      paridade com todo resultado já medido de M4/AG-114/AG-119, que
      assume a ordem atual (por retorno) implicitamente em qualquer
      código que já leia `canonical_id` bruto fora de `identify_stress_
      state_by_volatility` -- não auditado exaustivamente nesta sessão,
      levantamento de impacto é pré-requisito antes de migrar, não um
      motivo pra não migrar; ou (b) manter retorno como critério por uma
      razão TÉCNICA nova e explícita (não "porque o PRD já dizia isso" --
      essa justificativa não vale mais). Nenhuma das 2 decidida aqui --
      fica TBD, não decidida por omissão. Migração natural de se fazer
      junto de `src/io/artifact.py`/`regime()` formal (ADR-001 action
      item 3, ainda não construído) -- mesma janela de mudança de
      `schema_version`, não precisa de 2 quebras de compatibilidade
      separadas.
    status: "decidido 2026-08-23 (migrar, opção A + estatística MÉDIA) -- implementação em código de canonicalize_states permanece TBD, natural de fazer junto de src/io/artifact.py/regime() formal (ADR-001 action item 3, ver resolution). Não bloqueia AG-118 (workaround já em produção via identify_stress_state_by_volatility)."

