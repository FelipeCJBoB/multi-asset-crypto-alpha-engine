      do valor sob 15m), mas R2 sai ~2× maior (mediana ~95,1h-103,6h) e
      R3 ~4× maior (mediana ~202,1h-209,2h) -- o warmup fica bem mais
      longo que a intenção original de 200 barras=50h conforme a
      resolução fica mais grosseira, não mais curto como a suspeita
      original de `docs/refactor_dollar_bar_canonico.md` (rajada faz
      janela CURTA) previa isoladamente. As DUAS coisas são reais e
      convivem: no CASO TÍPICO (mediana), a janela cresce com a
      resolução; no CASO DE RAJADA (p1, pior caso de confirmação RÁPIDA
      demais), `min_warmup_bars=200` pode fechar em pouco mais de 25min
      (XRPUSDT/R1, `p1=1552s`) até ~2h (XRPUSDT/R3, `p1=7087s`) --
      XRPUSDT consistentemente mostra os p1 mais curtos entre os 5
      símbolos, BTCUSDT/ETHUSDT os mais longos mesmo no pior caso
      (`p1` de 34-267 mil segundos = 9,5h-74h). Decisão de fórmula de
      conversão SEGUE COM O MANAGER (B20/B23 -- não decidida aqui,
      medição só confirma que nem "sempre mais curto" nem "sempre mais
      longo" descreve o comportamento real; depende de symbol/N/regime
      de liquidez). `AG-180` permanece formalmente `aberto` até essa
      decisão."

    addendum_decisao_e_implementacao_2026-08-23: >
      Decisão do Manager sobre os 2 cenários que a medição real deixou em
      aberto -- confirmada e implementada, commit `3c3ed14`.
      **`min_warmup_bars` mantido em contagem de barra pura** (opção A) --
      a fórmula que o originou (`constants.yaml::min_warmup_bars`, `max`
      lookback fixo de feature T1/T2 + convergência de suavização
      exponencial) é nativamente em unidade de barra, as features que
      protege (C06 janela de 96 barras, A13 EMA de 48 barras) operam em
      contagem de barra, não em tempo -- manter fixo é consistente com o
      que está sendo protegido, e o efeito colateral (mais tempo real de
      warmup sob R2/R3) é o lado conservador do erro, não o arriscado.
      **`regime_confirmation_bars`/`regime_stress_exit_confirmation_bars`
      migrados pra piso híbrido** (opção B) -- `RegimeThresholds.
      confirmation_min_real_ms`/`stress_exit_confirmation_min_real_ms`
      (`src/regime/classifier.py`), `(N_barras-1) * step_ms("15m")` --
      confirmação de troca de eixo agora exige `pending >= N_barras` E
      `tempo_real_decorrido >= piso_ms`, o mais restritivo dos dois.
      Racional: a proveniência dessas duas é `LITERATURE` (PRD §4.5,
      escrito num mundo só-15m) -- a intenção real por trás de "N barras
      consecutivas" é confirmação de mercado por N-1 intervalos de
      relógio, não N observações discretas independente de quanto tempo
      isso leva sob dollar-bar; sem o piso, uma rajada de liquidez
      confirmaria em minutos, exatamente no momento de MAIOR incerteza --
      o oposto do que um filtro de ruído deveria fazer. Sob
      `bar_source="time_15m"` a condição híbrida reduz a bit-exata (grade
      fixa: N barras sempre cobrem exatamente `(N-1)*step_ms` de
      `open_time` a `open_time`) -- zero mudança de comportamento em
      produção real hoje, confirmado por teste de regressão dedicado. 11
      testes novos, `1741 passed, 0 failed` (suíte completa, confirmado
      pelo Manager). `AG-180` fechado."

