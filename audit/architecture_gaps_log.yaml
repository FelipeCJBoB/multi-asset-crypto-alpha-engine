      `time_stop_ms` em `src/labels/triple_barrier.py`, `barrier_sweep.py`,
      `cost_surface.py`, `backfill_multi_symbol.py`, `experiment_log.py`,
      `faixa2_caminho_b.py`. `horizon_end_ms = t0 + cfg.time_stop_ms`
      direto (item 1). Invariante de `assert_label_invariants` reescrita:
      teto antigo `n_bars_held <= time_stop_bars` vira teto direto em
      relógio `(t1-t0) <= time_stop_ms` sobre linhas não-NOFILL -- não
      depende mais de `bar_ms`/`n_bars_held` (item 2, resolvido via
      substituição do mecanismo de checagem, não via reescrita de
      `n_bars_held` -- essa arithmetic continua válida enquanto bars_15m
      for grade de TEMPO; vira contagem real só quando dollar bar existir
      de fato, comentário deixado no código apontando pra isso). `n_funding_
      events` Int8->Int16, widening preventivo (item 3). Grep completo
      confirmado sem callers órfãos (item 5, re-verificado por
      project_assurance independentemente). Nova constante `time_stop_ms`
      em `constants.yaml` (DERIVED, mesmo valor de `time_stop_bars` em
      15m, 28.800.000ms); `time_stop_bars` mantida "SUPERSEDIDO", não
      apagada.

      **ESCOPO RESTRINGIDO, DEPOIS REVERTIDO -- atr_window ENTROU no
      pacote.** Numa primeira rodada, atr_window ficou de fora (motivo
      registrado: leitura equivocada do `NotImplementedError` de
      `ATRWilderEstimator.estimate()` como se protegesse `window`, quando
      na verdade protege só `horizon_minutes` -- um problema DIFERENTE,
      não implementado, que não bloqueia derivar `window` em barras fora
      do estimador). `project_assurance` (Agent fresco) confirmou a
      distinção arquitetural (constante compartilhada com Feature Engine)
      mas o Manager, ao reler `docs/refactor_dollar_bar_canonico.md:403`
      ("resolver só metade deixa a barreira dimensionada numa unidade e o
      horizonte em outra"), decidiu explicitamente incluir `atr_window`
      nesta mesma PR -- ver AG-047 pra decisão registrada.

      **atr_window: IMPLEMENTADO 2026-08-16.**
      `LabelConfig.atr_window: int` (barras) vira `atr_window_ms: int`
      (relógio) -- SÓ neste dataclass; `constants.yaml::atr_window`
      continua existindo, inalterada, porque o Feature Engine (`src/
      features/build.py:90,142`, scripts de `src/analysis/`) consome a
      mesma constante direto como contagem de barra, decisão deliberada e
      separada (`scaling_invariant: bar_count`, AG-043/F1). Nova constante
      `atr_window_ms=18000000` (DERIVED, 20 barras @ 15m) em
      `constants.yaml`. `build_labels`/`LabelConfig.from_constants()`
      derivam `window_bars = round(atr_window_ms / bar_ms)` FORA do
      `ATRWilderEstimator` -- ele continua recebendo um `int` em barras,
      nenhuma mudança interna nele. `estimator_id` default passa a usar o
      `window_bars` já ajustado ao `tf` pedido (bit-exato `"atr_wilder_
      w20"` em `tf="15m"`; diverge em outro `tf`, corretamente, já que a
      contagem real de barras pra cobrir o mesmo relógio muda).

      **n_bars_held: IMPLEMENTADO 2026-08-16** (Manager decidiu incluir,
      ao reler o texto literal do item 2 do escopo original abaixo).
      Vira contagem REAL via busca em `t0_arr` (não mais `ceil((t1-t0)/
      bar_ms)`), em `triple_barrier.build_labels` E `barrier_sweep.
      resolve_barriers_vectorized` (parâmetro novo, opcional,
      `decision_bar_close_time_ms` -- `None` cai pra aritmética antiga,
      usado pelo único caller real que não carrega `bars_15m` nem consome
      o campo, `faixa2_caminho_b.py`). Fallback aritmético preservado pra
      cauda além do último decision bar carregado (bars_15m não tem
      buffer além de `end`, ao contrário de mark_1m) -- garante bit-
      exatidão com a fórmula antiga onde não há gap real no dado.
      Testes novos provam que o mecanismo detecta gaps de verdade (valor
      DIFERENTE da aritmética quando falta uma barra no array), não é só
      uma reformulação equivalente da mesma divisão --
      `test_build_labels_n_bars_held_conta_real_e_detecta_gap_no_array_de_
      decisao` (`test_labels_triple_barrier.py`),
      `test_resolve_barriers_vectorized_n_bars_held_contagem_real_detecta_
      gap` (`test_labels_barrier_sweep.py`). Teste de integração sobre
      dado real (1 ano, BTCUSDT) adicionado em `test_reproduz_
      distribuicao_real_2024_long` confirmando paridade exata entre os
      dois motores.

      **BUG DE RAIZ achado pelo usuário rodando pytest (2026-08-16),
      corrigido:** `test_build_labels_horizon_e_invariante_a_tf_nao_
      escala_mais` quebrou com `ValueError` de `estimator_id` inconsistente
      -- causa raiz: `estimator_id` (convenção `atr_wilder_w{N}`) passou a
      depender de DOIS campos (`atr_window_ms` E `tf`, via `window_bars =
      round(atr_window_ms/step_ms(tf))`), mas `dataclasses.replace(cfg,
      tf=novo)` só atualiza `tf`, deixando `estimator_id` obsoleto
      silenciosamente -- a MESMA classe de risco que a docstring da classe
      já citava pra `atr_window_ms` sozinho, só que a dependência de `tf`
      não tinha sido reconhecida. Solução robusta (não band-aid): validação
      nova em `LabelConfig.__post_init__` -- se `estimator_id` segue a
      convenção `"atr_wilder_w..."`, valida que bate com `round(
      atr_window_ms/step_ms(tf))`, falha alto NA CONSTRUÇÃO (inclusive via
      `replace()`, que re-chama `__post_init__`) com mensagem apontando pra
      causa raiz -- não só no ponto profundo dentro de `build_labels` onde
      o sintoma aparecia antes. Efeito colateral descoberto no caminho: um
      bug PRÉ-EXISTENTE e mais antigo (de quando `_TIME_STOP_MS_DEFAULT` foi
      introduzido) ficou exposto por essa validação -- 11 construções de
      teste tinham `atr_window_ms=20` (literal, correto só quando o campo
      era `atr_window` em barras) em vez de `20*900_000`; corrigido com
      constante `_ATR_WINDOW_MS_DEFAULT` nova. 3 call-sites de teste que
      usavam `replace(cfg, tf=X)` sem recalcular `estimator_id`/
      `atr_window_ms` corrigidos (`test_labels_triple_barrier.py`,
      `test_analysis_cost_surface.py`) -- nenhum caller de PRODUÇÃO real
      afetado (todos usam `LabelConfig.from_constants(tf=...)`, que já
      deriva `estimator_id` corretamente).

  - id: AG-032
    date: "2026-08-15"
    file: "src/validation/cpcv.py"
    related_file: "config/constants.yaml::cpcv_embargo_bars/time_stop_bars/feature_c06_vol_ratio_long_window, tests/unit/test_validation_cpcv.py"
    found_by: "Agent (general-purpose), a pedido do Manager -- avaliação de proposta de reclassificação LITERATURE -> DERIVED"
    gap: >
      Proposta de reclassificar `cpcv_embargo_bars` pra DERIVED com base em
      "embargo só precisa cobrir o lookback de feature (96), pois purge já
      cobre o alcance do label" está MECANICAMENTE INCORRETA pro código
      real. `purge_mask` (cpcv.py:383) só atua sobre linhas de treino com
      `t0 <= g_end` -- qualquer linha com `t0 > g_end` NUNCA é purgada,
      porque `t1 > t0` sempre (confirmado por
      `test_generate_splits_embargo_remove_bordas_mesmo_sem_overlap_de_t1`,
      que prova o embargo agindo SEM overlap de `t1`). A fronteira `g_end`
      (cpcv.py:380-381) vem só da partição de `t0` (`assign_time_groups`,
      linhas 161-194) -- nunca referencia o `t1` real das linhas de TESTE,
      que pode esticar até `g_end + time_stop_bars` (32 barras, teto por
      construção). Esse resíduo de até 32 barras após `g_end` fica sem
      cobertura de purge e só é removido pelo embargo. Piso mecânico real
      pro lado direito/frente, dado o código como está: `time_stop_bars`
      (32) + `feature_c06_vol_ratio_long_window` (96) = **128**, não 96.
      175 (atual) ainda cobre com folga de 47 barras (~27%) -- sem
      urgência, mas a fórmula "96 sozinho" subestimaria o piso real em 25%.

      Achado adicional: o lado esquerdo/trás do embargo (`t0 < g_start`,
      cpcv.py:386) NÃO tem derivação mecânica equivalente rastreável --
      continua sendo, na prática, o buffer heurístico original de
      correlação serial (López de Prado, "1% do fold"), não uma fórmula.

      Achado independente, já registrado em `constants.yaml`: a suspeita
      de erro de unidade/TF ("175 barras ~= 88h" só fecha a conta a 30m,
      não a 15m) NÃO é resolvida pela cobertura de lookback -- são duas
      justificativas CONCORRENTES e incompatíveis pro mesmo número: "88h"
      exige escalonar por TF; "128 barras" (`feature_c06` é
      `scaling_invariant: bar_count`, fixo entre TFs) exige NÃO escalonar.
      Reclassificar pra DERIVED trocaria o alvo, não validaria nem
      invalidaria a suspeita original.
    severity: "médio"
    layer: "validation"
    consequence: >
      Nenhum risco imediato -- 175 > 128 com folga. Risco latente: se
      `cpcv_embargo_bars` for reclassificado pra DERIVED com a fórmula
      "96 sozinho" (ou reduzido perto de 96 numa varredura de
      sensibilidade futura, Sprint 10), o piso real (128) seria violado
      SILENCIOSAMENTE -- mesma classe de risco de AG-004/AG-009. Além
      disso, `embargo_bars` é hoje escalar único aplicado a M15/M30/H1 sem
      escalonamento -- se M2/M3 rodar CPCV real em 30m/1h, o mesmo 175
      produz 87,5h/175h de embargo real, nunca avaliados.
    resolved_by_commit: null
    resolution: >
      DECIDIDO 2026-08-16 (Manager, Bloqueador 3 de docs/refactor_dollar_
      bar_canonico.md §4.3): **E4 + E1, nessa ordem, E4 tratado como
      correção estrutural obrigatória, não como alternativa a E1.**
      Separa as duas responsabilidades que hoje estão misturadas: PURGE
      elimina sobreposição real de intervalo [t0,t1] (deve responder
      "existe overlap real com o teste?", não usar `g_end` como proxy);
      EMBARGO protege só correlação serial pós-fronteira, fenômeno de
      RELÓGIO -- por isso E1 (relógio fixo), nunca E2 (contagem de barra,
      reacopla embargo à densidade de dollar bar) nem E3 (max de dois
      buffers -- remedia um purge imperfeito em vez de corrigi-lo,
      violando "nunca remediar, sempre solucionar").

      **Achado novo que AFINA a decisão, não a contradiz:** este mesmo
      registro (linha "(1) se vale mudar purge_mask...") já continha a
      pista -- "tornando 96 de fato suficiente" pressupõe que corrigir só
      o `t1` do LABEL de teste (componente 32, time_stop esticando pra
      FRENTE) deixaria o componente de LOOKBACK de feature (96, C06
      esticando pra TRÁS a partir de treino logo após g_end) ainda como
      responsabilidade do embargo. São duas direções de "cegueira de
      fronteira" mecanicamente diferentes -- uma é overlap de INTERVALO DE
      LABEL, a outra é alcance de JANELA DE FEATURE. **Critério de aceite
      explícito da implementação de E4** (não presumir, testar): escrever
      um caso de teste que isola só o componente 96 -- uma linha de treino
      com `t0` bem depois de `g_end` mas cuja janela de 96 barras alcança
      pra dentro do teste, sem nenhum `time_stop` envolvido -- e confirmar
      se o novo `purge_mask` pega esse caso. Se SIM (E4 escopado pra cobrir
      as duas direções): embargo reduz a "1% do fold" puro, nos dois
      lados -- e esse número já é computável AGORA, sem esperar dollar bar
      existir, porque `assign_time_groups` (cpcv.py:177) já particiona por
      LARGURA DE TEMPO igual (`np.linspace`), então "1% do fold" é
      quantidade de relógio nativa. Se NÃO (E4 cobre só o componente 32):
      embargo ainda precisa de `max(1% do fold, pior-caso de relógio do
      lookback de 96 barras)`, e o 2º termo depende de medir a distribuição
      de duração da dollar bar (P-2, docs/refactor_dollar_bar_canonico.md
      §8) -- não fecha sem isso.

      43,75h (175 barras × 15min, valor legado) NÃO é levado adiante como
      placeholder -- se E4 fechar o piso mecânico (mesmo que parcialmente),
      43,75h vira SUPERESTIMATIVA (foi calibrado pra cobrir 128+47 de
      folga, ~27%) e carregá-lo remove treino que já não protege nada.
      Primeira estimativa honesta: "1% do fold" recalculado direto do
      `np.linspace`, provavelmente bem menor que 43,75h.

      `step_ms(tf)` sai do caminho CANÔNICO do CPCV (`CPCVConfig` deixa de
      chamar), mas não é removido do repo -- `m2_bar_comparison.py`
      continua precisando comparar grades (é o mecanismo que decidiu
      dollar bar vencer em M2), então o caminho que resolve `step_ms(tf)`
      pra barra de tempo permanece em paralelo, só deixa de ser o default.
    status: >-
