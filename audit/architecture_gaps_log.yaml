    decisao_manager_2026-08-22_3_decisoes_residuais: >
      Manager decidiu as 3 pendências do brief
      docs/brief_auditoria_externa_2026-08-22_decisoes_residuais_risco_regime.md
      (§9, itens 1-2), depois da síntese de 2 pareceres externos e da
