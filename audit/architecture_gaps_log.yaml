  - id: AG-113
    date: "2026-08-20"
    file: "audit/n_lifetime.yaml (pré-filtro de custo, ainda não executado)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §2.6, §5 item 3; config/constants.yaml (E27f_cost_atr_ratio)"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B)"
    gap: >
      n_eff (amostra rotulada independente) é aproximadamente T/H
      (histórico / horizonte da barreira vertical) e é INVARIANTE à
      resolução do dollar bar -- rodar em R1 (mais rápida) não dá mais
      amostra efetiva que rodar em R3 (mais lenta), só mais linhas na
      tabela. O que a resolução de fato compra/destrói é o HURDLE DE
      CUSTO: win-rate de breakeven p* = (sl_mult+c)/(tp_mult+sl_mult),
      com c em unidades de ATR. Com TP=2,0/SL=1,5 e o custo/ATR medido
      de 19,4% (E27f_cost_atr_ratio, 2026), p*~=48,4% em R1; a mesma
      geometria numa resolução ~4x mais lenta (ATR escala ~raiz(4)=2x)
      devolve p*~=45,6% -- 2,8pp de hurdle de graça. Esse pré-filtro
      (c(símbolo,resolução) = custo_bps/ATR_bps pras 15 linhas) é
      aritmética sobre dado já existente, não exige rótulo nem backtest
      novo -- pela própria convenção AG-098, conta como 1 trial (passe
      de ranking que reusa artefato), não 15.
    severity: "médio"
    layer: "arquitetura de pesquisa -- sequenciamento da 1a rodada de seleção de linha"
    consequence: >
      Oportunidade, não bug: rodar o pré-filtro de custo antes de
      investir engenharia em gerar histórico de rótulo pras 3
      resoluções x 5 símbolos pode eliminar a maior parte do espaço de
      busca de graça, antes de qualquer backtest custoso. Responde
      também à decisão pendente #6 de §15.11 (resoluções lentas agora
      ou só a rápida) -- recomendação: gerar histórico de rótulo pra
      resolução mais LENTA também (não só a rápida, que tem o pior
      hurdle), rodar R1+R3 primeiro (pula R2 -- interpolação, só decide
      algo se R1/R3 divergirem em direção).
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre rodar o pré-filtro de custo antes de comprometer engenharia às 3 resoluções"

  - id: AG-114
    date: "2026-08-20"
    file: "src/analysis/m4_regime_comparison.py (_anova_or_degenerate, teste de heterogeneidade de forward_return)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §2.7 (ratificado, PLANO_MESTRE_PRINCE2.md §15.12); docs/m4_regime_auditoria_externa_2026-08-19_validacao_cruzada.md (lista 'fix mecânico' -- separação de volatilidade futura, occupancy, transition failure rate, detection delay); src/regime/regime_utility.py (só median_duration_bars/switch_rate/n_segments hoje)"
    found_by: "Manager, ao perguntar 'qual futuro o Regime vai atender' logo após ratificar o ADR-001 -- síntese entre a decisão de arquitetura (regime = gate, não feature) e o critério estatístico já usado pra escolher candidato de regime no M4"
    gap: >
      A metodologia da Trilha A/M4 avalia os 6 candidatos de regime por
      heterogeneidade do RETORNO médio futuro do Alpha entre buckets de
      regime (Welch's F/omega^2 sobre forward_return, h=1) -- isso mede
      utilidade como FEATURE preditiva. O ADR-001, agora ratificado
      (§2.7), decide que regime NÃO entra como feature do Meta/Alpha na
      v1 -- fica exclusivamente como GATE de risco, e um gate "não
      precisa prever, precisa evitar": não exige significância
      estatística de retorno, exige identificar corretamente períodos
      de risco de cauda elevado. O resultado nulo generalizado do M4
      (18/18 p-valores 0,30-0,85) prova que nenhum candidato é útil
      como FEATURE de retorno -- mas essa deixou de ser a pergunta que
      decide promoção, porque a arquitetura ratificada já decidiu que
      regime não vai ocupar esse papel na v1. A pergunta que decide
      promoção agora (heterogeneidade de VOLATILIDADE/risco de cauda
      futura entre buckets, occupancy do estado de stress, taxa de
      falso-positivo de transição, delay de detecção) nunca foi medida
      -- e já está catalogada, com precedente de literatura verificado,
      na lista "fix mecânico" da validação cruzada do M4: "separação de
      volatilidade futura -- só retorno é testado hoje, apesar do
      regime ser construído com log_return_1 E realized_vol_short, só
      metade é validada"; "effective_number_of_states/occupancy por
      estado"; "transition failure rate (N=3/5/10)"; "detection delay
      vs. eventos econômicos independentes".
    severity: "alto"
    layer: "regime / validation -- critério de avaliação do M4 desalinhado do papel de consumo já ratificado pela Trilha B"
    consequence: >
      M4 não pode ser encerrado com "resultado nulo, nenhum candidato
      serve" a partir só do teste de retorno -- isso responde a
      pergunta errada pro papel que regime de fato vai ter (gate).
      Antes do veredito final de M4 (congelar metodologia + locked
      holdout, já planejado em docs/m4_regime_plano_execucao.md),
      rodar os 4 diagnósticos de qualidade de GATE já catalogados como
      "fix mecânico" -- barato, reusa infraestrutura existente, sem
      redesenho: (1) heterogeneidade de VOLATILIDADE futura entre
      buckets, mesmo desenho estatístico já em uso (Welch's
      F/omega^2), trocando forward_return por volatilidade realizada
      futura; (2) occupancy por estado + effective_number_of_states;
      (3) transition failure rate; (4) detection delay vs. eventos
      econômicos independentes. Só depois desses 4 rodarem "nenhum
      candidato serve" (ou "candidato X é o melhor gate") vira
      afirmação sustentada pela pergunta certa, não pela pergunta que
      a arquitetura já descartou.
    resolved_by_commit: null
    resolution: >
      Regra de decisão APROVADA pelo Manager (2026-08-20), registrada
      ANTES de qualquer execução -- precondição B20 (threshold nunca
      escolhido por métrica OOS, sempre a priori). Estrutura: 3 gates de
      desqualificação + 1 métrica primária de ranking.
        GATE 1 -- occupancy / effective_number_of_states: estado de
          stress não pode ser degenerado (nem ausente, nem dominante).
          Limiar numérico TBD -- medir contra o próprio baseline em
          produção como referência (B23, nunca número inventado).
        GATE 2 -- transition failure rate: candidato que oscila sem
          parar é desqualificado independente de separação. Limiar TBD
          -- medir.
        GATE 3 -- detection delay vs. eventos econômicos independentes:
          papel DECIDIDO pelo Manager (2026-08-20): DESEMPATE, não
          desqualificante -- só entra em jogo se 2+ candidatos empatarem
          na métrica primária (separação de volatilidade). Um candidato
          não é eliminado por detection delay ruim sozinho.
        MÉTRICA PRIMÁRIA -- entre os candidatos que passam nos 3 gates,
          rank por heterogeneidade de VOLATILIDADE futura entre buckets
          (Welch's F/ω², mesmo desenho estatístico já validado pro
          teste de retorno original -- permutação em bloco por
          episódio, correção de múltiplos testes já em uso no M4).
      Nenhum limiar numérico foi fixado nesta aprovação -- ficam TBD até
      a medição real rodar; o que foi fixado é a ESTRUTURA da regra
      (quais métricas, que papel cada uma tem, ordem de aplicação), que
      é o que a disciplina anti-HARKing exige travado a priori.
    status: "REABERTO 2026-08-20, RE-FECHADO 2026-08-21 -- ver status_gate1_criterio_operacionalizado_2026_08_21 abaixo (Manager travou o criterio de Gate 1 em pior-caso/33%, hmm_gaussian_k2_v1 passa a FALHAR o Gate 1 nas 3 resolucoes sob esse criterio, veredito hmm_gaussian_k4_v1 CONFIRMADO e mais robusto que antes). Historico da fragilidade original preservado abaixo, nao apagado. Auditoria externa (Manager, papel de auditor) achou que o Gate 1 foi aplicado com 2 criterios misturados (mediana de resolucao vs. maximo por janela) sem declarar qual decide -- sob o criterio literal (mediana, ja testado a 40%), hmm_gaussian_k2_v1 (34,1/34,9/39,5%) PASSA o Gate 1 e vence a metrica primaria em R1 (97,82 vs 97,44) e R2 (95,31 vs 94,98). Declaracao de vencedor 'hmm_gaussian_k4_v1' NAO deve ser tratada como definitiva ate a regra ser re-especificada com criterio operacional unico. 1 hipotese alternativa (R3 do parecer -- HMM levar vantagem em R3 por fit in-sample) CHECADA e REFUTADA (AG-122 adendo final, verificado em 2 pontos do codigo: fit usa so obs[:train_end_idx], decode so obs[test_start_idx:test_end_idx]) -- nao muda a fragilidade do Gate 1, so elimina 1 explicacao alternativa possivel. Decisao de re-especificar Gate 1/Gate 3 continua pendente do Manager [RESOLVIDO 2026-08-21, ver campo acima -- Gate 3/'empate' permanece item residual nao-bloqueante]. Historico preservado abaixo (o que foi decidido nesta rodada, mesmo estando sob revisao)."
    status_historico_pre_reabertura: "FECHADO (2026-08-20) -- regra aplicada sobre o resultado real (experiments/m4_critical_windows_report.json), candidato vencedor declarado: hmm_gaussian_k4_v1. Detalhe completo, tabela de numeros e verificacao de robustez dos limiares em PLANO_MESTRE_PRINCE2.md secao 15.12.5. Resumo: Gate 1 (occupancy <=~33%) desqualifica hmm_gaussian_k2_v1 (34-44%, dominante, achado robusto entre 25%/33%/40% de limiar testados e entre janelas); Gate 2 (transition_failure_rate_n5 <= ~2-3x baseline) desqualifica bocpd_v1 (~3,3x baseline, falha em toda a faixa 2x-3x testada); sobreviventes hmm_k3/hmm_k4 nao empatam na metrica primaria (Gate 3 nao precisou entrar) -- hmm_k4 vence nas 3 resolucoes, margem maior em R3. jump_model_cjm_v1 confirmado nao-candidato nesta rodada (BTC-only, AG-117) E estruturalmente instavel nesta config (eff_n_states 1,17-1,39, occupancy variando de 1,0 degenerado a 0,04-0,56 entre janelas) -- separado do trabalho AG-119/Condicao C, que testa config nova. Achado colateral novo: BNBUSDT/RECENTE/R2 falhou por desalinhamento timestamp, isolado por AG-019, registrado como AG-120. Proximo passo: autorizacao do Manager pra implementar AG-118 (Gate Efficiency) usando hmm_gaussian_k4_v1 como candidato."
