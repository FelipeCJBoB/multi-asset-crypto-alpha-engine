  - id: AG-195
    date: "2026-08-23"
    file: "src/models/alpha.py::fit_side_model (:301-330), src/models/alpha.py::LGBMHyperparams, config/constants.yaml::alpha_lgbm_subsample"
    related_file: "docs/alpha_model_design_doc_2026-08-22.md §4 (tabela de mapeamento XGBoost->LightGBM, D-11)"
    found_by: "Workflow audit_engineering (auditoria de engenharia, lente FI, 4 lentes + verificação adversarial), 2026-08-23"
    gap: >
      D-11/design doc tratou `subsample` como renomeação direta e
      COMPLETA do `subsample` do XGBoost -- FALSO. No LightGBM,
      `subsample` (alias `bagging_fraction`) só tem efeito quando
      `subsample_freq` (alias `bagging_freq`) é um inteiro positivo --
      default da própria lib é `0` = "no enable" (confirmado na doc
      oficial, `LGBMClassifier` constructor). `fit_side_model` passava
      `subsample=hyper.subsample` (0.8) sem nunca passar `subsample_
      freq`/`bagging_freq` -- grep no repo inteiro confirmou 0
      ocorrências desses 2 nomes antes do fix. `config/constants.yaml::
      alpha_lgbm_subsample` declarava `provenance: DERIVED`,
      "renomeação direta... sem mudança de valor" -- proveniência
      factualmente incorreta dado que o EFEITO real era zero (bagging
      totalmente desabilitado), não idêntico ao XGBoost.
    severity: "alto"
    layer: "models -- hiperparâmetro de regularização inerte por parâmetro companheiro ausente, não pego por nenhum teste"
    consequence: >
      Todo modelo treinado sob a migração LightGBM (Camada 1 e Camada 0,
      as 15 combinações símbolo x resolução quando o gate abrir) treinaria
      SEM row-subsampling -- toda árvore sobre 100% dos dados de treino,
      não os 80% que `constants.yaml`/o design doc afirmavam. Nenhum
      teste em `test_models_alpha.py` exercitava bagging/subsample antes
      deste achado -- passaria despercebido até um retreino real, quando
      a diferença de regularização já teria contaminado Sharpe/HHI/
      decisão de permanência (§5.11) sem ninguém saber que o parâmetro
      nunca esteve ativo.
    resolved_by_commit: null
    resolution: >
      `LGBMHyperparams` ganha campo `subsample_freq: int`; nova constante
      `alpha_lgbm_subsample_freq` (ASSUMED, valor 1 = bag a cada
      iteração, `sweep_required: true`, `class: B`) -- não é conversão
      de nenhum valor XGBoost (não existe parâmetro equivalente lá).
      `fit_side_model` passa `subsample_freq=hyper.subsample_freq` ao
      `LGBMClassifier`. `alpha_lgbm_subsample.source` corrigido pra não
      mais alegar "sem mudança de valor" isoladamente. Teste novo
      (`test_fit_side_model_subsample_freq_realmente_ativa_o_bagging`)
      lê de volta via `model.get_params()` -- prova que o valor chega no
      objeto treinado, não só que `LGBMHyperparams.from_constants()`
      carrega um número.
    status: "fechado -- ver commit desta rodada, testado"

  - id: AG-196
    date: "2026-08-23"
    file: "src/models/alpha.py::fit_side_model (:301-345), src/models/persistence.py (docstring do módulo)"
    related_file: "docs/alpha_model_design_doc_2026-08-22.md §3 D-18, D-12; src/models/pipeline.py::run_layer1_sprint (device_type default cuda)"
    found_by: "Workflow audit_engineering (lente FI + pesquisa web dedicada, doc oficial LightGBM), 2026-08-23"
    gap: >
      A doc oficial do LightGBM (`Parameters.html#deterministic`) afirma
      textualmente que `deterministic=True` "works only with CPU device
      type". Confirmado por pesquisa independente: histograma sob CUDA
      usa `atomicAdd` (soma não-associativa, não-determinística por
      natureza), e o LightGBM emite um WARNING nativo nesse cenário --
      suprimido por `verbosity=-1` (B28, structlog-only). O único caller
      de produção real (`pipeline.run_layer1_sprint`) usa `device_type=
      "cuda"` por default; o teste golden bit-a-bit
      (`test_sprint8_reproducibility.py`) chama `run_fold` SEM passar
      `device_type`, então roda sempre sob `"cpu"` -- NUNCA exercita o
      caminho real de produção. A docstring de `persistence.py`
      registrava isso como "TBD -- não foi medido", o que subestimava a
      certeza real do problema: não é incógnita empírica pendente de
      trial, é fato já documentado pela própria biblioteca, verificável
      sem treinar nada.
    severity: "alto"
    layer: "models -- garantia de determinismo testada só no caminho que nunca roda em produção"
    consequence: >
      A arquitetura de persistência de modelo (`persistence.py`, reload
      de booster pra paper/live trading) depende de reload bit-exato.
      Se CUDA de fato quebrar essa garantia (o que a doc oficial já
      sugere ao restringir a `deterministic` a device CPU), a suíte de
      testes passaria silenciosamente para sempre -- o mecanismo de
      segurança (teste golden) é estruturalmente incapaz de capturar
      essa regressão, dando falsa confiança à garantia.
    resolved_by_commit: null
    resolution: >
      Não é possível medir determinismo real sob GPU sem treinar de
      verdade (fora do escopo desta sessão, sem GPU disponível pra
      Claude rodar nada). Fix aplicado: (1) `fit_side_model` emite
      `logger.warning` explícito via structlog quando `device_type !=
      "cpu"`, substituindo o sinal nativo do LightGBM que `verbosity=-1`
      suprime -- não fica mais silencioso; (2) comentário no código e
      docstring de `persistence.py` reescritos pra declarar isso como
      FATO documentado pela lib, não incógnita empírica ("TBD" undersold
      a certeza real). Saída de contingência (tolerância numérica em vez
      de igualdade bit-a-bit) já nomeada no design doc (§3 D-18), decisão
      de quando aplicá-la fica para quando o retreino real acontecer sob
      GPU e alguém puder de fato medir.
    status: "aberto -- visibilidade corrigida (warning explícito, doc honesta), mas a garantia em si permanece não verificada sob GPU real; reabrir/fechar quando o primeiro retreino real sob device_type=cuda acontecer e o teste golden puder ser comparado CPU vs GPU."

  - id: AG-197
    date: "2026-08-23"
    file: "src/models/alpha.py::fit_side_model (:301-345)"
    related_file: "audit/architecture_gaps_log.yaml::AG-196 (mesma garantia de determinismo, achado irmão)"
    found_by: "Workflow audit_engineering (lente FI + pesquisa web dedicada, doc oficial LightGBM), 2026-08-23"
    gap: >
      A doc oficial do LightGBM instrui explicitamente: "To avoid
      potential instability due to numerical issues, please set
      force_col_wise=true or force_row_wise=true when setting
      deterministic=true". Nenhum dos dois parâmetros aparecia em
      `fit_side_model` -- sem eles, a lib testa os dois modos de
      construção de histograma e escolhe o mais rápido a cada treino,
      podendo produzir escolha diferente entre máquinas/contagens de
      thread/versões da lib -- exatamente a instabilidade numérica que
      `deterministic=True` existe pra eliminar.
    severity: "medio"
    layer: "models -- lacuna de configuração documentada e não honrada, risco latente não confirmado"
    consequence: >
      Risco latente (o teste golden commitado passava no ambiente
      testado, então o heurístico tem sido estável até agora) -- se o
      heurístico escolher modos diferentes entre execuções, o teste
      golden bit-a-bit pode começar a falhar de forma intermitente e
      difícil de diagnosticar (não determinístico em qual ambiente
      falha), minando a mesma garantia que `deterministic=True` (D-12)
      trata como não-opcional.
    resolved_by_commit: null
    resolution: >
      `fit_side_model` ganha `force_row_wise=True` explícito -- dataset
      é "alto e magro" (7 features T1, centenas de milhares de barras),
      exatamente o perfil que a doc do LightGBM recomenda row-wise.
      Teste novo verifica `model.get_params()["force_row_wise"] is True`.
    status: "fechado -- ver commit desta rodada, testado"

