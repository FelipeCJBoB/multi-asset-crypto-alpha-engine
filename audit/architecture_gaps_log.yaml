  - id: AG-103
    date: "2026-08-19"
    file: "audit/n_lifetime.yaml:13-36 (regra de contagem N trials vs. 1 trial); PLANO_MESTRE_PRINCE2.md §15.11 (proposta AG-098, item 2)"
    related_file: "audit/architecture_gaps_log.yaml::AG-098; audit/n_lifetime.yaml id 10, id 11; src/validation/dsr.py:131-179"
    found_by: "project_assurance (Rodada 2 de contestação adversarial, revisão pós-Rodada-1 de AG-096/098/099)"
    gap: >
      A regra do item 2 de AG-098 ("id-10-símil SE E SOMENTE SE pelo
      menos 1 linha for promovida; id-11-símil se zero promoções") usa
      RESULTADO da rodada como critério de classificação. O ledger já tem
      uma regra FORMAL para essa distinção, escrita no próprio cabeçalho
      de `audit/n_lifetime.yaml` (linhas 19-29): a diferença entre id-10
      e id-11 é se cada candidata exige AJUSTE DE MODELO/BACKTEST NOVO
      (id-10, N trials) ou reusa um artefato já ajustado sem backtest por
      candidata (id-11, 1 trial) -- um critério ESTRUTURAL, conhecível a
      priori pelo desenho do teste, nunca pelo resultado. Seleção de
      linha exige, por construção, medir edge/Sharpe/DSR de CADA (symbol,
      resolution_id) individualmente -- estruturalmente id-10 sempre,
      goste ou não do resultado. AG-098 generalizou incorretamente um
      detalhe incidental da narrativa do precedente id-11 ("nenhuma
      promoção individual" foi mencionado na descrição daquele caso, mas
      NÃO é o critério que a regra formal do arquivo declara) como se
      fosse a regra em si. Consequência demonstrada em código:
      `src/validation/dsr.py::compute_dsr` recebe `n_trials` que
      alimenta diretamente `sr0_per_trade`/`dsr` (linhas 162-164) e
      `dsr_passes_conventional_threshold` decide promoção contra 0,95 --
      se `n_trials` da rodada depende de "alguma linha foi promovida"
      (que inclui a própria decisão sendo tomada), a penalidade de
      múltiplos testes de uma linha depende circularmente do resultado
      que ela mesma ajuda a determinar, e o `delta` a registrar no
      ledger só é conhecível DEPOIS que a rodada inteira (todas as 15
      linhas) terminar -- inclusive linhas avaliadas depois da que está
      sendo decidida agora.
    severity: "alto"
    layer: "validation (src/validation/dsr.py) + governança (audit/n_lifetime.yaml, regra de contagem)"
    consequence: >
      Hoje não bloqueia nada em produção porque `N_lifetime` não é gate
      vinculante (`AG-077`) -- mas AG-098 item 4 registra a contagem
      JUSTAMENTE para não precisar reconstruir retroativamente "se/quando
      o DSR voltar a ser vinculante". Adotar a regra como estava deixaria
      essa reconstrução futura presa numa definição circular -- o próprio
      problema que o item 4 diz querer evitar.
    resolved_by_commit: null
    resolution: >
      CORRIGIDO 2026-08-19, mesmo dia do achado -- `PLANO_MESTRE_PRINCE2.md`
      §15.11 revisado: item 2 de AG-098 substituído pelo critério
      ESTRUTURAL correto (backtest/ajuste por candidata, não resultado de
      promoção) -- seleção de linha conta SEMPRE como id-10-símil (1
      trial por linha avaliada, N=15 se as 15 forem avaliadas), nunca
      colapsa a 1 trial pela rodada, eliminando a circularidade com o
      gate de DSR.

      Auditoria adversarial independente (Rodada 3, 2026-08-19) confirmou
      a correção SEM achado novo: regra consistente com o critério "OU"
      de `audit/n_lifetime.yaml:19-29` (recálculo de backtest OU ajuste de
      modelo, basta um dos dois); cenário de reuso do fit de regime já
      fixado por M4 não gera ambiguidade porque medir edge por linha
      exige backtest novo mesmo com modelo reusado (satisfaz o "OU"
      sozinho); regra 3 (retest pós-mudança-de-código) confirmada
      ortogonal à regra 2, não redundante.
    status: "fechado -- regra de contagem simplificada pra critério estrutural, confirmada por 1 rodada adversarial limpa (Rodada 3)"

