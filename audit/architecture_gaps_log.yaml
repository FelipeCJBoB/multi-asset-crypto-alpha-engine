      processo, não só o código final.

      **HIGH resolvido:** `threshold_bars_step`/`ThresholdBarsCarry`
      reescritos -- `leftover` vira `_TradeArrays` (4 arrays numpy, não
      mais `pl.DataFrame` de 7 colunas), `np.concatenate`/`np.cumsum`
