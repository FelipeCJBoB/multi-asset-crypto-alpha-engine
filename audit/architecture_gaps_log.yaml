      mais resetado por janela) trocou o escopo de AVALIAÇÃO das
      métricas finais (`_bocpd_metrics_for_window`) para
      `[window.start, window.end)` -- a janela crítica INTEIRA (~15
      meses) -- em vez de `[oos_start, oos_end)`, a fatia de teste do
      walk-forward que os outros 5 candidatos usam (~1 trimestre). Viola
