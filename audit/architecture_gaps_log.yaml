  - id: AG-092
    date: "2026-08-19"
    file: "src/analysis/m4_critical_windows.py, src/analysis/m6_common_factor_hypothesis.py"
    related_file: "src/validation/regime_utility.py (regime_persistence, lógica de run-length/fronteira de episódio a ser reusada na solução)"
    found_by: "Agent estudo profundo de engenharia sobre a liderança suspeita do BOCPD em Cochran's Q/I², 2026-08-18"
    gap: >
      Cochran's Q/I² (DerSimonian & Laird 1986) assume estratos
      independentes -- premissa violada pela reutilização do M4: dentro
      de uma janela crítica, trades do MESMO bucket de regime formam
      episódios temporalmente contíguos e autocorrelacionados (regime
      persistente = condições de mercado correlacionadas), então o
      erro-padrão calculado por `stratum_metrics` (fórmula multinomial
      assumindo trades i.i.d.) subestima a variância real, inflando `Q`/
      `I²` artificialmente. Confirmado empiricamente: no relatório real
      pós-AG-084/085/087, `I²` satura 70-99% quase universalmente em
      todos os candidatos/resoluções -- padrão consistente com o
      mecanismo previsto na literatura, não com heterogeneidade real tão
      extrema e uniforme.
    severity: "alto"
    layer: "analysis -- instrumento estatístico usado como critério primário revisado de G-C1-2 (Gate ainda não emitido)"
    consequence: >
      Enquanto não corrigido, NENHUM valor de Cochran's Q/I² do M4 pode
      ser usado como evidência de heterogeneidade real -- o padrão
      universal de saturação observado é consistente com o artefato
      estatístico, não com um sinal genuíno. G-C1-2 não pode ser emitido
      com este instrumento sem essa correção (ou sem uma alternativa
      equivalente).
    resolved_by_commit: null
    resolution: >
      Implementado 2026-08-19 -- teste de permutação em bloco por
      episódio. `src/validation/regime_utility.py::segment_boundaries`
      extraído de `regime_persistence` (mesma lógica de run-length,
      agora reusável -- devolve `(segment_starts, segment_ends)`, não só
      a métrica agregada). `src/analysis/m6_common_factor_hypothesis.py`
      ganhou `permutation_heterogeneity_test`/`PermutationHeterogeneity
      Result` (+ helpers privados `_dense_bucket_codes`/`_q_statistic_
      from_bucket_codes`, núcleo vetorizado via `np.bincount` -- reusa a
      MESMA fórmula de `Q` de `cochrans_q_heterogeneity`, equivalência
      provada por teste dedicado, sem custo de `StratumMetrics`/Polars
      repetido B vezes): extrai episódios do vetor de bucket ORDENADO
      POR TEMPO, embaralha o VETOR de bucket-por-episódio (nunca quebra
      um episódio no meio -- prova indireta via caso analítico de `k=2`/
      `n_episodes=2`, onde toda permutação possível dá `Q_perm==Q_
      observado` por simetria, testado), recomputa `Q` sob cada
      permutação, p-valor empírico = `(1+Σ[Q_perm>=Q_obs])/(1+B)`.
      `src/analysis/m4_critical_windows.py`: `HeterogeneitySymbolDetail`
      ganhou `p_value_permutation`/`n_episodes`/`n_permutations_
      requested`/`n_permutations_valid`; `HeterogeneityWindowSummary`/
      `AggregatedHeterogeneityResult` ganharam `p_value_permutation_
      median` (mesma agregação de 2 níveis já usada pra `i_squared_pct`).
      `_heterogeneity_for_symbol_window`/`_aggregate_heterogeneity_for_
      classifier`/`aggregate_critical_windows_results`/`run_critical_
      windows_comparison`/`run_and_save_critical_windows_report`
      threaded com `n_permutations`/`permutation_seed` (parte do bundle
      "tudo-ou-nada" de 7 params, era 5). Constantes novas em
      `constants.yaml`: `m4_heterogeneity_n_permutations` (1000, classe
      C, provenance LITERATURE) e `m4_heterogeneity_permutation_seed`
      (42, classe D, provenance ASSUMED). `p_value` original (assintótico
      `chi²(k-1)`) PRESERVADO no dataclass, não removido -- continua
      exposto pra referência/diagnóstico, mas não deve ser usado como
      teste de significância (documentado explicitamente no docstring).

      **Não implementado ainda** (deliberadamente fora do escopo desta
      rodada, autorização cobriu só o p-valor empírico): critério de
      decisão combinando p-valor < α com magnitude econômica -- fica pra
      quando o Gate G-C1-2 for de fato avaliado, não faz sentido
      hard-codar num campo de métrica; e o t-stat de Ibragimov-Müller
      pra agregação entre janelas (secundário, mediana-de-medianas
      continua em uso).

      Scripts mecânicos limpos (ruff/mypy/banned_patterns/
      check_constants_referenced/check_unguarded_ratios) em todos os
      arquivos tocados. Testes novos: equivalência Q rápido vs. lento,
      determinismo, casos degenerados (`k=1`, array vazio), caso
      analítico exato (`p_value==1.0`), caso de separação real com poder
      estatístico (`p_value<0.05`, 20 episódios) -- todos em
      `test_analysis_m6_common_factor_hypothesis.py`; teste dedicado do
      cenário real de integração em `test_analysis_m4_critical_windows.py`
      (`n_buckets=1` propaga `NaN` no campo de permutação também) e em
      `test_validation_regime_utility.py` (`segment_boundaries` bate com
      `regime_persistence` no mesmo caso conhecido).

      **Auditoria independente concluída 2026-08-19** -- 2 agentes
      frescos em paralelo (1 focado na matemática do núcleo em
      `m6_common_factor_hypothesis.py`, 1 focado na integração/ordenação
      temporal em `m4_critical_windows.py`), veredito
      "APROVADO_COM_RESSALVAS" nos dois, 0 CRITICAL. Núcleo matemático:
      0 HIGH, 3 MEDIUM, 3 LOW -- as 6 alegações centrais (equivalência
      Q rápido vs. lento, episódio nunca quebrado, caso `k=2` analítico
      exato, poder estatístico do teste de 20 episódios, `k` preservado
      em toda permutação, `segment_boundaries` comportamentalmente
      neutro) foram VERIFICADAS matematicamente pelo agente (contas à
      mão, não só leitura), nenhum contra-exemplo encontrado. Pesquisa
      web confirmou que permutação em bloco por cluster é método
      estabelecido na literatura (Winkler et al. 2015) e que a correção
      `(1+ge)/(1+B)` é a correção padrão (Phipson & Smyth 2010), não
      convenção inventada. Achados MEDIUM corrigidos no mesmo dia: (a)
      fórmula de `SE` multinomial estava duplicada entre `_edge_bruto_se`
      e o núcleo vetorizado -- extraído `_edge_variance_multinomial`
      como fonte única, compartilhada pelos 2; (b) documentado que a
      resolução do p-valor degrada com poucos episódios (piso real pode
      ser mais grosseiro que `1/(B+1)` quando o espaço combinatório de
      rearranjos é pequeno); (c) viés de exclusão de permutações
      degeneradas (`SE=0` num bucket pseudo-atribuído) fica como
      observação registrada, não bloqueante enquanto `p_value_permutation`
      não for critério vinculante de gate. LOW corrigidos: guard de
      shape explícito (`ValueError`, mesma disciplina de `adjusted_rand`)
      + teste `k=3`/3 episódios generalizando o caso analítico além da
      troca binária.

      Integração: 0 HIGH inicial virou **1 HIGH real, corrigido no
      mesmo dia** -- a garantia de que `.filter()`/`join_asof` preservam
      ordem cronológica (pré-requisito crítico: a extração de episódio é
      puramente posicional) não é um contrato público do Polars com a
      mesma força pra `join_asof` quanto é pra `.filter()` -- pesquisa
      confirmou que o próprio Polars teve uma regressão real dessa
      exata propriedade (corrigida jan/2026, PR #25990, escopada a
      pipelines lazy/streaming, não ao uso eager simples daqui, mas
      prova que não era tratada como garantia formal até então) --
      **corrigido**: assertion de runtime em `_heterogeneity_for_
      symbol_window` (`np.all(np.diff(t0_ms) >= 0)`, falha ruidosa em
      vez de episódio artificial silencioso) + teste de regressão
      dedicado com buckets intercalados cronologicamente de forma
      NÃO-contígua (`n_episodes` esperado=4, discrimina uma reordenação
      silenciosa que o teste antigo -- bucket já contíguo por tempo por
      construção da fixture -- nunca pegaria). As outras 7 perguntas
      (alinhamento posicional dos 3 arrays, mesmo `tp_mult`/`sl_mult`,
      threading completo dos 2 params novos por toda a cadeia, bundle
      "tudo-ou-nada" sem call site quebrado, consistência dos campos
      novos nos 3 caminhos de construção, serialização NaN->null via
      orjson confirmada com evidência real em disco, dataclasses
      `frozen`/`slots` intactos) confirmadas corretas, 0 achados. 2 LOW
      não corrigidos (backlog): teste de round-trip de serialização
      dedicado pra `p_value_permutation=NaN`; classificação `class: C`
      de `m4_heterogeneity_n_permutations` sendo número redondo em vez
      de quantil (mas consistente com convenção já estabelecida em
      outras entradas `class: C` pré-existentes do arquivo).

      Scripts mecânicos limpos em todos os arquivos após os fixes
      pós-auditoria.
    status: "implementado e auditado de forma independente (0 CRITICAL; 1 HIGH real corrigido -- ordenação temporal agora verificada em runtime + testada; 3 MEDIUM corrigidos; 5 LOW parcialmente corrigidos/backlog) -- p-valor empírico substitui o assintótico como critério primário; critério de decisão (alfa + magnitude econômica) e t-stat de Ibragimov-Müller ficam pra quando G-C1-2 for avaliado"

  - id: AG-093
    date: "2026-08-19"
