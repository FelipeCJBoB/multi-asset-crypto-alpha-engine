  - id: AG-108
    date: "2026-08-20"
    file: "PLANO_MESTRE_PRINCE2.md §15.11 (AG-096, mecanismo aprovado 'gate por linha')"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §1.2/§4.1/§3.8b; audit/architecture_gaps_log.yaml::AG-096"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B, comissionado pelo Manager via docs/brief_auditoria_externa_2026-08-19_*.md)"
    gap: >
      O mecanismo aprovado em AG-096 ("posição atual no MESMO (symbol,
      resolution_id) != FLAT -- bloqueia entrada") pressupõe que
      (símbolo, resolução) é uma entidade portadora de posição na Binance
      USDⓈ-M. Não é. Em One-way mode existe UMA posição por símbolo, conta
      inteira; em Hedge mode existem duas (LONG/SHORT), nunca uma por
      resolução -- e o modo é configurado por CONTA, não por símbolo
      (Binance, "What Is Hedge Mode" -- "position mode is applied
      account-wide"). Consequência concreta: se BTCUSDT:R1 e BTCUSDT:R3
      sobreviverem ambas à seleção de linha (cenário explicitamente
      desejado pelo mandato -- "os PARES que entregarem mais edge",
      plural), elas compartilham UMA única posição BTCUSDT na exchange. A
      pergunta "a posição de BTCUSDT:R3 está FLAT?" não tem resposta no
      estado real da conta -- e quando R1 fecha, a posição de R3 fecha
      junto, porque é a mesma posição. Problema secundário: com
      timeInForce=GTX, uma ordem de R1 e uma ordem oposta de R3 no mesmo
      símbolo se cancelam/rejeitam mutuamente no book (Self-Trade
      Prevention não se aplica a GTX/FOK), produzindo cancelamentos
      correlacionados justamente quando as resoluções discordam -- viés
      de execução com estrutura, não ruído aleatório.
    severity: "crítico"
    layer: "decision engine / execução -- modelo de posição da exchange incompatível com a abstração 'linha' usada em todo o desenho aprovado"
    consequence: >
      Bloqueia a implementação de AG-096 como especificado. Exige
      reescrita do gate: separar LineState (lógico, chave line_id,
      máquina de estados FLAT|ENTRY_PENDING|OPEN|EXIT_PENDING|
      RECONCILIATION) de SymbolExposure (físico, chave symbol, o que a
      exchange de fato reporta), com o invariante "no máximo UMA linha
      por símbolo em estado != FLAT" -- ou, se duas resoluções do mesmo
      símbolo precisarem operar concorrentemente com edge
      descorrelacionado, um SymbolAggregator que combine as intenções
