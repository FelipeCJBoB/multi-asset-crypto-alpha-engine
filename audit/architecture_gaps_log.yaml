      derivado à mão) e prova de bit-exatidão genuína (oráculo copiado
      literal de `git show 50dd621`, não a própria função nova
      disfarçada) -- zero achado CRITICAL/HIGH. 4 achados reais MEDIUM/LOW
      + 1 achado do revisor REFUTADO por verificação direta:

      **(1) MEDIUM, CORRIGIDO:** zero teste de integração ponta a ponta
      entre `acd.predict_acd` e `fit_egarch_coupled`/
      `predict_egarch_coupled` -- todos os testes usavam `psi` construído
      à mão. 2 testes novos: 1 de integração real (`close_time` sintético
      irregular → `fit_acd`/`predict_acd` → `psi` real →
      `fit_egarch_coupled`/`predict_egarch_coupled`), 1 de causalidade
      ponta a ponta (perturbar `close_time`/`log_return` depois de
      `t_check` não muda `log_var[t_check+1]` -- fit isolado ao prefixo
      comum não-perturbado, pra não conflar "coeficiente diferente" com
      "vazamento temporal").

      **(2) MEDIUM, ABERTO (decisão do Manager, não corrigido):** a
      correção de censura de quantização (`AG-063`, `x==0 →
      _ACD_DURATION_FLOOR_MS=0,5ms`) é aproximação plug-in (densidade
      pontual no piso), não o tratamento estatisticamente rigoroso de
      dado censurado por intervalo (`log(F(1ms)-F(0))`). Direção de viés
      plausível (empurra `κ` recuperado pra baixo na presença de `x==0`),
      não medida por nenhum teste. Prevalência hoje é baixa (~0,006% em
      SOLUSDT, `AG-061`) mas `median_ratio_early_vs_recent` (1,16-2,40x,
      mesmo JSON) mostra durações encolhendo com o tempo -- prevalência
      tende a crescer, não é garantia permanente de irrelevância.

      **(3) MEDIUM, CORRIGIDO:** `psi_t` finito mas `&lt;=0` (violação de
      contrato de um caller hipotético fora de `predict_acd`, que garante
      positividade por construção) produziria `tau_t&lt;=0`, e `beta**tau_t`
      com `beta=0.0` (extremo do bound) e expoente negativo levantaria
      `ZeroDivisionError` não tratado em vez de falhar graciosamente.
      Corrigido: `psi_t&lt;=0` cai no mesmo fallback `tau_t=1.0` que
      `not isfinite(psi_t)`.

