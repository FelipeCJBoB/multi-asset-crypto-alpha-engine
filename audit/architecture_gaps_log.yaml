    resolved_by_commit: null
    resolution: >
      RETESTE EXECUTADO 2026-08-20 (mesma sessão, Manager: "abra a
      investigação agora") -- `tools/diagnostics/retest_jump_model_
      extended_features_k3.py` (novo, isolado do harness de produção),
      obs_2d expandido pra `[log_return_1, realized_vol_short,
      realized_vol_long, downside_deviation]` (`realized_vol_long` reusa
      `feature_c06_vol_ratio_long_window`, já em produção;
      `downside_deviation` novo em `src/features/support.py`, testado),
      `jump_n_states` testado em {2, 3} (item (c), critério de λ
      alternativo, não precisou ser testado). SEM normalização das 4
      colunas (isola o efeito de features+K).

      **RESULTADO DECISIVO -- reversão completa do achado original:**
      K=2 (espaço antigo) confirma AG-117 (nenhum λ do grid funciona pra
      SOL/BNB/XRP). **K=3 (espaço novo): TODO o grid de λ (0,0001 a
      0,02, 7 pontos) produz >=2 estados genuínos OOS pros 3 ativos --
      SOLUSDT, BNBUSDT, XRPUSDT** (`maior_penalty_com_2_mais_estados_
      oos=0,02` nos 3, saturando no TOPO do próprio grid -- teto real
      pode estar acima de 0,02, não testado). Achado real no caminho
      (não confundir com resultado): XRPUSDT retornou `NaN` em 100% do
      grid na 1ª rodada -- bug real em `downside_deviation`
      (`mean_sq` matematicamente não-negativa saindo `-3,16e-20` por
      cancelamento de ponto flutuante em janelas quase-só-positivas,
      `np.sqrt` de negativo vira `NaN` silencioso) -- corrigido na causa
      (`np.maximum(mean_sq, 0.0)` antes do `sqrt`, `src/features/
      support.py`, teste de invariante novo), reteste refeito só pra
      XRPUSDT após a correção -- mesmo resultado de SOL/BNB.

      **Conclusão: os 4 ativos não-BTC mostram estrutura de regime
      genuína no Jump Model com configuração alinhada à literatura (K=3
      + espaço de features rico) -- o achado original de AG-117
      ("ausência de estrutura pra 3/4 ativos") era real PRA AQUELA
      CONFIGURAÇÃO, não uma propriedade do método/dos ativos.** A
      exclusão do Jump Model da rodada real do M4 (`experiments/
      m4_critical_windows_report.json`, concluída 2026-08-20,
      10.891,9s) permanece válida PRA ESSA RODADA ESPECÍFICA (decisão
      já tomada antes deste reteste, run já concluído sem Jump Model
      pros 4 ativos não-BTC) -- mas não pode mais ser tratada como
      veredito definitivo sobre o candidato. Decisão pendente do
      Manager: rodar uma "Condição C" (K=3 + espaço de features novo)
      pros 4 ativos não-BTC no harness real do M4 (mesma infraestrutura
      de `run_jump_model_transferability_comparison`/AG-087, adaptada
      pro novo obs_2d), pra colocar Jump Model de volta na disputa do
      `AG-114` com a configuração correta -- ainda não decidido/
      agendado, é busca de hiperparâmetro classe B (novo `jump_n_
      states`/espaço de observação), exige reconciliação de
      `N_lifetime` se executado.

      ADENDO 2026-08-20 (mesma sessao) -- ETHUSDT retestado com a MESMA
      config nova, gap de metodologia fechado. O reteste original
      (acima) deliberadamente excluiu ETHUSDT porque ele ja tinha um
      lambda "genuino" conhecido no espaco ANTIGO (2 features, K=2) --
      uma inconsistencia real: os outros 3 ativos foram medidos na
      config nova, ETH continuava sendo julgado pela config velha.
      Reteste isolado (calibrate_for_symbol("ETHUSDT"), mesmo script,
      mesmo grid) rodado pra K=2 E K=3 no espaco de 4 features.
      RESULTADO: ETHUSDT bate EXATAMENTE o mesmo padrao de SOL/BNB/XRP
      -- os 7 pontos do grid (0,0001 a 0,02) dao is_genuine_oos=True
      tanto pra K=2 quanto pra K=3, saturando no TOPO do grid nos 2
      casos (maior_penalty_com_2(ou_3)_mais_estados_oos=0,02). Os 4
      ativos nao-BTC agora tem evidencia UNIFORME e CONSISTENTE: espaco
      de 4 features + qualquer K em {2,3} testado revela estrutura
      genuina de regime, grid inteiro saturado (teto real acima de 0,02
      permanece nao medido pros 4 -- achado real, nao escondido).

      Implementacao de "Condicao C" no harness REAL do M4 concluida
      nesta sessao (nao so no script de diagnostico isolado) --
      autorizacao do Manager: "autorizado pode rodar". Novo codigo,
      espelhando 1:1 o padrao ja auditado de AG-087/Condicao B:
      src/analysis/m4_regime_comparison.py ganhou _extended_jump_model_obs
      (nucleo puro, monta o obs 4D com corte de warmup proprio) e
      compare_jump_model_extended_features_for_symbol/run_jump_model_
      extended_features_for_symbol (@overload Literal[True]/
      Literal[False], mesmo padrao de compare_jump_model_only_for_
      symbol/run_jump_model_only_for_symbol); src/analysis/m4_critical_
      windows.py ganhou _run_jump_model_extended_features_one_cell/
      run_jump_model_extended_features_comparison (espelha _run_jump_
      model_only_one_cell/run_jump_model_transferability_comparison,
      mesmo isolamento de falha AG-019, mesmo reuso de aggregate_
      critical_windows_results); tools/diagnostics/compare_jump_model_
      extended_features_vs_condicao_a.py (novo, espelha compare_jump_
      model_lambda_transferability.py) gera "Condicao C", persiste,
      diff contra a Condicao A ja existente (experiments/m4_critical_
      windows_report.json). Testes novos em test_analysis_m4_regime_
      comparison.py e test_analysis_m4_critical_windows.py, mesma
      disciplina dos testes irmaos de Condicao B. Checks mecanicos
      limpos nos 5 arquivos tocados (ruff check, mypy --strict,
      banned_patterns.py --strict, check_constants_referenced.py,
      check_unguarded_ratios.py) -- 0 violacao automatizada em todos.

      jump_penalty_by_symbol decidido pra rodada real: ETHUSDT=0,02,
      SOLUSDT=0,02, BNBUSDT=0,02, XRPUSDT=0,02, jump_n_states=3 --
      maior valor testado que ainda e genuino nos 4 (mais parcimonioso/
      regularizado dentro do que foi MEDIDO), com a ressalva explicita
      ja citada acima (grid-top-saturated, teto real desconhecido)
      propagada pro script/log da rodada real, nunca escondida atras de
      um numero que pareca "calibrado com folga". E busca de
      hiperparametro classe B -- reconciliacao de N_lifetime pendente
      de decisao do Manager quando a rodada real terminar.

      ADENDO FINAL 2026-08-20 (mesmo dia) -- rodada real da Condicao C
      concluida (experiments/m4_jump_model_extended_features_condicao_c_
      report.json, 3 resolucoes, 12 celulas, 0 falhas). RESULTADO
      HONESTO, mais nuancado que o reteste isolado sugeria -- 2 achados
      distintos, nao 1:

      (1) VALIDADE ESTRUTURAL reconfirmada no harness real pra
      SOLUSDT/XRPUSDT (saturation_rate=0,0 nas 3 resolucoes -- nunca
      colapsa a 1 estado) e majoritariamente pra BNBUSDT (0,0 em R1/R2,
      0,333 em R3). ETHUSDT fica consistentemente pior (saturation_rate=
      0,333 nas 3 resolucoes) -- diferente do reteste isolado, onde ETH
      tinha passado 100% do grid. Isso bate com o achado (1) do reteste
      isolado, na maior parte.

      (2) UTILIDADE COMO GATE (metrica primaria do AG-114, heterogeneidade
      de volatilidade futura) CONTINUA SEM DEMONSTRACAO -- e a razao e
      medida, nao suposta: n_episodes por celula (symbol, janela,
      resolucao) fica entre 1 e 8 pra jump_model_cjm_v1 nesta rodada
      (vs. 37-622 pro baseline nas MESMAS celulas) -- literalmente o
      MESMO problema de poder estatistico nulo ja documentado na 4a
      execucao original do M4 ("mediana 4 episodios/celula"), agora por
      um motivo DIFERENTE e mais claro: jump_penalty=0,02 (o maior valor
      testado, escolhido por ser o mais regularizado dentro do grid
      medido) produz poucos episodios MUITO longos (persistence_median_
      duration_bars entre 98 e 2.230 barras) -- o candidato passa no
      teste ESTRUTURAL (>=2 estados genuinos) exatamente por regularizar
      bastante, o que ao mesmo tempo mata o poder estatistico do teste
      de heterogeneidade (poucas transicoes = poucos episodios
      independentes = teste de permutacao sem base amostral). i_squared_
      pct_median = 0,0% pra SOLUSDT/BNBUSDT/XRPUSDT nas 3 resolucoes
      (p_value_permutation tipicamente 0,10-1,0, nunca significativo);
      ETHUSDT teve i2=13,3%/10,3% em R2/R3 (ainda p>0,05), unico com
      leitura nao-trivialmente-zero.

      CONCLUSAO HONESTA: "Condicao C" NAO destrona hmm_gaussian_k4_v1
      como vencedor do AG-114 (PLANO_MESTRE_PRINCE2.md secao 15.12.5) --
      Jump Model continua nao-competitivo na metrica primaria, mas agora
      por um motivo bem medido (trade-off regularizacao-vs-poder-
      estatistico no jump_penalty escolhido), nao por saturacao/
      degenerescencia como antes. Pergunta em aberto, NAO respondida
      aqui (evitar B20 -- nao escolher lambda novo depois de ver este
      resultado): um lambda MENOR (mais transicoes, mais episodios,
      talvez menos "genuino" na leitura estrutural) teria mais poder
      estatistico pro teste de heterogeneidade? Fica registrada como
      pergunta pro Manager decidir se vale rodar mais uma rodada, nao
      decidida/executada nesta sessao.
    status: "FECHADO -- reteste isolado decisivo (K=3 reverte total pros 3 ativos), rodada real da Condicao C confirma validade ESTRUTURAL pra SOL/XRP/majoritariamente-BNB mas NAO demonstra utilidade como gate (mesmo problema de poder estatistico da 4a execucao original, agora por regularizacao alta em vez de saturacao) -- hmm_gaussian_k4_v1 permanece vencedor do AG-114, Jump Model nao promovido nesta rodada. Pergunta aberta (lambda menor teria mais poder?) registrada, nao respondida."

