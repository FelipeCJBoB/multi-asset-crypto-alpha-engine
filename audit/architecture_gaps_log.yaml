  - id: AG-117
    date: "2026-08-20"
    file: "config/constants.yaml::m4_jump_model_penalty; src/analysis/m4_regime_comparison.py::compare_jump_model_only_for_symbol"
    related_file: "audit/architecture_gaps_log.yaml::AG-087; docs/m4_regime_auditoria_externa_2026-08-19_validacao_cruzada.md §1.2/§4; tools/diagnostics/calibrate_jump_model_penalty_per_asset.py; experiments/jump_model_ethusdt_condicao_b.json"
    found_by: "Manager, autorizando a execução real do experimento de transferibilidade de λ do Jump Model já desenhado nesta sessão (encaminhamento de docs/m4_regime_auditoria_externa_2026-08-19_validacao_cruzada.md §4: 'rodar o experimento de transferibilidade primeiro; só depois, se a saturação persistir com λ localmente otimizado, a leitura ausência real de regime ganha sustentação')"
    gap: >
      Resultado REAL e decisivo do experimento de transferibilidade,
      medido nesta sessão (não hipotético). PASSO 1 -- calibração
      independente de λ por ativo (`calibrate_jump_model_penalty_per_
      asset.py`, mesma metodologia/grid de `m4_jump_model_penalty.source`,
      grid [0,0001..0,02], 50k barras/40k treino/10k teste, critério
      >=2 estados genuínos OOS): ETHUSDT -> λ=0,005 é o MAIOR do grid
      que ainda produz 2 estados OOS. **SOLUSDT/BNBUSDT/XRPUSDT ->
      NENHUM ponto do grid inteiro produz 2 estados genuínos OOS** --
      até no ponto de penalidade quase nula (λ=0,0001) o split já sai
      degenerado mesmo IN-SAMPLE (ex. XRPUSDT treino: [39969, 31] barras
      -- 0,08% no 2º estado). Não é "λ do BTC não transfere" -- é
      ausência de estrutura de 2 regimes detectável pelo CJM nesses 3
      ativos, em qualquer ponto testado.

      PASSO 2 -- Condição B rodada de verdade só pra ETHUSDT (único
      ativo com λ genuíno; SOL/BNB/XRP não tinham valor pra plugar --
      rodar os 4 símbolos custaria ~3h só pra reconfirmar o que o PASSO
      1 já respondeu de forma decisiva pros 3 sem λ válido).
      `saturation_rate` de ETHUSDT com λ PRÓPRIO (0,005) nas 3 janelas
      com múltiplos símbolos (CRYPTO_WINTER/ETF_HALVING/RECENTE): R1=
      66,7% (2 de 3 janelas saturam), R2=33,3%, R3=33,3% -- **PIOR ou
      IGUAL** à Condição A (λ=0,002 transplantado de BTC): R1/R2/R3
      todos 33,3% (só CRYPTO_WINTER satura, ETF_HALVING/RECENTE não, nas
      3 resoluções). Recalibrar λ pro critério genérico "2 estados numa
      janela de 50k barras qualquer" NÃO melhora a saturação nas janelas
      críticas específicas que o M4 avalia -- os dois problemas são
      dissociados: o critério de calibração usado (padrão da literatura,
      já documentado em `m4_jump_model_penalty.source`) não é preditivo
      de comportamento saudável nas janelas de interesse.
    severity: "alto"
    layer: "regime -- Jump Model como candidato"
    consequence: >
      Sustenta a leitura "ausência real de regime" pro Jump Model nos 4
      ativos não-BTC, com evidência mais forte que a saturação original
      de `AG-087` (que só media o efeito de transplantar λ de BTC sem
      reteste): aqui o λ FOI recalibrado por ativo (onde havia algum
      válido) e a saturação não melhorou. Recomendação: excluir Jump
      Model do Estudo 1 pros 4 ativos não-BTC na rodada real do M4
      (economiza ~1/4-1/6 do tempo de fit da extensão de gate-quality,
      já que Jump Model é 1 dos 4 candidatos que passam por
      `_run_fold_refit_candidate`) -- BTC continua elegível (λ=0,002 é
      seu próprio "λ local", nunca transplantado). Decisão final
      (excluir de vez vs. manter registrado como "avaliado, não
      promovido") é do Manager, não decidida aqui.
    resolved_by_commit: null
    resolution: >
      DECIDIDO 2026-08-20 (Manager): excluir Jump Model pra símbolo !=
      BTCUSDT da rodada real do M4. Implementado via `include_jump_model:
      bool = True` novo em `compare_regime_candidates_for_symbol`/
      `run_regime_comparison_for_symbol` (`src/analysis/m4_regime_
      comparison.py`) -- `m4_critical_windows._run_one_cell` seta
      `include_jump_model = (symbol == "BTCUSDT")`. Suíte completa
      validada: 1508 passed, zero falhas (mais 1 bug de docstring
      truncada achado e corrigido no caminho, mesma classe já vista 2x
      antes nesta sessão -- terceira ocorrência, ver nota de processo).

      **ADENDO -- achado real do Manager ao revisar a implementação,
      2026-08-20 (mesma sessão):** a exclusão por símbolo, sozinha, cria
      um problema estrutural NOVO que a resolução original acima não
      antecipou -- não é só "Jump Model tem menos cobertura", é
      "Jump Model deixa de ser COMPARÁVEL aos outros candidatos na
      comparação agregada do AG-114". `CRYPTO_WINTER`/`ETF_HALVING`/
      `RECENTE` têm até 5 símbolos pra HMM/BOCPD (mediana entre
      símbolos) mas só 1 (BTC) pra Jump Model -- se a etapa de ranking
      (gates + métrica primária, ainda não implementada) comparasse os
      agregados diretamente, Jump Model poderia "vencer" com base numa
      composição de amostra diferente (só o ativo historicamente mais
      limpo/líquido), mascarando o fato de que ele NUNCA foi provado
      funcionar nos outros 4 -- o oposto do que a exclusão pretendia
      proteger. Corrigido: `_JUMP_MODEL_EXCLUDED_FROM_RANKING_CAVEAT`
      novo em `m4_critical_windows.py`, propagado pro payload do
      relatório (`jump_model_excluded_from_ranking_caveat`) -- documenta
      explicitamente que `jump_model_cjm_v1` é DESQUALIFICADO da
      disputa pelo candidato vencedor (não só "com menos dado"), e que
      isso vem de AG-117 (evidência separada e controlada), não do
      resultado deste relatório. Os números de Jump Model continuam
      persistidos (diagnóstico/BTC, custo zero adicional), mas
      qualquer implementação futura da etapa gates->ranking->desempate
      DEVE ler este caveat e excluir Jump Model da disputa, nunca
      comparar o agregado dele contra os demais como se fosse
      equivalente.

      **2º ADENDO -- achado real, pesquisa de literatura dedicada,
      2026-08-20 (mesma sessão), motivada por contestação do Manager
      ("literaturas que li diziam que Jump Model era favorito sob dollar
      bar").** Pesquisa multi-ângulo (Nystrup, Shu/Kolm/Mulvey, Cortese/
      Kolm/Lindström, Aydınhan et al. -- o próprio paper que `jump_
      model.py` cita) encontrou: (1) a literatura de Jump
      Model/Statistical Jump Model NUNCA testou dollar bars/bars de
      informação em nenhuma direção -- todo paper localizado usa barra
      DIÁRIA de calendário, incluindo o único paper cripto-específico
      (Cortese/Kolm/Lindström 2023, valida BTC/ETH/XRP/LTC/BCH). A
      alegação "favorito sob dollar bar" é uma inferência que costura 2
      linhas de pesquisa nunca publicadas juntas, não uma citação
      literal -- mas (2) a literatura favorece Jump Model FORTE pra
      cripto em geral, e acha **K=3 estados** melhor que K=2 pra dinâmica
      cripto (mesmo paper, XRP incluso). Comparado contra essa literatura
      bem-sucedida, nosso desenho diverge em 3 eixos SIMULTÂNEOS, não só
      "dollar bar vs. diário": (a) espaço de features -- `obs_2d =
      [log_return_1, realized_vol_short]` (2 features cruas, 1
      horizonte) vs. 3-9+ features multi-horizonte na literatura (EWM
      return/downside-deviation/Sortino em 3 escalas) -- `jumpmodels`
      (lib já vendorizada) expõe `SparseJumpModel` pra exatamente esse
      cenário de espaço rico, nunca usada (`fit_jump_model` só instancia
      `JumpModel(cont=True)`, a versão densa); (b) `jump_n_states=2`
      fixo em toda a investigação, nunca testado em 3 (diferente do HMM,
      k=2/3/4) -- o único paper cripto-específico achou K=3 melhor; (c)
      critério de seleção de λ (maior valor com >=2 estados numa janela
      genérica) não bate com nenhum dos 3 métodos publicados (visual/
      qualitativo, CV por Sharpe -- Shu/Kolm/Mulvey 2024, arXiv:2402.05272
