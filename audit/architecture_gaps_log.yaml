  - id: AG-134
    date: "2026-08-21"
    file: "src/regime/hmm_gaussian.py::canonicalize_states, src/regime/build_hmm.py"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §3.4/§5 (canonicalize_states, linha ~1737-1750), audit/architecture_gaps_log.yaml::AG-114, AG-121, AG-127"
    found_by: "Agent (redesign_workflow, Fases 1-4, correção de AG-127), a pedido explícito do Manager (item 7 da rodada de perguntas consolidadas: 'Sim' -- vira item de acompanhamento)"
    gap: >
      A comparabilidade de `canonical_id` entre folds consecutivos do
      walk-forward do HMM tem hoje só GARANTIA EMPÍRICA, não formal.
      `canonicalize_states` ancora a ordenação nos parâmetros ajustados do
      FIT (`fit.params.emissions.means[:, 0]`, só viu `obs[:train_end_
      idx]`) -- causal por construção -- e o teste `tests/unit/test_
      regime_hmm_gaussian.py::test_canonicalizacao_estavel_entre_folds_
      consecutivos_regime_fixo` prova, empiricamente (via `agreement` em
      barras-probe comuns, não via ARI, que seria cego a label-switch),
      que essa canonicalização produz `canonical_id` estável entre dois
      cortes de janela expansiva consecutivos -- **desde que a estrutura
      geradora seja estável**. A própria docstring do teste é explícita
      que isso não prova robustez sob regime que muda de caráter entre
      folds (ex. um símbolo com mudança estrutural real de volatilidade
      entre o período de um fold e o seguinte). Não há hoje nenhuma prova
      FORMAL (matemática, não empírica) de que `canonical_id=2` no fold N
      e `canonical_id=2` no fold N+1 apontam pro mesmo conceito de estado
      sob toda condição de mercado -- só sob a condição testada.
    severity: "médio"
    layer: "regime"
    consequence: >
      Se um símbolo passar por uma mudança estrutural real de regime
      entre folds consecutivos (ex. transição de mercado lateral pra
      tendência sustentada, mudando a composição intrínseca dos estados
      do HMM), `canonical_id` poderia trocar de significado sem nenhum
      sinal -- consumidores downstream (Risk Engine via `regime_
      tradeable`, análises que agregam por `canonical_id` entre folds)
      tratariam estados diferentes como se fossem o mesmo. Não é
      vazamento temporal (isso já é causal) -- é um risco de
      IDENTIFICABILIDADE sob deriva estrutural, categoria diferente.
    resolved_by_commit: null
    resolution: null
    status: "aberto -- item de acompanhamento, não bloqueante hoje (nenhum consumidor de produção agrega por canonical_id entre folds fora do que já foi testado). Registrado a pedido do Manager pra não ficar esquecido enquanto AG-127 (identificação causal de is_stress_state por fold) é implementado -- as duas correções são relacionadas (mesma função, mesmo mecanismo de canonicalização) mas não são a mesma pergunta: AG-127 resolve CAUSALIDADE (a decisão usa só dado do passado); este resolve IDENTIFICABILIDADE (a decisão significa a mesma coisa entre folds). Rota sugerida, não decidida: um teste novo que force deliberadamente uma mudança estrutural sintética entre 2 folds (não regime fixo, como o teste existente) e meça se `canonical_id`/`stress_state_id` permanecem estáveis ou trocam de significado -- decisão de quando priorizar isso fica pro Manager."

    addendum_teste_caracterizacao_2026-08-23: >
      Rota sugerida (linha acima) implementada como teste --
      `tests/unit/test_regime_hmm_gaussian.py::test_canonicalizacao_pode_
      trocar_de_significado_sob_mudanca_estrutural_entre_folds`. Fold N vê
      só a estrutura alternada de 2 clusters moderados (mesma do teste
      irmão de estabilidade); fold N+1 vê a MESMA estrutura até o corte
      (nunca contamina o `probe`) mais um 3º modo estruturalmente extremo
      SÓ na porção exclusiva do fold N+1, massa amostral comparável ao
      resto da série. Mede se o `probe` (que sob estrutura fixa split
      ~50/50 entre canonical_id 0/1) colapsa pra quase um único
      canonical_id sob o fold N+1 -- mesmos pontos físicos, significado
      diferente. Limiar reusa o mesmo valor (`0,9`) que o teste irmão usa
      como piso de estabilidade -- não um número novo (B23). **NÃO FECHA
      esta entrada** -- caracteriza o risco (prova que o cenário é
      alcançável), não o resolve (nem prova formal, nem mitigação de
      produção); a "decisão de quando priorizar" nomeada no `status`
      acima segue igualmente pendente. Verificado: `ruff check` limpo,
      `mypy` sem mudança de baseline (`git stash`), `banned_patterns.py
      --strict` sem violação de CLASSE nova (5 magic numbers de fixture
      novos, mesmo padrão não-anotado dos 18 já pré-existentes no mesmo
