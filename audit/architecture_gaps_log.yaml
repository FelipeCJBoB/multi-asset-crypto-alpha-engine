    consequence: >
      Toda a cadeia de payoff (labels, pesos, calibração, meta-model,
      breakeven de custo) assume uma saída que pode não existir na
      prática -- é premissa, não feature, e não depende de nenhuma
      medição pra ser decidida. Recomendação, ordens de magnitude mais
      barata: admitir reduceOnly a mercado para SAÍDAS (manter
      post-only só para ENTRADAS) -- assimetria padrão de prática maker
      (paciente pra entrar, impaciente pra sair), custo adicional de
      ~3bps/perna (taker 0,05% vs maker 0,02%) contra o risco de perda
      de cauda ilimitada por não conseguir sair. Alternativa mais cara:
