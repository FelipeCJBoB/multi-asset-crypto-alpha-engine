    file: "src/regime/jump_model.py (fit_jump_model, obs_2d de 2 features); config/constants.yaml::m4_jump_model_n_states"
    related_file: "audit/architecture_gaps_log.yaml::AG-117 (2º adendo); tools/diagnostics/calibrate_jump_model_penalty_per_asset.py"
    found_by: "Manager, contestando a exclusão do Jump Model com base em literatura lida antes desta sessão ('literaturas que li diziam que Jump Model era favorito sob dollar bar') -- pesquisa dedicada disparada em resposta, achado real"
    gap: >
      AG-117 (exclusão do Jump Model pra SOLUSDT/BNBUSDT/XRPUSDT/
      recalibração de ETHUSDT) testou um Jump Model CONFUNDIDO em 3
      eixos simultâneos vs. toda aplicação bem-sucedida publicada: (a)
      espaço de features pobre (2 features cruas, 1 horizonte, vs. 3-9+
