    resolved_by_commit: null
    resolution: >
      Não resolvido nesta sessão -- fora de escopo da implementação de
      `AG-118` (que já sidesteps corretamente via
      `identify_stress_state_by_volatility`). Registrado pra decisão
      futura do Manager, agora com a hierarquia documental correta: (a)
      migrar `canonicalize_states` pra ordenar por volatilidade
      (recomendação do único documento canônico de arquitetura que trata
