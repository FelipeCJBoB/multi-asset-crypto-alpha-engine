  - id: AG-085
    date: "2026-08-18"
    file: "src/regime/bocpd.py"
    related_file: "src/analysis/m4_regime_comparison.py, src/regime/hmm_gaussian.py (canonicalização sem leak, contraste), src/regime/jump_model.py (idem)"
    found_by: "Agent Auditoria cética da orquestração e wiring do M4, 2026-08-18 -- refutou 4 hipóteses alternativas antes de isolar esta"
    gap: >
      `segments_to_canonical_states` (`bocpd.py:253-292`) define o bucket
      de cada segmento por quantil da MÉDIA de `log_return_1` sobre TODO
      o segmento (passado + futuro dentro do segmento) -- e esse rótulo é
      depois testado contra `forward_return[t] = log_return_1[t+1]` como
      métrica de "separação" do M4. Leakage mecânico: pra maioria das
      barras (segmento médio de 12,4 barras, só 5,3% singleton), `t+1`
      ainda está dentro do MESMO segmento que gerou o rótulo de `t`. Em
      HMM (`canonicalize_states`) e Jump Model, a mesma chamada só
      REORDENA rótulos de uma partição já decidida pelo filtro causal/
      `fit.model.predict` -- permutação de rótulo é invariante ao F/ω² da
      ANOVA. Em BOCPD, a chamada usa a resposta pra DEFINIR a própria
      partição -- daí o leak.
    severity: "alto"
    layer: "regime -- métrica de avaliação (não é vazamento no candidato em produção, é vazamento na canonicalização usada só para avaliação/comparação do M4)"
    consequence: >
      Prova direta por decaimento de defasagem (BTCUSDT, LUNA, R1):
      ω²=0,495 no lag 0 (concorrente, tautológico) -> 0,0035 no lag 1
      (== `forward_return`, valor que bate quase exato com o real do
      relatório: 0,003543601168177202) -> ~0 a partir do lag 3 (F<=1).
      Essa assinatura (alto no lag 0, ruído a partir do lag 3) é marca de
      artefato de construção, não de horizonte econômico real. Combinada
      com AG-084 (segmentos ainda mais curtos por causa do reset de
      prior), explica a quase totalidade do "achado positivo" do BOCPD.
    resolved_by_commit: null
    resolution: >
      CORRIGIDO 2026-08-18 (mesma autorização de AG-084). `segments_to_
      canonical_states` (`src/regime/bocpd.py`) reescrita pra ser causal
      por construção: nova `_causal_within_segment_mean` calcula a média
      DENTRO do segmento de forma EXPANSIVA (só `response[seg_start:t+1]`,
      nunca barra `>t`, vetorizado via cumsum), e o bucketing usa
      `expanding_percentile_rank_strict` (`src/features/support.py` --
      MESMO primitivo já usado/testado pra `C07_vol_pctile_expanding`,
      reuso direto, não reimplementação) em vez de quantil do
      segmento inteiro. Guard antigo (`n_buckets > n_segmentos` ->
      `ValueError`) removido -- artefato do desenho anterior (1 bucket
      fixo por segmento), sem base matemática no desenho novo (cada
      barra bucketada por posto contínuo). Testes novos: prova de
      causalidade dedicada (`test_segments_to_canonical_states_e_causal_
      perturbar_futuro_nao_muda_passado`, mesmo padrão de `run_bocpd`) +
      2 testes de guard atualizados. Mecanicamente auditado, limpo.
      Composto com AG-084 (série contínua) -- os dois juntos deveriam
      eliminar tanto o reset de prior quanto o leakage que produziam o
