    found_by: "Manager -- 1ª tentativa real do run canônico de M2, `uv run python -m src.analysis.m2_bar_comparison`, 9 das 20 tasks falharam"
    gap: >
      Dois defeitos reais achados no 1º run canônico de verdade de M2,
      ambos corrigidos na hora:

      (1) `_read_files` (`lake.py`, função compartilhada por `query_bars`/
      `query_agg_trades`/`query_funding` -- não é específico de M2) faz
      `duckdb.connect(":memory:")` sem `temp_directory` explícito. DuckDB
      sem essa configuração usa por padrão um caminho RELATIVO ao cwd
      (".tmp/duckdb_temp_storage_<classe-de-tamanho>-<n>.tmp"), com nome de
      arquivo de overflow fixo pela classe de tamanho do buffer -- não
      único por conexão. Sob `ProcessPoolExecutor` (12 workers
      concorrentes), todo processo herda o mesmo cwd e pode escolher o
      MESMO nome de arquivo simultaneamente -- 9 de 20 tasks morreram com
      `IOException: Failed to delete file ".tmp\duckdb_temp_storage_
      S32K-0.tmp"` (e S64K/S96K), um processo apagando o arquivo que outro
      processo, sem saber, também estava usando. Mesma CLASSE de bug já
      corrigida pra memory_limit/threads (cada conexão assumindo orçamento
      otimista sem coordenar com as outras) -- aqui o recurso em disputa é
      o NOME DO ARQUIVO de overflow em disco, não RAM. Corrigido: cada
      conexão recebe `temp_directory` único por PID
      (`tempfile.gettempdir()/duckdb_lake_pid{os.getpid()}`).

      (2) `_ADF_STAT_PLAUSIBLE_ABS_MAX=30.0` (`m2_stats.py`, gate de
      plausibilidade contra SVD degenerada, numpy#20384, adicionado nesta
      mesma sessão) disparou em TODAS as 13 tasks de barra de tempo do run
      real (n de 40.943 a 231.551), sempre com `|adf_stat|` entre 60 e 145
      -- padrão sistemático demais pra ser anomalia, sinal de que o limiar
      estava errado, não o dado. Verificado: `adf_stat/sqrt(n)` fica em
      ~-0,30 nas 13 tasks, consistente entre símbolos e TFs -- exatamente
      o comportamento esperado de uma estatística GENUÍNA (ADF diverge com
      `sqrt(n)` sob forte estacionariedade real). A justificativa original
      do limiar ("ADF costuma ficar bem dentro de [-10,10]") nunca tinha
      sido verificada contra dado real deste projeto em escala de
      produção -- só contra um caso sintético patológico (período exato,
      `-1,27e14`) e pesquisa de literatura genérica. Corrigido: limiar
      subiu pra 2000 (margem enorme dos dois lados -- bem acima de
      qualquer extrapolação razoável do padrão `sqrt(n)` observado, e
      ainda 11 ordens de magnitude abaixo do padrão de corrupção real já
      visto).
