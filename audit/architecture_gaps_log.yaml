      descarta `carry` inteiro ao capturar), mas uma primitiva pública
      deveria ser tudo-ou-nada por conta própria. Corrigido: circuit
      breaker checado ANTES de qualquer mutação. Teste novo prova
      atomicidade forçando as duas coisas no mesmo chunk.

      **Achados de revisão INDEPENDENTE (`project_assurance`, Agent
      fresco, 16 perguntas + 7 mecânicos rodados por conta própria) --
      todos genuínos, endereçados:** (1) MEDIUM -- `check_constants_
