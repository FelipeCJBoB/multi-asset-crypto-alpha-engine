      Sharpe -- Shu/Kolm/Mulvey 2024 --, ou FTIC -- Cortese/Kolm/
      Lindström AStA 2026) -- e que o próprio AG-117 já mostrou não
      generalizar (λ de ETH não ajudou nas janelas críticas reais).
      Detalhe completo: 2º adendo de `AG-117`.
    severity: "médio"
    layer: "regime -- Jump Model, desenho de features/hiperparâmetro, não arquitetura de orquestração"
    consequence: >
      O veredito atual "Jump Model não tem estrutura real pra
      SOLUSDT/BNBUSDT/XRPUSDT" não pode ser tratado como definitivo --
      é o resultado de uma configuração que diverge de toda literatura
      de sucesso em 3 eixos ao mesmo tempo, não um teste limpo do
