      restante de A′ pra quando dollar bar deployment de fato começar.

      **BUG DE RAIZ meu, achado pelo pytest do usuário (2026-08-16),
      corrigido:** `RESOLUTION_ID_BY_TF = dict(zip(("R1","R2","R3"),
      TIMEFRAMES))` -- `dict(zip(a,b))` usa o 1º argumento como CHAVE;
      escrevi a ordem invertida, produzindo `{"R1":"15m",...}` em vez de
      `{"15m":"R1",...}`, e todo call site (`RESOLUTION_ID_BY_TF[tf]`)
      levantava `KeyError`. Corrigido invertendo a ordem do `zip`. Pego
      pelo próprio teste de regressão escrito nesta mesma leva -- prova de
      que o teste tem dente, não só cobertura de linha.

      **Bug PRÉ-EXISTENTE, não meu, exposto no caminho:** `commit f0bd28c`
      (M2, antes desta leva) deu `start`/`end` obrigatórios a `m2_worker.
      _query_baseline` e atualizou o fake de só 1 dos 3 testes que a
      chamam (`test_trades_dependent_bars_btcusdt_sobre_dado_real_janela_
      curta`) -- `test_compute_trades_dependent_bars_for_symbol_tf_e_
      autocontida`/`test_time_stop_ms_e_invariante_entre_tfs` ficaram com
      fakes de 2 argumentos, nunca pegos porque não rodaram de novo depois
      da mudança (mesma classe de bug que a docstring do próprio arquivo
      já documentava, 2ª ocorrência). Corrigido: os 2 fakes aceitam
      `start`/`end` agora.

      **CONFIRMADO EMPIRICAMENTE 2026-08-16** -- usuário rodou `uv run
      pytest` (3 rodadas: a 1ª achou o bug de `zip` invertido, a 2ª achou o
      bug pré-existente de `_query_baseline`, a 3ª confirmou limpo):
      **105 passed in 167,23s**. Commitado em `982b5d4`, pushed pra
      `origin/master`.
    status: "FECHADO PARCIALMENTE 2026-08-16 -- itens (1)/M2 implementados e testados (105 passed), commitados. Item (3) regra de calibration_version segue aberto (decisão de negócio do Manager sobre calibração congelada de produção)."
    addendum_item2_alarme_de_deriva_2026_08_16: >
      Item (2) IMPLEMENTADO -- `src/monitoring/dollar_bar_drift.py`
      (novo), `DollarBarDriftResult`/`evaluate_drift` (função pura,
      `drift_ratio = max/min` dos dois thresholds, `alarm_triggered =
