      (`n=2401, n_bad=389, pct=16,20%, max=8,9376, min=0,1402`) — bate
      exato; também recomputei a média de `dollar_per_day` por dia da
      semana pra BTCUSDT direto do JSON — sábado em 0,593x da média
      geral, confirma o mecanismo de sazonalidade abaixo de forma
      independente do cálculo do agente.

      **Resultado — PADRÃO MONOTÔNICO PARCIALMENTE REFUTADO em
      granularidade diária.** Pra `SOLUSDT`/`BNBUSDT`/`XRPUSDT`
      continua monotônico (W=1 dia é o melhor). Pra `BTCUSDT`/`ETHUSDT`
      REVERTE — erro pica em W=2-3 dias, mínimo real fica perto de
      W=5, não W=1.

      **Causa investigada e confirmada, não é ruído de amostra
      pequena**: sazonalidade de dia-da-semana. `dollar_per_day` de
      fim de semana cai pra ~55-70% da média (mais forte em BTC/ETH —
      sábado ~0,57-0,59x — que em BNB/SOL/XRP — sábado ~0,70-0,73x).
      Qualquer bloco de calibração/aplicação MAIS CURTO que o ciclo
      semanal inteiro (7 dias) fica "sortudo" ou "azarado" dependendo
      de quais dias da semana específicos ele contém — segunda-feira
      (calibrada pelo domingo, volume baixo) e sábado (calibrado pela
      sexta, volume alto) concentram quase todos os erros ruins pra
      BTC/ETH (BTCUSDT: segunda 32,0% ruim, sábado 50,6% ruim).
      `W=7` (e múltiplos exatos de 7) é o ponto onde todo bloco
      garante exatamente 1 de cada dia da semana, eliminando esse
      artefato de aliasing por construção — consistente com `W=14`/
      `W=21` não melhorarem mais (deriva secular, o efeito já
      conhecido, volta a dominar em janelas mais longas).

      **Sugestão FINAL (ainda sugestão, não decisão)**:
      `trailing_window_days=7`, `cadence_days=7` — REFORÇADA, não
      enfraquecida, pela medição diária. Não é mais só "a menor janela
      testada com menor erro" — é "a menor janela que é múltiplo
      exato do ciclo sazonal semanal", uma razão estrutural, não só
      empírica. Ir abaixo de 7 dias não tem sustentação em evidência
      pra 2 dos 5 símbolos (BTC/ETH), e o ganho pros outros 3 em W=1
      vs. W=7 é modesto contra esse risco. **Achado novo, relevante
      pra qualquer desenho futuro de `cadence_days` diferente de 7**:
      se algum dia fizer sentido usar cadência mais curta por outro
      motivo de engenharia, ela deveria continuar múltiplo exato de 7
      (7/14/21...), nunca um valor arbitrário curto — achado que as
      rodadas mensal/semanal não tinham revelado.

    addendum_desacoplamento_trailing_cadence_2026-08-21: >
      Auditoria externa (3 documentos, ver `AG-136`,
      `docs/plano_acao_ag124_pos_auditoria_2026-08-21.md`) apontou que
      `trailing_window_days`/`cadence_days` nunca tinham sido testados
      desacoplados (`cadence == trailing` em toda medição até aqui) — e
      que a sazonalidade semanal (addendum diário acima) é restrição
      sobre a FONTE de calibração, não sobre a CADÊNCIA de aplicação.
      `tools/diagnostics/analyze_dollar_threshold_calibration_error.py`
      generalizado pra aceitar `--trailing`/`--cadence` separados
      (default `cadence=trailing`, preserva bit-a-bit o comportamento
      anterior, revalidado contra os 2 números publicados antes de
      confiar no refactor). Medido contra `dollar_threshold_drift_
      daily.json`:

      **`T=7, C=1` (calibra com os 7 dias anteriores, recalibra TODO
      dia) vence `T=7, C=7` (baseline até então) nos 5 símbolos, sem
      exceção, por margem grande — não marginal:**
      BTCUSDT 16,20%→13,35% · ETHUSDT 16,52%→12,27% · SOLUSDT
      17,99%→11,80% · BNBUSDT 20,28%→14,44% · XRPUSDT 21,81%→16,37%
      (Δ entre -2,85pp e -6,19pp, todos na mesma direção). Confirma com
      dado real a previsão do parecer externo (§4, pergunta 2): a fonte
      de calibração balanceada por dia-da-semana (`T=7`) elimina o
      aliasing; a cadência curta (`C=1`) minimiza a exposição à deriva
      secular — os dois efeitos são aditivos, não conflitantes, porque
      são parâmetros genuinamente independentes.

      **Preenchimento do grid (`W=5,6,8,9,13,15`, antes um buraco entre
      4 e 14) também revela que a leitura original de "7 é mínimo local
      do ciclo sazonal" era mais fraca do que registrado**: sob
      `cadence==trailing`, BTCUSDT e ETHUSDT têm erro MENOR em `W=5`
      (15,68%/15,01%) e `W=6` (16,13%/15,73%) do que em `W=7`
      (16,20%/16,52%) — não há um mínimo local limpo exatamente em 7,
      o padrão é mais um vale largo entre 5-9 com leve subida depois.
      Isso não invalida a escolha de 7 (que segue sendo um bom ponto
      dentro do vale, e a única opção com garantia estrutural de
      balanceamento), mas remove o argumento "7 é o ótimo local
      observado" -- não é, com o grid completo.

      **Sweep do corte de erro** (`--high-mult`/`--low-mult`, itens 6/M1
      do plano) em `1,7/0,6` e `2,5/0,4` contra `2,0/0,5` original, pra
      `W∈{1,2,4,7}`: ranking BTC (7 vence 1) e ranking ETH (1 vence 7,
      já no cut original) são ESTÁVEIS nos 3 cortes testados — a
      preferência de cada símbolo não é artefato do corte estar em cima
      da moda (achado 2.1 do parecer externo permanece uma preocupação
      metodológica válida em geral, mas não muda a decisão neste caso
      específico).

      **Recomendação ATUALIZADA (ainda sugestão, pendente confirmação do
      Manager)**: `trailing_window_days=7`, `cadence_days=1` — substitui
      `7/7` como candidato a travar. **Pré-condição, não opcional sob
      `cadence_days=1`**: preservar `ThresholdBarsCarry` através da
      fronteira de período (item 14 do plano de ação) — sem isso,
      cadência diária multiplica as fronteiras truncadas de ~52/ano
      (sob `C=7`) pra ~365/ano, o que NINGUÉM mediu o custo real de
      ignorar. Ordem de execução não muda (plano de ação, `AG-136`):
      isso confirma que o item 14 deixa de ser "faça na mesma mudança"
      e vira bloqueante de fato, exatamente como o parecer original
      (doc 2) já havia sinalizado como condicional.

