  - id: AG-063
    date: "2026-08-17"
    file: "src/features/acd.py (novo)"
    related_file: "audit/architecture_gaps_log.yaml::AG-061, AG-036 (addendums ACD-GARCH de 2026-08-17)"
    found_by: "Claude, rodando pytest sobre o sub-módulo ACD (autorização temporária de execução, acesso remoto do Manager)"
    gap: >
      `fit_acd` retornava `None` (otimizador não convergia) sempre que os
      dados de treino continham QUALQUER duração real `x==0` -- achado ao
      rodar `test_predict_acd_duracao_zero_no_meio_da_serie_nao_crasha_
      ag061`, não hipotético. Causa raiz matemática real, não bug de
      código: a densidade Weibull em `x=0` é EXATAMENTE `0` pra `κ>1` e
      `+∞` pra `κ<1` -- qualquer duração real exatamente zero (a rajada de
      liquidez já documentada em `AG-061`, SOLUSDT 2025-07-16) torna a
      log-verossimilhança TOTAL não-finita fora de uma vizinhança
      minúscula de `κ=1` (que é justamente o `x0` do otimizador), deixando
      o L-BFGS-B sem gradiente utilizável em qualquer direção -- não uma
      falha rara, uma certeza matemática toda vez que `x` real contém um
      zero exato.
    severity: "alto"
    layer: "features"
    consequence: >
      Sem a correção, `fit_acd` (e por extensão `fit_egarch_coupled`, que
      depende de `psi`/`psi_bar` do ACD) falharia silenciosamente
      (retornando `None`) pra QUALQUER símbolo/janela cujo dado real
      contivesse uma rajada de liquidez com `close_time` repetido --
      exatamente o padrão que `AG-061` já confirmou ser real (não
      hipotético) em pelo menos 1 dos 5 símbolos medidos. O 3º e último
      candidato amputado de M1 ficaria estruturalmente incapaz de ajustar
      em janelas com esse padrão, sem nenhum sinal de que a causa era
      matemática (densidade zero/infinita), não dado insuficiente.
    resolved_by_commit: null
    resolution: >
      IMPLEMENTADO 2026-08-17, mesma sessão do achado -- `close_time` tem
      resolução de 1ms (Binance); uma duração observada `x==0` é CENSURA
      DE QUANTIZAÇÃO (duração real está em `[0,1)ms`, só arredondada pro
      mesmo carimbo), não zero físico verdadeiro (dois trades não ocorrem
      no mesmo instante). `_ACD_DURATION_FLOOR_MS=0.5` (ponto médio do
      intervalo de censura) substitui `x==0` -- e SÓ `x==0` exato, via
      `np.where(x==0, floor, x)`, não `np.maximum` -- na avaliação da
      verossimilhança (`_acd_weibull_log_pdf`), nunca na recursão de `ψ`
      (`_acd_psi_recursion` usa `x` verdadeiro; `alpha*0` é aritmética
      linear normal, sem patologia). Irrelevante pra qualquer duração real
      não-zero (mediana medida em `AG-061`: 7,5-9,9 minutos = 450.000-
      594.000ms -- um piso de 0,5ms é ruído desprezível fora do caso de
      fronteira). 3 testes de fronteira reescritos pro comportamento
      correto (finito pra qualquer κ, não mais ±∞ no limite matemático) +
      1 teste novo confirmando que valores não-zero (inclusive
      fracionários, usados pra provar correção geral contra
      `scipy.stats.weibull_min`) não são afetados pelo floor. Confirmado
      empiricamente: 43 passed (`test_features_acd.py` +
      `test_features_volatility_models.py`), 1198 passed na suíte rápida
      completa.
    status: "fechado -- corrigido e confirmado na mesma sessão do achado"

