    addendum_trend_efficiency_recente_2026-08-23: >
      Manager pediu aprofundar a hipótese "estado de maior retorno em
      `RECENTE` é tendência ordeira (não caótica)" sobre a divergência
      MÉDIA×DESVIO-PADRÃO especificamente em `hmm_gaussian_k4_v1`
      (candidato canônico de produção). Tentativa inicial
      (`tools/diagnostics/measure_ag121_trend_efficiency_by_state.py`)
      colidiu com dado obsoleto (`AG-191`) -- Manager autorizou refresh
      escopado de `RECENTE` (`run_and_save_critical_windows_report`,
      `windows=(RECENTE,)`, `hmm_states_grid=(4,)`, ~29min, 0 falhas,
      `experiments/m4_critical_windows_report_ag121_recente_k4_
      refresh.json`), executado por Claude com autorização explícita do
      Manager. Diagnóstico recomputado sobre dado fresco (pós-`AG-124`):
      **4 células de discordância `hmm_gaussian_k4_v1`/`RECENTE` no
      dado atual são DIFERENTES das 4 do dado obsoleto** (agora
      `BNBUSDT/R1`, `BNBUSDT/R2`, `XRPUSDT/R2`, `XRPUSDT/R3` -- antes
      era `BTCUSDT/R1`, `SOLUSDT/R1`, `BTCUSDT/R2`, `XRPUSDT/R3`) --
      esperado, o refit sobre bars recalibrados naturalmente muda quais
      estados colidem.

      **Resultado da hipótese, Efficiency Ratio de Kaufman por estado
      (`ER = |Σretorno| / Σ|retorno|`), MISTO -- não confirma nem
      refuta de forma limpa:**
      - `BNBUSDT/R2`: SUPORTA claramente -- estado selecionado por MÉDIA
        (ER=0,062, retorno médio -0,0225%) é ordens de grandeza mais
        "ordeiro" que o selecionado por DESVIO-PADRÃO (ER=0,002,
        essencialmente ruído puro, `std_vol` 2,9x maior -- o mais
        errático dos 4 estados).
      - `XRPUSDT/R3`: SUPORTA -- MÉDIA (ER=0,061, retorno +0,036%,
        único estado com retorno claramente positivo) vs. DESVIO-PADRÃO
        (ER=0,048, retorno -0,020%, `std_vol` quase 3x maior).
      - `XRPUSDT/R2`: AMBÍGUO -- ER quase empatado (0,038 vs. 0,035),
        sem diferença prática.
      - `BNBUSDT/R1`: CONTRADIZ -- o estado selecionado por DESVIO-
        PADRÃO tem ER MAIOR (0,021) que o selecionado por MÉDIA
        (0,009); e o estado de retorno médio mais alto dos 4 nem é o
        selecionado por MÉDIA (é outro estado, `canonical_id=3`,
        0,0000253 vs. 0,0000199) -- a suposição "MÉDIA sempre pega o
        estado de maior retorno" (do achado original sobre dado
        obsoleto) não se sustenta aqui.

      **Conclusão honesta**: a hipótese tem suporte parcial (2 de 4),
      não é um padrão limpo o bastante pra virar afirmação no doc de
      arquitetura -- fica registrada como observação qualificada, não
      como achado fechado. Não muda a decisão já tomada (MÉDIA,
      addendum acima) -- só documenta que o "porquê" da divergência não
      tem uma explicação econômica única e confiável. Dado completo:
      `experiments/ag121_trend_efficiency_by_state.json` (58 células,
      10 discordâncias no total incluindo `bocpd_v1`/`jump_model_
      cjm_v1`, fora do escopo desta hipótese). Nota: a estatística de
      concordância "90,9%" do addendum anterior segue baseada em dado
      PARCIALMENTE obsoleto (só `RECENTE` foi refrescada; `LUNA`/`FTX`/
      `CRYPTO_WINTER`/`ETF_HALVING` continuam no snapshot de
      2026-08-20) -- não recalculada aqui, ver `AG-191`.

  - id: AG-122
    date: "2026-08-20"
    file: "PLANO_MESTRE_PRINCE2.md §15.12.5 (AG-114, veredito de vencedor); audit/architecture_gaps_log.yaml::AG-118"
    related_file: "docs/brief_auditoria_externa_2026-08-20_gate_efficiency_ag118.md; tools/diagnostics/crosscheck_stress_bucket_vs_atr_decile.py (novo, diagnóstico D1)"
    found_by: "Manager, no papel de auditor externo -- parecer técnico completo revisando o brief acima, 4 achados que não estavam nas 12 perguntas originais. Diagnóstico D1 (o mais barato/decisivo dos 5 propostos) executado por Claude na mesma sessão, confirma o achado A do parecer com dado real."
    gap: >
      DOIS achados independentes e sérios sobre o trabalho de AG-114/
      AG-118, ambos verificados contra código/dado real, não apenas
      aceitos por autoridade do parecer:

      (A) TAUTOLOGIA DE INSTRUMENTAÇÃO -- confirmado no código
      (`src/labels/triple_barrier.py:1130-1131`): `tp_price = fill_px *
      (1 + side * tp_atr_mult * atr_pct_i)` / `sl_price` análogo, e
      `atr_pct_i` é EXATAMENTE a mesma quantidade persistida como
      `atr_at_t0` (linha 1256/909). Ou seja, a barreira do triple-barrier
      já é escalada pelo MESMO ATR usado como denominador de
      `p05_return_atr` (AG-118) -- `ret_net/atr_at_t0` fica
      mecanicamente próximo de `±tp_atr_mult`/`±sl_atr_mult` quando uma
      barreira é tocada, INDEPENDENTE do regime. Medir "regime prevê
      tail loss em unidades de ATR" é quase tautológico quando a
      barreira já é definida nessas mesmas unidades.

      (B) CONFIRMADO POR DADO REAL, diagnóstico D1 (rodado nesta sessão,
      `tools/diagnostics/crosscheck_stress_bucket_vs_atr_decile.py`,
      reusa 100% da mecânica de `gate_efficiency.py`, zero fit novo):
      `is_stress_bucket` (HMM k=4) é FORTEMENTE colinear com decil de
      `atr_at_t0` no momento da entrada. `frac_stress` por decil de ATR:
      decil 1 (menor ATR) = 0,74%; decil 10 (maior ATR) = 23,04% --
      relação MONOTÔNICA, ~31x de aumento do decil 1 pro 10.
      **60,5% de todos os labels com `is_stress_bucket=True` caem nos 2
      decis superiores de ATR** (vs. ~20% esperado sob independência,
      pooled 3 resoluções, n=972.798 labels). Isso não é ambíguo nem
      sutil -- é um efeito grande.
    severity: "alto"
    layer: "regime/labels -- interação entre a definição de stress-bucket (via realized_vol_short) e a geometria de barreira do triple-barrier (via atr_at_t0)"
    consequence: >
      A conclusão do AG-118 registrada anteriormente ("estrutura genuína,
      sem utilidade econômica demonstrada" -- `lift`~1, tail loss/holding
      time sem diferença clara) estava tecnicamente correta como
      DESCRIÇÃO dos números, mas a INTERPRETAÇÃO estava errada: os 3
      instrumentos usados (tail loss em unidades de ATR, pooling por
      contagem entre janelas sem LUNA/FTX pra 4 dos 5 símbolos, k=4
      testado sozinho com a menor cobertura entre os aprovados) não
      conseguiriam mostrar o efeito MESMO SE ele existisse -- ver
      resolução abaixo pra reformulação. A conclusão correta não é
      "regime não funciona como gate" -- é **"regime, medido em unidades
      já normalizadas por ATR, não demonstrou adicionar informação além
      do que o ATR em t0 já captura, nesta configuração de instrumentação"
      -- uma afirmação mais forte, mais específica, e diretamente
      testável (não testada ainda: regime prevê algo em unidades BRUTAS,
      não normalizadas por ATR?).**
    resolved_by_commit: null
    resolution: >
      Diagnóstico D1 (o mais barato dos 5 propostos pelo parecer,
      "minutos, dois desfechos úteis") executado e CONFIRMA o achado A
      com folga -- não ficou em zona ambígua. `AG-114` (veredito de
      vencedor `hmm_gaussian_k4_v1`) e `AG-118` (conclusão de `lift`
      fraco) precisam ser REABERTOS -- não porque o processo foi
      desonesto (não foi -- reportar `lift`~1 sem suavizar foi o
      comportamento certo), mas porque a MEDIÇÃO não tinha poder pra
      sustentar a conclusão que foi tirada dela.

      Achado adicional do mesmo parecer, também verificado nesta sessão
      (não apenas aceito): a seleção de `hmm_gaussian_k4_v1` no `AG-114`
      é MENOS robusta do que registrado -- em R1 e R2, HMM k=2 tem I²
      MAIOR que k=4 na métrica primária (R1: 97,82 vs 97,44; R2: 95,31
      vs 94,98) e só foi desqualificado pelo Gate 1 (occupancy). Pior
      que o parecer registrou: usando o critério que o próprio Gate 1
      declara (mediana por resolução, não máximo por janela), a
      occupancy de k=2 fica 34,1%/34,9%/39,5% -- TODAS abaixo do teto de
      40% já testado nesta sessão como parte do sweep de robustez. Ou
      seja, sob o próprio critério mediano do Gate 1, no próprio teto já
      testado (não precisa extrapolar pra 45% como o parecer sugeriu),
      **k=2 passa o Gate 1 e vence a métrica primária em 2 das 3
      resoluções.** O brief original citou occupancy POR JANELA (43-44%
      em algumas janelas de R1) como razão de desqualificar k=2 mesmo a
      40% -- misturando 2 critérios diferentes (mediana de resolução vs.
      máximo de janela) sem declarar qual decide. Também confirmado: em
      R1, k=3 (97,40) e k=4 (97,44) NÃO estão literalmente empatados
      (correção a um detalhe do parecer, que leu a tabela arredondada do
      brief) -- mas a diferença (0,04 ponto) é claramente menor que
      qualquer ruído de amostra plausível, então o ponto mais profundo do
      parecer (decisão tomada sem intervalo de confiança, "empate" nunca
      definido operacionalmente na regra travada) permanece válido
      independente dessa correção pontual.

      NÃO decidido nesta entrada (fica pro Manager, fila de trabalho
      completa no parecer original, seção 4): (a) rodar `AG-118` em
      k=2/k=3 (custo ~zero, `RawLabels` já persistidos); (b) redefinir
      "empate" do Gate 3 com critério numérico explícito; (c) tail
      loss/holding time fora de unidade de ATR (retorno bruto,
      comparação pareada por célula); (d) intervalo de confiança em
      `lift`/I² (bootstrap em bloco, maquinaria já existe); (e) `lift`
      reaberto por janela (LUNA/FTX separadas das outras 3, já que são
      as únicas com choque abrupto e são BTC-only -- hipótese "gate
      funciona só em crise" é hoje NÃO-TESTÁVEL pra 4 dos 5 símbolos).

      ADENDO FINAL 2026-08-21 -- fila completa processada (R3, D1-D5,
      R1), auto-verificação incluída (achado real na própria verificação,
      ver item D4 abaixo). Novo script `tools/diagnostics/gate_
      efficiency_full_diagnostics.py`, reusa 100% da mecânica existente,
      zero fit novo.

      R3 -- CONFIRMADO, não é fit in-sample. Verificado em 2 pontos do
      código: `m4_regime_comparison._run_fold_refit_candidate` (linha
      ~805) decodifica só `obs_2d[test_start_idx:test_end_idx]`, e
      `hmm_gaussian.fit_hmm_gaussian` (linha ~295) treina só sobre
      `obs[:train_end_idx]`. A hipótese do parecer (HMM levar vantagem
      em R3 por contaminação in-sample) está REFUTADA -- é walk-forward
      ancorado genuíno, mesma disciplina B05 de todo o M4.

      D2 -- `lift` por janela, LUNA/FTX separadas (as únicas com choque
      abrupto, BTC-only): NENHUMA das 12 células LUNA/FTX (2 janelas x 2
      sides x 3 resoluções) exclui 1,0 no IC, em NENHUM dos 3
      candidatos (k2/k3/k4). A hipótese "gate funciona especialmente em
      crise" (§7 pergunta 8), onde de fato testável (só BTC), não achou
      suporte.

      D3 -- IC de `lift` via ponderação por `uniqueness` (não bootstrap
      em bloco -- unicidade já é infraestrutura do projeto, López de
      Prado, reusada sem fórmula nova) + método de Katz (delta method em
      log-razão de 2 proporções). De 90 células (30 por candidato x 3
      candidatos), só 2 excluem 1,0 no IC 95% -- k3/R2/BNBUSDT/short
      (lift=1,325, IC=[1,032;1,701]) e k4/R3/BTCUSDT/long (lift=0,806,
      IC=[0,666;0,976]), ambas marginais. **Com 90 testes a 95%, ~4-5
      falsos positivos são esperados só por acaso -- achar 2, ambos
      limítrofes, é exatamente o padrão de RUÍDO, não de sinal
      escondido.** Isso refuta especificamente a suspeita do parecer
      (item D) de que `n` nominal (~15-25 mil) mostraria desvios grandes
      de 1,0 -- usando `n_eff` real (ponderado por unicidade, ~2.000-
      3.500 por célula, ~7-10x menor que o nominal, magnitude plausível
      dada a sobreposição de barreira tripla em holding de ~17-20
      barras), a leitura "sem padrão consistente" do brief original
      estava CORRETA, só não vinha acompanhada do IC que a sustentasse.

      D4 -- ACHADO MAIS IMPORTANTE desta rodada, e uma AUTOCORREÇÃO em
      cima da própria leitura inicial. Tail loss em `ret_net` BRUTO (não
      dividido por ATR), pareado por (símbolo, janela, side, resolução):
      a princípio pareceu uma reversão dramática -- o bucket de stress
      tem p05/p01/p005 sistematicamente PIOR (mais negativo) que o
      bucket não-stress em ~96-100% das ~100 células pareadas, nos 3
      candidatos (mediana da diferença ≈ -0,006, ou seja ~0,6pp pior).
      **Verificação adicional (não pedida pelo parecer, achada nesta
      auto-checagem) mostrou que essa "reversão" NÃO é evidência nova
      -- é uma segunda manifestação do MESMO mecanismo do achado A/D1,
      não independente dele.** Confirmado em `src/labels/triple_
      barrier.py`: `exit_price` em TP/SL é o PRÓPRIO PREÇO DA BARREIRA
      (linha ~1151, "convenção padrão de triple barrier"), e `ret_gross
      = side*(exit_price/fill_px - 1)` (linha 1155) -- substituindo
      `tp_price`/`sl_price` (linhas 1130-1131), isso dá `ret_gross ≈
      ±mult*atr_pct` EXATAMENTE, sempre, pra qualquer trade que bate
      barreira (maioria dos casos) -- não há overshoot/gap modelado no
      label (o Label Engine documenta essa convenção explicitamente,
      não é bug). Ou seja: `ret_net` de um trade TP/SL é quase-
      deterministicamente uma função de `atr_pct` (mais custos fixos +
      funding, variação pequena) -- NÃO importa se você normaliza por
      ATR (Finding A original, tautológico por cancelar exatamente) ou
      mede bruto (D4, tautológico por escalar exatamente com `atr_pct`,
      que já é maior no bucket de stress via D1). **As DUAS versões da
      métrica de tail loss são estruturalmente incapazes de medir risco
      condicional a regime além do que ATR já captura -- não por escolha
      de unidade, mas porque o Label Engine fixa `exit_price` no nível
      da barreira por construção.** O ÚNICO canal que não é
      mecanicamente determinado por `atr_pct` é QUAL barreira é tocada
      primeiro (`frac_tp`/`frac_sl`, isto é, `lift`) -- que depende do
      caminho real de preço, não do nível pré-fixado da barreira. É
      exatamente o que D3 mediu, e D3 não achou sinal.

      D5 -- `lift` por side já é dimensão nativa das tabelas de D2/D3
      (side é chave de agrupamento desde a implementação original) --
      inspecionado, sem padrão consistente (sinal alterna
      inconsistentemente entre símbolo/janela/resolução, sempre dentro
      do IC largo de D3).

      R1 -- rodado pra k2/k3/k4 (não só k4): o padrão de D2-D5 (sem
      `lift` significativo, achado D4 sobre determinismo de `ret_net`)
      é UNIFORME nos 3 candidatos, não um artefato específico de
      `hmm_gaussian_k4_v1`. Achado positivo de robustez: a conclusão de
      AG-118 não depende de qual K vence o AG-114.

      Fixes de baixo custo aplicados: hash de proveniência (blake2b dos
      parquets de `RawLabels` consumidos + `generated_at`/`code_version`
      da rodada AG-114 de origem) em `gate_efficiency_report.json`
      (`gate_efficiency._raw_labels_provenance`, testado); docstring de
      `src/regime/canonicalization.py` reforçada com aviso explícito
      (mitigação AG-121, rename completo de `canonical_id` avaliado e
      DESCARTADO -- 25 arquivos referenciam o nome, custo real de
      refactor, não "minutos" como estimado no parecer); constante nova
      `jump_model_min_episodes_per_cell=30` (ASSUMED, classe B, sweep
      pendente) pré-registrada em `config/constants.yaml` ANTES de
      qualquer novo teste de Jump Model, resolve item 5/6 do parecer.
      Nota de processo registrada em `CLAUDE.md` (Diretrizes de
      comportamento) -- toda regra travada a priori precisa de definição
      operacional de cada termo, não só métrica+limiar.

      CONCLUSÃO FINAL:
      - `AG-118` (utilidade econômica do gate): agora BEM MEDIDA, não
        subpotente -- `lift` não mostra desvio significativo de 1,0 em
        90 células (3 candidatos x 3 resoluções x 5 símbolos x 2 sides),
        robusto a K, e o mecanismo é entendido (barreira ATR-escalada +
        `exit_price` determinístico tornam `frac_tp`/`frac_sl` o único
        canal onde sinal de regime PODERIA aparecer, e não aparece).
        Reformulação final: "regime, medido pelas métricas disponíveis
        no desenho atual do triple-barrier, não demonstra adicionar
        informação além do que `atr_at_t0` já captura -- não por
        limitação de poder estatístico, e não por escolha de unidade de
        medida, mas por uma propriedade estrutural de como o Label
        Engine define `exit_price`."
      - `AG-114` (candidato vencedor): CONTINUA ABERTO -- a fragilidade
        da seleção k=4-vs-k=2 (ver adendo anterior) não foi resolvida
        por nenhum diagnóstico desta rodada (nenhum deles reavalia o
        Gate 1 em si). Decisão pendente do Manager: redefinir Gate 1
        (mediana OU máximo-por-janela, nunca os dois sem critério) e
        Gate 3 ("empate" com número) ANTES de redeclarar um vencedor --
        não decidido aqui de propósito, seria a mesma classe de erro
        que motivou reabrir isto.
    status: "AG-118 resolvido -- lift bem medido (IC via n_eff/uniqueness), sem sinal em 90 células, robusto a K (k2/k3/k4), mecanismo explicado (D4, exit_price=preço da barreira torna qualquer metrica de tail-loss quase-determinística em atr_pct). AG-114 CONTINUA aberto -- redefinição operacional do Gate 1/Gate 3 pendente do Manager antes de redeclarar vencedor."

