    addendum_2026_08_16_min_common_history_bars: >
      4º ponto achado (revisão independente `project_assurance` sobre
      `src/data/build_dollar_bars.py`/`src/features/build.py::
      build_t1_features(bar_source=...)`, runner de validação de fiação
      de dollar bar) -- mesma família dos 3 pontos já enumerados
      (`sqrt(window)`, Yang-Zhang overnight, asof-lag), mas não estava
