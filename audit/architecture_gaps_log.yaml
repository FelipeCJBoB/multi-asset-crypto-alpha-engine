      (tratado como o achado mais urgente da síntese, "P1").
      **Verificado contra o código real nesta sessão e REFUTADO**: não
      existe nenhum motor de backtest com estado de posição/margem/
      equity hoje, nem acoplado nem independente. `src/backtest/`
