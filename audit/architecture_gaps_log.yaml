  - id: AG-004
    date: "2026-08-12"
    file: "src/validation/cpcv.py"
    related_file: "PLANO_MESTRE_PRINCE2.md §15"
    found_by: "Agent discovery (Explore, 6 agentes paralelos, discovery de src/ solicitado pelo Manager)"
    gap: >
      cpcv.py:70 -- `_BAR_MS: Final[int] = step_ms("15m")`, constante de
      MODULO fixa em 15 minutos, usada para converter `embargo_bars`
      (contagem de barras) em milissegundos (`embargo_ms = cfg.embargo_bars
      * _BAR_MS`, linha 262). Nao existe parametro `tf` em
      `generate_splits`/`load_labels_v1` para sobrescrever isso.
    severity: "alto"
    layer: "validation"
    consequence: >
      Rodar CPCV para um TF diferente de 15m (M2/M3 do PRD V4.1, ja no
      roadmap) produziria embargo em UNIDADE DE TEMPO ERRADA --
      SILENCIOSAMENTE, sem erro visivel. E o unico bloqueador de
      multi-TF desta descoberta com risco de dado errado nao detectado,
      em vez de crash/erro obvio -- por isso e o item de maior prioridade
      de correcao entre os achados de src/ (PLANO_MESTRE Sec15.6).
    resolved_by_commit: "648935c"
    resolution: >
      CPCVConfig ganhou campo `tf: str = "15m"` (default bit-exato pra todo
      caller existente, nenhum passa tf hoje). embargo_ms passa a ser
      computado por `step_ms(cfg.tf)` em cada chamada (generate_splits E
      assert_embargo_respected), nao mais uma constante `_BAR_MS` fixa em
      import-time. `load_labels_v1` ganhou `tf` correspondente. 3 testes
      novos: paridade bit-exata do default, escala EXATA 2x embargo 15m->30m
      (fortalecido apos revisao do Agent independente pedir razao exata, nao
      so ">"), e tf desconhecido levanta UnsupportedTimeframeError na
      construcao (falha alto, nao tarde). Scripts mecanicos autorizados
      (ruff/mypy/banned_patterns/check_unguarded_ratios) rodados, limpos.
      Revisao independente via skill project_assurance (Agent fresco,
      general-purpose) confirmou compatibilidade retroativa por inspecao de
      TODOS os callers reais, nao presumida -- achou 1 gap real (AG-009,
      abaixo) e 1 teste mais fraco que o docstring alegava (corrigido antes
      de fechar). Primeira rodada de pytest do Manager (2026-08-13) achou
      `test_embargo_escala_com_tf_nao_fica_preso_em_15m` falhando: 300 vs
      140 observado, nao 280 (2x) esperado pela versao fortalecida do
      teste. Causa raiz derivada a mao sobre o algoritmo real (nao e bug em
      `generate_splits`): com `horizon_bars=1` na fixture, a linha de
      treino logo a ESQUERDA de cada fronteira de grupo de teste tem
      `t1 == g_start` exatamente, satisfazendo a condicao de purge
      (`t1 >= g_start`) e sendo contada em `n_purged`, nao `n_embargoed`
      (dedup proposital `embargo_mask & ~purge_mask`, pra nao contar a
      mesma linha 2x). Esse desconto e 1 linha CONSTANTE por fronteira
      esquerda -- nao escala com `embargo_bars`/`tf` -- entao quebra a
      razao exata 2x so nas 20 fronteiras esquerda (das 40 totais nos 15
      splits de C(6,2)). Formula confirma os dois numeros observados:
      15m = 20*4 + 20*(4-1) = 140; 30m = 20*8 + 20*(8-1) = 300 (razao
      2,14, nao 2). Corrigido o TESTE (nao o codigo-fonte): fixture passa
      a usar `horizon_bars=0` (`t1=t0`), que elimina a interacao com purge
      (nenhuma linha fora do proprio grupo de teste satisfaz
      `t1 >= g_start`), isolando a escala pura do embargo -- com isso a
      razao exata 2x volta a valer e a asserção `== 2 *` permanece forte.
      pytest ainda nao re-rodado com a correcao (PENDENTE-DE-EXECUCAO-
      HUMANA, protocolo de execucao) -- status fica "aguarda confirmacao"
      ate o Manager confirmar verde.
    status: "fechado — aguarda confirmação de pytest verde após correção do fixture (protocolo de execução)"

