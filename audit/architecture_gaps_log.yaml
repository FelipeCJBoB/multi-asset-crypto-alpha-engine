      reconstruir a ontologia por conta própria, arriscando reintroduzir a
      leitura "R1≈15m" que o próprio achado D do Bloqueador 2 já identificou
      como "mentira operacional". Registrar agora, antes de qualquer linha
      de código, é o que torna a decisão auditável.
    resolved_by_commit: "982b5d4"
    resolution: >
      IMPLEMENTADO PARCIALMENTE 2026-08-16 -- item (1) das 3 dependências
      registradas abaixo fechado (`grade_id`, AG-037, mesmo commit). Escopo
      real desta entrada era a parte de M2: `BarComparisonMetrics` ganhou
      `resolution_id: str` (novo, ao lado de `tf`, que passa a ser só o
      parâmetro de CALIBRAÇÃO -- decide qual baseline de `klines_1m` define
      `target_n_bars`). `m2_worker.RESOLUTION_ID_BY_TF` (`dict(zip(
      TIMEFRAMES, ("R1","R2","R3")))`) implementa o pareamento posicional;
      threading completo em `compute_time_bar_for_symbol`/`compute_trades_
      dependent_bars_for_symbol_tf`/`_log_task_done`/`m2_bar_comparison.
      _build_payload`. `bar_measure=quote_volume`/`bar_unit=USDT`/
      `bar_close_condition` (já implícitos em `bars.py:222`) documentados
      como nota em `constants.yaml::canonical_bar_type`, sem constante YAML
      nova (vocabulário, não valor de domínio numérico -- mesmo tratamento
      de `BAR_TYPES`/`TIMEFRAMES`). Teste de regressão travando o
      invariante central (`resolution_id` nunca é um literal de
      `TIMEFRAMES`) escrito ANTES da implementação estar correta -- pegou
      um bug de raiz meu na hora (ver abaixo).

      Itens (2) e (3) permanecem NÃO IMPLEMENTADOS, fora de escopo desta
      leva por decisão explícita (nenhum caller de produção real até
