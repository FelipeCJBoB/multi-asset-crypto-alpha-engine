    found_by: "Manager -- decisão do Bloqueador 2 (o que 'M15/M30/H1' significa sob dollar bars)."
    gap: >
      Registro de decisão, não achado novo -- Bloqueador 2 (sem AG número
      próprio até agora) decidido: **Opção A′ (threshold fixo por
