  - id: AG-105
    date: "2026-08-19"
    file: "PLANO_MESTRE_PRINCE2.md §15.11 (proposta AG-096, parte 2, lista de 3 caminhos pós-AG-102, opção 2 já corrigida por AG-104)"
    related_file: "src/exchange/rate_limit.py:70-96 (Budget.cap_for/can_admit/reserve, used compartilhado); config/constants.yaml:544-556 (rate_limit_reserve_pct=0.30, ip_weight_limit_1m=2400); audit/architecture_gaps_log.yaml::AG-101, AG-102, AG-104"
    found_by: "project_assurance (Rodada 4 de contestação adversarial, escopo estreito: parágrafo da opção 2 pós-correção de AG-104)"
    gap: >
      AG-104 corrigiu corretamente a violação do invariante P0/P1
      (confirmado por releitura de `Budget.cap_for()` -- a redação ficou
      inequívoca: "nunca da reserva de 30% exclusiva de P0/P1"). Mas a
      correção deixa sem tratar um problema estrutural diferente. `Budget`
      tem um único contador `used` compartilhado por TODAS as prioridades
      do mesmo orçamento -- `cap_for()` só reconhece dois níveis (execução
      = `self.limit` cheio; não-execução = `self.limit*(1-reserve_pct)`),
      sem nenhum conceito de sub-alocação DENTRO de P2/P3 por `call_type`.
      Mesmo com essa sub-alocação implementada, ela NÃO protegeria
      `position_risk` do cenário que o próprio `AG-102` identificou como
      motivador -- porque `cap_for(P2)` e `cap_for(P3)` já são o MESMO
      valor hoje, e tráfego de P0/P1 sozinho já pode esgotar esse teto
      inteiro antes de qualquer chamada P2/P3 (dedicada ou não) ser
      admitida: com `ip_weight_limit_1m=2400` e `rate_limit_reserve_
      pct=0.30`, basta `used` cruzar 1680 (70% do limite total, bem
      abaixo do teto de 2400 que P0/P1 sozinho pode consumir) para que o
      orçamento restante de P2 vá a zero -- nenhuma fatia "dedicada"
      dentro dos 1680 muda esse resultado, porque o corte que importa
      (P0/P1 vs P2/P3) já aconteceu antes de qualquer subdivisão interna
      ao P2/P3 entrar em jogo. A opção 2, mesmo corrigida por AG-104,
      resolvia um problema que `AG-102` nunca levantou (position_risk
      perder pra account_info/backfill/research DENTRO do P2/P3) e
      deixava intocado o problema que `AG-102` de fato levantou (P2/P3
      inteiro esgotado por tráfego de P0/P1 sob STRESS).
    severity: "alto"
    layer: "risk / exchange -- eficácia do orçamento dedicado de rate-limit contra o problema que motivou AG-102"
    consequence: >
      Um Manager que lesse a lista de 3 caminhos e escolhesse a opção 2
      pensando que ela resolve a lacuna de latência de AG-102 estaria
      escolhendo uma solução que não move a agulha nesse cenário
