    resolved_by_commit: null
    resolution: >
      Implementado 2026-08-19 -- autorização explícita do Manager
      ("AG-093 + 4ª re execução = aprovado"), depois de AG-090/091/092
      já implementados e auditados de forma independente.
      `src/analysis/m4_regime_comparison.py::SymbolResult` ganhou 2
      campos novos, `oos_start_ms: int`/`oos_end_ms: int` -- a fronteira
      `[oos_start_ms, oos_end_ms)` (half-open, TIMESTAMP não índice) do
      MESMO walk-forward ancorado que já produz baseline/HMM/Jump Model
      dentro de `compare_regime_candidates_for_symbol`, computada assim:
      `oos_start_ms = close_time_ms[oos_start]`, `oos_end_ms = close_
      time_ms[oos_end-1] + 1` (o `-1`/`+1` evita indexar fora dos
      limites quando o último fold cobre até o fim da série carregada --
      caso normal do walk-forward ancorado, confirmado lendo `generate_
      anchored_walk_forward_splits`). Zero IO/fit adicional -- reusa
      exatamente o mesmo `close_time_ms`/`oos_start`/`oos_end` que os
      outros 5 candidatos já usam, computados 1x.
      `m4_critical_windows.py::_bocpd_metrics_for_window` mudou de
      assinatura -- recebia `window: CriticalWindow` e derivava `start_
      ms`/`end_ms` de `window.start`/`window.end`; agora recebe `oos_
      start_ms`/`oos_end_ms` diretamente. Caller (`run_critical_windows_
      comparison`, loop de `patched_outcomes`) passa `outcome.symbol_
      result.oos_start_ms`/`.oos_end_ms` -- reusa o `SymbolResult` JÁ
      CALCULADO da mesma célula, a linha `window = next(...)` que
      existia só pra essa chamada foi removida (não é mais necessária).
      Teste novo (`test_compare_regime_candidates_oos_bounds_contem_
      todo_raw_labels_de_todo_candidato`) prova que `close_time_ms` de
      TODO `RawLabels` de TODO candidato (baseline pós-R0, HMM x2, Jump
      Model, BOCPD-fatiado-por-janela-original) cai dentro de
      `[oos_start_ms, oos_end_ms)` -- garante que a fronteira exposta é
      válida pra todos, não só coincidentemente compatível com um.
      3 testes de `_bocpd_metrics_for_window` atualizados pra passar
      `oos_start_ms`/`oos_end_ms` diretamente. Scripts mecânicos limpos.

      **Auditoria independente concluída 2026-08-19 -- 0 CRITICAL/0
      HIGH.** Agente confirmou a pergunta mais crítica (fórmula da
      fronteira) por leitura direta de `generate_anchored_walk_forward_
      splits`: `oos_end == len(close_time_ms)` é GARANTIDO SEMPRE (não
      só "no caso comum") quando `splits` não é vazio -- o último fold
      cobre sempre o último período civil presente, por construção do
      loop -- confirmando que `close_time_ms[oos_end-1]+1` (nunca
      `close_time_ms[oos_end]`, que seria índice fora dos limites) é a
      escolha correta, não uma coincidência. Rastreou variável por
      variável dentro de `compare_regime_candidates_for_symbol` e
      confirmou que `oos_start_ms`/`oos_end_ms` vêm exatamente do MESMO
      `close_time_ms`/`oos_start`/`oos_end` que os outros 5 candidatos
      usam (zero recomputação paralela). Confirmou blast radius completo
      de `SymbolResult` (6/6 sites atualizados), zero uso órfão da linha
      `window = next(...)` removida, `_compute_bocpd_full_history`
      intocada (zero double-fit), consistência com `close_time_ms`
      (AG-090) em toda a correção.

      1 achado MEDIUM, corrigido no mesmo dia: o teste novo só provava
      CONTAINMENT (a fronteira é um superconjunto válido dos dados reais
      de cada candidato) -- uma implementação hipotética ERRADA
      (`oos_start_ms`/`oos_end_ms` = série carregada INTEIRA, não a
      fatia OOS -- exatamente a classe de bug que AG-093 corrige)
      passaria no teste sem alteração, porque todo `RawLabels` já é
      subconjunto da série inteira por construção. Corrigido com 2
      checagens adicionais: (a) igualdade EXATA contra um split
      recomputado de forma independente (mesmos primitivos, chamados do
      zero, não emprestados do resultado); (b) `oos_end_ms - oos_start_
      ms` precisa ser significativamente menor que o span da série
      carregada inteira (`&lt; 0.5x`) -- pegaria de imediato uma regressão
      futura pra essa classe específica de bug.

      Scripts mecânicos limpos após o fix. Zero achado LOW.
    status: "implementado e auditado de forma independente (0 CRITICAL/HIGH; 1 MEDIUM corrigido -- teste agora prova igualdade exata contra split recomputado, não só containment) -- 4ª re-execução do M4 autorizada pelo Manager, pronta pra disparar"

  - id: AG-094
    date: "2026-08-19"
    file: "PRD_V3_2_UNIFICADO.md §6.5 (linhas 1425-1438), §6.8 (linhas 1459-1469)"
    related_file: "PRD_V4_1.md §4.5 (Meta reaberto, não toca em regime)"
    found_by: "Agent independente (Project Assurance), auditoria cética Regime→Alpha/Meta-Label/Risk/Execução comissionada pelo Manager"
    gap: >
      O Meta-Label (Parte VI do PRD) não tem nenhum campo de entrada
      derivado de Regime -- nem estado, nem probabilidade, nem confiança.
      A lista de INPUT (§6.5, 6 features: `alpha_confidence`,
      `J01_p_fill_est`, `J04_cost_est_bps`, `J05_adverse_selection_est_bps`,
      `F03f_spread_vol_ratio`, `E05f_time_to_funding_h`) e os 5 critérios
      de entrada (§6.8: obs_efetivas≥3000, fila calibrada, ganho CPCV>5pp,
      DSR, Brier<0,22) nunca citam `regime`. `PRD_V4_1.md` reabre o Meta
      (§4.5) mas não adiciona nem revisa nenhum campo de entrada -- não
      toca em regime. Sob a arquitetura multi-resolução (M4 medindo
      regime em R1/R2/R3 simultaneamente), haverá potencialmente 3
      classificações de regime concorrentes por (símbolo, TF), e o
      documento que define o Meta não diz se/como ele deveria consumir
      qualquer uma delas.
    severity: "alto"
    layer: "models/meta -- contrato de features, camada ainda não implementada (V41-10, não iniciado)"
    consequence: >
      Não bloqueia nada hoje (V41-10 é o último item do roadmap de Camada
      2/3, critério de entrada do §6.8 não depende de regime). Mas é
      exatamente o tipo de lacuna que gera retrabalho de desenho quando o
      Meta for implementado -- a decisão (incluir regime como feature do
      Meta, e de qual resolução/candidato) precisa ser tomada antes da
      implementação, não descoberta no meio dela.
    addendum_reversao_2026-08-22: >
      **AG-094 FECHADO -- com REVERSÃO EXPLÍCITA da resolução que AG-118
      havia antecipado.** Este addendum existe porque `AG-118`
      (`consequence`) registrou, em 2026-08-20, a resolução OPOSTA como
      já decidida: "Resolve os 2: AG-094 fecha como 'Meta não consome
      nenhum candidato -- pergunta se aplica ao GATE, não ao Meta'".
      Fechar agora sem nomear essa posição anterior deixaria o log
      internamente contraditório -- o leitor futuro encontraria duas
      resoluções incompatíveis sem saber qual venceu nem por quê.

      **Decisão que prevalece (Manager, 2026-08-22): regime ENTRA como
      feature do Meta**, one-hot com níveis fixos, nunca ordinal
      (`AG-121`: canonicalização é por RETORNO, "R2 < R3" não significa
      volatilidade). Isso revoga a recomendação #7 do ADR-001 §2.7 --
      revogação explícita do Manager, verbatim: "Vou revogar o contrato
      canônico do Meta-Labeling pois não me convenceu, pesquise sobre
      Meta-Labeling no AFML depois pesquise casos de uso recente
      modernos".

      **Por que a posição mudou** (não foi preferência, foi evidência
      nova em 3 vias independentes): (a) o experimento canônico do
      framework formal de meta-labeling (Joubert,
      `theory_and_framework/fp_modeling.py`, código aberto) implementa
      um braço explicitamente regime-aware sobre dado bi-regime; (b)
      `Ensemble Meta-Labeling` (Thumm/Barucca/Joubert, JFDS 5(1):10-26,
      2022) lista identificação de regime como 1 dos 3 eixos e conclui
      que o ganho aparece QUANDO há múltiplos regimes; (c) um co-autor
      de `Meta-Labeling Architecture` (JFDS 4(4):10-24) recomenda
      publicamente features de regime exclusivas do meta-model.

      **E o argumento próprio deste motor, que é o decisivo:** sem uma
      vantagem informacional -- um input que o primário não tem --
      meta-labeling não tem MECANISMO (regressão infinita) e só adiciona
      variância. Regime SAIU do vetor de treino do Alpha em 2026-08-21
      (`src/models/alpha.py:57-68`, Fase A do `PLANO_MESTRE §15.13`), o
      que criou como efeito colateral não planejado exatamente essa
      vantagem.

      **A evidência contrária de AG-118 NÃO é descartada:** `lift ~ 1,0`
      em 90 células mede o lift INCONDICIONAL (universo inteiro,
      estratificado por stress). O Meta opera sobre a subpopulação
      CONDICIONAL (só as barras em que o Alpha disparou). É logicamente
      possível que regime separe TP de SL dentro dos sinais sem separar
      no universo -- e essa é a ÚNICA hipótese que AG-118 não fechou.
      Ela virou o Gate E0 do desenho, com consequência declarada antes
      de rodar: falha em >=2 dos 5 paths -> registro em
      `evidence_ledger.yaml` e o Meta sai do roadmap.

      **A pergunta original de AG-094 ("de qual resolução/candidato?")
      também é respondida:** mesmo (símbolo, resolução) e mesmo
      `method_id` do Alpha que ele filtra, `decode_mode = filter`,
      identidade de estado canonicalizada -- e, na v1 do Meta,
      concretamente a coluna `regime` (Utf8) que
      `build_modeling_frame` já entrega, não `canonical_id` (que não
      chega por esse caminho; ver design doc §6.1).

      Detalhe completo: `docs/meta_model_design_doc_2026-08-22.md` (v2,
      auditado) e `PLANO_MESTRE_PRINCE2.md §15.19`.
    resolved_by_commit: null
    resolution: >
      Regime entra como FEATURE do Meta (one-hot, níveis fixos, nunca
      ordinal), revogando ADR-001 §2.7 recomendação #7. Decisão do
      Manager 2026-08-22, com evidência de literatura e o argumento de
      vantagem informacional. Reverte explicitamente a resolução
      antecipada em AG-118. Condicionada ao Gate E0 (separabilidade
      condicional) -- se E0 falhar, o Meta sai do roadmap e esta
      decisão fica sem objeto.
    status: "fechado -- decisão de desenho tomada pelo Manager (2026-08-22), com reversão explícita da posição antecipada em AG-118; implementação gated no Gate E0 e no retreino do Alpha"

  - id: AG-095
