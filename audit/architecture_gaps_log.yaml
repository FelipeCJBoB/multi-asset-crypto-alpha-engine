  - id: AG-115
    date: "2026-08-20"
    file: "PRD_V3_2_UNIFICADO.md §9.1 (linhas 1700-1727); src/labels/triple_barrier.py (comentário 8, linhas 52-59)"
    related_file: "audit/architecture_gaps_log.yaml::AG-109; docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §1.4/§5 item 1; PLANO_MESTRE_PRINCE2.md §15.12"
    found_by: "Manager, pedindo auditoria do desenho técnico de labels em ADR-001 vs. PLANO_MESTRE -- verificação direta contra PRD_V3_2_UNIFICADO.md e o código real da Label Engine"
    gap: >
      AG-109 (auditoria externa, ADR-001) registrou como achado de maior
      severidade de todo o parecer que "nenhuma versão do gatilho de
      proteção... tem saída executável sob a política post-only GTX
      declarada" e que isso "afeta o STOP-LOSS do próprio triple-barrier"
      -- REFUTADO por verificação direta. A política de execução real do
      projeto (`PRD_V3_2_UNIFICADO.md` §9.1, linhas 1700-1727) é
      ASSIMÉTRICA por desenho, não uniformemente post-only: só a ENTRADA
      é `LIMIT/GTX/on_timeout=CANCEL` (nunca vira mercado). O STOP-LOSS é
      `STOP_MARKET/working_type=MARK_PRICE/reduce_only` -- ordem
      condicional nativa da Binance que, uma vez disparada, executa como
      MARKET (taker, execução garantida). O TIME_STOP é `MARKET
      reduce_only` explícito (também garantido). O TAKE_PROFIT é
      `LIMIT/GTC/reduce_only` (maker, pode não encher -- mas se não
      encher, a posição sai via TIME_STOP, que É garantido). Confirmado
      também no código real: `src/labels/triple_barrier.py` já
      implementa essa assimetria de custo (comentário 8, "SL e TIME caem
      no mesmo ramo `else` porque os dois exigem execução garantida via
      ordem agressiva") -- a Label Engine em PRODUÇÃO já assume esse
      desenho, não é uma proposta nova. Economia já quantificada em
      `PRD_V3_2_UNIFICADO.md` §0.3/linha 3369/3450: "Execução maker
      assimétrica... breakeven 53,4% -> 48,1%".
    severity: "alto"
    layer: "governança -- correção de achado de auditoria externa, não um gap de código"
    consequence: >
      AG-109 fica REFUTADO como estava formulado -- não existe o furo que
      descrevia. O item de maior prioridade do parecer do ADR-001
      ("definir o caminho de saída executável") já estava definido no PRD
      desde antes do parecer existir; o auditor externo não tinha essa
      informação (nota de escopo do próprio ADR-001: "Não tenho acesso ao
      repositório") e generalizou incorretamente a política de ENTRADA
      (post-only, nunca-market) pra TODA a política de execução, incluindo
      saídas. IMPORTANTE -- isso não fecha o trabalho pendente:
      `src/exchange/adapter.py::place_order` continua `NotImplementedError`,
      nenhum código de execução real existe ainda. A diferença é que o
      trabalho que falta é IMPLEMENTAR uma decisão já tomada
      (STOP_MARKET/MARKET reduce_only pras saídas), não DECIDIR algo novo
      -- muda a natureza do próximo passo, de "resolver furo de desenho"
      pra "implementar desenho já definido". `PLANO_MESTRE_PRINCE2.md`
      §15.12/§11.6 e o Road Map Vivo v2 (passo "Resolver AG-109 antes de
      qualquer outra coisa") citavam AG-109 como bloqueante máximo --
      precisam de correção.
    resolved_by_commit: null
    resolution: >
      Nenhuma ação de código necessária -- o desenho já está correto em
      `PRD_V3_2_UNIFICADO.md` §9.1. Ação real pendente: atualizar
