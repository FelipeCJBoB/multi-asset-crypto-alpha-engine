      restante de A′ pra quando dollar bar deployment de fato começar.

      **BUG DE RAIZ meu, achado pelo pytest do usuário (2026-08-16),
      corrigido:** `RESOLUTION_ID_BY_TF = dict(zip(("R1","R2","R3"),
      TIMEFRAMES))` -- `dict(zip(a,b))` usa o 1º argumento como CHAVE;
      escrevi a ordem invertida, produzindo `{"R1":"15m",...}` em vez de
      `{"15m":"R1",...}`, e todo call site (`RESOLUTION_ID_BY_TF[tf]`)
