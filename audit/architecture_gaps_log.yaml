      transientes do tamanho do CHUNK inteiro (não do estado acumulado).
      Com `bars_streaming_chunk_days=30` e a taxa real medida de BTCUSDT
      (3.385.807.729 trades/2.412 dias = 1.403.735 trades/dia,
      `bars.py:76-82`), um chunk de 30 dias tem ~42 milhões de linhas --
      ~2-3GB por cópia, várias cópias coexistindo por chamada de `step()`.
      Sob até 12 processos concorrentes isso soma dezenas de GB -- um
      mecanismo REAL e quantificável dentro de `bars.py`, adicional ao que
      a hipótese original de AG-034 cobria só em termos vagos de "frames
      Polars materializados".

      **[MEDIUM] Schema não podado** -- `chunk`/`combined`/`leftover`
      carregam as 7 colunas de `AGG_TRADES`, só 4 são necessárias
      (`_TRADE_REQUIRED_COLUMNS`, `bars.py:112-117`) -- ~⅓ de bytes/linha
      desperdiçados em toda cópia do mecanismo acima, mitigação direta e
      barata do achado HIGH.

      **[MEDIUM] "`bar_frames` é pequeno" não é universal** -- verdade só
      pro caminho dollar/volume (calibração por divisão direta, `n_bars_
      real ≈ target_n_bars`). Tick imbalance NÃO tem essa garantia (AG-035:
      250x-1000x mais barras que o alvo). Se um orquestrador de produção
      futuro reusar `m2_worker._build_trades_dependent_bars` (constrói os
      3 tipos por chamada, propósito de comparação de M2, não de produção)
      em vez de um caminho dollar-only, o risco de `bar_frames` grande
      reabre -- não é bug em `bars.py`, é risco de reuso indevido, vale
      documentar antes do orquestrador real ser escrito.

      **[MEDIUM] Threshold único global sob volume não-estacionário de 6+
      anos, magnitude não medida na parte mais fria da história** --
      `experiments/dollar_threshold_drift.json` (MEDIDO) já mostra deriva
      de 2,1x-8,9x só entre as 5 janelas de M2 (2022-2026). BTC começa em
      2019-12-31, era de liquidez bem menor, não coberta por nenhuma
      medição existente. Um sub-período de baixa liquidez levaria
      proporcionalmente mais chunks pra fechar 1 barra, durante os quais
      `ThresholdBarsCarry.leftover` (trades brutos) cresce sem teto nem
      circuit breaker. Marcado como HIPÓTESE fundamentada, não confirmado.

      **[MEDIUM] Nenhum sinal diagnóstico pro crescimento de `leftover`,
      nenhuma blindagem fora do DuckDB** -- `m2_worker.py` loga por chunk
      mas nunca loga `carry.leftover.height` (a quantidade que cresce sob
      o achado anterior). Os `try/except duckdb.OutOfMemoryException`
      existentes só cobrem exceção da QUERY -- uma falha de alocação
      dentro de `pl.concat`/`cum_sum`/`np.empty` (pré-alocações do núcleo
      Numba dimensionadas ao tamanho do chunk) não é capturada em lugar
      nenhum, explicando mecanicamente o "9h sem log, sem exceção" já
      observado.

      **Recomendação final -- GO com mitigação, não "tentar de novo às
      cegas" nem só "esperar e medir":** (1) 0 código -- estender
      `measure_dollar_threshold_drift.py` com 1-2 janelas do início real
      da história (2020-01/2020-06), quantifica o achado de threshold
      fixo com dado real antes de qualquer tentativa cara; (2) se/quando
      uma tentativa real acontecer: 1 símbolo por vez (BTC primeiro),
      caminho dollar-only (não reusar `_build_trades_dependent_bars`),
      `bars_streaming_chunk_days` reduzido de 30 pra ~5-7 (já autorizado
      pela proveniência da própria constante); (3) instrumentação de RSS
      real por processo continua sendo o passo humano central, sem
      comando `.py` a rodar da minha parte -- PENDENTE-DE-EXECUÇÃO-HUMANA;
      (4) mudança pequena e localizada recomendada em `bars.py` ANTES da
      próxima tentativa (baixo risco, testável pelos 16 testes existentes):
      podar `chunk`/`combined`/`leftover` pras 4 colunas necessárias +
      logar `carry.leftover.height` por chunk; (5) Opção 3 original de
      AG-034 (descarregar `bar_frames` em disco) NÃO priorizada -- esta
      auditoria reconfirma que `bar_frames` já é pequeno pro caminho
      dollar/volume; se a medição do passo (1)/(3) mostrar que é
      `leftover` (não `bar_frames`) quem cresce, o alvo certo de
      descarregamento incremental é `leftover`, distinção que o texto
      original de AG-034 não fazia. Nenhuma implementação feita nesta
      rodada -- decisão de executar o plano acima é do Manager.
