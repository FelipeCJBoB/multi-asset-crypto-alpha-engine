  - id: AG-032
    date: "2026-08-15"
    file: "src/validation/cpcv.py"
    related_file: "config/constants.yaml::cpcv_embargo_bars/time_stop_bars/feature_c06_vol_ratio_long_window, tests/unit/test_validation_cpcv.py"
    found_by: "Agent (general-purpose), a pedido do Manager -- avaliação de proposta de reclassificação LITERATURE -> DERIVED"
    gap: >
      Proposta de reclassificar `cpcv_embargo_bars` pra DERIVED com base em
      "embargo só precisa cobrir o lookback de feature (96), pois purge já
      cobre o alcance do label" está MECANICAMENTE INCORRETA pro código
      real. `purge_mask` (cpcv.py:383) só atua sobre linhas de treino com
      `t0 <= g_end` -- qualquer linha com `t0 > g_end` NUNCA é purgada,
      porque `t1 > t0` sempre (confirmado por
      `test_generate_splits_embargo_remove_bordas_mesmo_sem_overlap_de_t1`,
      que prova o embargo agindo SEM overlap de `t1`). A fronteira `g_end`
      (cpcv.py:380-381) vem só da partição de `t0` (`assign_time_groups`,
      linhas 161-194) -- nunca referencia o `t1` real das linhas de TESTE,
      que pode esticar até `g_end + time_stop_bars` (32 barras, teto por
      construção). Esse resíduo de até 32 barras após `g_end` fica sem
      cobertura de purge e só é removido pelo embargo. Piso mecânico real
      pro lado direito/frente, dado o código como está: `time_stop_bars`
      (32) + `feature_c06_vol_ratio_long_window` (96) = **128**, não 96.
      175 (atual) ainda cobre com folga de 47 barras (~27%) -- sem
      urgência, mas a fórmula "96 sozinho" subestimaria o piso real em 25%.

      Achado adicional: o lado esquerdo/trás do embargo (`t0 < g_start`,
      cpcv.py:386) NÃO tem derivação mecânica equivalente rastreável --
      continua sendo, na prática, o buffer heurístico original de
      correlação serial (López de Prado, "1% do fold"), não uma fórmula.

      Achado independente, já registrado em `constants.yaml`: a suspeita
      de erro de unidade/TF ("175 barras ~= 88h" só fecha a conta a 30m,
      não a 15m) NÃO é resolvida pela cobertura de lookback -- são duas
      justificativas CONCORRENTES e incompatíveis pro mesmo número: "88h"
      exige escalonar por TF; "128 barras" (`feature_c06` é
      `scaling_invariant: bar_count`, fixo entre TFs) exige NÃO escalonar.
      Reclassificar pra DERIVED trocaria o alvo, não validaria nem
      invalidaria a suspeita original.
    severity: "médio"
    layer: "validation"
    consequence: >
      Nenhum risco imediato -- 175 > 128 com folga. Risco latente: se
      `cpcv_embargo_bars` for reclassificado pra DERIVED com a fórmula
      "96 sozinho" (ou reduzido perto de 96 numa varredura de
      sensibilidade futura, Sprint 10), o piso real (128) seria violado
