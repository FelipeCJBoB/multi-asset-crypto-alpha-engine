      `LeftoverOverflowError` através de `_build_trades_dependent_bars`/
      `compute_trades_dependent_bars_for_symbol_tf` -- 2 testes novos em
      `test_analysis_m2_worker.py`. (3) MEDIUM -- risco de overflow
      silencioso de int64 em `.astype(np.int64)` (a versão anterior usava
      `pl.Series.cast(pl.Int64, strict=True)`, que falha alto; numpy não)
      -- guarda nova antes do cast. (4) MEDIUM -- a prova de paridade
      `np.cumsum`/`pl.cum_sum()` virou leitura de código-fonte sem NENHUM
      teste executável -- teste canário novo compara os dois direto. (5)
      LOW -- caso de borda `new_leftover_size == max_leftover_trades`
