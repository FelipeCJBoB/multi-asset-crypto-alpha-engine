    addendum_manager_aprova_e_fase2_implementada_2026-08-21: >
      Manager: "T=7,C=1 aprovado" -- ordem de execução v2 (`AG-136`,
      `docs/plano_acao_ag124_pos_auditoria_2026-08-21.md` §7) autorizada
      ponta a ponta. Fase 2 (itens 14/15/16) implementada e testada nesta
      sessão:

      **Item 14 (carry através da fronteira)**: `src/data/bars.py` ganha
      `threshold_bars_drain(carry)` (devolve barras fechadas sem tocar
      leftover/base_value/threshold -- ao contrário de `finish`).
      `build_dollar_bars_walkforward` reestruturado: 1 carry único criado
      no 1º período real, reusado (só `threshold`/`max_leftover_trades`
      mudam por período), `drain` a cada período, `finish` só no ÚLTIMO
      -- 1 barra subdimensionada por RODADA inteira, não por período (sob
      `C=7`: ~1 em vez de ~52/ano; sob `C=1`: ~1 em vez de ~365/ano).
      Achado colateral documentado (não escondido): trocar threshold
      entre períodos pode fechar cedo um trade que "estava em progresso"
      sob o threshold antigo -- `cum_value` nunca reseta, `bar_id =
      cum_value // threshold` reinterpreta o histórico acumulado sob o
      threshold novo; nenhum trade perdido/duplicado, só a fronteira
      exata pode mudar (verificado em teste).

      **Item 15 (lead-in buffer)**: mesma mudança de arquivo. TODO
      período tenta calibrar agora, incluindo o 1º -- só a leitura de
      trades pode olhar antes de `start` (nunca a escrita de barras). Só
      descarta (cold-start) quando `calibrate_dollar_threshold_for_
      validation` levanta `ValueError` (sem trade algum na janela --
      início real de histórico, não mais um `if i==0` incondicional).
      Recupera ~1 semana real por símbolo antes perdida sem necessidade.

      **Item 16 (circuit breaker vs. pico ~14x)**: validado, SEM mudança
      de código -- achado principal: "~14x" (razão de volume em DÓLAR/dia)
      e "50x" (`bars_threshold_leftover_safety_multiplier`, multiplicador
      de CONTAGEM DE TRADES) são dimensões diferentes, não comparáveis
      diretamente. Pico de volume sustentado por mais trades de tamanho
      semelhante ao calibrado fecha MAIS barras, não faz leftover crescer.
      O que ameaça `max_leftover_trades` de verdade é mudança de FORMA da
      distribuição (trades muito menores que o calibrado, deslocando
      trades-por-barra além do multiplicador de segurança) -- categoria
      de risco ortogonal ao "~14x" medido. 2 testes sintéticos novos
      confirmam: pico de 14x legítimo passa com folga grande (leftover
      residual ~1/50 do teto); mudança de forma (trades 60x menores)
      dispara `LeftoverOverflowError` corretamente.

      **Testes**: 6 novos (`test_data_bars.py` x4, `test_data_build_
      dollar_bars.py` x2), todos verdes. **Achado colateral corrigido no
      caminho, fora do escopo de AG-124**: `test_models_pipeline_paths.py`
      tinha 4 testes quebrados desde a implementação do AG-032 item 8
      (sessão anterior) -- mesmo bypass já aplicado a 5 testes de
      `test_validation_leakage.py` nunca tinha sido aplicado aqui.
      Corrigido (2 pontos). Suíte completa: 1619 passed (1613 + 6 novos),
      1 skip/2 xfail pré-existentes não relacionados. `banned_patterns
      --strict`/`ruff`/`mypy --strict` limpos em todos os 6 arquivos
      tocados. Detalhe completo: `docs/plano_acao_ag124_pos_auditoria_
      2026-08-21.md` §9.

      Fase 3 (item 11, autocorrelação/curtose sobre barras reais) é o
      próximo passo da ordem autorizada -- ainda não iniciada nesta
      entrada.

    addendum_fase3_item11_achado_curtose_2026-08-21: >
      **Achado real que COMPLICA a decisão já aprovada -- não confirma
      trivialmente `T=7,C=1`.** `tools/diagnostics/measure_dollar_bar_
      return_quality.py` (novo) rodou `build_dollar_bars_walkforward` DE
      VERDADE (dest_root=tempdir descartável, nunca `data/capacity/`)
      sobre amostra real de 30 dias (2026-07-01..2026-07-30), 5 símbolos,
      `T7,C7` vs. `T7,C1`, medindo autocorrelação lag-1 e curtose em
      excesso dos retornos de barra -- as 2 âncoras que faltavam do trio
      do parecer externo (§2.2, dispersão por dia-da-semana já medida no
      item 9).

      Autocorrelação: sem vencedor claro, ambos < 0,035 em módulo pros 5
      símbolos -- diferença sem relevância prática.

      **Curtose: `T7,C1` PIOR que `T7,C7` em 4 dos 5 símbolos, às vezes
      dramaticamente** -- BTCUSDT 5,02→68,49 (13,6x), SOLUSDT
      16,33→31,46 (1,9x), BNBUSDT 15,65→33,94 (2,2x), XRPUSDT
      34,42→56,30 (1,6x); só ETHUSDT inverte (91,38→78,38, T7,C1 um
      pouco melhor). É o OPOSTO do que a métrica de erro de calibração
      (item 9) sozinha sugeria -- `T7,C1` rastreia `dollar_per_day` mais
      de perto, mas produz caudas de retorno MUITO mais pesadas, a
      propriedade que barras por atividade deveriam reduzir (mais perto
      de IID), não piorar.

      Mecanismo plausível (não confirmado com certeza pela amostra de 30
      dias): `T7,C1` recalibra diariamente, reage rápido a picos de
      volume/volatilidade intra-semana, concentrando um movimento grande
      em MENOS barras maiores (o threshold "acompanha" o pico) -- em vez
      de espalhar o mesmo movimento por MAIS barras menores, o que
      `T7,C7` faz por atraso (threshold parado a semana inteira), não
      por desenho. Consistente com `T7,C1` produzir MENOS barras que
      `T7,C7` no mesmo período (1257-1805 vs. 2302-2505).

      Limitação explícita: `T7,C7` só tem 5 eventos de recalibração
      nesta amostra de 30 dias (`n_periods=5`) contra 30 de `T7,C1` --
      pouco pra conclusão definitiva, mas o sinal (mesma direção, 4/5
      símbolos, magnitude não-trivial) é forte o bastante pra registrar
      e levar ao Manager.

      **Trade-off real, não decidido aqui**: `T7,C1` vence decisivamente
      no erro de calibração (item 9, -2,85 a -6,19pp em todos os 5
      símbolos) E perde (na maioria) em curtose (item 11, pior em 4/5,
      até 13,6x pior). Nenhuma métrica domina a outra. Isto muda "travar
      T7,C1" de aprovação sem ambiguidade pra uma escolha consciente de
      trade-off (rastreio de volume mais fiel vs. caudas mais pesadas,
      relevante pra qualquer consumidor downstream sensível a outliers).
      Reportado ao Manager como achado que pode reabrir a decisão já
      aprovada (item 20 do plano de ação) -- NÃO decidido
      automaticamente aqui. Full detail: `docs/plano_acao_ag124_pos_
      auditoria_2026-08-21.md` §10, JSON em `experiments/dollar_bar_
      return_quality_sample.json`.

    addendum_validacao_auditor_curtose_v2_2026-08-21: >
      Manager consultou o auditor (autor do parecer/adendo) sobre o
      achado de curtose acima. 4 pontos da resposta, cada um verificado
      antes de aceitar:

      (1) Curtose dominada por poucas barras extremas em n~1500-2500 --
      ACEITO, conta de mistura de escala reproduzida (minoria de
      variância menor desloca curtose de 3 pra ~3,09, não pra 68).

      (2) Confundidor "5 resets de carry contra 30" -- NÃO confirmado
      como descrito: verificado em código
      (`src/data/build_dollar_bars.py:705,765,783`) que o item 14 (já
      implementado ANTES desta medição rodar) já elimina reset de carry
      por período -- 1 único carry por rodada, 1 só `finish` no fim, pros
      2 candidatos. O auditor parece ter avaliado com modelo mental
      pré-item-14. MAS existe mecanismo relacionado real e irredutível:
      `carry.threshold` muda 5x (T7,C7) vs. 30x (T7,C1) com leftover
      ainda aberto -- já documentado em teste
      (`test_threshold_bars_drain_sobrevive_a_troca_de_threshold_entre_
      periodos`). Não é bug, é o que "cadência" significa.

      (3) Curtose é ferramenta ruim pra este n -- ACEITO (fato
      estatístico estabelecido).

      (4) 3ª âncora nunca rodou sobre barras reais -- corrigido.

      Script reescrito (v2, `tools/diagnostics/measure_dollar_bar_
      return_quality.py`), rodado sobre a mesma amostra:
      `experiments/dollar_bar_return_quality_sample_v2.json`.

      **Excluir as 29 barras de fronteira (1ª de cada período
      não-inicial) é HETEROGÊNEO, não confirma o mecanismo do auditor
      universalmente**: melhora XRP (curtose 56,30->7,00, quase resolve
      sozinho), melhora SOL/BNB moderadamente, mas PIORA BTC/ETH
      (68,49->85,15 e 78,38->104,26) -- os outliers de BTC/ETH NÃO estão
      nas barras de fronteira.

      **Achado novo, não estava no plano -- mecanismo mais preciso e
      melhor sustentado: concentração de volatilidade de horário de
      funding (Binance USDⓈ-M funding 00:00/08:00/16:00 UTC).** As 5
      maiores barras padronizadas de CADA um dos 5 símbolos sob `T7,C1`
      fecham entre 23:18-23:59:59 UTC, sem exceção. Verificado
      quantitativamente pra BTCUSDT: barras fechando nos últimos 10 min
      do dia UTC são 1,99% do total sob `T7,C1` (uniforme esperado
      0,69%, ~2,9x excesso) contra 0,74% sob `T7,C7` (~igual ao
      uniforme, sem excesso). Barras menores (cadência maior) concentram
      o pico de funding em menos barras, produzindo retornos mais
      extremos; barras maiores diluem o mesmo pico. Não é bug do
      pipeline -- é granularidade de barra interagindo com microestrutura
      real de mercado.

      **2 medidas ROBUSTAS (não dominadas por 1-2 outliers) confirmam
      `T7,C1` pior nos 5 símbolos, sem exceção**: índice de cauda de
      Hill (`T7,C1` α=2,55-3,41 vs. `T7,C7` α=4,41-5,17, calculado sobre
      os 5% maiores `|retorno|`) e CV de barras-por-dia-da-semana sobre
      barras reais (`T7,C1` 0,49-0,77 vs. `T7,C7` 0,36-0,51, MAIOR
      dispersão sob `T7,C1`, oposto do esperado).

      **Síntese**: hipótese específica do auditor (confundidor de carry)
      não se sustenta -- já corrigida antes da medição rodar. Mas
      substituir curtose por medidas robustas não faz o achado
      desaparecer -- acha um achado DIFERENTE e melhor sustentado (Hill +
      CV semanal, ambos robustos, ambos unânimes nos 5 símbolos, com
      mecanismo causal identificado e verificado). **Pesa MAIS contra
      travar `T7,C1` do que o achado frágil original.** Ainda não
      decidido -- Manager precisa escolher entre travar `T7,C7`, travar
      `T7,C1` conscientemente do trade-off, ou testar candidato
      intermediário (`T7,C2`/`T7,C3`). Full detail: `docs/plano_acao_
      ag124_pos_auditoria_2026-08-21.md` §11.

    addendum_RETRATACAO_teste_decisivo_2026-08-21: >
      **O addendum anterior (Hill+CV "confirmam T7,C1 pior de forma
      robusta") NÃO SE SUSTENTA -- retratado, não apagado (histórico
      preservado acima).** Segunda rodada com o auditor: aceitou a
      correção do item 14, mas reformulou o confundidor -- não é
      "reset", é a semântica de troca de threshold com barra em aberto
      (documentada agora, não mais indefinida -- ver `src/data/build_
      dollar_bars.py::build_dollar_bars_walkforward`), rodando 6x mais
      vezes no braço `C=1` (30 vs. 5). Propôs teste decisivo: se a
      concentração em 23:5x fosse funding (00h/08h/16h UTC), apareceria
      nos 3 horários, nos 2 braços.

      **Teste decisivo executado, BTCUSDT**: pré-00h `T7,C7`=1,06x
      `T7,C1`=2,86x (excesso só em C1); pré-08h `T7,C7`=0,87x
      `T7,C1`=0,80x (SEM excesso, nenhum dos 2); pré-16h `T7,C7`=1,75x
      `T7,C1`=1,26x (excesso leve, MAIOR em C7 -- direção oposta).
      **Refuta microestrutura de funding genérica** -- só pré-00h mostra
      o padrão assimétrico. Confirma a leitura do auditor (fronteira de
      calibração), refuta a minha (funding).

      **Redefinição de fronteira (janela de ~1h em torno de 00h UTC, não
      só a flag estreita "1ª barra do período") + reexecução sobre
      Hill, não só curtose, nos 5 símbolos**: excluir essa janela
      (menos de 4% das barras) faz a curtose colapsar pra perto de zero
      NOS 2 BRAÇOS (ex. BTCUSDT: C7 5,02->0,18, C1 68,49->2,50) E o Hill
      CONVERGE entre braços (ambos ficam 4,1-6,1, contra o 2,5-3,4 vs.
      4,4-5,2 que parecia diferença estrutural robusta). **O auditor
      estava certo: Hill e curtose não eram confirmações independentes,
      liam a mesma janela contaminada** (~30 barras/braço sob C=1 contra
      ~5 sob C=7, cardinalidade grande o bastante pra atravessar
      qualquer estimador, robusto ou não).

      **O achado "T7,C1 tem cauda estruturalmente mais pesada" (addendum
      anterior) NÃO FICA REGISTRADO COMO CONFIRMADO.** Vira observação
      pendente de desconfundir: por que retornos na janela 23:30-00:30
      UTC são desproporcionalmente extremos, mais sob C=1 (2,86x) que
      C=7 (~uniforme), mas presentes em algum grau nos 2 braços -- causa
      raiz NÃO isolada (candidatos: efeito residual da transição de
      threshold mais amplo que só a 1ª barra; fenômeno real de mercado
      na virada de dia UTC; possível conexão com `AG-120`, desalinhamento
      de timestamp nunca totalmente investigado -- item 13/B0 do plano).

      **Decisão, seguindo a recomendação do auditor sem alteração**:
      `T=7,C=1` NÃO travado. `T=7,C=7` fica candidato PROVISÓRIO -- não
      porque a evidência contra `C=1` esteja estabelecida (não está),
      mas porque `C=1` exercita 6x mais um caminho de código só agora
      formalizado, e sua vantagem (item 9) vive numa métrica cujo corte
      nunca passou por sweep (M1). `T7,C2`/`T7,C3` REJEITADOS --
      interpolar entre 2 braços cuja diferença não está explicada não
      informa nada. Semântica de troca de threshold documentada em
      código (determinística, testada, já não "não trivial"). Full
      detail: `docs/plano_acao_ag124_pos_auditoria_2026-08-21.md` §12.

    addendum_terceira_rodada_M1_redux_e_residual_2026-08-21: >
      3ª rodada com o auditor, 4 pontos: (1) leitura mais fina do teste
      decisivo -- pré-08h abaixo de 1x nos 2 braços, pré-16h maior em
      C7 (direção oposta), só pré-00h separa por 2,7x -- conclusão
      revisada: NÃO é uma explicação única, são 2 mecanismos sobrepostos
      (efeito modesto de virada de dia, presente nos 2 braços + amplificação
      por transição de threshold, concentrada no braço de 30 transições).
      (2) Teste decisivo restante (tamanho/duração de barra na janela
      23:30-00:30 vs. resto do dia, por braço) -- RESULTADO MISTO: tamanho
      (quote_volume) praticamente igual dentro/fora da janela nos 2
      braços; duração maior na janela nos 2 braços, proporcionalmente
      MAIOR em C7 (+49%) que C1 (+21%) -- oposto do que "amplificação só
      em C1" prediria. Inspeção das 5 barras mais extremas de C1
      individualmente: assinaturas MISTAS -- 1 barra com quote_volume a
      0,20x da mediana (assinatura de transição), 2 barras com tamanho
      normal mas duração 2,5-3,2x maior (assinatura de mercado real) --
      confirma que os 2 mecanismos coexistem, não são hipóteses
      excludentes. (3) Conexão AG-120 x janela de meia-noite -- já
      respondida no addendum anterior de AG-120: desalinhamento real é
      2026-05-04, 04:06-04:08 UTC, fora da janela por ~4h, evento único
      (não recorrente como o achado de curtose) -- confirmado
      INDEPENDENTE, B0 não precisa de redesenho. (4) M1 redux -- sweep
      original (item 6) testou o corte 2x/0,5x sobre a grade ACOPLADA
      (T=C), nunca especificamente sobre T7,C7 vs. T7,C1 (a comparação
      que decide a aprovação). Refeito nos 3 cortes (2,0/0,5, 1,7/0,6,
      2,5/0,4), 5 símbolos: C1 vence C7 em TODAS as 15 combinações,
      sem exceção nem inversão de sinal -- a vantagem de C1 no erro de
      calibração NÃO é artefato do corte. M1 passa -- não muda a decisão
      de travar C7 provisório (motivo continua sendo a semântica de
      transição, não dúvida sobre M1), mas fecha a verificação pendente.
      Item "documentar semântica" reconfirmado como já travado -- teste
      já asserta valores exatos derivados à mão (característica, não
      checagem frouxa). Full detail: `docs/plano_acao_ag124_pos_
      auditoria_2026-08-21.md` §14.

    addendum_quarta_rodada_contagem_transicao_2026-08-21: >
      4ª rodada com o auditor: (1) argumentou que M1 passar remove um
      dos 2 pilares do "provisório" (semântica caracterizada + M1 robusto
      = os 2 motivos originais caíram), propondo a medição final que
      faltava -- contar, entre as 29-30 transições de threshold da
      amostra (T7,C1), quantas produzem barra com `quote_volume < 0,5x`
      a mediana; se poucas, custo estrutural de C=1 seria desprezível.
      (2) Releu 14.2 como "mercado dominante, contaminação minoritária
      de transição" (1/5 barras extremas com assinatura de transição,
      2/5 com assinatura de mercado), não um empate entre mecanismos.

      **Medição rodada -- resultado na direção OPOSTA à esperada pelo
      auditor.** Contagem real, 5 símbolos, 29 transições cada (amostra
      de 30 dias): BTCUSDT 12/29 (41,4%), ETHUSDT 20/29 (69,0%), SOLUSDT
      12/29 (41,4%), BNBUSDT 16/29 (55,2%), XRPUSDT 17/29 (58,6%) --
      **41-69% de TODAS as transições produzem barra subdimensionada,
      não "poucas".** A barra de 0,20x achada antes (inspeção das 5
      maiores por retorno) não era um caso raro dentro de uma amostra
      dominada por mercado -- é uma amostra pequena de um fenômeno que,
      medido sobre as 29 transições completas, é comum, quase
      majoritário em alguns símbolos (ETH 69%).

      **Não decide sozinho que o mecanismo de transição CAUSA a curtose**
      (barra subdimensionada não implica automaticamente retorno maior
      -- esse elo não foi medido aqui, só a frequência do subdimensiona-
      mento). Mas decide a pergunta que o próprio auditor fez: o custo
      estrutural de `C=1` em FREQUÊNCIA não é desprezível -- é uma
      propriedade regular do desenho sob recalibração diária, não um
      acidente raro. Pela régua que o próprio auditor propôs ("se forem
      poucas, decisão inclina pra C1"), o resultado inclina na direção
      contrária -- reforça, não remove, a cautela sobre `C=1`.

      **`T=7,C=7` continua candidato PROVISÓRIO -- motivo atualizado**
      (não mais "caminho não caracterizado", que de fato caiu com a
      semântica documentada+testada, nem "corte não varrido", que caiu
      com M1): agora é "custo de transição de `C=1` é frequente
      (41-69% das recalibrações produzem barra subdimensionada), elo
      exato com o achado de curtose não isolado -- não é escolha entre
      2 opções com diferença pequena, como pareceu por um momento após
      M1 passar."

    addendum_correcao_taxa_base_e_elo_com_retorno_2026-08-21: >
      **Correção ao addendum anterior -- a formulação "propriedade
      regular do desenho de C=1" era mais forte do que a medição
      sustentava.** Auditor apontou (corretamente) que 41-69% pode ser a
      taxa-base de QUALQUER fronteira de recalibração (resíduo no
      instante de corte é aproximadamente uniforme sob um processo de
      acumulação por threshold, então ~50% de barras de corte abaixo de
      0,5x da mediana é esperado mesmo sem nada patológico) -- não uma
      severidade específica de `C=1`. Propôs 2 controles, ambos rodados:

      **Controle A (taxa por evento em `C=7`, n=4 transições/símbolo)**:
      BTCUSDT 50%, ETHUSDT 50%, SOLUSDT 50%, BNBUSDT 75%, XRPUSDT 25% --
      média ~50%, igual à taxa de `C=1` (41-69%). **Confirmado: a taxa
      de subdimensionamento por evento NÃO difere entre os braços --
      não é defeito de `C=1`, é propriedade de qualquer fronteira.**

      **Controle B (barras não-fronteira)**: 0,0-0,6% subdimensionadas
      nos 2 braços -- o corte 0,5x separa fronteira de normal de
      verdade, não está mal calibrado em geral.

      **Mas o elo com retorno extremo, que faltava medir (o outro lado
      do fork que o próprio auditor definiu -- "ou se mede o elo... ou
      se trava C=1"), foi medido e é REAL e ASSIMÉTRICO entre os
      braços**, diferente da taxa de subdimensionamento (que é
      simétrica). Retorno |z| médio, barra de fronteira vs. barra
      normal: sob `C=1` (n=29/símbolo) -- BTCUSDT 2,0x, ETHUSDT 2,7x,
      SOLUSDT 1,6x, BNBUSDT 2,7x, XRPUSDT 3,3x (fronteira SEMPRE mais
      extrema, 5/5 símbolos). Sob `C=7` (n=4/símbolo, mais ruidoso mas
      direção consistente) -- BTCUSDT 0,16x, ETHUSDT 0,08x, SOLUSDT
      0,42x, BNBUSDT 0,02x, XRPUSDT 0,25x (fronteira SEMPRE MENOS
      extrema que o normal, 5/5 símbolos, direção oposta).

      **Síntese, sobrevive aos 2 controles**: a taxa de subdimensionamento
      por evento é base (igual nos 2 braços) -- não é defeito de `C=1`.
      Mas a CONSEQUÊNCIA em retorno de um evento de fronteira não é base
      -- é específica de `C=1` (elevada, 5/5 símbolos) e ausente/invertida
      em `C=7` (5/5 símbolos). Cautela sobre `C=1` não se apoia mais em
      "evento raro e talvez inofensivo, só mais frequente" -- se apoia em
      frequência de evento (7,25x mais, 29 vs. 4) MULTIPLICADA por uma
      consequência de retorno que é real e específica do braço, agora
      medida, não presumida. `T=7,C=7` continua candidato PROVISÓRIO --
      motivo final desta rodada (4ª formulação, cada vez mais precisa):
      "C=1 gera 7,25x mais eventos de transição; a taxa de
      subdimensionamento por evento é equivalente entre braços (não é
      defeito de C=1), mas o retorno associado a um evento de fronteira é
      1,6-3,3x maior que o normal sob C=1 (5/5 símbolos) e menor sob C=7
      (5/5 símbolos, n pequeno) -- frequência × consequência de retorno
      específica do braço, ambas medidas, não presumidas."

    addendum_correcao_confundimento_amostral_e_desfecho_final_2026-08-21: >
      **Correção crítica ao addendum anterior -- a comparação "fronteira
      C=1 vs. fronteira C=7" estava confundida com hora-do-dia, e o
      auditor identificou os 2 problemas amostrais antes de eu aceitar
      os números.** (1) As 4 fronteiras de `C=7` são os MESMOS 4
      instantes de calendário nos 5 símbolos -- cripto correlaciona
      fortemente no mesmo minuto, então "5/5 símbolos concordam" sob
      `C=7` é ~n=4, não 5 réplicas independentes. (2) Sob `C=1`,
      "fronteira" e "meia-noite" são quase o MESMO conjunto (29 das 30
      meia-noites são fronteira); sob `C=7`, fronteira é 1 em 7
      meia-noites -- então comparar "fronteira C=1" contra "fronteira
      C=7" (só 4 das 30 meia-noites) escondia o efeito de hora-do-dia já
      confirmado no turno 14 (excluir a janela 23:30-00:30 colapsa
      curtose NOS DOIS BRAÇOS) atrás de uma subamostragem desigual.

      **Teste decisivo proposto pelo auditor, executado**: comparar
      `|z|` médio de TODAS as barras que fecham na janela 23:30-00:30
      (não só as 4/29 flagadas como "fronteira") contra o resto do dia,
      nos 2 braços, mesma janela, amostra muito maior (n=71-103/braço,
      não mais n=4):

      | símbolo | razão C=7 (janela/resto) | razão C=1 (janela/resto) |
      |---|---:|---:|
      | BTC | 1,20x | 2,25x |
      | ETH | 1,53x | 1,86x |
      | SOL | 1,09x | 1,63x |
      | BNB | 1,34x | 1,81x |
      | XRP | 1,17x | 1,99x |

      **Resultado: o efeito de hora-do-dia É REAL e aparece nos 2
      braços** (`C=7` 1,09-1,53x, sempre >1) -- confirma a hipótese do
      auditor, os números anteriores (0,02-0,42x "invertido" pra `C=7`)
      estavam confundidos por amostra pequena e não-representativa, NÃO
      REFLETEM a realidade -- retratados, não usados na decisão. **Mas
      `C=1` mostra elevação CONSISTENTEMENTE MAIOR que `C=7` na MESMA
      janela, nos 5 símbolos, sem exceção** (incremento de `C=1` sobre
      `C=7` na mesma janela: BTC 1,88x, ETH 1,22x, SOL 1,50x, BNB 1,35x,
      XRP 1,70x). **Os 2 mecanismos são reais simultaneamente**: efeito
      de hora-do-dia (base, presente nos 2 braços) + amplificação de
      transição (incremento específico de `C=1`, sobre a mesma base) --
      confirma a leitura original do turno 14 (§14.1) com números agora
      corretos e não-confundidos, não a leitura intermediária (turno
      anterior) que atribuía toda a elevação à transição.

      **Desfecho final da linha de investigação estatística**: o elo
      transição↔retorno é real mas MENOR do que o addendum anterior
      media (confundido) -- ainda assim positivo e unânime nos 5
      símbolos. Não decide sozinho a escolha de cadência.

      **O que decide, per reformulação do auditor (nível de sistema, não
      estatística de cauda)**: contagem de eventos em que a barra viola o
      próprio invariante que define uma dollar-bar (tamanho determinado
      por troca de threshold com acumulação em voo, não por volume) --
      `C=7` ≈52/ano/símbolo, `C=1` ≈365/ano/símbolo, contagem sem
      ambiguidade. Mais 3 argumentos qualitativos, não dependentes de
      medição adicional: (a) **tipo de erro** -- `C=7` erra de forma
      SUAVE (threshold um pouco desatualizado, absorvido por feature
      normalizada por ATR); `C=1` erra de forma DISCRETA (linha
      individual anômala, nada absorve, ~92 features planejadas/79 não
      escritas ainda não sabem quais são sensíveis a isso); (b)
      **assimetria de estar errado** -- sem métrica de sucesso final
      registrada (confirmado), escolher `C=7` errado é reversível e
      barato (rastreamento pior, corrige no próximo reprocessamento);
      escolher `C=1` errado significa 7x mais artefatos gravados em 6
      anos × 5 símbolos, herdados por tudo a jusante, concentrados
      possivelmente na cauda onde risco olha -- descobrir depois custa
      reprocessar tudo de novo; (c) **superfície de paridade
      lote↔streaming ao vivo** -- cada transição é um ponto onde o loop
      ao vivo (`src/live/` ainda vazio) precisa reproduzir exatamente a
      fronteira do backtest; `C=1` multiplica por 7x os pontos onde job
      atrasado/janela incompleta/restart no horário errado diverge
      grade backtest↔produção, no artefato mais fundamental do sistema.

      **`T=7,C=7` -- decisão final desta linha de investigação, não mais
      "provisório por motivo em aberto"**: preferido por evidência
      estatística parcial (elo real mas modesto) E por 3 argumentos de
      engenharia de sistema independentes da estatística (contagem de
      violação de invariante, tipo de erro, assimetria de custo de estar
      errado, superfície de paridade ao vivo) -- decisão fica com o
      Manager formalizar, mas a linha de investigação de cadência está
      concluída. Full detail: `docs/plano_acao_ag124_pos_auditoria_
      2026-08-21.md` §17.

      **Padrão registrado, não específico desta decisão** (pedido
      explícito do auditor): quando 2 parâmetros são amarrados (aqui,
      `trailing_window_days == cadence_days` até o desacoplamento desta
      sessão), toda verificação feita sobre "o parâmetro" fica ambígua
      sobre qual dos dois foi de fato verificado -- 2ª ocorrência
      confirmada nesta MESMA investigação (a métrica de erro de
      calibração original nunca tinha sido varrida especificamente para
      `T7,C7` vs. `T7,C1`, só para a grade acoplada `T=C`, `M1 redux`
      acima) além da 1ª (o próprio achado de aliasing semanal recaindo
      só sobre `trailing_window`, não sobre `cadence`, addendum de
      desacoplamento). Vale como heurística geral pra revisão futura de
      qualquer par de parâmetros historicamente acoplado neste projeto.

      Full detail: `docs/plano_acao_ag124_pos_auditoria_2026-08-21.md`
      §15.

