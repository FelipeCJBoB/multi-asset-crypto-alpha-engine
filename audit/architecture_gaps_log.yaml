      pelo próprio teste de regressão escrito nesta mesma leva -- prova de
      que o teste tem dente, não só cobertura de linha.

      **Bug PRÉ-EXISTENTE, não meu, exposto no caminho:** `commit f0bd28c`
      (M2, antes desta leva) deu `start`/`end` obrigatórios a `m2_worker.
      _query_baseline` e atualizou o fake de só 1 dos 3 testes que a
