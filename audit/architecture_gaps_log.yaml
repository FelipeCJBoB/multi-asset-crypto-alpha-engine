      entrada exigia. Deliberadamente NÃO implementado (B23 -- decisão já
      tomada, não inventar threshold sem medir): a ressalva de MAGNITUDE
      do proxy p99 (2ª metade do `addendum_v3` acima) -- o proxy foi
      medido/justificado pro modelo de custo de PREFETCH, não pro de
      PURGE, e não há guarda de runtime nem medição do máximo real de
      janela de 96 barras consecutivas. Revisão independente
      (`project_assurance`, 2026-08-23) confirma que isso segue real e
      sem mitigação em código -- ver `AG-181`/docstring de
      `compute_max_feature_lookback_ms`. **Não fechar esta entrada como
      `resolved_by_commit` até a guarda de runtime (ressalva 4) existir ou
      o máximo real ser medido (ressalva 3)** -- o bug de UNIDADE original
      que esta entrada nomeia está corrigido, mas o risco de fundo (purge
      sub-protegido silenciosamente) só é mitigado quando essa ressalva
