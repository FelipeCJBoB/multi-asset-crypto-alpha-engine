      precisa (sub-cobertura = vazamento, B02/B09) -- `max_ms` real de
      SOLUSDT/R3 chega a ~6x o `p99` usado. Design doc propõe fórmula
      corrigida + verificação adicional (agregar máximo real de janela de
      96 barras consecutivas sobre os parquets já persistidos, sem
      medição nova) + guarda de runtime (`structlog.warning` quando o
      lookback calculado for menor que o máximo medido, uma vez essa
      medição existir). Nenhuma linha implementada ainda -- Fase 4, só
      desenho. Ver `docs/regime_feature_engine_design_doc_2026-08-23.md`
      D-02 pro texto completo.

    addendum_implementacao_2026-08-23: >
      Componente de UNIDADE implementado (commit `6902352`, 2026-08-23):
      `compute_max_feature_lookback_ms` ganhou `resolution_id` -- quando
      setado, usa `label_prefetch_p99_bar_duration_ms` em vez de
      `step_ms(tf)`. Os DOIS call sites (`pipeline.py:427`,
