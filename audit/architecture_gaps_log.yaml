      numérico", mas o JSON serializado muda, logo o hash muda. Os labels
      reais de produção (`b281a18954e224ef`) foram gerados ANTES dessas
      migrações e nunca foram reprocessados -- fato já citado em
      `docs/SPRINT_LOG.md` (achado D3, "config_hash idêntico ao anterior,
      b281a18954e224ef") como o hash "estável" de referência, sem que
      ninguém tivesse notado que ele predatava o schema atual porque
      nenhum caller comparava os dois antes de `AG-140`.

      **Decisão do usuário** (`AskUserQuestion`, 3 opções: reprocessar
      agora / reverter a checagem / registrar e escalar): reprocessar
