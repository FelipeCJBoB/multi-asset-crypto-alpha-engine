      for construído, ele herda o mesmo erro de design do AG-096/AG-108
      caso implemente o gate "por linha" em vez de "por símbolo". Ação
      recomendada: quando esse motor for especificado, a correção
      arquitetural deste AG-108 (LineState/SymbolExposure separados)
      precisa valer para ele também, carimbada no design doc antes do
      1º commit -- não é um bloqueio ativo hoje.
      Achado irmão sobre K01 (`src/risk/kill_switch.py:102-108`,
