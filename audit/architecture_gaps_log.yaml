  - id: AG-035
    date: "2026-08-16"
    file: "src/analysis/m2_worker.py"
    related_file: "src/data/bars.py, config/constants.yaml::bars_tick_imbalance_ewma_floor"
    found_by: "Manager pediu investigação do achado M2 (tick imbalance falhando em 5/5 janelas, ver aba M2 da Biblioteca de Testes) -- causa raiz encontrada por leitura de código, não suposição."
    gap: >
      CAUSA RAIZ CONFIRMADA -- `tick_imbalance` produz 250x-1000x mais
      barras que o alvo calibrado, nas 5 janelas, nos 5 ativos, nos 3 TFs,
      sem exceção. Exemplo real (BNBUSDT 15m, janela LUNA): alvo (mesmo do
      baseline `time`) = 2.976 barras; `tick_imbalance` real = 969.263 --
      325x mais. Isso, não "tick imbalance é estruturalmente ruim pra
      cripto", explica o JB/Ljung-Box=0% e a unicidade ~300x menor
      (painel 05 da aba M2): com 325x mais barras no mesmo intervalo de
      relógio, cada barra fica minúscula (maioria quase degenerada) e a
      janela de concorrência fixa (`time_stop_ms`) passa a sobrepor
      centenas de barras em vez de poucas.

      Mecanismo (`src/data/bars.py::_tick_imbalance_loop`, lido linha a
      linha): uma barra fecha quando `abs(theta) >= exp_num_ticks *
      max(abs(ewma_b), ewma_floor)`. `m2_worker._build_tick_imbalance_
      config` calibra `exp_num_ticks_init = n_ticks / target_n_bars` --
      MESMA fórmula usada pra dollar/volume bars (fechar após consumir um
      nº fixo de ticks/volume/$). Mas tick imbalance bars NÃO fecham após
      consumir `exp_num_ticks` ticks -- fecham após acumular `exp_num_ticks
      × |ewma_b|` de DESEQUILÍBRIO LÍQUIDO, onde `ewma_b` é a EWMA (janela
      de 10.000 ticks, `bars_tick_imbalance_expected_imbalance_window`) do
      sinal de agressor (+1/-1) por tick. Pra qualquer mercado sem
      imbalance persistente forte no nível de tick individual (cripto
      líquida entra nessa categoria -- cada trade é ~cara-ou-coroa entre
      comprador/vendedor agressor na maior parte do tempo), `|ewma_b|`
      fica bem abaixo de 1 em regime estável -- estimativa empírica pelo
      exemplo acima: ~1/325 ≈ 0,003 (0,3% de desequilíbrio líquido médio
      por tick). A fórmula de calibração da task NUNCA leva isso em conta
      -- implicitamente assume `|imbalance|≈1` sempre, o que só seria
      verdade se todo tick fosse na mesma direção.

      `bars_tick_imbalance_ewma_floor=1e-12` (constants.yaml) NÃO é a
      causa -- seu único propósito documentado (`bars.py` linha 514-523) é
      evitar `close_threshold` EXATAMENTE zero (guarda de divisão por
      zero), não prover um piso significativo. `ewma_b` nunca chega perto
      de 1e-12 no estado estável (fica na casa de 1e-3 a 1e-2, como
      esperado de mercado balanceado) -- o floor nunca é o fator ativo,
      confirmado lendo a lógica de atualização (`ewma_b = alpha_imbalance *
      b_i + (1-alpha_imbalance) * ewma_b`, `alpha_imbalance=2/10001`).
    severity: "alto"
    layer: "analysis/data"
    consequence: >
      A conclusão publicada na aba M2 da Biblioteca de Testes ("tick
      imbalance falha sistematicamente") está tecnicamente correta sobre O
      QUE foi medido, mas a LEITURA "tick imbalance bars não servem pra
      este universo de ativos" seria uma inferência não sustentada -- o
      que foi medido é uma calibração quebrada da harness de M2, não o
      método em si. Nenhuma decisão de descartar tick imbalance como
      candidato deveria se apoiar neste resultado até a calibração ser
      corrigida e remedida.
    resolved_by_commit: null
    resolution: >
      NÃO IMPLEMENTADO -- diagnóstico completo, fix não escrito ainda
      (decisão do Manager: só investigar foi pedido nesta rodada). Caminho
      de correção mais direto: `_build_tick_imbalance_config` precisaria
      estimar `|imbalance|` esperado (via passe de amostragem sobre uma
      fração do período, medindo `ewma_b` real observado) em vez de
      assumir `exp_num_ticks_init = n_ticks/target_n_bars` diretamente --
      mesma disciplina de "medir, não estipular" já aplicada em outros
      pontos do projeto. Fora de escopo desta entrada decidir se vale a
      pena consertar e remedir M2, ou se o achado fica documentado como
      limitação conhecida da harness (custo: reprocessar as 5 janelas de
      novo, ~10min cada pela experiência real desta sessão).
    status: >-
      FECHADO 2026-08-16 pelo Manager -- decisão explícita de não
      corrigir/remedir. `canonical_bar_type=dollar` já foi decidido
      independente disso, e a vitória de dollar sobre TEMPO (baseline
      real) não depende de tick_imbalance estar calibrado certo. Risco
      aceito, não esquecido: fica sem resposta se tick_imbalance
      recalibrado bateria dollar -- tick_imbalance continua descartado
