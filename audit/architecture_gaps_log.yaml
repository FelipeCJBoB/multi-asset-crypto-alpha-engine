  - id: AG-121
    date: "2026-08-20"
    file: "src/regime/canonicalization.py::canonicalize_states; docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §3.4 Cláusula 2 (Parte I do parecer completo)"
    related_file: "PRD_V4_1.md §3.2 M4; src/validation/regime_utility.py::identify_stress_state_by_volatility (AG-114, workaround já em produção)"
    found_by: "Claude, verificando o ADR-001 completo (Partes I/II, ~1900 linhas, colado pelo Manager nesta sessão como docs/ADR-001_..._base.md) antes de implementar AG-118 -- achado real de leitura, não hipotético"
    gap: >
