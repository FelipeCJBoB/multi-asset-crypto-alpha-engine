    file: "src/labels/triple_barrier.py (linhas 152-165, 1000: horizon_end_ms = t0 + cfg.time_stop_ms, incondicional mesmo sob resolution_id/dollar-bar)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §3.1 cláusula 1, §4.3; audit/architecture_gaps_log.yaml::AG-031; PRD_V4_1.md §2.7 I2/§3.2 M1/§4.2"
    found_by: "Manager, auditoria do desenho técnico de labels em ADR-001 vs. PLANO_MESTRE"
