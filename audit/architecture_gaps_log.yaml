      não-temporal, a PRÓPRIA comparação de estimadores do M1 (rodada só
      sobre barras de tempo) pode não ser válida no novo espaço, não só
      "precisar rodar de novo". Isso não muda a decisão de adiar (mesma
      conclusão), muda O QUE precisa ser reconfirmado quando M2 fechar --
      não só "os labels", a ranking de estimador em si.

