  - id: AG-110
    date: "2026-08-20"
    file: "PLANO_MESTRE_PRINCE2.md §15.11 (AG-099, mecanismo revisado 'encurtar time_stop')"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §1.4 problema 1; src/labels/triple_barrier.py (time_stop_ms=28.800.000, 8h)"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B) -- mesmo padrão de ponto cego identificado pelo próprio parecer: a Rodada 1 interna refutou 'apertar o stop' com um argumento de execução e o substituto aprovado não reaplicou o mesmo invariante"
    gap: >
      O mecanismo revisado de AG-099 (encurtar o horizonte máximo de
      holding sob regime de stress, em vez de apertar o SL) repete, numa
      camada diferente, o defeito estrutural da versão refutada:
      M_long/M_short foi treinado sobre rótulos com time_stop=8h fixo --
      p = P(toca TP antes de SL, dentro de 8h). Se o motor encurta esse
      horizonte ao vivo sob stress, ele usa p de UM evento (barreira 8h)
      pra decidir OUTRO evento (barreira mais curta) -- não é
      aproximação, é troca de variável aleatória. A calibração (p_cal)
      deixa de valer, e Brier score é uma das condições de entrada do
      Meta -- passaria a ser medido contra uma distribuição que não é a
      operada. O efeito é assimétrico (TP=2.0/SL=1.5 -- a barreira de
      perda é tocada mais cedo em média) e o sinal do efeito líquido é
      desconhecido sem medição.
    severity: "alto"
    layer: "labels / meta-model -- paridade treino-live quebrada no rótulo, não no código de execução"
    consequence: >
      Adotar o gatilho revisado sem correção repete o erro que a Rodada
      1 interna já tinha corrigido uma vez, só que deslocado pro rótulo
      em vez do preço. Correção proposta: se o horizonte é condicional a
      regime ao vivo, ele precisa ser condicional a regime NO RÓTULO --
      horizon_bars(regime_t0) vira parâmetro da geometria de rotulagem,
      o modelo é retreinado sobre esses rótulos, e o "gatilho ao vivo"
      vira aplicação da mesma regra que gerou o rótulo (não um ajuste
      arbitrário em produção). Sequência recomendada antes de qualquer
      parâmetro: (1) extrair, de rótulos já existentes, a distribuição
      empírica de tempo-até-primeira-barreira condicional a regime
      (custo ~zero, é um groupby); (2) medir barras/hora por regime
      (parte do efeito de "encurtar sob stress" já pode ser grátis,
      porque dollar bars sob volume alto chegam mais rápido em tempo de
      relógio); (3) só então decidir se sobra efeito suficiente pra
      justificar horizon_bars(regime) na geometria de rotulagem.
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre relabeling condicional a regime antes de adotar o gatilho K15 (AG-099)"

  - id: AG-111
    date: "2026-08-20"
    file: "PLANO_MESTRE_PRINCE2.md §15.11 (AG-098, convenção de contagem de trials pra seleção de linha)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19.md §1.3; audit/n_lifetime.yaml; src/validation/dsr.py"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B)"
    gap: >
      A convenção aprovada em AG-098 (cada (symbol, resolution_id)
      avaliada = 1 trial, sempre, independente de promoção) corrigiu a
      circularidade original mas tem dois problemas residuais. (1)
      Sobre-contagem por correlação: contar 15 linhas como 15 trials
      ignora que o DSR deveria deflacionar pelo número EFETIVO de
      trials independentes -- com correlação equicorrelacionada entre
      símbolos da ordem de rho~=0,8 (BTC-ETH medido ~0,94, altcoins
      tipicamente >0,7 com BTC, convergindo pra 1 sob stress) e as 3
      resoluções do mesmo símbolo ainda mais redundantes entre si,
      N_eff = N/(1+(N-1)*rho) fica da ordem de 2, não 15 -- contar 15
      deixa o DSR conservador demais e pode matar edge real. (2)
      Resíduo de circularidade: n_trials continua sendo a CARDINALIDADE
      DA RODADA -- se a próxima rodada incluir um 16º par, o DSR de
      toda linha JÁ PROMOVIDA muda retroativamente (mesma família do
      problema original, não a mesma instância). (3) N_lifetime foi
      descomissionado como orçamento vinculante (AG-077) e nada o
      substituiu -- a convenção define como contar um número que hoje
      não bloqueia nada.
    severity: "alto"
    layer: "validation -- DSR/multiple-testing, seleção de linha"
    consequence: >
      Correção proposta em 3 partes: (a) n_trials vitalício e
      cumulativo via trial_registry append-only (um arquivo por trial,
      produto automático do pipeline, não ledger manual digitado --
      substitui N_lifetime sem reintroduzir o problema "mal implementado
      desde o começo"); (b) N_eff CALCULADO por decomposição espectral
      sobre as séries de retorno OOS do registry (Li & Ji 2005, somando
      autovalores substituindo por 1 os maiores que 1 -- determinístico,
      sem hiperparâmetro), não contado manualmente; (c) gate primário de
      promoção deixa de ser só DSR e passa a incluir PBO/CSCV (já
      recomendado em AG-098 item 5 como não-bloqueante -- este achado
      eleva a urgência: PBO mede overfitting sem depender de contagem de
      trials). O critério estrutural de AG-098 (backtest novo = 1 trial)
      continua válido e é preservado -- é o que torna o pré-filtro de
      custo (AG-113) gratuito no orçamento de multiplicidade.
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre implementar trial_registry + N_eff espectral antes da primeira rodada de seleção de linha"

