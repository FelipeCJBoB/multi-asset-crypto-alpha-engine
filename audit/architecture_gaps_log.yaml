  - id: AG-039
    date: "2026-08-16"
    file: "audit/n_lifetime.yaml"
    related_file: "PLANO_MESTRE_PRINCE2.md:1164-1165,1421-1423, config/constants.yaml (13 constantes classe A ASSUMED), CLAUDE.md (Regra de proveniência #4)"
    found_by: "Agent Project Assurance (revisão independente), pergunta prioritária 3."
    gap: >
      Não existe definição a priori de quando uma varredura de sensibilidade
      ±50% de constante classe A conta como 1 trial (bloco) vs. N trials (1
      por ponto testado). Confirmado por leitura direta: o repo
      institucionaliza isso como "decisão do Manager caso a caso" em duas
      citações literais (`PLANO_MESTRE_PRINCE2.md:1164-1165` e `:1421-1423`),
      não como fórmula. O relatório original (docs/refactor_dollar_bar_
      canonico.md §5.4) cita só o precedente `n_lifetime.yaml` id 11
      (70 candidatas em bloco, 1 trial) a favor de "expandir o vetor T1 não
      consome N_lifetime", sem mencionar `id 10` (grade 3×3×2 lados = 18
      trials, N-trials) como contraponto -- e nenhum dos dois é literalmente
      o caso que vai ocorrer (sweep de `time_stop_bars`/`cpcv_embargo_bars`/
      threshold de dollar bar).
    severity: "baixo"
    layer: "governance"
    consequence: >
      Risco de subestimar o custo em `N_lifetime` de um sweep específico no
      momento em que ele de fato for declarado e rodado. **Correção do
      Manager, 2026-08-16 (mesmo dia):** isto NÃO é orçamento em risco
      agora — as 13 constantes citadas já têm `review_by` (sprint) em
      `config/constants.yaml`, cada sweep só roda (e só custa trial) no
      sprint agendado; ver `PLANO_MESTRE_PRINCE2.md` §11.4 (Road Map Vivo,
      novo). Severidade rebaixada de MEDIUM pra LOW por isso -- a
      ambiguidade de processo (1 trial vs. N) continua real, mas não é
      urgente enquanto nenhum sweep estiver de fato em execução.
    resolved_by_commit: null
    resolution: >
      IMPLEMENTADO 2026-08-16 — Manager autorizou fechar. Regra registrada em
      `audit/n_lifetime.yaml` (cabeçalho): N trials = nº de combinações que
      exigem ajuste de modelo/backtest novo por ponto (precedente id 10, grade
      3×3 = 18); 1 trial = passe de ranking/triagem sem reajuste por candidata,
      independente da contagem (precedente id 11, 70 candidatas = 1). Sweep de
      sensibilidade ±50% classe A segue a mesma régua: delta = nº de pontos
      testados SE cada ponto disparar retreino/backtest novo; delta=1 se lido
      de artefato já existente sem reajuste. Regra é a priori (declarada antes
      de qualquer sweep agendado em §11.4 rodar de verdade) — não retroativa
      aos ids 1-15 já registrados, que mantêm seu delta original.
    status: "FECHADO 2026-08-16 -- convenção registrada em audit/n_lifetime.yaml, autorizada pelo Manager"

