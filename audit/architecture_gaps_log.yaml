      projeto (`PRD_V3_2_UNIFICADO.md` §9.1, linhas 1700-1727) é
      ASSIMÉTRICA por desenho, não uniformemente post-only: só a ENTRADA
      é `LIMIT/GTX/on_timeout=CANCEL` (nunca vira mercado). O STOP-LOSS é
      `STOP_MARKET/working_type=MARK_PRICE/reduce_only` -- ordem
      condicional nativa da Binance que, uma vez disparada, executa como
      MARKET (taker, execução garantida). O TIME_STOP é `MARKET
      reduce_only` explícito (também garantido). O TAKE_PROFIT é
      `LIMIT/GTC/reduce_only` (maker, pode não encher -- mas se não
      encher, a posição sai via TIME_STOP, que É garantido). Confirmado
      também no código real: `src/labels/triple_barrier.py` já
      implementa essa assimetria de custo (comentário 8, "SL e TIME caem
      no mesmo ramo `else` porque os dois exigem execução garantida via
      ordem agressiva") -- a Label Engine em PRODUÇÃO já assume esse
      desenho, não é uma proposta nova. Economia já quantificada em
      `PRD_V3_2_UNIFICADO.md` §0.3/linha 3369/3450: "Execução maker
      assimétrica... breakeven 53,4% -> 48,1%".
