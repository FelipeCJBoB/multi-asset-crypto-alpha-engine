  - id: AG-109
    date: "2026-08-20"
    file: "PRD_V3_2_UNIFICADO.md (política de execução -- maker post-only GTX, cancela no timeout, nunca converte a mercado)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §1.4 problema 2, §5 item 1; src/labels/triple_barrier.py (tp_atr_mult=2.0/sl_atr_mult=1.5)"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B)"
    gap: >
      A política de execução declarada do projeto é maker post-only
      (GTX), cancela no timeout, NUNCA converte a mercado. Uma ordem GTX
      que cruzaria o book é rejeitada/expira, não executa. Isso não
      afeta só o gatilho de proteção (AG-099/D) -- afeta o STOP-LOSS do
      próprio triple-barrier: os rótulos assumem que tocar sl_px
      significa sair a sl_px, mas sob post-only sem conversão a mercado,
      tocar sl_px significa que o preço atravessou o nível enquanto a
      ordem passiva ficava do lado errado do movimento. A geometria de
      payoff inteira (tp_atr_mult=2.0/sl_atr_mult=1.5/time_stop=8h)
      descreve uma estratégia que a política de execução declarada não
      consegue executar como rotulada.
    severity: "crítico"
    layer: "labels / execução -- premissa de saída executável nunca verificada contra a política de execução real"
    consequence: >
      Toda a cadeia de payoff (labels, pesos, calibração, meta-model,
      breakeven de custo) assume uma saída que pode não existir na
      prática -- é premissa, não feature, e não depende de nenhuma
      medição pra ser decidida. Recomendação, ordens de magnitude mais
      barata: admitir reduceOnly a mercado para SAÍDAS (manter
      post-only só para ENTRADAS) -- assimetria padrão de prática maker
      (paciente pra entrar, impaciente pra sair), custo adicional de
      ~3bps/perna (taker 0,05% vs maker 0,02%) contra o risco de perda
      de cauda ilimitada por não conseguir sair. Alternativa mais cara:
      relabelar assumindo saída passiva com modelo de fila (ret_net
      condicional a fill). Item de maior severidade de todo o ADR, e
      anterior a qualquer decisão sobre o gatilho D.
    resolved_by_commit: null
    resolution: >
      REFUTADO 2026-08-20, ver AG-115. Achado deste entry generalizou a
      política de ENTRADA (GTX post-only) pra toda a política de
      execução, incluindo SAÍDAS -- erro de leitura do auditor externo,
      que não tinha acesso ao repositório real (nota de escopo do
      próprio ADR-001). Verificado contra PRD_V3_2_UNIFICADO.md §9.1
      (linhas 1700-1727) e o código real (`src/labels/triple_barrier.py`,
      comentário 8): a política já é ASSIMÉTRICA -- SL usa
      `STOP_MARKET`/`working_type: MARK_PRICE` (garantido, taker), TIME
      usa `MARKET reduce_only` (garantido, taker); só a ENTRADA é
      GTX-nunca-mercado. Ou seja, a recomendação "admitir reduceOnly a
      mercado pra saídas" já É o desenho vigente -- não decisão nova,
      implementação já existe na Label Engine desde antes deste parecer.
      Consequência prática: `src/exchange/adapter.py::place_order`
      continua `NotImplementedError` (nenhum código de execução real
      ainda existe), mas o trabalho que falta é IMPLEMENTAR uma decisão
      já tomada, não decidir algo novo -- este item deixa de ser
      prioridade 1 do Road Map Vivo.
    status: "fechado -- refutado, ver AG-115 (achado do auditor externo generalizou política de ENTRADA pra toda a execução; SL/TIME já são taker-garantido no desenho real)"

  - id: AG-110
    date: "2026-08-20"
    file: "PLANO_MESTRE_PRINCE2.md §15.11 (AG-099, mecanismo revisado 'encurtar time_stop')"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §1.4 problema 1; src/labels/triple_barrier.py (time_stop_ms=28.800.000, 8h)"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B) -- mesmo padrão de ponto cego identificado pelo próprio parecer: a Rodada 1 interna refutou 'apertar o stop' com um argumento de execução e o substituto aprovado não reaplicou o mesmo invariante"
    gap: >
      O mecanismo revisado de AG-099 (encurtar o horizonte máximo de
      holding sob regime de stress, em vez de apertar o SL) repete, numa
      camada diferente, o defeito estrutural da versão refutada:
      M_long/M_short foi treinado sobre rótulos com time_stop=8h fixo --
      p = P(toca TP antes de SL, dentro de 8h). Se o motor encurta esse
      horizonte ao vivo sob stress, ele usa p de UM evento (barreira 8h)
      pra decidir OUTRO evento (barreira mais curta) -- não é
      aproximação, é troca de variável aleatória. A calibração (p_cal)
      deixa de valer, e Brier score é uma das condições de entrada do
      Meta -- passaria a ser medido contra uma distribuição que não é a
      operada. O efeito é assimétrico (TP=2.0/SL=1.5 -- a barreira de
      perda é tocada mais cedo em média) e o sinal do efeito líquido é
      desconhecido sem medição.
    severity: "alto"
    layer: "labels / meta-model -- paridade treino-live quebrada no rótulo, não no código de execução"
    consequence: >
      Adotar o gatilho revisado sem correção repete o erro que a Rodada
      1 interna já tinha corrigido uma vez, só que deslocado pro rótulo
      em vez do preço. Correção proposta: se o horizonte é condicional a
      regime ao vivo, ele precisa ser condicional a regime NO RÓTULO --
      horizon_bars(regime_t0) vira parâmetro da geometria de rotulagem,
      o modelo é retreinado sobre esses rótulos, e o "gatilho ao vivo"
      vira aplicação da mesma regra que gerou o rótulo (não um ajuste
      arbitrário em produção). Sequência recomendada antes de qualquer
      parâmetro: (1) extrair, de rótulos já existentes, a distribuição
      empírica de tempo-até-primeira-barreira condicional a regime
      (custo ~zero, é um groupby); (2) medir barras/hora por regime
      (parte do efeito de "encurtar sob stress" já pode ser grátis,
      porque dollar bars sob volume alto chegam mais rápido em tempo de
      relógio); (3) só então decidir se sobra efeito suficiente pra
      justificar horizon_bars(regime) na geometria de rotulagem.
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre relabeling condicional a regime antes de adotar o gatilho K15 (AG-099)"

  - id: AG-111
    date: "2026-08-20"
    file: "PLANO_MESTRE_PRINCE2.md §15.11 (AG-098, convenção de contagem de trials pra seleção de linha)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §1.3; audit/n_lifetime.yaml; src/validation/dsr.py"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B)"
    gap: >
      A convenção aprovada em AG-098 (cada (symbol, resolution_id)
      avaliada = 1 trial, sempre, independente de promoção) corrigiu a
      circularidade original mas tem dois problemas residuais. (1)
      Sobre-contagem por correlação: contar 15 linhas como 15 trials
      ignora que o DSR deveria deflacionar pelo número EFETIVO de
      trials independentes -- com correlação equicorrelacionada entre
      símbolos da ordem de rho~=0,8 (BTC-ETH medido ~0,94, altcoins
      tipicamente >0,7 com BTC, convergindo pra 1 sob stress) e as 3
      resoluções do mesmo símbolo ainda mais redundantes entre si,
      N_eff = N/(1+(N-1)*rho) fica da ordem de 2, não 15 -- contar 15
      deixa o DSR conservador demais e pode matar edge real. (2)
      Resíduo de circularidade: n_trials continua sendo a CARDINALIDADE
      DA RODADA -- se a próxima rodada incluir um 16º par, o DSR de
      toda linha JÁ PROMOVIDA muda retroativamente (mesma família do
      problema original, não a mesma instância). (3) N_lifetime foi
      descomissionado como orçamento vinculante (AG-077) e nada o
      substituiu -- a convenção define como contar um número que hoje
      não bloqueia nada.
    severity: "alto"
    layer: "validation -- DSR/multiple-testing, seleção de linha"
    consequence: >
      Correção proposta em 3 partes: (a) n_trials vitalício e
      cumulativo via trial_registry append-only (um arquivo por trial,
      produto automático do pipeline, não ledger manual digitado --
      substitui N_lifetime sem reintroduzir o problema "mal implementado
      desde o começo"); (b) N_eff CALCULADO por decomposição espectral
      sobre as séries de retorno OOS do registry (Li & Ji 2005, somando
      autovalores substituindo por 1 os maiores que 1 -- determinístico,
      sem hiperparâmetro), não contado manualmente; (c) gate primário de
      promoção deixa de ser só DSR e passa a incluir PBO/CSCV (já
      recomendado em AG-098 item 5 como não-bloqueante -- este achado
      eleva a urgência: PBO mede overfitting sem depender de contagem de
      trials). O critério estrutural de AG-098 (backtest novo = 1 trial)
      continua válido e é preservado -- é o que torna o pré-filtro de
      custo (AG-113) gratuito no orçamento de multiplicidade.
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre implementar trial_registry + N_eff espectral antes da primeira rodada de seleção de linha"

  - id: AG-112
    date: "2026-08-20"
    file: "src/risk/sizing.py (a implementar -- Risk Engine, quantização de lote)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §4.2"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B -- achado não coberto por nenhum dos dois briefs originais)"
    gap: >
      Nenhum documento do projeto menciona minNotional/stepSize por
      símbolo. Dados medidos ao vivo (2026-08-19): BTCUSDT
      stepSize=0,001 BTC = 69,26 USDT/step; SOLUSDT stepSize=0,01 SOL =
      0,85 USDT/step -- ~24x de diferença de granularidade de risco
      entre os dois símbolos mais/menos granulares (1 step de risco =
      0,19% de equity em BTC vs. 0,008% em SOL, capital R$1.000=193
      USDT). Com risco-alvo 0,65%/trade e stop 1,5xATR, o notional
      necessário em BTC (~239 USDT) cai numa grade de só ~3,45 steps --
      erro de até +-15% no alvo de risco, contra precisão quase
      contínua em SOL/XRP. Um backtest que assume sizing contínuo não é
      reproduzível ao vivo em BTC, e a diferença de granularidade entre
      símbolos é um VIÉS SISTEMÁTICO a favor dos símbolos de grade fina
      numa rodada de seleção de linha, não uma diferença de edge real.
    severity: "alto"
    layer: "risk / execução -- quantização de lote ausente da comparação entre linhas"
    consequence: >
      Sem quantização aplicada ANTES da decisão (calcular qty factível,
      recalcular o risco real dessa qty, só então aprovar/rejeitar -- e
      o backtest replicando exatamente o mesmo código), a seleção de
      linha mede parcialmente granularidade de lote, não só edge.
      Adicionalmente: sob stress (ATR~1,2%), a posição BTC MÍNIMA já
      consome ~0,65% de equity por stop -- ~3 stops de tamanho mínimo
      esgotam o teto diário de 2%, e não existe tamanho menor. Risk
      Engine precisa de um estado explícito "símbolo intratável no
      orçamento atual" (hoje inexistente -- comportamento atual seria
      rejeição no envio pela própria exchange, a pior forma de
      descobrir isso).
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre priorizar quantização de lote no Risk Engine antes da 1a rodada de seleção de linha"

  - id: AG-113
    date: "2026-08-20"
    file: "audit/n_lifetime.yaml (pré-filtro de custo, ainda não executado)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §2.6, §5 item 3; config/constants.yaml (E27f_cost_atr_ratio)"
    found_by: "Auditoria externa (ADR-001, parecer sobre a Trilha B)"
    gap: >
      n_eff (amostra rotulada independente) é aproximadamente T/H
      (histórico / horizonte da barreira vertical) e é INVARIANTE à
      resolução do dollar bar -- rodar em R1 (mais rápida) não dá mais
      amostra efetiva que rodar em R3 (mais lenta), só mais linhas na
      tabela. O que a resolução de fato compra/destrói é o HURDLE DE
      CUSTO: win-rate de breakeven p* = (sl_mult+c)/(tp_mult+sl_mult),
      com c em unidades de ATR. Com TP=2,0/SL=1,5 e o custo/ATR medido
      de 19,4% (E27f_cost_atr_ratio, 2026), p*~=48,4% em R1; a mesma
      geometria numa resolução ~4x mais lenta (ATR escala ~raiz(4)=2x)
      devolve p*~=45,6% -- 2,8pp de hurdle de graça. Esse pré-filtro
      (c(símbolo,resolução) = custo_bps/ATR_bps pras 15 linhas) é
      aritmética sobre dado já existente, não exige rótulo nem backtest
      novo -- pela própria convenção AG-098, conta como 1 trial (passe
      de ranking que reusa artefato), não 15.
    severity: "médio"
    layer: "arquitetura de pesquisa -- sequenciamento da 1a rodada de seleção de linha"
    consequence: >
      Oportunidade, não bug: rodar o pré-filtro de custo antes de
      investir engenharia em gerar histórico de rótulo pras 3
      resoluções x 5 símbolos pode eliminar a maior parte do espaço de
      busca de graça, antes de qualquer backtest custoso. Responde
      também à decisão pendente #6 de §15.11 (resoluções lentas agora
      ou só a rápida) -- recomendação: gerar histórico de rótulo pra
      resolução mais LENTA também (não só a rápida, que tem o pior
      hurdle), rodar R1+R3 primeiro (pula R2 -- interpolação, só decide
      algo se R1/R3 divergirem em direção).
    resolved_by_commit: null
    resolution: null
    status: "aberto -- decisão do Manager sobre rodar o pré-filtro de custo antes de comprometer engenharia às 3 resoluções"

  - id: AG-114
    date: "2026-08-20"
    file: "src/analysis/m4_regime_comparison.py (_anova_or_degenerate, teste de heterogeneidade de forward_return)"
    related_file: "docs/ADR-001_arquitetura_artefatos_e_contratos_2026-08-19_base.md §2.7 (ratificado, PLANO_MESTRE_PRINCE2.md §15.12); docs/m4_regime_auditoria_externa_2026-08-19_validacao_cruzada.md (lista 'fix mecânico' -- separação de volatilidade futura, occupancy, transition failure rate, detection delay); src/regime/regime_utility.py (só median_duration_bars/switch_rate/n_segments hoje)"
    found_by: "Manager, ao perguntar 'qual futuro o Regime vai atender' logo após ratificar o ADR-001 -- síntese entre a decisão de arquitetura (regime = gate, não feature) e o critério estatístico já usado pra escolher candidato de regime no M4"
    gap: >
      A metodologia da Trilha A/M4 avalia os 6 candidatos de regime por
      heterogeneidade do RETORNO médio futuro do Alpha entre buckets de
      regime (Welch's F/omega^2 sobre forward_return, h=1) -- isso mede
      utilidade como FEATURE preditiva. O ADR-001, agora ratificado
      (§2.7), decide que regime NÃO entra como feature do Meta/Alpha na
      v1 -- fica exclusivamente como GATE de risco, e um gate "não
      precisa prever, precisa evitar": não exige significância
      estatística de retorno, exige identificar corretamente períodos
      de risco de cauda elevado. O resultado nulo generalizado do M4
      (18/18 p-valores 0,30-0,85) prova que nenhum candidato é útil
      como FEATURE de retorno -- mas essa deixou de ser a pergunta que
      decide promoção, porque a arquitetura ratificada já decidiu que
      regime não vai ocupar esse papel na v1. A pergunta que decide
      promoção agora (heterogeneidade de VOLATILIDADE/risco de cauda
      futura entre buckets, occupancy do estado de stress, taxa de
      falso-positivo de transição, delay de detecção) nunca foi medida
      -- e já está catalogada, com precedente de literatura verificado,
      na lista "fix mecânico" da validação cruzada do M4: "separação de
      volatilidade futura -- só retorno é testado hoje, apesar do
      regime ser construído com log_return_1 E realized_vol_short, só
      metade é validada"; "effective_number_of_states/occupancy por
      estado"; "transition failure rate (N=3/5/10)"; "detection delay
      vs. eventos econômicos independentes".
    severity: "alto"
    layer: "regime / validation -- critério de avaliação do M4 desalinhado do papel de consumo já ratificado pela Trilha B"
    consequence: >
      M4 não pode ser encerrado com "resultado nulo, nenhum candidato
      serve" a partir só do teste de retorno -- isso responde a
      pergunta errada pro papel que regime de fato vai ter (gate).
      Antes do veredito final de M4 (congelar metodologia + locked
      holdout, já planejado em docs/m4_regime_plano_execucao.md),
