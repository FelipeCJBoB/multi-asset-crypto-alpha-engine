# audit/n_lifetime.yaml
#
# Ledger de trials vitalício — §16.10.2 M5. O DSR (§11.6) usa `counter`, não o N
# de uma busca isolada. Incrementa em: cada constante classe B otimizada, cada
# retreino, cada challenger, cada emenda ao pré-registro (§16.9), cada
# experimento §9.5.1 (RPI vs post-only). NÃO decrementa nunca — trial gasto é
# gasto mesmo que a variante perca.
#
# Regra de edição: só se acrescenta ao final de `log`. Nunca editar ou remover
# uma entrada já registrada — isso é o próprio objeto que o ledger existe para
# impedir.

schema_version: 1
counter: 5

log:
  - id: 1
    date: "2026-08-08"
    type: timeframe_search
    description: >
      Mudança de timeframe de decisão 5m → 1h, na elaboração do PRD V2/V3
      (histórico da conversa que produziu o blueprint, anterior a este repo).
    delta: 1
  - id: 2
    date: "2026-08-08"
    type: timeframe_search
    description: "Mudança de timeframe de decisão 1h → 30m."
    delta: 1
  - id: 3
    date: "2026-08-08"
    type: timeframe_search
    description: >
      Mudança de timeframe de decisão 30m → 15m (escolha a priori do PRD V3.2,
      §0.4, com base em ATR medido sobre amostra de 8 meses — ela própria P2,
      a refazer no Sprint 3).
    delta: 1
  - id: 4
    date: "2026-08-09"
    type: new_confidence_definition
    description: >
      Faixa 1.5, Bloco 4 — `confidence_rank` (percentil do score cru
      intra-fold) adicionado a `predictions.parquet` como definição nova de
      confiança, ao lado de `confidence` (calibrado) já existente. Não
      recalibra sobre OOF empilhado, não ajusta calibrador nenhum — mas é
      uma variante de definição de sinal (§5.12), variante de modelo pelo
      critério de M5.
    delta: 1
  - id: 5
    date: "2026-08-09"
    type: monotonic_constraint_variant
    description: >
      Faixa 1.6, Bloco 4 — retreino dos 15 folds x 2 lados da Camada 1 com a
      restrição forçada de `E02f_funding_z_expanding` REMOVIDA só do short
      (`unforce_features_by_side`, parâmetro aditivo novo em
      `src.models.monotonic`/`src.models.alpha`, default `None` em produção
      — `alpha_c1_v1`/`alpha_c0_baseline_v1` intocados). Model_id novo
      `alpha_c1_e02f_short_unforced_v1`, artefatos persistidos
      (predictions.parquet + diagnostics/) sem substituir nenhum existente.
      `directional_sharpe` pooled caiu de 0,879 (baseline atual, os dois
      lados forçados) para 0,282 — a maior parte do ganho do T0 vinha do
      short, não do long, apesar de o Bloco 5 da Faixa 1.6 ter medido que a
      triagem estatística quase nunca confirmaria essa restrição sozinha
      (1/15 folds com unanimidade). Variante de modelo pelo critério de M5.
    delta: 1

# Nota de proveniência do seed: os 3 trials acima reconstroem o histórico
# citado em §18.6 M5 e §18.7 item 9 do PRD ("já há trials gastos"). É uma
# reconstrução parcial, não um registro contemporâneo — o histórico completo
# anterior a este repo (V2 → V3.0 → V3.1 → V3.2) não é auditável linha a linha.
# Tratar `counter` como PISO, não como valor exato.
