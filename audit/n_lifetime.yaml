# audit/n_lifetime.yaml
#
# Ledger de trials vitalício — §16.10.2 M5. O DSR (§11.6) usa `counter`, não o N
# de uma busca isolada. Incrementa em: cada constante classe B otimizada, cada
# retreino, cada challenger, cada emenda ao pré-registro (§16.9), cada
# experimento §9.5.1 (RPI vs post-only). NÃO decrementa nunca — trial gasto é
# gasto mesmo que a variante perca.
#
# Regra de edição: só se acrescenta ao final de `log`. Nunca editar ou remover
# uma entrada já registrada — isso é o próprio objeto que o ledger existe para
# impedir.
#
# Regra de contagem — 1 trial em bloco vs. N trials (AG-039, fechado
# 2026-08-16). Não havia fórmula declarada até aqui, só "decisão do Manager
# caso a caso" (PLANO_MESTRE_PRINCE2.md:1164-1165/1421-1423) — o log já
# demonstrava a distinção na prática (id 10 vs. id 11 abaixo), só nunca
# generalizada. Regra explícita, extraída do próprio precedente:
#
#   N trials = nº de combinações de parâmetro que exigem um AJUSTE DE MODELO
#   OU RECÁLCULO DE BACKTEST novo por combinação (cada ponto é uma decisão
#   testada contra dado real). Exemplo: id 10 — grade tp_atr_mult x
#   sl_atr_mult, 3x3 por lado = 18 combinações, cada uma resolvendo a
#   barreira de novo -> delta=18.
#
#   1 trial = passe de RANKING/TRIAGEM que reusa um artefato já ajustado
#   (nenhum modelo novo treinado, nenhum backtest novo por candidata) —
#   conta como 1 INDEPENDENTE do nº de candidatas comparadas. Exemplo:
#   id 11 — 70 candidatas rankeadas por ortogonalidade incremental sobre
#   correlação já computada, "nenhum modelo retreinado" -> delta=1.
#
#   Sweep de sensibilidade ±50% de constante classe A (§16.10 regra 4,
#   obrigatório antes do Gate 3) segue a mesma régua: se cada ponto do sweep
#   (ex. -50%/baseline/+50%) dispara um retreino/backtest novo, delta = nº de
#   pontos testados; se o sweep é lido de um backtest/modelo já existente sem
#   reajuste, delta=1. Aplica-se aos sweeps já agendados em §11.4 (Sprint 5/6/
#   10/11/16) no momento em que cada um de fato rodar.

# ============================================================================
# DESCONTINUADO como orçamento vinculante -- 2026-08-17, decisão do Manager
# ("pode descontinuar, não nos será útil pra esse projeto, foi mal
# implementado desde o começo"). O ledger continua existindo como registro
# HISTÓRICO (append-only preservado, nada abaixo foi apagado/editado -- mesma
# disciplina de sempre) mas `counter` deixa de bloquear trabalho em
# `PLANO_MESTRE_PRINCE2.md` §11.4/§11.6 (M4/V41-6/V41-7/V41-10 não ficam mais
# presas por `counter > 60`).
#
# Consequência real, NÃO resolvida por esta descontinuação sozinha:
# `PRD_V4_1.md` §6.1 usa `N_lifetime` como insumo direto da fórmula de DSR
# (piso de significância cresce com N) e §6.5 critério de encerramento #5
# ("N_lifetime > 60 sem Camada 2 fechada -> encerrar") depende deste contador
# -- `src/validation/dsr.py`/`src/analysis/faixa2_dsr_and_b2_check.py` leem
# `counter` de verdade (`_audited_n_lifetime()`). Descontinuar o CONTADOR sem
# decidir o que substitui a penalidade de multiple-testing no cálculo de DSR
# deixa o Gate 6 (V41-12) e o critério #5 sem definição operacional --
# registrado como `audit/architecture_gaps_log.yaml::AG-077`, decisão
# pendente do Manager (não inventada aqui, é decisão estatística/de
# governança que não é do Claude tomar sozinho).
# ============================================================================

