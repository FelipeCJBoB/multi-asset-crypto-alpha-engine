  ancoragem_defeito: null
  nome_engana: null
  veredito: SEM_MECANISMO
  observacao: 'MECANISMO DISPONÍVEL E NÃO RECLAMADO: sob dollar bar o denominador de volume
    é CONSTANTE por construção, então TR_t/C_{t-1} é literalmente ''variação de preço por
    dólar negociado'' = impacto de preço / iliquidez de Amihud (ou λ de Kyle discretizado).
    Isso seria uma tese real, com contraparte identificável (quem consome liquidez paga o
    impacto). O repo NÃO declara isso em lugar nenhum — registry, docstring e constants.yaml
    tratam A11 como ''true range percentual''. Veredito segue SEM_MECANISMO (não se credita
    tese não escrita), mas esta é a candidata mais barata de promover a TESE_OK do grupo A.'
- feature: A12_gap_pct
  formula_resumida: (O_t - C_{t-1}) / C_{t-1}
  memoria_efetiva_barras: 2
  memoria_justificativa: 'toca O_t e C_{t-1}. Mas o CONTEÚDO não é 2 barras de informação:
    as barras são partição CONTÍGUA do fluxo de trades (src/data/bars.py::_aggregate_bars
    — open = price.first() do bar_id, close = price.last() do anterior), então O_t é o preço
    do trade IMEDIATAMENTE seguinte ao último trade de t-1. A saída é um retorno de 1 TICK,
    não um gap.'
  h_sobre_H: 0.4
  papel: ruido
  mecanismo_economico: AUSENTE
  quem_esta_do_outro_lado: AUSENTE
  ancoragem: misto
  ancoragem_defeito: 'O mecanismo do ''gap'' é de RELÓGIO/CALENDÁRIO — exige descontinuidade
    de sessão (fechamento overnight, fim de semana, leilão de abertura), onde ordens se acumulam
    sem poder executar e o preço salta na reabertura. Cripto USDⓈ-M negocia 24/7 e as barras
    são partição contígua do MESMO fluxo de trades: não existe intervalo entre C_{t-1} e O_t
    em que ordens se acumulem. A feature aplica um mecanismo de fronteira de sessão sobre
    uma fronteira de CONTAGEM DE BARRAS que, neste mercado, não tem nenhum significado de
    calendário. Erro categórico na direção espelhada do caso canônico.'
  nome_engana: null
  veredito: ERRO_CATEGORICO
  observacao: 'Consequência mensurável e barata de checar: a distribuição de A12 deve ser
    ~um tick_size/preço (BTC: ~1,5e-6), com massa enorme em 0 e sem cauda. Se A12 tiver variância
    comparável a A01, isso denuncia buraco de dado (trades faltando entre barras), não sinal
    — nos dois casos a feature não mede o que o nome diz.'
