- feature: A11_true_range_pct
  formula_resumida: TR_t / C_{t-1}, TR = max(H-L, |H-C_{t-1}|, |L-C_{t-1}|)
  memoria_efetiva_barras: 2
  memoria_justificativa: TR toca a barra t e C_{t-1}; sem suavização. Memória = 2 = lookback_bars.
  h_sobre_H: 0.4
  papel: gatilho
