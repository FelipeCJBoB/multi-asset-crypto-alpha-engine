# audit/feature_thesis/fichas_69_2026-08-25.yaml
#
# Ficha de tese de cada coluna do vetor de features (T1 + T2 promovidas,
# AG-207). Uma ficha por coluna: memoria efetiva REAL da saida (nao o
# lookback_bars declarado), papel na grade, mecanismo economico e
# ancoragem fluxo x relogio.
#
# CALIBRACAO USADA (medida, nao estipulada):
#   duracao mediana da barra (BTCUSDT): R1=9,43 R2=19,73 R3=41,16 min
#   holding H = 5 barras (mediana medida nas 3 grades, p80 ~13,6-14,0)
#   H e invariante em BARRAS -> para janela fixa em barras, h/H e invariante
#   bandas: ruido <0,1H | gatilho 0,25-1,0H | confirmacao 1-4H |
#           regime 4-20H | quase-constante >20H
#
# METODO: 3 auditorias independentes por grupo (A+B, C+D, E+K), mesma
# rubrica. Os achados mais graves foram REVERIFICADOS por execucao direta
# nesta sessao antes de virar AG -- ver AG-263.
#
# LEITURA DO CAMPO : precedencia
#   ERRO_CATEGORICO > INCOERENTE_DIMENSIONAL > SEM_MECANISMO > TESE_OK

- feature: A01_log_return_1
  formula_resumida: ln(C_t / C_{t-1})
  memoria_efetiva_barras: 1
  memoria_justificativa: retorno de 1 barra; memória = lag = 1. Bate com lookback_bars=1.
    É o piso de memória possível numa série em barras.
  h_sobre_H: 0.2
  papel: gatilho
  mecanismo_economico: Autocorrelação de curto prazo (momentum de curto horizonte), categoria
    de mecanismo reconhecida na literatura de microestrutura — persistência de fluxo de ordens
    (execução fatiada tipo VWAP/TWAP gera continuação na mesma direção) e subreação a informação
    nova. Emenda ADR-005 §14.2/AG-329, 2026-08-27 — reconhecimento de categoria da literatura
    geral, não medição própria deste motor.
  quem_esta_do_outro_lado: Provedor de liquidez que absorve o fluxo de ordens persistente
    (formador de mercado compensado pelo risco de inventário assumido) ou trader mais
    lento/desinformado que ainda não reagiu à mesma informação que já move o fluxo.
  ancoragem: fluxo
  ancoragem_defeito: null
  nome_engana: null
  veredito: TESE_OK
  observacao: Sob dollar bar 1 barra é ~9,4 min de MEDIANA, mas a dispersão de duração é o
    próprio regime — o mesmo valor de A01 significa coisas diferentes em rajada e em estiagem,
    sem nenhum termo que carregue essa informação. EMENDA 2026-08-27 (AG-329, formalizando
    ADR-005 §14.2) — mecanismo_economico/quem_esta_do_outro_lado atualizados para refletir a
    justificativa já decidida no ADR (momentum de curto prazo é categoria reconhecida na
    literatura), que antes só existia na prosa do ADR, nunca na ficha; veredito SEM_MECANISMO
    para TESE_OK. Isso NÃO é evidência estatística de sinal real — o diagnóstico de poder
    (AG-327, 2026-08-27) mostra que o eixo 1 tem poder alto mesmo para IC pequeno, e esta
    coluna continua com 0-1 símbolo de descoberta no eixo 1 (AG-294); a leitura mais provável
    é mecanismo genérico da literatura, não confirmado para este motor especificamente.
    Permanece L3 (em observação), não promovida a L2.
