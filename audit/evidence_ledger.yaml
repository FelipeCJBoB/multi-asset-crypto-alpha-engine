    (BTC -0,029 / ETH -0,023 / BNB -0,062 / XRP -0,051 / SOL -0,016) e
    POSITIVO em R2 nos 5 (todos > 0) e em R3 nos 5 (todos > 0) --
    monotonico R1<R2<R3 em TODOS os 5 simbolos do lado long. Lado short
    NAO mostra o mesmo padrao (ETHUSDT/BNBUSDT/XRPUSDT pioram de R1 pra
    R2 antes de melhorar em R3) -- consistente com o short raramente
    passar o gate economico em qualquer resolucao (1/12 nao-nulas,
    achado independente do Manager). Evidencia direta, sem experimento
    novo, de que o custo/frequencia de R1 corroi especificamente a borda
    LONG, nao o lado short (que ja nao tem borda pra corroer).
    (3) Cruzamento observacional (nao causal) capacidade x concentracao:
    as 5 celulas SEM calibracao propria (caem no hiperparametro global,
    num_leaves=8) tem TODAS mean_n_eff_factors_t1 > 4,5; das 10 celulas
    COM calibracao (num_leaves 2-3 em quase todas, ADR-005 Sec13.12), 8
    tem mean_n_eff_factors_t1 < 3 -- so BTCUSDT_R1/R2 (calibradas) fogem
    do padrao com N_eff alto. Suporta a hipotese de teto de capacidade
    (nao falta de valor incremental das 15 promovidas) ANTES de rodar o
    sweep controlado de num_leaves/max_depth ja proposto -- nao substitui
    o sweep causal, mas justifica priorizar-lo.

