- id_curto: geometria-de-barreira-nao-fecha-o-buraco-2026-09-04
  fase: 'Mapa de features pos-multi-seed (item 1 da ordem recomendada ao Manager, 2026-09-04)'
  symbol: 'os 5 candidatos (BTCUSDT/R2, SOLUSDT/R2, SOLUSDT/R3, XRPUSDT/R2, XRPUSDT/R3)'
  tf: 'R2 e R3 (grades canonicas dollar-bar)'
  janela: 'labels/v1 completo, reconstruido sob AG-432'
  lado: 'ambos (populacao INCONDICIONAL -- nao a que o Alpha dispara, ressalva ja registrada no design doc do S1)'
  regime: all
  feature_ou_filtro: 'sweep S1 de geometria (tp_atr_mult/sl_atr_mult) na grade R x S declarada a priori, 7 celulas admissiveis'
  metrica_tipo: 'edge liquido estimado por trade (bps) = edge_bruto_atr x ATR_mediano_bps - custo fixo, com custo = round_trip_cost_bps (5,52) + selecao adversa media (2,25) = 7,77 bps'
  metrica_valor: >
    NENHUMA das 7 celulas da grade produz expectancia positiva, em nenhum dos 5
    candidatos. Melhor celula (R=2, S=3/4 -> tp=1,50 / sl=0,75): -7,47 a -7,92
    bps/trade. Producao (R=1, S=3/2 -> 1,50/1,50): -8,26 a -8,59 bps/trade.
    Ganho da melhor troca de geometria: ~0,6-0,7 bps, contra um buraco de ~7,8
    bps. ACHADO QUE REFUTA A HIPOTESE TESTADA: alargar a barreira simetricamente
    (R=1, S=9/4 -> 2,25/2,25) da -8,26 a -8,58 bps -- IDENTICO a producao ate a
    2a casa. A tese de que "custo e fixo e o bruto escala com a largura, entao
    alargar reduz a acuracia exigida" e aritmeticamente verdadeira mas
    empiricamente vale ZERO nesta grade: o edge geometrico bruto se degrada na
    mesma proporcao em que a magnitude cresce (edge_atr_units passa de -0,0138
    para -0,0139 em R2 quando tp/sl vai de 1,5 para 2,25). Geometrias
    assimetricas PRO TP sao muito piores (tp=3,0/sl=1,5: -8,90 a -16,20).
    ADMISSIBILIDADE, medida a parte: a melhor celula (sl=0,75) reprova o piso R2
    (stop_pct >= 0,27587%) em 53,1% das barras de BTCUSDT/R2 e 26,8% das de
    XRPUSDT/R2 -- viavel so em SOLUSDT/R2 (92,3%), SOLUSDT/R3 (99,5%) e
    XRPUSDT/R3 (97,3%).
  n: '7 celulas x 5 candidatos; labels completos (108.446 trades preenchidos so em BTCUSDT/R2)'
  status: vermelho
  fonte_arquivo: 'experiments/s1_tp_sl_sensitivity_report_R2.json; experiments/s1_tp_sl_sensitivity_report_R3.json (ambos re-executados 2026-09-04 sob os labels do AG-432)'
  fonte_secao: 'aggregate_by_cell (edge_atr_units_mean_across_strata); src/analysis/s1_tp_sl_sensitivity.py; src/labels/barrier_geometry.py::REWARD_RISK_GRID/SL_MULT_GRID'
  data: '2026-09-04'
  nota: >
    VERMELHO e o resultado CORRETO deste teste -- ele foi rodado justamente pra
    falsificar uma recomendacao minha ao Manager, e falsificou. Contexto que
    torna o achado decisivo: a geometria de producao e SIMETRICA (1,5/1,5), o que
    faz a expectancia bruta ser estruturalmente zero (medido: ret_gross medio =
    +0,01 bps em BTCUSDT/R2 e +0,02 em XRPUSDT/R3, com TP/SL em 50,0%/49,9%).
    Logo TODO lucro tem que vir de acuracia direcional acima de 50%, e a
    acuracia de empate fica entre 52,6% e 56,5% conforme o combo. A geometria era
    a unica alavanca conhecida capaz de baixar essa barra sem tocar em features;
    a medicao diz que ela nao baixa. Consequencia de priorizacao: sobra a
    pergunta do poder discriminativo (AUC de populacao completa medida em
    0,4985-0,5107, contra 0,50 de acaso), nao a do desenho do alvo.
    RESSALVA metodologica herdada do proprio design doc do S1: o sweep mede a
    populacao INCONDICIONAL, nao a que o Alpha de fato sinaliza -- se o modelo
    tivesse poder discriminativo real, a geometria otima CONDICIONADA ao sinal
    poderia diferir. Com AUC no acaso essa ressalva e vacua hoje, mas volta a
    valer se alguma versao futura do vetor sair do acaso.
