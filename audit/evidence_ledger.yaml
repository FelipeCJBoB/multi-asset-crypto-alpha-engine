    (o que o gradiente ponderado por sample_weight de fato ve) e 1,65.
  n: >
    223.111 barras / 446.223 linhas de label; 15 splits x 2 variantes x 2
    lados = 60 ajustes LightGBM; ESS medido 47,5k-48,2k por fold/lado;
