    sem restricao", pipeline.py linha 3). BNBUSDT_R2 pertence a este
    grupo mas NAO e R1 -- refuta a leitura de "problema estrutural de
    R1" como causa unica; o eixo real e esta assinatura de zero-sinal,
    que so CORRELACIONA com R1 em 4 de 5 casos. Precondicao pra decidir
    "0/15 permanencia"/"22/75 caminhos" com confianca: excluir estas 5
    (25 dos 75 caminhos) do denominador ate a causa raiz (por que o
    modelo sem restricao monotonica nao cruza tau nestas celulas
    especificas) ser entendida -- recalculando so sobre as 10 celulas
    com baseline valido, caminhos vencidos sobe de 22/75 (29%) pra
