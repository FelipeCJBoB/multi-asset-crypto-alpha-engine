- id_curto: peso_de_classe_implicito_em_uniqueness_x_abs_ret_net_2026-08-30
  data: '2026-08-30'
  fase: 'F2 do Meta-model (docs/meta_model_design_doc_2026-08-22.md Sec5) -- medir n_eff_subpop antes de escolher learner. O achado abaixo apareceu como efeito colateral da medicao obrigatoria de corr(|ret_net|, y_meta) que o proprio Sec5 exige.'
  feature_ou_filtro: 'meta_sample_weight = uniqueness_subpop * |ret_net| (formula do Sec5 do design doc do Meta, identica a src.labels.weights.apply_weights usada em producao pelo Alpha)'
  symbol: BTCUSDT
  tf: 'R1 (dollar bar), variante camada1'
  janela: 'meta_training_set completo -- 11.859 linhas de treino com y_meta nao-nulo, de 12.138 linhas de treino'
  lado: ambos
  regime: n/a
  metrica_tipo: 'peso_de_classe_implicito = mean(w | y=0) / mean(w | y=1); eta2 = fracao da variancia de |ret_net| explicada pela classe; corr(|ret_net|, y_meta)'
  metrica_valor: 1.6082
  n: 11859
  status: MEDIDO
  fonte_arquivo: 'artifacts/predictions_alpha/config_hash=3765daed058f7d32/symbol=BTCUSDT/resolution=R1/part-0000.parquet + data/labels/BTCUSDT/R1/v1/labels.parquet, via src.models.meta_dataset.compute_uniqueness_divergence'
  fonte_secao: 'Sec5 (pesos e unicidade, D-10)'
  nota: >
    ACHADO: ponderar por |ret_net| sob barreiras de ATR FIXAS nao e
    "enfase economica no evento" -- e majoritariamente um PESO DE CLASSE.
    Medido: eta2 = 0,4872 (a classe explica 48,7% da variancia de
    |ret_net|), corr(|ret_net|, y_meta) = -0,698, e o peso resultante
    equivale a 1,6082:1 a favor da classe NEGATIVA. Nunca escolhido,
    nunca declarado, nunca medido antes desta sessao.

    CAUSA RAIZ, medida e nao inferida: as barreiras hoje sao SIMETRICAS
    (tp_atr_mult = sl_atr_mult = 1,5) e o retorno BRUTO e simetrico
    (+0,002261 no TP vs -0,002269 no SL, como manda a geometria). A
    assimetria inteira vem do CUSTO DE EXECUCAO -- cost_exit_bps = 2,00
    no TP (fill maker no limite) e 5,00 no SL (fill taker no stop).
    Liquido: E[|ret_net| | y=1] = 0,001860 e E[|ret_net| | y=0] =
    0,002968, razao 0,63.

    O design doc do Meta (Sec5) afirmava o OPOSTO em magnitude E direcao:
    "com tp_atr_mult = 2.0 e sl_atr_mult = 1.5, E[|ret_net| | y=1] ~=
    1,33 x E[|ret_net| | y=0]". Os dois multiplicadores citados estao
    desatualizados (hoje 1,5/1,5) e a conclusao esta invertida.

    A `uniqueness` NAO participa do vies: razao de classe 1,0049,
    corr(uniqueness, y_meta) = -0,0089. O vies e todo de |ret_net|.

    POR QUE IMPORTA: um peso de classe no TREINO desloca a escala de
    p_meta, e D-07 removeu o calibrador que absorveria o deslocamento --
    p_meta deixa de estimar P(y=1|X). A assimetria de custo TP/SL e
    economicamente real, mas o lugar dela e a REGRA DE DECISAO (tau_meta,
    Sec8.3), onde e parametro declarado; no peso de treino ela entra duas
    vezes e sem controle.

    CORRECAO APLICADA (mesma sessao): meta_sample_weight passa a ser
    uniqueness_subpop * atr_at_t0 -- a magnitude EM RISCO, conhecida em
    t0, nunca funcao do resultado. Medido sobre o MESMO dado: razao de
    classe 1,596 -> 0,997; corr(peso, y) -0,698 -> 0,006; eta2 0,487 ->
    0,000; e corr(atr_at_t0, |ret_net|) DENTRO da classe = 0,89 (y=0) /
    0,97 (y=1), ou seja a ordenacao economica que justificava ponderar
    por magnitude e PRESERVADA. atr_at_t0 ja vem em unidades de retorno
    (mediana 0,00148), nao de preco.

    ESCOPO NAO CORRIGIDO -- decisao do Manager: src.labels.weights.
    apply_weights usa a MESMA formula para o ALPHA em producao, com peso
    de classe implicito medido em 1,3027 (labels.sample_weight,
    populacao TP/SL de BTCUSDT/R1). Corrigir la muda o treino de todo o
    motor e invalidaria as medicoes em disco.

    Guarda contra recorrencia: weight_class_ratio entra como campo de
    UniquenessDivergenceDiagnostic e e reportado por fold. Um comentario
    nao teria pego 1,61; um numero por fold pega.

