  data: '2026-08-19'
  nota: '4a execucao real, pos-correcao de 4 achados metodologicos (AG-090 close_time_ms, AG-091 Cochran''s
    Q k=1, AG-092 permutacao em bloco, AG-093 janela OOS do BOCPD). BOCPD, que liderava sob I2 classico
    (metrica pre-correcao), tem p-valores entre os MENOS significativos (0,47-0,85) -- confirma que a
    lideranca era artefato de autocorrelacao intra-regime, nao heterogeneidade real. Jump Model com poder
    estatistico inexistente -- resultado dele nao interpretavel, tratado a parte (3 causas independentes:
    decode nao-causal confinado ao fold, poder nulo, lambda calibrado numa fatia so de BTC nunca
    retestada). Resultado tratado como achado valido (regime construido sobre estas dimensoes nao modula
    o edge deste alpha, nestas janelas), nao como estudo com bug -- 2 auditorias externas brutas
    processadas + validacao cruzada propria confirmam a leitura (docs/m4_regime_auditoria_externa_2026-08-19_validacao_cruzada.md).
    M4 pausado por decisao do Manager ate a Trilha B (contrato Regime->Alpha->Execucao) travar o
    consumidor downstream -- ver PLANO_MESTRE_PRINCE2.md §15.11.'

- id_curto: ag114-regra-decisao-hmm-k4-vencedor-fragil
  fase: PRD V4.1 M4 (Regime) / AG-114
  lado: both
  regime: all
  janela: '5 janelas históricas críticas (LUNA, FTX, crypto winter, ETF/halving, recente)'
  feature_ou_filtro: regra de decisao de 3 gates (occupancy, transition failure rate, detection delay
    -- desempate only) + metrica primaria (heterogeneidade de volatilidade futura, I2/Cochran's Q em
    permutacao) aplicada aos 6 candidatos x 3 resolucoes (R1/R2/R3)
  metrica_tipo: stress_state_occupancy_median (Gate 1) + I2 (metrica primaria)
  metrica_valor: 'occupancy mediana hmm_k2/k3/k4 = 34,1/18,3/12,7% (R1), 34,9/18,4/11,1% (R2), 39,5/21,5/10,5%
    (R3). Sob o limiar ORIGINALMENTE aplicado (Gate 1 <=~33%), k2 e desqualificado nas 3 resolucoes
    (34-40%, acima do teto) -- sobra k3 vs k4 na metrica primaria, k4 vence nas 3 (veredito original,
    PLANO_MESTRE_PRINCE2.md §15.12.5). Sob o teto alternativo de 40% (JA testado como sweep de
    sensibilidade do proprio limiar), k2 passa o Gate 1 nas 3 resolucoes -- e, uma vez em disputa, o I2
    bruto de k2 vence o de k4 em 2 das 3 resolucoes: 97,82 vs 97,44 (R1), 95,31 vs 94,98 (R2); só em R3
    k4 vence (91,77 vs 91,66, margem minima). Ou seja: o veredito "k4 vence" depende inteiramente de qual
    dos 2 tetos de occupancy (33% vs 40%, ambos ja testados como robustez) o Gate 1 usa -- nao e robusto
    a essa escolha, que nunca foi declarada operacionalmente antes de rodar (achado da auditoria externa).'
  n: 'gate_quality: 5 janelas x 3 resolucoes (n_windows_ok, ver per_window); volatility_heterogeneity: episodios
    por celula, mediana 92-273 (candidatos com poder saudavel, mesmo n de m4-4a-execucao-permutacao-nula-generalizada)'
  status: amarelo
  fonte_arquivo: experiments/m4_critical_windows_report.json
  fonte_secao: by_resolution[].gate_quality (stress_state_occupancy_median/transition_failure_rate_n5_median)
    + by_resolution[].volatility_heterogeneity (i_squared_pct_median/p_value_permutation_median)
  data: '2026-08-20'
  nota: 'hmm_gaussian_k4_v1 declarado vencedor do AG-114 em 2026-08-20 (PLANO_MESTRE_PRINCE2.md §15.12.5)
    -- REABERTO no mesmo dia por auditoria externa (Manager, papel de auditor): o Gate 1 foi aplicado
    misturando 2 criterios (mediana de resolucao vs. maximo por janela) sem declarar qual decide; sob o
    criterio literal de mediana, k2 passa e vence a metrica primaria em 2 das 3 resolucoes (numeros exatos
    acima, extraidos direto de experiments/m4_critical_windows_report.json em 2026-08-21). 1 hipotese
    alternativa (HMM levar vantagem em R3 por fit in-sample) foi checada e REFUTADA (fit e walk-forward
    genuino, verificado em 2 pontos do codigo -- AG-122 adendo final) -- nao resolve a fragilidade do Gate
    1, so elimina 1 explicacao alternativa. status AINDA ABERTO em 2026-08-21 (audit/architecture_gaps_log.yaml::AG-114)
    quanto a metodologia de selecao -- decisao de re-especificar o criterio operacional do Gate 1/Gate 3
    pendente do Manager. Classificado amarelo (nao verde/vermelho) porque a "vitoria" e real sob os
    limiares originalmente testados mas contestada/nao decidida, nao um achado limpo. Ver
    ag118-gate-efficiency-lift-nulo-90-celulas abaixo para a pergunta seguinte (o gate tem utilidade
    economica?) e status_override_producao_2026_08_21 em AG-114 pro override de negocio que autorizou k=4
    em producao mesmo com este achado aberto.'

