    ESPERADO sob taxa de sinal de ~3,4%. Um ratio proximo de 1 teria
    sido alarme de bug de agrupamento, nao propriedade do dado.

    CONSEQUENCIA PARA Sec7.3 (escolha de learner): com 7 colunas no
    design matrix sob regime HMM k=4 (score_alpha_raw_z, p_alpha,
    margin, side_hat, 3 dummies de regime drop-first), o EPV medido e
    93 na mediana e 20 no PIOR fold -- ambos acima de
    meta_min_events_per_variable = 10. A logistica L2 e sustentada em
    todos os folds com folga. O gate de GBM continua dependendo de
    meta_min_neff_for_gbm, que permanece TBD (B23, nao inventado aqui).

    CONTEXTO DE ESCASSEZ, medido no mesmo passo: das 15 combinacoes
    (fold do Alpha), so 8 produzem QUALQUER sinal -- folds 0,1,2,3,5,6,7
    e 10 ficam em zero. 6.142 sinais em 411.600 linhas de predicao. E o
    pooling cross-simbolo rende menos que o nominal (cross_symbol_ess
    2026-08-25: N_eff = 2,03 de 5 simbolos).

    RESSALVA DE ESCOPO: medido com regime_source = quantile_classifier_v1
    porque os artefatos de regime HMM k=4 ainda estavam sendo gerados. A
    medicao NAO depende do regime: n_eff_subpop, inflation_ratio,
    concorrencia e pesos sao funcao de (t0, t1, symbol, side_hat,
    atr_at_t0) apenas -- o regime so entra no one-hot e no meta_status.
    Vale identica sob HMM k=4.

