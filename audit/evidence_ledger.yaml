    N_LIFETIME: esta rodada NAO incrementa. Nenhuma busca de parametro
    aconteceu -- e uma execucao unica do desenho ja fixado, com
    instrumentacao adicionada, cujo proposito e MEDIR o motor existente.
    Pela definicao do proprio ledger ("combinacoes de parametro que exigem
    ajuste de modelo NOVO testado contra dado real"), instrumentar e medir
