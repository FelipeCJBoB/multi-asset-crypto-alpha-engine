    2,36x) mostra que nem estavelmente ela e.
    (3) DISPERSAO -- Camada1: mean=-3,1187, std_between_paths=0,8270,
    range [-4,0860; -2,1408]. Camada0: mean=-2,3979,
    std_between_paths=0,8340, range [-3,4671; -1,3395].
    delta_sharpe_mean=-0,7208. |delta| = 0,72 < sigma ~ 0,83: a diferenca
