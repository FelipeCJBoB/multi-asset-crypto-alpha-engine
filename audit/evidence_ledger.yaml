    src/labels/triple_barrier.py): exit_price de TP/SL e o proprio preco da barreira por construcao, o
    que torna QUALQUER metrica de tail-loss derivada de ret_net quase-deterministica em atr_pct,
    normalizada por ATR ou nao -- nem a metrica original (ATR-normalizada, tautologica) nem a reversao
    aparente em termos brutos (D4, que parecia nova evidencia mas e o MESMO mecanismo D1 por um caminho
    aritmetico diferente) sao evidencia independente de risco de cauda alem do que ATR ja captura.
