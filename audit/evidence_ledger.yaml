- id_curto: alpha-tau-calibracao-experimento-pareado-3-bracos-2026-08-25
  fase: >
    AG-220 + addendum -- experimento pareado de 3 bracos sobre a REGRA DE
    DECISAO do Alpha (nao sobre o modelo). Objetivo: testar se os dois
    defeitos de calibracao diagnosticados em AG-209 (calibrador isotonico
    ajustado sobre sub-split ALEATORIO de rotulos sobrepostos) e AG-210
    (quantil 1-target_signal_rate aplicado POR LADO quando
    fee_budget_is_per_side=false declara o orcamento como TOTAL) explicam
    a violacao de R3 medida na rodada de diagnostico. Desenho pareado
    estrito: mesmo simbolo, mesma resolucao, mesmo seed
    (alpha_random_seed=42), mesmo desenho LightGBM, mesma janela, mesmos
    15 splits de CPCV. Varia SO a politica de calibracao da fronteira.
  tf: R1 (dollar-bar)
  janela: 'labels/v1/labels.parquet R1 BTCUSDT, janela cheia, 446.223
    linhas (223.111 barras x 2 lados), vol_estimator_id=parkinson_w20'
  lado: 'long e short (a regra de decisao acopla os dois via dominancia)'
  regime: all
  feature_ou_filtro: >
    T1_FEATURE_IDS de producao (7 features), desenho LightGBM de producao
    inalterado. NENHUM hiperparametro de modelo foi variado entre os
    bracos -- a unica variacao e (tau_policy, calib_split_mode).
  metrica_tipo: >
    (1) taxa de sinal realizada OOS por caminho de CPCV, contra o
    orcamento TOTAL declarado (target_signal_rate=0,0189 = 661 trades/ano,
    fee_budget_is_per_side=false); (2) Sharpe naive medio e desvio ENTRE
    caminhos por camada; (3) delta de Sharpe C1-C0 lido contra esse
    desvio; (4) veredito do gate de permanencia §5.11
    (alpha_layer1_permanence_min_paths >= 4 de 5).
  metrica_valor: >
    BRACO A (tau=legacy_per_side, calib=legacy_random) -- taxa=3,315%
    (1,75x o orcamento), 954,1 trades/ano (1,44x); C1 mean=-3,1187
    sigma=0,8270; C0 mean=-2,3979 sigma=0,8340; delta=-0,7208;
    n_better=1/5; permanence_pass=FALSE.
    BRACO B (tau=total_common_oof, calib=legacy_random) -- taxa=3,157%
    (1,67x), 934,0 trades/ano (1,41x); C1 mean=-3,0830 sigma=1,1225;
    C0 mean=-3,8928 sigma=1,6777; delta=+0,8098; n_better=4/5;
    permanence_pass=TRUE.
    BRACO C (tau=total_common_oof, calib=temporal_purged) -- taxa=6,687%
    (3,54x), 1.858,0 trades/ano (2,81x); C1 mean=-5,1086 sigma=1,0912;
    C0 mean=-5,0117 sigma=1,3112; delta=-0,0969; n_better=2/5;
    permanence_pass=FALSE.
    LEITURA 1 -- nenhum braco entrega R3. Corrigir escopo+populacao do
    quantil (A->B) moveu a taxa 0,16 ponto percentual; adicionar a
    calibracao purgada (B->C) DOBROU a taxa em vez de reduzi-la.
    LEITURA 2 -- em TODOS os tres bracos |delta| < sigma entre caminhos
    (0,72<0,83 ; 0,81<1,12 ; 0,10<1,09). O gate §5.11 nunca teve poder
    estatistico neste dataset, sob nenhuma configuracao.
    LEITURA 3 -- o veredito do gate oscilou FALSE -> TRUE -> FALSE
    governado apenas por escolhas de calibracao de threshold, que nao
    mudam modelo, features nem dado. No braco B a inversao veio da
    DEGRADACAO do braco de controle (C0: -2,3979 -> -3,8928, delta
    -1,495), nao da melhora do tratado (C1 moveu 0,036).
  n: >
    3 bracos x 15 splits x 2 variantes x 2 lados = 180 ajustes LightGBM;
    223.111 barras por braco; elapsed 581s (A) + 1.555s (B) + ~2.000s (C).
  status: vermelho
  fonte_arquivo: >
    experiments/alpha_layer1_report_ag208_217_diag.json (A) +
    experiments/alpha_layer1_report_ag210_tau_total.json (B) +
    experiments/alpha_layer1_report_ag209_210_calib_tau.json (C)
  fonte_secao: >
    camada1_backtest_by_path (taxa) / layer1_vs_layer0.camada{0,1}_sharpe_
    dispersion + delta_sharpe_mean + n_paths_camada1_supera_camada0 +
    permanence_pass (2-4) / policies (identidade do braco)
  data: '2026-08-25'
  nota: >
    ACHADO PRINCIPAL, e ele e sobre o INSTRUMENTO, nao sobre a variante:
    tres formas diferentes de escolher ONDE e COMO tirar o quantil de
    probabilidade produziram taxas de sinal de 3,16% a 6,69% sobre o
    mesmo alvo declarado de 1,89%. Calibrar uma fronteira de decisao por
    quantil de p e estruturalmente fragil porque quantis de probabilidade
    nao transferem entre treino e teste sob nao-estacionariedade -- o
    solver acerta o alvo IN-SAMPLE por construcao e a taxa OOS nao segue.
    Isto e a evidencia empirica direta a favor de ADR-004 §4 (fronteira
    derivada do CUSTO em unidade de retorno, |mu| > lambda com lambda =
    max(c, lambda_B)), que antes desta rodada era so argumento dimensional
    ("uma probabilidade nao tem unidade de retorno, entao nao da para
    escrever p > custo").
    REGISTRO DE AUTOCRITICA: as duas correcoes testadas aqui foram
    propostas e implementadas por mim (Claude) nesta mesma sessao. Ativadas
    isoladamente, PIORARAM a metrica que deveriam melhorar. Os dois
    diagnosticos seguem corretos (o sub-split aleatorio vaza; o quantil por
    lado contradiz uma constante classe A) -- o que o experimento mostra e
    que corrigir dois defeitos de um instrumento errado nao o torna certo.
    N_LIFETIME: 2 incrementos propostos (bracos B e C), NAO 3 -- o braco A
    e a rodada de diagnostico ja registrada na entrada anterior deste
    ledger (instrumentacao do desenho vigente, sem busca de parametro). B
    e C sao configuracoes NOVAS da regra de decisao testadas contra dado
    real, o que se enquadra na definicao do ledger. Decisao final do
    Manager -- nao incrementado unilateralmente.
    RECOMENDACAO: nao varrer mais variantes de calibracao de tau. O
    instrumento ja esta caracterizado por 3 pontos; mais pontos gastam
    N_lifetime sem informacao nova. Ir para ADR-004 Fase 1+2 (alvo em
    unidade de retorno + fronteira lagrangiana), custo 1 retreino.
    RESSALVA DE ESCOPO: 1 combinacao (BTCUSDT/R1) de 15. As tres leituras
    acima nao se generalizam sem medicao propria nas outras 14.
