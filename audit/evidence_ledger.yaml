    parkinson_w20; CPCV 6 grupos / 2 de teste = 15 splits, 5 caminhos'
  lado: 'long e short, reportados separadamente onde a metrica e por lado'
  regime: all (sem estratificacao por regime nesta rodada de instrumentacao)
  feature_ou_filtro: 'T1_FEATURE_IDS de producao (7 features), desenho
