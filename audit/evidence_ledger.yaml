    n_paths_camada1_supera_camada0 = 1 de 5, permanence_pass=false.
    Ressalva estrutural que acompanha o numero: os 5 caminhos reconstroem
    o MESMO dataset (src/validation/cpcv.py item 3), entao este sigma mede
