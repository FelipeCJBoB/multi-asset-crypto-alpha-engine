    e o ledger e append-only -- evidencia negativa que some e evidencia perdida; (2)
    define a barra que o retreino precisa superar -- se o Alpha novo repetir
    AUC ~ permutada, o problema nao era a grade nem o learner; (3) e o insumo do
    Gate E0 do Meta-model (docs/meta_model_design_doc_2026-08-22.md Sec2.6), que
    tem execucao PILOTO sobre exatamente este artefato (provisoria, nao vinculante)
    e execucao VINCULANTE sobre o Alpha novo.

    Consequencia declarada a priori para o Meta: meta-labeling sobre um primario sem
    sinal direcional e reducao de exposicao, nao selecao -- AFML Sec3.6 estabelece que
    o ganho do Meta e funcao do estoque de falsos positivos do primario, mas isso e
    condicao NECESSARIA, nao suficiente: os FPs precisam ser SEPARAVEIS. Com AUC ~ 0,50
    o primario produz uma subamostra aproximadamente aleatoria, e filtrar amostra
    aleatoria devolve amostra aleatoria menor. Por isso o ablation do Meta e contra
    "filtro aleatorio na mesma taxa", nunca contra "sem Meta".
