# --- Camada 1 — restrições monotônicas (§5.3) ---

alpha_monotonic_consistency_min_envs:
  value: 6
  provenance: DERIVED
  source: >
    §5.3 literal diz "consistente em >= 6 de 7 ambientes", mas §5.4 define
    ambientes como "tercil de cost_atr_ratio x regime estrutural, seis
    células" — 6, não 7. Investigado: o "7" não tem nenhuma sétima categoria
    de ambiente em lugar nenhum do PRD (§5.4 é a única definição de
    ambiente e diz explicitamente "seis células"); a leitura mais
    consistente é que "7" é resíduo de contaminação com a tabela de IC
    ANUAL de 7 anos (2020-2026) do §17.2/§5.0 — a mesma tabela que o
    próprio §5.3 proíbe explicitamente de usar para configurar o modelo
    ("A tabela de IC do §17 cobre 2020-2026 e NAO pode ser usada para
    atribuir restrições... vazamento de horizonte"), e cujos exemplos
    adjacentes na mesma seção usam literalmente "IC negativo em 7/7 anos" /
    "IC negativo em 6/7" — anos, não ambientes. Usado 6 ambientes (§5.4),
    não 7, por instrução explícita da task e por esta investigação.
    Limiar de consistência adaptado de "6 de 7" (tolera exatamente 1
    ambiente dissidente em 7) para 6 ambientes por PRESERVAÇÃO DA TOLERÂNCIA
    QUALITATIVA, não da razão numérica: floor(1/7 * 6) = 0 ambientes
    dissidentes tolerados, logo 6 de 6 (unânime) — mesmo resultado do
    critério "arredondar para preservar ou exceder o rigor original"
    (ceil(6/7 * 6) = ceil(5.14) = 6). A alternativa por razão mais
    PRÓXIMA (não por tolerância) seria 5 de 6 (83,3%, mais perto de 85,7%
    que 100%) — calculada e reportada como sensibilidade no relatório do
    Sprint 8, mas não adotada como padrão: o princípio de tolerância
    (floor/ceil) é aplicado de forma consistente com o mesmo raciocínio
    usado em alpha_layer1_permanence_min_paths abaixo, e ambos os
    princípios (tolerância e "não afrouxar o rigor") concordam em 6 aqui,
    divergindo só do critério de razão mais próxima.
  class: B
  sweep_required: false
  review_by: sprint_11

alpha_stability_screen_limiar:
  value: 0.02
  provenance: ASSUMED
  source: >
    §5.4 literal: "`limiar` é constante classe A — varrer, não escolher
    (§18)". Nenhuma base numérica no PRD. `estabilidade = forca *
    consistencia**2` (src.models.stability) — `forca` é média de |IC de
    Spearman| (tipicamente 0,01-0,05 neste projeto para sinal fraco real,
    ver "IC de +0,042" citado no achado do §17.2/PARTE XIX) e
    `consistencia` ∈ [0,1] com denominador fixo 6 (mesma convenção de
    `alpha_monotonic_consistency_min_envs` acima). 0,02 escolhido como
    piso plausível (força ~0,02-0,03 com consistência unânime, ou força
    maior com consistência parcial) sem varredura ainda — sweep_range
    ±50% declarado, não executado nesta rodada (E3, Faixa 2). Nenhuma
    decisão de produção depende do valor exato até a varredura.
  class: A
  sweep_required: true
  sweep_range: [0.01, 0.03]
  review_by: sprint_11

