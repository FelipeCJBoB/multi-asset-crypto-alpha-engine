  # scaling_invariant (2026-08-16, AG-043 -- F3, decisão DELIBERADA de
  # intenção, NÃO classificação por omissão): EMA de 48 barras de RELÓGIO,
  # PONTO -- não converte pra bar_count sob dollar bar. O vocabulário
  # scaling_invariant ganha 3ª classe `activity` (AG-043), mas dollar bar
  # NÃO converte automaticamente toda feature em `activity`: a unidade é
  # definida pela INTENÇÃO da feature. A intenção declarada de A13 é
  # memória/suavização comensurável ao horizonte de RELÓGIO do label
  # (time_stop_ms=8h, AG-031/B1 -- `time_stop_bars` supersedido, ver
  # entrada abaixo), não à contagem de barras -- em multi-TF, span escala
  # INVERSAMENTE ao TF pra preservar meia-vida em tempo real (ex.:
  # 96@15m -> 48@30m -> 24@1h, NÃO 96 fixo). Origem do achado: AG-027
  # addendum (2026-08-15). Decisão do Manager (2026-08-15): manter valor
  # 48. Autorização anterior de testar EMA(24)/EMA(96) REVOGADA no mesmo
  # dia -- não gastar N_lifetime nisso por ora. Ver AG-027 e AG-043.
  #
  # IMPLEMENTADO 2026-08-23 (fecha o débito de F3 que faltava: a
  # classificação existia aqui desde 2026-08-16, mas nenhum código a
  # aplicava -- src/features/build.py::FeatureWindows.from_constants
  # ganhou parâmetro bar_source, escala ema_window via
  # _scale_clock_window_bars/_clock_reference_bar_duration_ms usando
  # CALIBRATION_TF_BY_RESOLUTION (src.data.build_dollar_bars) como
  # referência FIXA de calibração -- NUNCA uma duração medida (isso
  # reabriria F2, já rejeitado, ver histórico acima). Sob R1/R2/R3:
  # 48/24/12 barras (não 96/48/24 -- o valor real de A13 é 48, o "96" do
  # parágrafo acima é só o exemplo ilustrativo original). Pesquisa de
  # literatura que fundamenta a decisão de NÃO generalizar essa conversão
  # pras outras 8 janelas (permanecem bar_count): López de Prado (2018,
  # Advances in Financial ML) e Grądzki/Wójcik/Lessmann (Financial
  # Innovation 2025, cripto + dollar/volume bars + triple-barrier —
  # praticamente o mesmo desenho deste repo) — indicadores técnicos
  # computados sobre barras de informação mantêm contagem de barra fixa
  # entre resoluções, por desenho (cada barra ~mesmo peso de informação).
  # A13 é a exceção deliberada, não a regra.
  #
  # REVERTIDO 2026-08-26 (`AG-295`, aprovação explícita do Manager):
  # `scaling_invariant` volta de `clock` pra `bar_count` -- a premissa que
  # sustentava a exceção ("span comensurável ao horizonte de RELÓGIO do
