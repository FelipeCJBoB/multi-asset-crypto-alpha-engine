tp_atr_mult:
  value: 1.5
  provenance: MEASURED
  source: >
    CORRIGIDO 2026-08-24 (decisão do Manager, "muda", após S1 medir a
    grade). Valor anterior (2.0, herdado do PRD V2 sem nunca ter sido
    questionado) trocado pelo candidato validado pelo sweep S1
    (`experiments/s1_tp_sl_sensitivity_report.json`,
    `docs/s1_design_doc_sweep_tp_sl_reward_risk_2026-08-22.md`).
    Metodologia REAL executada (nota: diverge da "metodologia decidida"
    citada em outro lugar do PLANO_MESTRE — ADR-001 §5 item 10, payoff/
    hurdle via distribuição de tempo-até-barreira — que NÃO foi o que
    rodou): `edge_atr_units = frac_tp·tp_mult − frac_sl·sl_mult`
    (`src.analysis.feasibility.edge_bruto_atr`), geometria de acerto
    normalizada por ATR sobre a população INCONDICIONAL de
    `labels.parquet`, SEM custo (`edge_bruto`, não `edge_liq` —
    `custo_atr`/`captura` existem em `feasibility.py` mas não foram
    chamados por este sweep). Grade 3×3 reparametrizada
    (`reward_risk_ratio × sl_mult`), 2 células universalmente excluídas
    (fora do `sweep_range` declarado), célula central reproduz produção
    EXATO (`sanidade_centro_da_grade.reproduz_producao_exato=true`).
    7 células válidas — TODAS com `edge_atr_units` médio NEGATIVO, célula
    de produção (tp=2,0/sl=1,5) era a 3ª melhor de 7 (-0,02555). As 2
    células nominalmente melhores (`R=4/3,S=3/4`→tp=1,0/sl=0,75,
    -0,01284; `R=2,S=3/4`→tp=1,5/sl=0,75, -0,01054) são INVIÁVEIS pra
    BTCUSDT/BNBUSDT — violam o piso R2 (`cost_stop_ratio_max` × stop,
    `_min_viable_sl_mult`, `sl_mult=3/4` abaixo do mínimo viável desses 2
    símbolos) — não são candidato de constante GLOBAL, só existem pra
    3/5 símbolos. Escolhido: `R=1, S=3/2` (tp=1,5/sl=1,5, reward:risk
    1:1) — `edge_atr_units` médio -0,01686 (34% menos negativo que
    produção), VÁLIDO pros 5 símbolos (`n_estratos_symbol_side=10`, sem
    exceção de R2). **Ressalva explícita, não escondida**: continua
    edge NEGATIVO — é "menos pior medido", não "edge positivo
    encontrado"; `edge_liq_atr` (líquido de custo) nunca foi computado
    por este sweep, só pode piorar o número, nunca melhorar. Veredito
    formal de "sobrevive à faixa" (§11 risco #1 do design doc) segue
    TBD — decisão de trocar o valor foi tomada apesar disso, não porque
    isso tenha sido resolvido.
  class: A
  sweep_required: false
  sweep_range: [1.0, 3.0]   # RESTAURADO 2026-08-25 (AG-237) -- ver sweep_range_note
  sweep_range_note: >-
    Este `sweep_range` foi REMOVIDO junto com a troca de valor de
    2026-08-24 (S1), e a remocao quebrou
    tests/unit/test_analysis_cost_surface.py::
    test_default_grid_axes_fica_dentro_do_sweep_range_declarado -- o teste
    existe para garantir que a grade +-30% de `cost_surface` cabe dentro
    da faixa declarada, e a faixa tinha sumido. Restaurado em [1.0, 3.0],
    o valor historico, porque a faixa continua correta: a grade real do S1
    corrigido (R:R em {1; 4/3; 2} x sl em {0,75; 1,5; 2,25}) esta contida
    nela.
    `sweep_required: false` MANTIDO, mas agora por um motivo diferente e
    melhor. Quando foi marcado false (2026-08-24) o S1 lia a grade de
    RELOGIO 15m, que nao e a de producao desde AG-042 -- ou seja, o sweep
    que justificava dispensar o sweep tinha sido feito na grade errada
    (AG-232). O S1 corrigido rodou sobre R1 (AG-235) e o resultado
    SUSTENTA a dispensa: entre as 5 celulas com cobertura completa
    (n_estratos=10), o gap edge-custo varia de 5,95 a 6,19 bps -- spread
    de 0,24 bps sobre um gap de ~6. Trocar a geometria renderia +0,02 bps
    (0,3%). O mecanismo e estrutural, nao especifico das celulas testadas:
    R:R maior melhora o edge bruto mas piora o custo (P(TP) cai, mais
    saidas viram taker), e os dois efeitos se cancelam. Sob martingale o
    edge bruto e ZERO para qualquer geometria simetrica -- o que sobra e
    custo, e custo varia pouco entre geometrias viaveis.
  derived_from: [round_trip_cost_bps_maker_prob]   # piso R2 usado pra excluir células depende deste valor medido
  review_by: sprint_10

sl_atr_mult:
  value: 1.5
  provenance: MEASURED
  source: >
    Valor NUMÉRICO não mudou (já era 1,5) — proveniência atualizada
    2026-08-24 porque o S1 (ver `tp_atr_mult` acima) validou este ponto
    como parte da célula `R=1,S=3/2` escolhida, não porque o número em
