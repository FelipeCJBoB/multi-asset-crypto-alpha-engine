    13,0/65,0/86,71/130,0; 6.67x é a mesma razão já validada no teste
    sintético de bocpd.py, hazard_lambda=2000 para segmentos de 300
    barras, test_detecta_changepoint_unico_injetado_no_ponto_certo),
    cada ponto rodando run_bocpd sobre log_return_1 REAL (mesma série/
    corte de warmup de m4_regime_comparison._valid_start_idx, 231.540
    barras válidas) e medindo a distribuição de duração de segmento
    resultante (mesma metodologia de regime_persistence, à mão).
    hazard_lambda=13,0 (1x, o valor bruto da mediana) é PATOLÓGICO --
    confirma empiricamente, em dado real, o achado já documentado no
    teste sintético de bocpd.py ('hazard_lambda parecido com a duração
    real do segmento prejudica a detecção'): 55.604 segmentos,
    median_duration_bars=1,0 (mean=4,16, p90=1,0) -- o prior domina, MAP
    resetando por ruído barra-a-barra, não por estrutura real.
    hazard_lambda=65,0 (5x) foi o ponto medido que melhor reproduzia a
    ORDEM DE GRANDEZA real do fenômeno NO HISTÓRICO COMPLETO --
    median_duration_bars=14,0 (quase idêntico aos 13,0 do baseline),
    1.196 segmentos plausíveis, mean=193,6/p90=476,0/max=12.729 (cauda
    direita mais pesada que o baseline, mas mesma forma qualitativa) --
    SUBSTITUÍDO 2026-08-20 por incluir vazamento das janelas de teste
    (ver acima)."
  class: B
  sweep_required: false

m4_bocpd_n_canonical_buckets:
  value: 3
  provenance: DERIVED
  source: "PRD_V4_1.md §3.2 especifica K só para o HMM ('2/3/4 estados') --
    nem para BOCPD nem para Jump Model (confirmado por leitura literal da
    linha 416 do PRD). Não é medição -- é escolha de desenho justificada.
    Duas âncoras, como pedido: (1) comparabilidade com o candidato mais
    simples do grid HMM (k=2) -- 3 fica adjacente a esse piso, não solto
    numa granularidade desconectada dos outros candidatos do estudo; (2) o
    que o desenho de segmentação por changepoint do BOCPD pede: 2 buckets
    (só 'acima/abaixo da mediana do retorno médio de segmento') arrisca
    dividir arbitrariamente uma massa de segmentos com retorno médio muito
    perto de zero (log-retorno de 1 barra de dollar-bar oscila perto de 0
    quase sempre -- não há razão para esperar 2 modos claramente separados
    por sinal) entre os 2 lados do corte por pura mediana amostral, sem
    nenhum bucket 'neutro' para absorver esse ruído -- SNR ruim por
    construção. 3 buckets (tercis) cria explicitamente esse meio-termo
    (negativo / neutro-perto-de-zero / positivo), dando ao teste de
    separação (ANOVA/ω²) uma chance real de separar sinal de ruído em vez
    de fragmentar o meio da distribuição ao acaso. Também espelha
    diretamente o candidato HMM k=3 já no grid (mesmo nº de estados,
    comparação de MODELO controlando por granularidade), sem exigir uma
    3ª entrada nova de estado (BOCPD já usa 1 trial do orçamento de 6,
    não ganha um K próprio para sweepar)."
  class: B
  sweep_required: false

m4_jump_model_n_states:
  value: 2
  provenance: DERIVED
  source: "Mesma lacuna do PRD que m4_bocpd_n_canonical_buckets -- K não
    especificado para Jump Model (só para HMM). Escolha de desenho, não
    medição. Motivo: (1) comparabilidade direta com o candidato mais
    simples do grid HMM (k=2) -- isola o efeito de FAMÍLIA de modelo
    (Gaussian HMM/EM vs. Continuous Jump Model/coordinate-descent +
    penalidade de jump explícita) do efeito de granularidade (k), já que
    o Jump Model tem só 1 trial no orçamento de 6 (não pode sweepar k
    como o HMM faz com 3 trials). (2) achado real já documentado em
    src/regime/jump_model.py (item 6) e confirmado nesta sessão
    (m4_jump_model_penalty abaixo): jump_penalty já é um hiperparâmetro
    sensível à escala e propenso a saturar (colapsar num único estado)
    mesmo com só 2 estados pedidos -- pedir n_states>2 aumentaria ainda
    mais o espaço de saturação possível (mais formas de um cluster ficar
    vazio/degenerado) para um hiperparâmetro que já precisou de
    calibração cuidadosa só para sobreviver com k=2. (3) testa a hipótese
    mais forte primeiro: se uma única divisão binária (via CJM) já separa
    retorno condicional tão bem quanto o baseline de 4 regimes
    tradeable (R1-R4), a complexidade extra de mais estados fica
    deferida para iteração futura, não presumida necessária a priori."
  class: B
  sweep_required: false

m4_jump_model_penalty:
  value: 0.002
  provenance: MEASURED
  source: "jumpmodels (.venv/Lib/site-packages/jumpmodels/{jump,base}.py)
    lido por completo antes de varrer à mão -- NÃO expõe nenhum método de
    seleção de jump_penalty via BIC/critério de informação/CV embutido
    (JumpModel.fit não aceita nada do tipo, confirmado por leitura direta
    do código-fonte, não hipótese) -- por isso a varredura manual, não um
