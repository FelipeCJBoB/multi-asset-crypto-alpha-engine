  provenance: ASSUMED
  source: "Seed do gerador determinístico (numpy.random.default_rng) do
    teste de permutação em bloco (AG-092) -- sem base de escolha além de
    garantir reprodutibilidade bit-a-bit (mesmo padrão de hmm_seed=0/
    jump_seed=0, parâmetros de função em m4_regime_comparison.py, não
