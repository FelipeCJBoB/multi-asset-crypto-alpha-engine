# ============================================================================
# Camada labels — Label Engine (Sprint 6, §3). tp_atr_mult/sl_atr_mult/
# time_stop_bars/atr_window/maker_fee/taker_fee/adverse_selection_bps já
# existem acima (§0.2 R1/R2, execução) e são REUSADOS aqui, não duplicados.
# fill_timeout_bars é a única constante nova deste Sprint.
# ============================================================================

fill_timeout_bars:
  value: 1
  provenance: ASSUMED
  source: "citado explicitamente no PRD §3.3 (fill_timeout_bars: 1) mas sem teste de sensibilidade — quanto tempo uma ordem limite fica postada antes do timeout (on_timeout: CANCEL, B13). Não invalida o desenho sozinho (NOFILL já é um desfecho de primeira classe, §3.2) — classe B, não A, mas ainda precisa de proveniência (Regra 1). Continua em uso direto por src/execution/fill_simulator.py (contagem de barra, consumidor independente de LabelConfig, fora do escopo da migração dollar-bar de 2026-08-17 -- zero acoplamento a estimador de volatilidade, sem caller de produção real ainda) e por src/labels/barrier_sweep.py -- NÃO renomear/apagar."
  class: B
  sweep_required: false
  review_by: sprint_6

fill_timeout_ms:
  value: 900000
  provenance: DERIVED
  source: "derivado de fill_timeout_bars(1, ASSUMED) × step_ms('15m')=900000 -- mesmo valor (15min), reexpresso em relógio fixo pro Label Engine (achado 2026-08-17, ao implementar suporte a dollar bar no Label Engine -- LabelConfig.fill_timeout_bars multiplicava por bar_ms=step_ms(cfg.tf) em build_labels, mesma classe de bug já corrigida em time_stop_ms/AG-031/B1, só não tinha sido pega na 1ª rodada). LabelConfig.fill_timeout_ms substitui fill_timeout_bars NESTE dataclass só -- fill_horizon_ms = t_post + fill_timeout_ms, direto, sem depender de tf/bar_ms sob dollar bar. A constante fill_timeout_bars (acima) continua existindo, inalterada, pros outros consumidores (fill_simulator.py, barrier_sweep.py). A suposição de timeout em si (15min) permanece ASSUMED, sweep_required herdado."
  class: B
  sweep_required: false
  review_by: sprint_6

label_entry_fill_source:
  value: "agg_trades"
  provenance: DERIVED
  source: >-
    Fonte de preco usada para simular o FILL DE ENTRADA no Label Engine.
    Dois valores validos, ambos causais: "mark_1m" (candle de 1 minuto --
    caminho historico) e "agg_trades" (trades agregados, granularidade de
    milissegundo). DERIVED da medicao de AG-221/AG-229, nao escolhido por
    preferencia: sob mark_1m o preenchimento so pode ocorrer em fronteira
    de minuto, mas t_post e o close_time de uma DOLLAR BAR, que cai em
    instante arbitrario -- a diferenca injetava uma latencia SINTETICA de
    0 a 60s entre a decisao e o fill, cobrada como custo de execucao que
    o motor nunca pagaria. Nao era vies constante: escalava com
    volatilidade (validado por estratificacao em quintis de ATR e pela
    predicao de escala, AG-221). Relabel completo das 15 combinacoes
    (AG-229) mediu o efeito: P(TP) 0,4505-0,4768 -> 0,4917-0,4969 (todas
    dentro de 0,83pp do 0,50 de martingale, que e o valor TEORICO correto
    para barreiras simetricas) e gap edge-custo 10,50 -> 6,10 bps
    (-41,9%). Ou seja: cerca de metade do edge bruto negativo era
    ARTEFATO DE MEDICAO, nao propriedade do mercado.
    Por que a constante existe em vez de um default no dataclass
    (AG-236): LabelConfig.entry_fill_source tem default TECNICO "mark_1m"
    para que fixture sintetica que exercita o caminho de candle continue
    funcionando sem precisar de agg_trades; o valor de PRODUCAO entra
    exclusivamente por LabelConfig.from_constants(), que le esta chave.
    Trocar o default do dataclass em vez disso quebrou 43 testes (medido).
    EFEITO COLATERAL DESEJADO: sob from_constants o config_hash passa a
    bater com os labels R1/R2/R3 relabelados (3599b765b7a53ff2 /
    19be840676f4c43c / ff8dcb98fa579975) e a NAO bater com a grade de
    relogio 15m legada (9492d29c36b06cb1) -- o expurgo pedido pelo Manager
    (AG-233) acontecendo por MECANISMO (B15 falha alto), nao por delecao.
  class: A
  sweep_required: true
  sweep_range: ["mark_1m", "agg_trades"]
  sweep_status: EXECUTADO
  sweep_note: >-
    O "sweep" desta constante e a ENUMERACAO das duas fontes validas -- o
    dominio e discreto e completo, entao +-50% nao tem significado; varrer
    aqui e medir as duas pontas, e isso JA FOI FEITO.
    Correcao registrada: declarei `sweep_required: false` primeiro,
    argumentando que uma fonte domina a outra por argumento causal
    (mark_1m e um subconjunto amostrado de agg_trades, entao a de maior
    granularidade nao pode ser pior). O argumento continua correto, mas a
    declaracao estava errada -- `check_constants_provenance.py` rejeitou,
    e com razao: dispensar sweep de uma constante CLASSE A porque o
    resultado e previsivel e exatamente o que a regra 4 existe para
    impedir. O sweep nao foi dispensado, foi EXECUTADO.
    Resultado medido das duas pontas (AG-221 isolou o mecanismo, AG-229
    relabelou as 15 combinacoes de producao, 998s):
      mark_1m    -> P(TP) 0,4505-0,4768 | gap edge-custo 10,50 bps
      agg_trades -> P(TP) 0,4917-0,4969 | gap edge-custo  6,10 bps
    Sob barreiras simetricas o P(TP) TEORICO de martingale e 0,50; com
    agg_trades todas as 15 combinacoes ficam dentro de 0,83pp desse valor,
    com mark_1m nenhuma fica. A ponta escolhida e a que reproduz o valor
    teorico, nao a que da o numero melhor -- e a diferenca (-41,9% no gap)
    era ARTEFATO DE MEDICAO, nao propriedade do mercado.
    GRUPO DE CONTROLE preservado: as 5 combinacoes de grade 15m ficaram em
    mark_1m por desenho e sairam bit-identicas, o que separa "o relabel
    mudou o numero" de "o dado mudou sozinho".
  review_by: sprint_6

