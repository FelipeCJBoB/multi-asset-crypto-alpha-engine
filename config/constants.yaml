# NOTA (Sprint 9, 2026-08-08, informativa — NÃO altera `adverse_selection_bps.value`
# acima; isso continua reservado para a calibração real do §9.5, Testnet/Paper,
# Sprint 15-16, método explicitamente diferente do abaixo):
# `src/execution/fill_simulator.py` mediu markout real sobre bookTicker+aggTrades,
# janela pré-RPI completa 2023-05-16..2024-03-30 (60.650 ordens simuladas, ambos
# os lados, grade de 15m): markout médio 1m=-0,586bps / 5m=-0,643bps / 30m=-0,590bps
# (mediana 1m=-0,515 / 5m=-0,576 / 30m=-0,407bps; sinal negativo = seleção adversa
# real, na direção esperada pela teoria) — em MAGNITUDE, ~2,5x MENOR que o
# placeholder de 1,5bps acima. `p_fill` medido no mesmo run: 37,3% (buy 36,7%,
# sell 37,9%) — LIMITE INFERIOR pessimista (cancelamento de fila não modelado,
# ver docstring do módulo), abaixo do piso de 60% citado no §9.6. Detalhe completo
# em `experiments/fill_simulator_runs.parquet` (run_id=1) e
# `execution/fill_simulator/v1/summary.json` (bulk, gitignored).
# ============================================================================
# Riscos de dados registrados (não são hiperparâmetros — são lacunas medidas
# que podem invalidar figuras já publicadas no PRD se não resolvidas)
# ============================================================================

known_gaps:
  - id: dataset_start_mismatch
    description: >
      PRD §5.9/§11.3 assumia série desde 2020-01-01/2020-09-01. Medido em
      2026-08-08: a lacuna real era menor que o temido — não é "faltam 2020-
      2022", é "a Binance nunca publicou dump público para BTCUSDT perpétuo
      antes de ~2019-12-23/31", confirmado por listagem S3 completa (D01
      aggTrades: ausência real 2019-09-01→2019-12-30, gap de lançamento do
      contrato em 2019-09-08 até o início da publicação de dumps, não falha
      de coleta). Backfill CONCLUÍDO em 2026-08-08 para D01 (2019-12-31→
      2026-07-31), D03 klines_1m (2019-12-31→2026-08-07), D04 metrics
      (2020-09-01→2026-08-07, início real da fonte), D07 funding (2020-01→
      2026-07), D10 markPriceKlines (2019-12-23→2026-08-07), D11
      premiumIndexKlines (2019-12-24→2026-08-07). A janela 1 do walk-forward
      (treino 2020-01..2022-12, §5.9) agora TEM dado por trás — mas a origem
      das figuras ano-a-ano de 2020-2022 na PARTE XVII (ATR, IC) ainda não
      foi reconciliada contra esses arquivos recém-baixados (nem confirmado
      nem refutado) até o Gate 1 rodar de fato.
    severity: class_A_risk
    status: backfill_concluido_reconciliacao_pendente
    review_by: gate_1
  - id: microstructure_definition_break_2025_11_20
    description: >
      Ordens RPI (Retail Price Improvement) desde 2025-11-20 tornam o book
      visível (bookTicker/bookDepth) incompleto. Grupo F (microestrutura)
      muda de definição no meio da amostra. Ver PRD §2.7.1 (v3.3) — Grupo F
      removido de T1 até 6 meses de coleta forward de rpiDepth (F06).
    severity: class_A_risk
    status: coleta_forward_iniciada
    review_by: gate_8
  - id: d05_d08_d09_upstream_availability_shorter_than_prd_claims
    description: >
      PRD §1.1 declara D05 BVOLIndex "início 2021" e D08/D09 bookTicker
      "início 2022-01". Medido em 2026-08-08 via listagem S3 completa
      (não por tentativa e erro de datas): D05 só existe publicamente desde
      2023-06-20 (1.119 arquivos até 2026-08-07, agora com dump BRUTO
      completo em data/raw/bvol_index/). D08/D09 bookTicker só existe de
      2023-05-16 a 2024-03-30 (320 arquivos, ~52,6GB comprimidos) — a
      Binance aparentemente descontinuou a publicação pública deste dump
      depois de 2024-03-30; não há como confirmar isso além de "não está no
      bucket". D08/D09 baixado por completo em 2026-08-08: 320/320 arquivos,
      0 checksum_fail, 52,579GB, em data/raw/book_ticker/BTCUSDT/. Cobertura
      real é 10,5 meses (2023-05-16→2024-03-30), não contínua até hoje como
      o PRD supunha — qualquer feature do Grupo F treinada com isso herda
      uma janela curta e datada, além de já estar fora de T1 por
      microstructure_definition_break_2025_11_20 acima.
    severity: class_B_risk
    status: concluido
    review_by: sprint_4
  - id: exchange_info_snapshot_coverage_gap
    description: >
      Medido no Sprint 6 (Label Engine, §3.4): data/raw/snapshots/exchange_info/
      só tem UM snapshot canônico no disco, "2026-08-08.json" — a coleta
      forward começou nesta mesma data (pendência P0 já citada no cabeçalho
      deste arquivo) e o diretório reconstructed/ está vazio. Isso significa
      que load_filters_asof(t) (src/exchange/filters.py, §1.4) levanta
      NoFiltersAvailableError para QUALQUER t anterior a 2026-08-08 — ou
      seja, hoje é literalmente impossível resolver tick_size/min_notional/
      step_size vigentes de forma B01-compliant para os ~6,5 anos de
      histórico usados no resto do pipeline (features, labels). O Label
      Engine (src/labels/triple_barrier.py) só consome tick_size (para
      round_to_tick da entrada) — min_notional/step_size são consumidos por
      risk/execution, fora de escopo aqui. tick_size não tem nenhum evento
      de mudança documentado (ao contrário de min_notional, que mudou
      100->50 em 2026-04-14 — ver measured acima), então usar o único
      snapshot existente como proxy do tick_size histórico é uma aproximação
      MENOR do que seria usar min_notional do snapshot de hoje para o
      passado. src/labels/triple_barrier.py implementa isso como fallback
      EXPLÍCITO, não-default (historical_filters_fallback: bool = False —
      o caminho default continua levantando o erro, B01-compliant de
      verdade): só quando o chamador pede fallback=True o único snapshot
      disponível é reusado para datas históricas, com log estruturado de
      WARNING a cada uso e o fato registrado dentro do próprio filters_hash
      da linha (não fica silencioso). Resolução de verdade (reconstrução
      histórica de exchangeInfo por anúncio da Binance, mesmo mecanismo já
      previsto em filters.py) é P0 pendente de outro sprint, não deste.
    severity: class_B_risk
    status: medido_sprint_6_fallback_explicito_implementado
    review_by: gate_1

