# config/constants.yaml
#
# Registro de proveniência — §16.10 / PARTE XVIII do PRD V3.2 (v3.3 pendente).
# Nenhum literal numérico entra em código de pipeline sem uma entrada aqui.
# CI bloqueia build de produção com classe A em provenance: ASSUMED (regra M1/M2, §16.10.2).
#
# Schema por entrada:
#   value:           número ou lista
#   provenance:      MEASURED | DERIVED | LITERATURE | ASSUMED
#   source:          de onde veio, ou por que não se sabe
#   class:           A (invalida desenho) | B (hiperparâmetro) | C (guardrail) | D (cosmético)
#   sweep_required:  true se classe A (M2, §16.10.2)
#   sweep_range:     [min, max] quando sweep_required
#   review_by:       sprint em que precisa ser resolvido/revisto
#
# Seed do Sprint 1 — NÃO exaustivo. As ~90 constantes classe B/C restantes (janelas de
# feature, hiperparâmetros de XGBoost, guardrails operacionais) entram conforme cada
# módulo é implementado (Sprints 4+), nunca direto em código.

