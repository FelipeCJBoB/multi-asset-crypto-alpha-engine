round_trip_cost_bps_maker_prob:
  value: 0.4942
  provenance: MEASURED
  source: >
    SEGUNDA REMEDIÇÃO 2026-08-25 (AG-221/AG-227, passo 6 do
    docs/MAPA_IMPACTO_RELABEL_ag221_2026-08-25.md) -- executada APÓS o
    relabel de produção que trocou `entry_fill_source` de `mark_1m` para
    `agg_trades` nas 15 combinações dollar-bar. Era a única constante do
    repo que precisava de duas passadas, e a necessidade estava declarada
    na passada anterior (preservada abaixo), não descoberta depois.
    MEDIÇÃO (mesma metodologia da 1ª passada -- contagem direta de
    barrier_hit sobre as 15 combinações reais, P(TP|preenchido) =
    TP/(TP+SL+TIME), NOFILL fora do denominador):
      pooled ponderado por n_fill : 0,4942  <- VALOR ADOTADO
      mínimo                      : 0,4917
      máximo                      : 0,4969
      spread                      : 0,0052 (0,52 pontos percentuais)
    O spread caiu de 0,0263 (1ª passada) para 0,0052 -- as 15 combinações
    ficaram muito mais homogêneas depois de removido o viés de
    granularidade, o que REFORÇA a escolha de manter a constante GLOBAL em
    vez de por (símbolo, resolução): a dispersão que já não justificava
    3 entradas agora é 5x menor.
    Todas as 15 convergem para dentro de 0,83 pp de 0,50 -- o valor
    teórico de martingale sob payoff simétrico (tp=sl=1,5). Sob
    `mark_1m` ficavam em 0,4505-0,4768.
    EVOLUÇÃO DA CONSTANTE, para leitura histórica:
      0,4206  original     (tp=2,0, grade de relógio 15m)  -> 5,7382 bps
      0,4597  1ª remedição (tp=1,5, dollar bar, mark_1m)   -> 5,6209 bps
      0,4942  2ª remedição (tp=1,5, dollar bar, agg_trades)-> 5,5173 bps
    GATILHO DE REVISÃO (o que faltava na versão original): esta medição
    está amarrada a TRÊS coisas -- geometria (tp_atr_mult/sl_atr_mult),
    grade (canonical_bar_type/resolution_id) e fonte do fill de entrada
    (LabelConfig.entry_fill_source). Mudança em qualquer uma exige
    remedir ANTES de a constante voltar a ser confiável.
    --- 1ª REMEDIÇÃO (valor 0.4597, superseded) ---
    ATUALIZADO 2026-08-25 (AG-222, passo 1 aprovado pelo Manager). Valor
    anterior 0.4206 estava obsoleto em DUAS dimensões simultâneas, e a
    própria entrada anterior (preservada abaixo) já instruía a remedição
    que nunca foi executada -- "se essas mudarem (S1, sweep_required=true
    em ambas), esta medição precisa ser refeita para a nova geometria
    antes de continuar confiável":
      (1) GEOMETRIA -- 0.4206 foi medido sob tp_atr_mult=2.0/sl_atr_mult=1.5.
          O sweep S1 alterou tp_atr_mult para 1.5 em 2026-08-24 (ver a
          entrada de tp_atr_mult). Sob tp=sl=1.5 a ruína do apostador prevê
          50%, não os 42,9% analíticos citados na justificativa antiga.
      (2) GRADE -- tools/diagnostics/measure_barrier_touch_probability.py
          chama load_labels_v1(symbol=symbol) SEM resolution_id, então mede
          sobre a grade de RELÓGIO 15m legada, não sobre dollar bar
          R1/R2/R3, que é a grade de produção desde AG-042. Achado desta
          mesma auditoria -- o script precisa ganhar o eixo resolution_id.
    MEDIÇÃO NOVA (2026-08-25): contagem direta de barrier_hit sobre as 15
    combinações reais de produção (5 símbolos x R1/R2/R3),
    data/labels/{symbol}/{R}/v1/labels.parquet, geometria vigente
    tp=sl=1,5. P(TP|preenchido) = TP/(TP+SL+TIME), excluindo NOFILL do
    denominador (NOFILL não gera saída, portanto não gera fee de saída).
      pooled ponderado por n_fill : 0,4597  <- VALOR ADOTADO
      média simples das 15        : 0,4645
      mínimo  BTCUSDT/R1          : 0,4505
      máximo  SOLUSDT/R3          : 0,4768
      spread                      : 0,0263 (2,63 pontos percentuais)
    ESCOLHA DE ARQUITETURA -- constante GLOBAL, não por (símbolo,
    resolução). Há gradiente sistemático R1 < R2 < R3 nos 5 símbolos
    (barras mais lentas tocam TP com mais frequência), e os símbolos são
    quase idênticos entre si. Mas o spread inteiro vale 0,079 bps de
    custo (5,570 a 5,649), desprezível frente ao gap de ~6 bps que o motor
    precisa vencer -- uma constante por resolução adicionaria 3 entradas e
    complexidade de fiação em 7 call sites para ganhar menos de 0,1 bps.
    Reavaliar se o spread crescer.
    IMPACTO: custo round-trip de 5,738 bps (p=0,4206) para 5,621 bps
    (p=0,4597) -- a constante antiga SUPERESTIMAVA o custo em 0,117 bps.
    SEGUNDA REMEDIÇÃO PENDENTE: se o relabel de AG-221 (fill de entrada
    via agg_trades) for executado, P(TP) sobe para ~0,49 (medido em 4
    combinações) e este valor precisa de nova passada. É a única constante
    do repo que precisa de duas remedições -- ver
    docs/MAPA_IMPACTO_RELABEL_ag221_2026-08-25.md §6, passos 1 e 6.
    --- PROVENIÊNCIA HISTÓRICA (valor 0.4206, agora superseded) ---
    "AG-027 (audit/architecture_gaps_log.yaml, 2026-08-15) mediu o viés;
    corrigido 2026-08-24 (achado do usuário, validação de governança em
    sessão -- constante já existia declarada aqui desde AG-027, mas
    round_trip_cost_bps nunca a lia, permanecia com 0.5/0.5 hardcoded no
    corpo). Ruína do apostador (tp_atr_mult=2.0/sl_atr_mult=1.5) prevê
    P(maker, TP primeiro)=1,5/3,5=42,9% analítico; medição empírica real
    (tools/diagnostics/measure_barrier_touch_probability.py, 5 ativos,
    labels.parquet, contagem direta de qual barreira toca primeiro) confirma
    42,06% pooled -- usa o valor MEDIDO, não o analítico. round_trip_cost_bps
    (src/features/groups/group_e.py) agora lê esta constante via
    src.features._constants.load_constant em vez do literal 0.5/0.5 -- os 7
    call sites conhecidos (group_e.py, cost_surface.py,
    volatility_operational_effect.py, feasibility.py, m3_timeframe_choice.py,
    risk/limits.py, s1_tp_sl_sensitivity.py) herdam a correção automaticamente,
    nenhuma assinatura mudou. Empiricamente amarrado à geometria de
    tp_atr_mult/sl_atr_mult -- se essas mudarem (S1, sweep_required=true em
    ambas), esta medição precisa ser refeita para a nova geometria antes de
    continuar confiável (mesmo tratamento de adverse_selection_wr_cost_per_bp,
    ver derived_from abaixo)."
  class: A
  sweep_required: false
  derived_from: [tp_atr_mult, sl_atr_mult]   # medição empírica condicionada a esta geometria -- refazer se ela mudar (S1)
  review_by: sprint_9

