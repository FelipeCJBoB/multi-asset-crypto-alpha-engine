    ([0,0001;0,0005;0,001;0,005;0,01] -> testado
    [0,0001;0,0005;0,001;0,002;0,005;0,01;0,02]) sobre fatia REAL recente
    de BTCUSDT (últimas 50.000 barras válidas de obs_2d=[log_return_1,
    realized_vol_short], mesma convenção/escala do M4; 40.000 treino +
    10.000 teste, fit_jump_model/predict_jump_model diretos, n_states=2,
    seed=0 -- mesmo caminho de código do harness real, não reimplementado).
    Medido para cada ponto: nº de estados sobreviventes no FIT (treino) E
    no DECODE do fold de teste (o que importa de verdade -- é o que
    anova_by_group/persistence do harness M4 usariam), duração mediana de
    segmento e switch_rate no teste. Resultado completo do grid: 0,0001 ->
    2 estados (treino [29095,10905], teste 64 segmentos,
    median_duration=63,5); 0,0005 -> 2 estados (treino [25460,14540],
    teste 8 segmentos, median_duration=1180,5); 0,001 -> 2 estados (treino
    [25202,14798], teste 4 segmentos, median_duration=2533,0); 0,002 -> 2
    estados, resultado IDÊNTICO a 0,001 (treino [25202,14798], teste 4
    segmentos, median_duration=2533,5 -- mesmo ótimo local do coordinate
    descent nos dois pontos, plateau largo, não um resultado instável na
    borda); 0,005 -> DEGENERA no teste (1 único estado, 1 segmento cobrindo
    as 10.000 barras inteiras, switch_rate=0,0) apesar do FIT de treino
    ainda reportar 2 estados (quase balanceados, [20105,19895]) -- a
    saturação acontece na DECODIFICAÇÃO OOS, não no ajuste em si; 0,01 ->
    também degenera no teste (mesmo resultado de 0,005, confirma/estende o
    achado já registrado em tests/unit/test_analysis_m4_regime_comparison.py
    de que jump_penalty=0,01 satura BTCUSDT real); 0,02 -> também degenera.
    Fronteira de saturação da DECODIFICAÇÃO OOS está entre 0,002 (2 estados
    genuínos) e 0,005 (colapsa) -- escolhido o MAIOR valor testado que
    ainda produz >=2 estados genuínos no fold de teste (0,002), por ser o
    mais parcimonioso dentro do lado seguro medido (jump_penalty maior =
    menos ruído espúrio), consistente com a orientação da task. Note bem:
    0,001 (valor usado nos testes SINTÉTICOS do harness,
    tests/unit/test_analysis_m4_regime_comparison.py::_CANDIDATE_KWARGS)
    funciona igualmente sobre dado real neste grid -- mas 0,002 é
    estritamente mais parcimonioso e igualmente seguro, medido, não só
    herdado do fixture sintético."
  class: B
  sweep_required: false

m4_heterogeneity_n_permutations:
  value: 1000
  provenance: LITERATURE
  source: "AG-092 (audit/architecture_gaps_log.yaml) -- Cochran's Q/I² do
    M4 viola a premissa de estratos independentes (autocorrelação
    intra-episódio de regime), corrigido via teste de permutação em
    bloco por episódio (nunca quebra um episódio no meio, preserva
    duração/ordem temporal). B=1000 é o número de permutações Monte
    Carlo -- não é hiperparâmetro que 'invalida o desenho' se mudado
    dentro de uma faixa razoável (500-2000), é resolução numérica do
    p-valor empírico: `p_min = 1/(B+1)`, então B=1000 dá resolução de
    ~0,001 -- mais que suficiente pra qualquer decisão contra alfas
    convencionais (0,05/0,01), consistente com a prática padrão de
    testes de permutação (Good, P.I. (2005), 'Permutation, Parametric,
    and Bootstrap Tests of Hypotheses', 3ª ed., Springer -- recomenda
    milhares de permutações quando computacionalmente barato, o que é o
    caso aqui: núcleo vetorizado via np.bincount, sem refit de modelo).
    Não é MEASURED porque não há um valor 'certo' a medir -- é escolha
    de precisão computacional, documentada como tal."
  class: C
  sweep_required: false

m4_heterogeneity_permutation_seed:
