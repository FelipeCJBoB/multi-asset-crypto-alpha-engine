alpha_lgbm_min_sum_hessian_in_leaf:
  value: 0.001
  provenance: ASSUMED
  source: >
    AG-208 (2026-08-25, achado da persona `lgbm-crypto-quant` sobre a
    árvore de src/models/alpha.py). Este parâmetro NUNCA existiu no repo
    -- nem em constants.yaml, nem como argumento de LGBMClassifier --,
    então rodava no default de biblioteca sem nenhuma entrada de
    proveniência (§16.10 Regra Zero). VALOR REGISTRADO = o default da
    própria biblioteca (LightGBM 4.7.0, uv.lock), portanto bit-exato com
    todo artefato já treinado: esta entrada corrige PROVENIÊNCIA, não
    valor.
    Por que importa mais que min_child_samples: sob objective="binary" a
    hessiana por amostra é p(1-p)*w <= 0,25*w, e sample_weight neste
    projeto é `uniqueness * |ret_net|` normalizado para média 1
    (src/labels/weights.py::apply_weights) -- distribuição de cauda longa,
    massa concentrada nos desfechos de barreira (TP/SL têm |ret_net|
    grande, TIME pequeno). Nesse regime 0,001 não restringe nada, e
    min_child_samples=20 limita CONTAGEM de amostras por folha, não MASSA:
    uma folha pode ter 20 amostras cuja hessiana somada é fração de uma
    observação típica. É o cenário canônico de memorização de ruído em
    sinal fraco (§17.2 mede IC ~0,04 neste projeto).
    O valor DEFENSÁVEL seria derivado de min_child_samples x hessiana
    média medida no fold (algo como min_data_in_leaf * w_barra * 0,25) --
    não estipulado aqui porque w_barra ainda não foi medido por fold/lado
    (B23: TBD, medir junto do sweep).
  class: B
  sweep_required: true
  sweep_range: [0.001, 5.0]
  review_by: sprint_10

alpha_lgbm_max_bin:
  value: 255
  provenance: ASSUMED
  source: >
    AG-208 (2026-08-25), mesma origem de alpha_lgbm_min_sum_hessian_in_leaf
    acima. VALOR REGISTRADO = default de biblioteca (LightGBM 4.7.0),
    bit-exato -- correção de proveniência, não de valor.
    Racional para varrer: em sinal fraco, mais bins não melhora resolução
    útil e aumenta a chance de um split encontrar ruído; a curva costuma
    saturar cedo. Contrapeso específico de cripto: retorno tem cauda
    pesada e os eventos que mais importam (cascata de liquidação, gap de
    fim de semana) vivem exatamente na cauda -- reduzir max_bin demais
    apaga a resolução justamente lá. Sem medição própria, não há base para
    mover em nenhuma direção (B23).
    NOTA de escopo, verificada e registrada para não virar achado
    fantasma: `bin_construct_sample_cnt` (amostra usada para CONSTRUIR as
    fronteiras de bin, default 200.000) foi avaliado no mesmo achado e
    NÃO entra aqui -- o treino real por fold/lado fica abaixo desse
    default (BTCUSDT/R1 tem 223.172 barras no total, e o treino de um
    fold é ~4/6 disso menos purge/embargo/NOFILL), e R1 é a grade com
    MAIS barras entre R1/R2/R3. O default cobre o dataset inteiro em
    todas as 15 combinações. Só passa a importar se alguma combinação
    ultrapassar 200.000 linhas de treino por lado.
  class: B
  sweep_required: true
  sweep_range: [63, 511]
  review_by: sprint_10

alpha_lgbm_ess_regularization_n_obs_independentes_alvo:
  value: 30.0
  provenance: ASSUMED
  source: >
    ADR-005 §13.14.1 (item 8 de §13.17, emenda `lgbm-crypto-quant`,
    2026-08-26) -- número de observações INDEPENDENTES que uma folha
    precisa carregar para o erro-padrão de `p` ficar num nível
    considerado aceitável (`SE(p) = sqrt(0,25/n) ~= 9,1 pp` em n=30,
    contra o edge-alvo de ~5-7 pp medido no projeto -- ainda largo, mas
    não a ordem de grandeza do `SE` de `min_child_samples=20` sob
    `ESS/linhas ~= 0,39` medido em §13.9.3, que dá só ~7-8 obs.
    independentes). Não é medido -- é o "n_obs_independentes_alvo"
    que a própria fórmula de §13.5-3 já pedia como parâmetro declarado
    a priori, nunca antes escolhido porque a fórmula nunca tinha sido
    implementada. Parâmetro hoje INERTE em produção: sob
    `num_leaves in {2,3}` nenhuma árvore chega perto do piso de folha
    que esta regularização impõe (§13.9.3) -- só passa a morder se
    `max_depth` subir, decisão separada e não tomada aqui.
  class: B
  sweep_required: true
  sweep_range: [15.0, 60.0]
  review_by: sprint_10

alpha_lgbm_ess_regularization_fator_conservador:
  value: 0.5
  provenance: ASSUMED
  source: >
    ADR-005 §13.14.1, companheiro da constante acima. Cobre o segundo
    defeito real da fórmula original de §13.5-3: `p(1-p)` na hessiana é
    a predição CORRENTE da iteração de boosting, não a taxa base -- ela
    CAI conforme o boosting avança e os scores se espalham, então um
    piso derivado da cota `0,25` (p=0,5) descreve só a iteração 0.
    `fator_conservador <= 1` encolhe o piso para não superestimar a
    massa disponível nas iterações tardias -- 0,5 (metade da cota da
    iteração 0) é escolha de engenharia sem medição de como `p(1-p)`
    de fato evolui neste projeto (B23: TBD, medir junto do sweep de
    `max_depth` que tornaria este parâmetro ativo pela primeira vez).
  class: B
  sweep_required: true
  sweep_range: [0.25, 1.0]
  review_by: sprint_10

