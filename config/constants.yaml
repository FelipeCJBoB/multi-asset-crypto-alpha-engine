meta_min_events_per_variable:
  value: 10
  provenance: LITERATURE
  source: "docs/meta_model_design_doc_2026-08-22.md §11/§7.3 -- piso de EPV (events per variable) que decide se um meta-fold AJUSTA MODELO ou cai em pass-through. TRANSPLANTADA, e a transferência NÃO foi validada: EPV=10 foi estabelecida para regressão logística NÃO-PENALIZADA contando EVENTOS BRUTOS independentes (Peduzzi et al. 1996); aqui é aplicada a logística L2 contando Σ uniqueness_subpop da classe minoritária. Duas substituições, nenhuma validada -- por isso LITERATURE com ressalva, nunca DERIVED. DUAS CORREÇÕES DA v3 SOBRE A v1: (a) estava declarada classe C, violando a regra 'guardrails classe C são quantis, nunca número redondo' (CLAUDE.md §Proveniência) -- 10 é o número redondo arquetípico, e a constante decide se um fold ajusta modelo, o que é classe B no mínimo; (b) estava com sweep_required false, o que deixaria o risco SIMÉTRICO sem teste -- não só 'baixar o EPV para fazer caber' (R4), mas o EPV estar ERRADO POR TRANSPLANTE e matar o desenho sem motivo. MEDIDO em F2 (2026-08-30, BTCUSDT/R1 camada1): com 7 colunas no design matrix o EPV realizado é 93 na mediana e 20 no pior meta-fold -- a logística L2 é sustentada com folga em todos os folds sob este piso."
  class: B
  sweep_required: true
  sweep_range: [5, 20]

