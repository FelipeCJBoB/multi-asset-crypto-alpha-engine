    fronteira matemática entre lucro e prejuízo, por isso não segue a
    convenção de quantil-medido dos guardrails classe C. Computado sobre
    `PathBacktestResult.mean_trade_ret` (é FRAÇÃO — `ret_net`/`ret_gross` de
