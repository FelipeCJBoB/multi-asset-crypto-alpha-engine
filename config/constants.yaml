  class: A
  scaling_invariant: bar_count
  sweep_required: true
  sweep_range: [10, 30]
  review_by: sprint_6
  # scaling_invariant (2026-08-23, formaliza como campo YAML real o que já
  # estava só em prosa acima desde AG-043/F1 -- decisão em si NÃO muda,
  # só ganha o mesmo formato estrutural das outras 8 janelas com tag).
  # E27f_cost_atr_ratio (Feature Engine) usa este ATR (bar-count,
  # estável/estacionário entre grades), DELIBERADAMENTE separado do ATR
  # que dimensiona TP/SL no Label Engine (atr_window_ms, clock-based, ver
  # abaixo) -- não reconciliar os dois. Pesquisa de literatura 2026-08-23
  # (AG-043 addendum, López de Prado 2018; Grądzki/Wójcik/Lessmann,
  # Financial Innovation 2025, "Algorithmic crypto trading using
  # information-driven bars, triple barrier labeling and deep learning")
  # confirma esta separação: (a) indicadores técnicos genéricos sobre
  # barras de informação (dollar/volume) devem manter contagem de barra
  # fixa -- cada barra carrega peso de informação ~igual, converter pra
  # preservar tempo de calendário reintroduziria a heterocedasticidade
  # que motivou adotar dollar-bar; (b) a implementação de referência do
  # triple-barrier (mlfinlab::add_vertical_barrier) usa tempo de relógio
  # pra barreira de horizonte independente do tipo de barra -- confirma
  # que atr_window_ms (label, restrição econômica real) deve ser
  # clock-based, e que isso é uma categoria DIFERENTE de atr_window
  # (feature, estimador estatístico). Ver docs/regime_feature_engine_
  # design_doc_2026-08-23.md.

