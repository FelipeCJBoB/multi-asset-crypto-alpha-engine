aggregate_risk_max:
  value: 0.01
  provenance: ASSUMED
  source: >
    PRD_V4_1.md §5.3 -- achado I4 (falha de segurança: Risk Engine avaliava
    cada posição isoladamente, ignorando correlação entre ativos). Controle
    19 (AGGREGATE_RISK_LIMIT), sigma_agg = sqrt(w.T @ Corr @ w). Com rho~=0,91
    medido (5 ativos), 5 posições simultâneas = 4,82x o risco unitário
    declarado -- acima de max_daily_loss (2%) num único evento adverso. Valor
    1,00% escolhido no PRD sem sweep formal ainda; implementado como gate de
    código antes do sweep (decisão do Manager 2026-08-17, decouple de V41-8 --
    AG-081) porque o risco já está quantificado e não depende da sequência de
    medição M4/M5/V41-5..7.

    [CORREÇÃO 2026-08-22, AG-144] "rho~=0,91" acima nunca teve janela/período
    declarados e não tinha entrada em evidence_ledger.yaml. Remedido
    (tools/diagnostics/measure_cross_asset_correlation_stability.py,
    audit/evidence_ledger.yaml::ag144-correlacao-cross-asset-15m-4-janelas):
    a MÉDIA real entre os 10 pares fica entre 0,70 (janela histórica completa)
    e 0,83 (últimos 180d), nunca ~0,91 -- só o par BTCUSDT-ETHUSDT isolado
    chega perto disso (0,89-0,90) nas janelas mais curtas. Instável entre
    janelas (range até 0,23 por par). Não invalida a existência de correlação
    alta o bastante pra justificar este controle (0,70 pooled já é material
    pra 5 ativos supostamente diversificados) -- mas o fator "4,82x" acima,
    calculado sobre 0,91, está superestimado; recalcular com o valor
    correto (janela a decidir pelo Manager) fica pendente, sem mudar o
    `value` nem o `sweep_required` desta constante.
  class: A
  sweep_required: true
  sweep_range: [0.005, 0.015]
  review_by: gate_3   # AG-081 -- controle já implementado, threshold pendente de sweep

