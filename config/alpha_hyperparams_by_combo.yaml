# config/alpha_hyperparams_by_combo.yaml
#
# Hiperparâmetro LightGBM calibrado POR combinação (symbol, resolution_id),
# em vez do conjunto único global de constants.yaml::alpha_lgbm_* — completa
# D-11 (docs/alpha_model_design_doc_2026-08-22.md, "conjunto único v1,
# ASSUMED até sweep"), que sempre previu esta possibilidade sem nunca ter
# sido varrida antes de 2026-08-25.
#
# Fora do schema de constants.yaml de propósito (não é escalar único —
# check_constants_provenance.py/check_constants_referenced.py não cobrem
# este arquivo). Cada valor aqui é MEASURED, fonte única:
#   ADR-003 (docs/ADR-003_hiperparametro_feature_set_completo_2026-08-25.md)
#   Estágio 2 -- vencedor por mediana de 5 seeds (não o screening de 1
#   seed), por combinação. audit/evidence_ledger.yaml::
#   adr003-k62-10-piores-combinacoes-veredito-2026-08-25.
#
# feature_ids associado: SUPPORT_FEATURE_IDS (62, src/features/build.py) --
# SUBSTITUI T1_FEATURE_IDS (7), nunca soma. Toda combinação listada aqui
# treina sob esse vetor, não sob T1.
#
# RESSALVA CRÍTICA (AG-220/AG-220-ADDENDUM, audit/architecture_gaps_log.yaml,
# achado de sessão paralela, 2026-08-25): o gate de permanência usado pra
# checar cada vencedor (Estágio 3 do ADR-003) foi medido, em experimento
# pareado real sobre BTCUSDT/R1 (k=7), lendo RUÍDO da variância de path do
# CPCV/backtest_lite, não sinal -- |delta(Camada1,Camada0)| < sigma nas 3
# variantes testadas. Os valores abaixo são a CALIBRAÇÃO de hiperparâmetro
# medida (Estágio 1-2, robusta a viés de seleção via mediana de 5 seeds),
# não uma validação de que o resultado é distinguível de ruído -- ver ADR-003
# §Resultado antes de tratar qualquer "gate passou" como sinal real.
#
# Cobertura: só as 10 piores combinações por ret_net (AG-207) foram
# calibradas aqui. As outras 5 (ETHUSDT/R1, SOLUSDT/R2, SOLUSDT/R3 -- já
# passavam o gate de permanência sob T1/hiperparâmetro global antes desta
# campanha; XRPUSDT/R2, XRPUSDT/R3 -- não fizeram parte das "10 piores")
# NÃO têm entrada aqui. `load_hyperparams_by_combo` retorna `None` pra
# essas -- o chamador cai pro hiperparâmetro global de constants.yaml
# (mesmo comportamento de sempre), com warning explícito, não silencioso.
#
# Regra de edição: MESMA disciplina do resto do projeto -- só se acrescenta
# ao final ou se substitui uma entrada inteira quando uma nova campanha de
# calibração medir de novo essa combinação especificamente; nunca editar um
# valor isolado sem re-rodar a medição que o produziu.
#
# AG-371 (2026-08-28) -- `feature_ids_hash` abaixo é a TRAVA que faltava:
# `AG-362` (27/08) reestruturou `T1_FEATURE_IDS` (7->22) sem recalibrar
# este arquivo, e o retreino canônico de 28/08 injetou este hiperparâmetro
# (calibrado sob os 62 `SUPPORT_FEATURE_IDS` de 25/08, substitutivo, já
# extinto nessa forma) sob o vetor novo sem checagem nenhuma --
# `src.models.hyperparams_by_combo.load_hyperparams_by_combo` agora
# recusa (`HyperparamFeatureMismatchError`) se o hash de conteúdo do
# vetor ativo não bater com `feature_ids_hash` aqui. `feature_ids_hash`
# é hash de CONTEÚDO (via `compute_feature_ids_hash`), não do nome
# `feature_ids_ref` -- a causa raiz do AG-371 foi o NOME do vetor ficar
# igual enquanto o CONTEÚDO mudava; recalibrar (AG-371 item (c), já
# priorizado) regrava as duas chaves juntas, sempre.

schema_version: 1
provenance: MEASURED
source: "ADR-003 Estágio 2 (mediana de 5 seeds), 2026-08-25"
feature_ids_ref: "features_build.SUPPORT_FEATURE_IDS"
# Hash de conteúdo (sha256[:16] de {"feature_ids": sorted(...)}, schema_
# version "alpha_hyperparams_by_combo_feature_ids_v1") do vetor de 62
# SUPPORT_FEATURE_IDS de 25/08 (commit 10fbd78, ADR-003) -- preenchido
# por `tools/diagnostics/backfill_ag371_hyperparams_feature_hash.py`,
# nunca à mão (AG-371: um valor digitado errado aqui destrava o mesmo
# buraco que esta trava existe pra fechar). `null` = arquivo ainda não
# migrado -- `load_hyperparams_by_combo` recusa nesse estado, de propósito.
feature_ids_hash: "a1ec4831894d2136"

