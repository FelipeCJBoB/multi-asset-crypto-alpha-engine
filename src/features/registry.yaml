  added: 2026-08-24

- id: D07f_taker_imbalance_1m_agg
  tier: T2
  group: D
  formula: "media de (2*taker_buy_ratio_1m - 1) das barras de 1m dentro da barra de 15m (bucket_id = open_time // step_ms('15m'), mesmo grid dos dois lados)"
  sources: [D03, "klines_1m bruto (fonte NOVA, mesmo dataset em disco que resample_klines ja usa pra produzir bars_15m)"]
  lookback_bars: 1
  min_warmup_bars: 200
