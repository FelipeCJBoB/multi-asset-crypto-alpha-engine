# src/features/registry.yaml
#
# Registro de features do Feature Engine — §2.14 do PRD. Formato exato:
# id, tier, group, formula, sources, lookback_bars, min_warmup_bars, tf,
# dtype, range, nan_policy, causal_proof, parity_tested, version, added.
#
# Sprint 4 (2026-08-08): vetor T1 (§2.13, com E27f_cost_atr_ratio no lugar
# de B07_efficiency_ratio_48 — v3.3) + B07 (T2, insumo do Regime Engine
# §4.2, Sprint 5) + C01/C02 (T2, insumo direto de A05/A13/C06/C07/E27f).
# Grupo F (microestrutura) e Grupos G-K ficam fora deste registry — fora de
# escopo do Sprint 4 (Grupo F removido de T1 na v3.3 por quebra RPI,
# §2.7.1; G/H/I/J/K são T2/T3 de sprints futuros).
#
# ============================================================================
# NOTA DE TF — achado do Sprint 4, reportado por instrução explícita da
# task, não decisão silenciosa:
#
# As tabelas de fórmula §2.2-2.6 do PRD anotam quase toda feature T1 com
# TF="30m". Mas:
#   - §0.1 declara `decision_tf: 15m` como escolha a priori do sistema,
#     com o comentário explícito "v3.1: era 30m; ver §0.4".
#   - §0.4 é a seção inteira que mede ATR real em 4 timeframes (5m/15m/
#     30m/1h) e escolhe 15m sobre 30m ("A premissa de 0,272% a 30m estava
#     no percentil 13 da distribuição real").
#   - §0.5 confirma: "15m é escolha a priori, registrada no pré-registro
#     (§16.9). 30m é verificação de robustez, não competidor."
#   - §5.9 e a PARTE XVII (estudo de não-estacionariedade) usam
#     "230.784 barras de 15m, 2020-01-01 a 2026-07-31" como a série
#     completa de referência do projeto inteiro.
#   - §3.3 (Label Engine) declara `time_stop_bars: 32` como "8h a 15m —
#     uma janela de funding", ancorando o Label Engine também em 15m.
#   - A própria tabela §2.6 já tem UMA linha de T1 com TF correto:
#     E27f_cost_atr_ratio diz "15m" explicitamente (é a feature mais nova
#     do documento, adicionada depois que 30m→15m já tinha sido decidido).
#     As outras 9 linhas de T1 em §2.2-2.6 dizem "30m" — resíduo textual
#     não atualizado quando `decision_tf` mudou de 30m (v3.0) para 15m
#     (v3.1), carregado adiante até a v3.3 sem correção.
#
# Conclusão: todas as features T1 abaixo são calculadas a 15m (`tf: 15m`),
# batendo com `decision_tf` e com o resto do documento (Label Engine,
# estudo de não-estacionariedade, pré-registro). O "30m" nas tabelas
# §2.2-2.6 é dívida de documentação do PRD, não uma instrução a seguir —
# seguir "30m" literalmente produziria features numa granularidade
# diferente da que o Label Engine e o Alpha realmente usam, uma
# inconsistência pior do que a que está sendo corrigida aqui.
#
# Consequência colateral, também reportada (não corrigida silenciosamente):
# as janelas de lookback em barras (EMA48, RSI14, z-score 48, vol_ratio
# 12/96) foram herdadas literalmente do PRD como CONTAGEM DE BARRAS, não
# recalibradas para preservar o intervalo de calendário original. A 30m,
# 48 barras = 1 dia; a 15m, as mesmas 48 barras = 12h. Isso é consistente
# com a instrução explícita da task ("janelas de lookback (EMA48, ATR20,
# RSI14, vol_ratio 12/96, z-score 48/96, min_warmup_bars=2000) são todas
# classe B... registre") — os valores em `config/constants.yaml` são as
# contagens de barra literais do PRD, aplicadas ao novo TF, não uma
# tentativa de preservar o intervalo de calendário de 30m. Fica registrado
# como pergunta em aberto para a ablação do Sprint 8 (§2.0.1): se o
# intervalo de calendário importa mais que a contagem de barras para
# alguma dessas janelas, a ablação vai mostrar.
# ============================================================================
#
# PRINCÍPIO DE GATE pra feature nova (2026-08-28, `AG-372`/ADR-006,
# decisão do Manager) — sequência aplicada ANTES de qualquer leitura de
# feature importance/SHAP, nesta ordem:
#
#   1. auditoria algébrica     -- é identidade/combinação linear/transformação
#      monotônica de algo já no vetor? (ex. A08+|A07|+A09=1, B03=exp(A04)-1)
#   2. auditoria de mecanismo  -- tem tese econômica declarada, com contraparte
#      identificável ("quem está do outro lado")? "é indicador clássico" NÃO
#      é mecanismo (ADR-005 §5.3 item 3).
#   3. alinhamento de horizonte -- a janela/lag da feature está calibrada
#      contra o holding period real do motor (H, medido -- não herdada de
#      indicador de barra de relógio)? Ver `h_sobre_H` em
#      `audit/feature_thesis/fichas_69_2026-08-25.yaml`.
#   4. eliminação de redundância -- mede o mesmo conceito que outra feature
#      já no vetor, só sob janela/parametrização diferente?
#   5. walk-forward / informação incremental in-fold (CPCV purgado, B06) --
#      o Alpha de fato ganha algo com ela? PENDENTE de protocolo formal
#      desde `AG-362` (cai do lado `src/models/`, sessão de ML).
#   6. LightGBM / SHAP / estabilidade -- confirmação pós-hoc, NUNCA
#      descoberta primária -- a régua de entrada não é "teve gain/SHAP
#      alto", é ter sobrevivido aos passos 1-5 primeiro.
#
# Motivo: SHAP/gain lido do LightGBM pode estar contaminado por capacidade
# de árvore/hiperparâmetro desincronizado do vetor ativo (`AG-371`) --
# calibrar entrada de feature pela leitura de importância é o mesmo erro
# estrutural que o gate de correlação marginal cometia (`AG-362`), só
# trocando qual instrumento mais fraco decide por antecipação.
# ============================================================================

- id: A05_ret_vol_norm_4
  tier: T1
  group: A
  layer: [L2]
  quarentena: false
  defeito_construcao: false
  formula: "ln(C_t / C_{t-4}) / (atr_20_pct_t * 2)"
  sources: [D03]
  lookback_bars: 4
  min_warmup_bars: 200
  tf: 15m
  dtype: float64
  range: [-.inf, .inf]
  nan_policy: "NaN até warmup completo (precisa de atr_20_pct, que precisa de atr_window=20 barras); null antes de min_warmup_bars por corte uniforme"
  causal_proof: "usa só close[t-4..t] e atr_20_pct[t] (janela rolante <= t, sem lookahead) — testado em tests/unit/test_features_groups.py::test_a05_causalidade"
  parity_tested: true
  version: v1
  added: 2026-08-08
  nota: "atr_20_pct herda o estimador de C01_atr_20 (2026-08-17) — sob vol_estimator_id='parkinson_w20' o valor de A05 muda, a fórmula acima não."

