- id: E03f_funding_cum_3d
  tier: T2
  group: E
  layer: [L4]
  quarentena: false
  defeito_construcao: true
  formula: "soma dos ultimos 9 valores de funding CONHECIDOS ate a barra t (fronteira de evento por timestamp, close_time_ms // (funding_interval_hours em ms), nao por mudanca de valor)"
  sources: [D07, close_time]
  lookback_bars: 288
  min_warmup_bars: 200
  tf: 15m
  dtype: float64
  range: [-.inf, .inf]
  nan_policy: "NaN ate 9 eventos distintos terem sido vistos; null antes de min_warmup_bars"
  causal_proof: "fronteira de evento detectada por epoch de timestamp (mesma tecnica de E05f), so acumula eventos ja conhecidos ate t -- testado em tests/unit/test_features_groups.py::test_e03f_soma_por_evento_nao_por_barra"
  parity_tested: true
  version: v1
  added: 2026-08-24
  nota: "Soma ingenua sobre janela de BARRAS contaria o mesmo valor de funding repetido ~32x (asof-join backward repete o ultimo valor conhecido em toda barra de 15m dentro do periodo de 8h) -- errado por construcao. Deteccao por timestamp (nao por mudanca de valor) e robusta ao caso raro de 2 eventos consecutivos com o MESMO valor numerico (ex. funding no cap/floor). lookback_bars=288 = 9 eventos x 32 barras/evento (8h a 15m) -- derivado, nao um numero solto; e o pior caso real usado pra proteger CPCV/purge (AG-032 item 8), nao um valor tipico. AG-319 (2026-08-26): 288 e o alcance a 15m NOMINAL -- sob dollar bar o alcance REAL varia por grade (72h / duracao mediana da barra): 458,1 barras em R1, 219,0 em R2, 105,0 em R3. O schema de registry so tem 1 campo lookback_bars (nao suporta valor por resolucao) -- 288 fica sub-declarado nas 3 grades reais, mais grave em R1 (1,59x). NAO corrigido pra um numero unico porque nenhum dos 4 (288/458/219/105) e certo pras outras grades -- documentado aqui em vez de trocar 1 numero errado por outro. Protecao real: compute_max_feature_lookback_ms (AG-296) ja falha alto se E03f entrar em T1_FEATURE_IDS com qualquer lookback_bars declarado > 96 sob resolution_id -- 288 ja dispara essa guarda, a imprecisao do numero exato nao muda esse fato."

