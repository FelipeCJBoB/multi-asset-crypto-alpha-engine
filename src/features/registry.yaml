- id: A17_log_tr_per_overshoot_ratio
  tier: T1
  group: A
  layer: [L2]
  quarentena: false
  defeito_construcao: false
  formula: "ln1p( (TR_t/C_{t-1}) / (overshoot_t/threshold_quote_t) ), overshoot_t = quote_volume_t - threshold_quote_t"
  sources: [D03, dollar_bar_quote_volume, dollar_bar_threshold_quote]
  lookback_bars: 2
  min_warmup_bars: 200
  tf: 15m
  dtype: float64
  range: [0.0, .inf]
  nan_policy: >-
    NaN quando overshoot_t<=0 ou threshold_quote_t<=0 (guardas
    explícitas — overshoot_t<=0 acontece de fato 1x por
    símbolo×resolução, última barra de cada stream, subdimensionada por
    construção, ver AG-373); NaN na primeira barra (sem C_{t-1}); NaN
    inteiro sob bar_source=time_15m (sem quote_volume/threshold_quote
    nesse grid); null antes de min_warmup_bars
  causal_proof: "TR via support.true_range (primitiva causal), C_{t-1} é close[t-1]; overshoot/threshold_quote são do próprio bar t (sem lookahead) — testado em tests/unit/test_features_groups.py::test_a17_causalidade"
  parity_tested: true
  version: v2
  added: 2026-08-28
  nota: >-
    **[NOVO, `AG-372`/ADR-006; REDESENHADA no mesmo dia, `AG-373`]**
    v1 (`TR_t/overshoot_t` cru) tinha defeito dimensional real —
    `TR_t` em unidade de preço (`$/coin`), `overshoot_t` em notional
    ($) — razão residual `1/coin`, risco de deriva com o nível de preço
    do próprio ativo ao longo do histórico de treino (mesma classe de
    defeito que `group_a.py` cabeçalho já trata como não-negociável pra
    A05 vs A13). v2 normaliza os dois lados contra sua própria escala de
    referência antes de dividir (`TR/C_{t-1}` == A11, sobre `overshoot/
    threshold_quote`, ambos adimensionais) e aplica `ln1p` pra domar a
    cauda pesada (overshoot pequeno relativo ao threshold é o caso
    ECONOMICAMENTE esperado — `AG-321`, a barra fecha quase exatamente
    no threshold — não um evento raro; mesmo tratamento que A18-A21/B16
    já aplicam, por consistência). Tese econômica preservada:
    deslocamento de preço por unidade de atividade monetária MARGINAL
    relativa ao threshold-alvo — overshoot pequeno com TR grande é sinal
    de iliquidez/impacto alto. Deliberadamente NÃO chamada "Amihud"/
    "Kyle lambda" — analogia conceitual, não replicação da métrica
    original. Testar junto de A11 (TR/close) é intencional — as duas
    capturam o mesmo fenômeno por normalizações diferentes (preço vs.
    atividade monetária relativa ao threshold), ver ADR-006/AG-373.

