- id: C07_vol_pctile_expanding
  tier: T2  # AG-032, 2026-08-23 -- saiu de T1_FEATURE_IDS (lookback_bars: expanding, sem proteção finita de purge). Continua calculada, consumida direto pelo Regime Engine (src.regime.classifier)
