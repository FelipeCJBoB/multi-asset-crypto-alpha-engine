- id: E02f_funding_z_expanding
  tier: T2  # AG-032, 2026-08-23 -- saiu de T1_FEATURE_IDS (lookback_bars: expanding, sem proteção finita de purge)
  group: E
  formula: "z-score EXPANSIVO estrito de funding_last_t (alinhado ao grid de 15m por asof-join backward) em [t0_dataset, t-1]"
