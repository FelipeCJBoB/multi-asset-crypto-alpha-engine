# ============================================================================
# LOTE B — liberação de features (H5, 2026-08-24). 6 features T2 novas
# que precisam de primitiva ou fonte nova: A15 (reset por fronteira de
# dia), B10 (mín/máx rolante), C08 (posto percentil ROLANTE, não
# expansivo — support.rolling_percentile_rank_strict), D07f (fonte nova:
# klines_1m bruto), D10f (correlação rolante — support.rolling_
# correlation), E03f (soma por EVENTO de funding, não por barra). Nenhuma
# promovida a T1 (§0.2 R4 do CLAUDE.md; §2.0.1/§2.13 do PRD). Fórmulas
# validadas contra literatura pública (VWAP/Stochastic — pesquisa web,
# 2026-08-24) além do PRD, mesma instrução do Lote A.
# ============================================================================

- id: A15_dist_vwap_d_atr
  tier: T2
  group: A
  formula: "(C_t - VWAP_dia) / ATR_20 (absoluto), VWAP_dia = cumsum(preco_tipico*volume)/cumsum(volume) desde 00:00 UTC do dia da barra t, preco_tipico=(H+L+C)/3"
  sources: [D03, close_time]
  lookback_bars: 96
  min_warmup_bars: 200
  tf: 15m
  dtype: float64
  range: [-.inf, .inf]
  nan_policy: "nunca NaN por warmup de janela (acumula desde a 1a barra do dia); null antes de min_warmup_bars"
  causal_proof: "polars cum_sum().over(day_id) reseta a soma acumulada a cada dia UTC novo, preservando ordem de aparicao -- barra t so acumula ate si mesma dentro do proprio dia, nunca alem -- testado em tests/unit/test_features_groups.py::test_a15_causalidade_e_reset_diario"
  parity_tested: true
  version: v1
  added: 2026-08-24
  nota: "preco_tipico=(H+L+C)/3 e a convencao publica padrao de VWAP (validada via pesquisa web nesta sessao). Reset a meia-noite UTC e adaptacao pra cripto 24/7 (sem 'abertura de sessao' tradicional), mesma convencao de fronteira de dia de K03/K08. lookback_bars=96 e o TETO (barra final do dia, 24h/15min) -- na pratica a maioria das barras acumula menos, mas o registry exige um int (nao ha valor 'variavel', so 'expanding'/int fixo, §2.14), e 96 e o limite superior real usado pra proteger CPCV/purge (AG-032 item 8)."

- id: B10_stoch_k_14
  tier: T2
  group: B
  formula: "(C - min(L)_14) / (max(H)_14 - min(L)_14) * 100"
  sources: [D03]
  lookback_bars: 14
  min_warmup_bars: 200
  tf: 15m
  dtype: float64
  range: [0.0, 100.0]
  nan_policy: "NaN nas primeiras 14 barras; NaN se a janela inteira for flat (range=0, caso degenerado sem convencao declarada no PRD); null antes de min_warmup_bars"
  causal_proof: "janela rolante fixa [t-13,t] (polars.rolling_min/rolling_max) -- testado em tests/unit/test_features_groups.py::test_b10_faixa_0_100_e_causalidade"
  parity_tested: true
  version: v1
  added: 2026-08-24
  nota: "Stochastic %K padrao (George Lane), validado via pesquisa web nesta sessao."

