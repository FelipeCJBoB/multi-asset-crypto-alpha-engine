  min_warmup_bars: 200
  tf: 15m
  dtype: float64
  range: [-.inf, .inf]
  nan_policy: "NaN nas primeiras 48 barras; null antes de min_warmup_bars"
  causal_proof: "janela rolante fixa [t-47, t] — testado em tests/unit/test_features_groups.py::test_d06f_causalidade"
