  dtype: float64
  range: [-1.0, 1.0]
  nan_policy: "NaN se klines_1m nao foi carregado (load_taker_imbalance_1m=False ou bar_source != 'time_15m' em build_t1_features) ou se o bucket_id nao tem nenhuma barra de 1m correspondente; null antes de min_warmup_bars"
  causal_proof: "cada bucket de 15m so agrega as barras de 1m que ele mesmo contem (bucket_id identico calculado do mesmo jeito nos dois grids), nunca uma barra de outro bucket -- testado em tests/unit/test_features_groups.py::test_d07f_causalidade_e_agregacao"
  parity_tested: true
  version: v1
  added: 2026-08-24
  nota: "PRD original (a 30m) cita '30 barras de 1m'; sob 15m real, sao as barras de 1m do mesmo bucket de 15min -- contagem natural=15, nao recalibrada/hardcoded. Nucleo puro em group_d.py::d07f_taker_imbalance_1m_agg; ponto de entrada com IO em _sources.py::load_taker_imbalance_1m_agg_aligned (parametro opcional, default True, em build_t1_features -- ver docstring). AG-318 (2026-08-26): sob TODA a grade de producao real (bar_source in {dollar_r1,dollar_r2,dollar_r3} -- R1/R2/R3), o carregamento e SEMPRE pulado (build.py, gate bar_source=='time_15m') -- a coluna sai 100% NaN, sempre, em todos os simbolos/resolucoes de producao. So roda de verdade sob bar_source='time_15m', que nao e a grade de producao (AG-042). Qualquer contagem de 'features T2 disponiveis' que inclua D07f sob a grade real esta inflada em 1."

