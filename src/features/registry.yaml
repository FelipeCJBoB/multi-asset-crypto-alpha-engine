  causal_proof: "TR via support.true_range (mesma primitiva causal de C01/ATR) — testado em tests/unit/test_features_groups.py::test_a11_causalidade"
  parity_tested: true
  version: v1
  added: 2026-08-24
  nota: >-
    insumo direto de C09_range_pctile_expanding (reaproveitado, não
    recomputado — ver build.py::compute_t1_features). **[REATIVADA
    2026-08-28, `AG-372`/ADR-006, override deliberado do Manager — NÃO é
    a anistia de `AG-362`, que cobre só `layer: L3`]** estava `layer: L4`
    ("aposentada"), já testada e REPROVADA sob o gate de correlação
    marginal (ADR-005 §1.3, 5/15 células) antes desse gate ser abolido.
    Tese NOVA, declarada aqui, substitui a leitura antiga genérica de
    "true range percentual": sob dollar bar, o volume em dólar por barra
    é quase constante (`quote_volume ≈ threshold_quote`, `AG-321`) — TR/
    close mede deslocamento de preço por atividade monetária
    aproximadamente constante, ou seja, uma leitura de impacto de preço
    NORMALIZADA POR PREÇO (evita o confundidor de nível de preço entre
    símbolos que `A17_log_tr_per_overshoot_ratio` — a variante em
    atividade monetária — não evita sozinha, embora a redação 2026-08-28
    de A17, AG-373, também tenha corrigido a normalização interna dela).
    `quem_esta_do_outro_lado`: quem consome
    liquidez rápido (ordem que atravessa o book) paga o impacto que TR/
    close mede; quem fornece liquidez (maker) captura o spread do lado
    oposto. Testar A11 e A17 lado a lado é intencional — ver ADR-006.

