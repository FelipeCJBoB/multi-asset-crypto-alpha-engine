# ============================================================================
# LOTE A — liberação de features (H5, 2026-08-24). 47 features T2 novas
# dos Grupos A/B/C/D/E/K, todas usando fontes JÁ ativas (D03/D04/D07, mesmas
# de A05/A13/B01/B07/C01/C02/C06/C07/D03f/D06f/E02f/E10f/E27f acima) e
# primitivas JÁ existentes em src/features/support.py — nenhuma fonte nova,
# nenhuma primitiva nova. Nenhuma promovida a T1 por esta implementação
# (§0.2 R4 do CLAUDE.md: teto de features é medido, nunca estipulado;
# promoção só por ablação dentro do CPCV, §2.0.1/§2.13 do PRD). Formulas
# validadas contra literatura pública (MACD/Bollinger/RSI/ATR/Parkinson/
