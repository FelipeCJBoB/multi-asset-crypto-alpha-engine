  parity_tested: true
  version: v1
  added: 2026-08-08

- id: D03f_volume_z_expanding
  tier: T2  # AG-032, 2026-08-23 -- saiu de T1_FEATURE_IDS (lookback_bars: expanding, sem proteção finita de purge)
  group: D
  formula: "z-score EXPANSIVO estrito de log(1+V_t) em [t0_dataset, t-1]"
