[project]
name = "btcusdt-quant"
version = "0.1.0"
description = "Motor quantitativo BTCUSDT perpétuo — Binance USDⓈ-M. PRD V3.2/V3.3."
requires-python = ">=3.12"
readme = "CLAUDE.md"

dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "optuna>=4.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tzdata>=2024.1",
    "statsmodels>=0.14",
    "numba>=0.61",
    "dynamax>=0.1.5",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jumpmodels>=0.1",
    "shap>=0.49.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------
# ruff — lint + format. Regras amplas; banned patterns específicos do domínio
# (proveniência, mark price, GTX, etc.) vivem em tools/lint/banned_patterns.py,
# não são expressáveis como regra genérica de ruff.
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle/pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "T20",               # flake8-print — pega print() direto (B28)
    "RUF",
]
ignore = [
    # RUF002 marca σ/×/√/− em docstrings como "caractere ambíguo" (confundível
    # com ataque de homoglifo). Aqui são notação matemática legítima em
    # português — as fórmulas do PRD inteiro usam esses símbolos (§2.2-2.6) —
    # não texto disfarçado. Mutilar pra ASCII (x, sigma, sqrt) pioraria a
    # fidelidade da docstring à fórmula fonte sem ganho de segurança real.
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# tools/lint/*.py são scripts CLI standalone (rodados via `python
# tools/lint/x.py`, nunca importados como lib de pipeline) -- print() é o
# mecanismo de saída, não um substituto de structlog em código de
# produção (B28/§14.1 continua valendo pra src/). Achado de auditoria
# (AG-028, 2026-08-15): banned_patterns.py -- o próprio script que
# ENFORCE o banimento de print() -- já usava print() 6x antes desta
# entrada existir; a config estava inconsistente com a própria regra que
# aplica. `tests/**` já tinha essa exceção; faltava estender aqui.
"tools/lint/**" = ["T20"]

# tools/diagnostics/*.py são scripts standalone (rodados via `uv run python
# tools/diagnostics/x.py`, caminho direto, não `-m`) que importam de `src.*`
# -- sem `sys.path.insert(_REPO_ROOT, ...)` ANTES desse import, `src` não é
# encontrado (`ModuleNotFoundError`), porque só o diretório do próprio
# script entra em sys.path[0] nesse modo de invocação. Achado real
# (2026-08-16): os 8 scripts existentes tinham esse bug, nunca detectado
# porque nunca tinham sido de fato invocados por caminho direto até o
# usuário rodar. E402 (import fora do topo) é o preço estrutural do fix --
# aceito aqui, não em `src/`.
"tools/diagnostics/**" = ["E402"]

# --------------------------------------------------------------------------
# mypy strict — DoD de "código de modelo"/"código de feature" exige type hints.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["^data/", "^\\.venv/"]

[[tool.mypy.overrides]]
# libs de terceiros sem stubs completos — não relaxa nosso próprio código.
# "yaml" entrou no Sprint 2 (src/data/_constants.py replica o mesmo import de
# src/exchange/_constants.py — sem isso, mypy --strict falha nos dois pacotes
# por igual; types-PyYAML resolveria mas é dependência extra por um único
# ponto de uso em cada pacote). "scipy"/"sklearn" entraram no Sprint 8
# (src/models/monotonic.py usa scipy.stats.spearmanr; src/models/alpha.py e
# src/models/baselines.py usam sklearn.isotonic/model_selection/metrics) —
# mesmo motivo: scipy-stubs/sklearn não publicam stubs completos o
# suficiente para mypy --strict, e adicionar types-* extras por um punhado
# de pontos de uso não paga o custo de dependência extra. "statsmodels"
# entrou no M2 (PRD_V4_1.md §3.2) -- src/analysis/m2_bar_comparison.py usa
# statsmodels.stats.diagnostic.acorr_ljungbox/statsmodels.tsa.stattools.
# adfuller, mesmo motivo dos outros. "numba" entrou em 2026-08-15 (achado
# de magnitude do M2: historico completo de BTCUSDT e' da ordem de bilhoes
# de trades, loop Python puro de tick_imbalance_bars_step levaria dezenas
# de minutos a mais de 1h so nesse simbolo) -- src/data/bars.py usa
# numba.njit, sem stubs completos publicados. "dynamax"/"jax"/"jumpmodels"
# entraram no M4 (PRD_V4_1.md §3.2, 2026-08-17) -- src/regime/
# hmm_gaussian.py/jump_model.py (Fase 2 do plano) e o smoke test de Fase 0
# usam as 3, nenhuma publica stubs. "pandas" entra pelo mesmo smoke test
# (jumpmodels espera pandas.DataFrame na fronteira, B26 -- interop de borda).
# "shap" entrou no ADR-008 Fase 7 (2026-08-31, dependência nova aprovada
# pelo Manager) -- src/models/walk_forward.py usa shap.TreeExplainer,
# sem stubs publicados.
module = [
    "lightgbm.*",
    "optuna.*",
    "duckdb.*",
    "yaml",
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "numba.*",
    "dynamax.*",
    "jax.*",
    "jumpmodels.*",
    "pandas.*",
    "shap.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "golden: teste de reprodutibilidade bit-a-bit contra artefato versionado (Fase G, ~20-30s, retreina fold 0 de verdade — nao mockado)",
    "slow: teste que sozinho custa mais que ~2s (reconstroi serie/frame real completo, nao fixture sintetica) — excluido de 'pytest -m \"not slow\"'",
    "integration: le artefato real do disco (data/, labels/, predictions/, models/) via skip-if-ausente, em vez de fixture sintetica — pode ser pulado (SKIPPED) fora do ambiente com backfill local",
]

# --------------------------------------------------------------------------
# import-linter — hierarquia de camadas do §14.2, quebra o build se violada.
#
# O diagrama do PRD ("exchange -> data -> ... -> validation" e
# "backtest <- risk <- execution <- live") descreve ORDEM DE PIPELINE, não
# necessariamente direção de import — a própria seção nomeia só 4 regras sem
# ambiguidade, e são essas 4 que viram contrato "forbidden" abaixo. A cadeia
# completa como "layers" fica para quando risk/execution/live tiverem conteúdo
# real (Sprints 12-14) e a direção puder ser confirmada contra código, não
# inferida de um diagrama de texto.
# --------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "features não importa labels"
type = "forbidden"
source_modules = ["src.features"]
forbidden_modules = ["src.labels"]

[[tool.importlinter.contracts]]
name = "models não importa execution"
type = "forbidden"
source_modules = ["src.models"]
forbidden_modules = ["src.execution"]

[[tool.importlinter.contracts]]
name = "labels só é lido por models, validation, backtest"
type = "forbidden"
source_modules = [
    "src.exchange", "src.data", "src.features", "src.regime",
    "src.risk", "src.execution", "src.live", "src.monitoring",
]
forbidden_modules = ["src.labels"]

[[tool.importlinter.contracts]]
name = "risk não importa execution nem models"
type = "forbidden"
source_modules = ["src.risk"]
forbidden_modules = ["src.execution", "src.models"]

[[tool.importlinter.contracts]]
name = "models não importa analysis"
type = "forbidden"
source_modules = ["src.models"]
forbidden_modules = ["src.analysis"]

[[tool.importlinter.contracts]]
name = "features não importa analysis"
type = "forbidden"
source_modules = ["src.features"]
forbidden_modules = ["src.analysis"]

[[tool.importlinter.contracts]]
# AG-034 addendum (2026-08-16, auditoria de prontidão de src/data/bars.py):
# m2_worker.py (src/analysis/, medição pós-hoc) constrói dollar+volume+
# tick_imbalance bars SIMULTANEAMENTE por chunk (_build_trades_dependent_
# bars) -- padrão correto para COMPARAR os 3 tipos, mas 3x mais caro em
# memória que o caminho canônico single-type que uma pipeline de PRODUÇÃO
# precisa (canonical_bar_type=dollar). Nada impedia mecanicamente um futuro
# orquestrador de reprocessamento real (ainda não escrito, seria natural
# viver em src/data/) de importar esse helper por conveniência e herdar o
# mesmo custo 3x -- só convenção/prosa protegia contra isso. Este contrato
# fecha essa lacuna mecanicamente, mesmo padrão já usado para
# features/models não importarem analysis.
name = "data não importa analysis"
type = "forbidden"
source_modules = ["src.data"]
forbidden_modules = ["src.analysis"]

[[tool.importlinter.contracts]]
# F7 (D-13, §10.5 do design doc do Meta, 2026-09-01) — formalizado agora
# que os módulos existem como arquivos reais (alpha.py desde Sprint 8;
# meta.py/meta_dataset.py/meta_ablation.py/meta_walk_forward.py desde
# F0-F6b desta sessão). Meta-labeling é, por definição, um modelo do erro
# do PRIMÁRIO (Alpha) — a dependência só pode ir Meta -> Alpha; o inverso
# seria o Alpha (produção canônica) carregando lógica de uma camada
# secundária que nem passou nos próprios gates (AG-404/AG-409/AG-413).
name = "alpha não importa meta"
type = "forbidden"
source_modules = ["src.models.alpha"]
forbidden_modules = [
    "src.models.meta",
    "src.models.meta_dataset",
    "src.models.meta_ablation",
    "src.models.meta_walk_forward",
]
