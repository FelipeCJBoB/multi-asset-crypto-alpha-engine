# Instalar com: uv run pre-commit install
# Todos os hooks rodam localmente antes do commit — nada chega ao histórico
# sem passar por ruff, mypy strict e banned_patterns.py.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.9]
        args: [--strict]
        exclude: ^(data|tests)/

  - repo: local
    hooks:
      - id: banned-patterns
        name: banned patterns (CLAUDE.md, 32 padrões + Regra 1 de proveniência)
        entry: python tools/lint/banned_patterns.py --path src --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: hierarquia de camadas (§14.2)
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: constants-referenced
        name: toda constante referenciada em src/ tem entrada em constants.yaml (Fase H)
        entry: python tools/lint/check_constants_referenced.py
        language: system
        pass_filenames: false
        always_run: true
        # Lê o ÍNDICE do git (staged), não o working tree — de propósito: é o
        # que teria pego o incidente de ~280 linhas de proveniência que
        # ficaram staged em `.py` mas não em `constants.yaml` (Sprints 8/12,
        # ver docs/SPRINT_LOG.md Fase H). check_sprint_log_references.py
        # (Fase H, a outra metade) fica de fora deste arquivo — é heurístico
        # de prosa com falso positivo esperado (ver docstring do script);
        # bloquear commit local nele treinaria a usar --no-verify. Roda só em
        # CI, non-blocking (continue-on-error), ver .github/workflows/ci.yml.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: scan de segredos (B31, §16.7)
