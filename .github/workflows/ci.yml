# CI — roda em todo push/PR. Nenhum destes passos é opcional (§16.10.2 regra 2:
# bloqueia build de produção com constante classe A em provenance: ASSUMED).
#
# Sem remote configurado ainda (Sprint 1) — este arquivo fica pronto para
# ativar assim que o repo for empurrado para o GitHub, não precisa de ajuste.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 2 (não o default 1) — check_sprint_log_references.py
          # faz `git diff HEAD~1` para achar as linhas novas de cada push; um
          # checkout raso de profundidade 1 não teria HEAD~1 disponível. Se um
          # push empilhar >1 commit novo, o step só vê o diff do último commit
          # contra o penúltimo — limitação aceita dado o fluxo trunk-based
          # deste repo (push a cada commit significativo, CLAUDE.md §Rotina de
          # git), documentada aqui, não escondida.
          fetch-depth: 2

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync (inclui dev deps)
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy src

      - name: banned patterns (CLAUDE.md, 32 padrões + Regra 1)
        run: uv run python tools/lint/banned_patterns.py --path src --strict

      - name: import-linter (hierarquia §14.2)
        run: uv run lint-imports

      - name: constants referenciadas em src/ têm entrada em constants.yaml (Fase H)
        run: uv run python tools/lint/check_constants_referenced.py

      - name: SPRINT_LOG.md — número novo tem referência por perto (Fase H, heurístico)
        run: uv run python tools/lint/check_sprint_log_references.py --base HEAD~1
        # HEURÍSTICO de prosa (ver docstring do script) — falso positivo
        # esperado em parágrafos legítimos sem referência formal. Fica
        # non-blocking até calibrar contra uso real, mesmo motivo/mesmo
        # padrão do step de constants_provenance abaixo.
        continue-on-error: true

      - name: constants.yaml — nenhuma classe A com provenance ASSUMED em build de produção
        run: uv run python tools/lint/check_constants_provenance.py --fail-on-assumed-class-a
        # Sprint 1: script ainda não existe (config/constants.yaml tem 9
        # constantes classe A legitimamente ASSUMED até a varredura de
        # sensibilidade, §16.10.2 regra 4 — isso é esperado nesta fase, não é
        # bug). O passo fica declarado aqui e é ativado no Sprint 10, quando a
        # varredura de sensibilidade estiver feita e este for de fato um gate
        # de "build de produção", não do dia a dia de pesquisa.
        continue-on-error: true

      - name: constants.yaml — classe A ASSUMED DENTRO de ret_net (AG-442, BLOQUEANTE)
        run: uv run python tools/lint/check_constants_provenance.py --only-ret-net-gate
        # Deliberadamente SEM continue-on-error, ao contrário do step acima.
        # A diferença é de categoria, não de rigor: aquele step cobre TODA
        # classe A ASSUMED, e há 15 legitimamente pendentes da varredura do
        # Sprint 10 — bloquear ali pararia a pesquisa. Este cobre só o
        # subconjunto declarado com `enters_ret_net: true`, isto é, a
        # constante que é SUBTRAÍDA do P&L e portanto decide promoção de
        # candidato. Para essa, "esperar o Sprint 10" não é estado de
        # pesquisa aceitável.
        # Motivo (AG-432/AG-442): `adverse_selection_bps` migrou de coluna
        # informativa para termo de `ret_net` sem que nada registrasse a
        # mudança de status. Este gate existe para que a próxima migração
        # dessas não passe silenciosa.

      - name: pytest
        run: uv run pytest -q
